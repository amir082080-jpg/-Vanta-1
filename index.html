<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>ÀVanta Messenger</title>

<style>
*{box-sizing:border-box}
:root{
 --bg:#0b1020;
 --panel:#111827;
 --panel2:#182235;
 --text:#f5f7fb;
 --muted:#8f9bb3;
 --primary:#6c63ff;
 --primary2:#5148e8;
 --danger:#ef4444;
 --border:rgba(255,255,255,.08);
 --shadow:0 15px 45px rgba(0,0,0,.35);
}
body.light{
 --bg:#eef2f7;
 --panel:#fff;
 --panel2:#f1f4f8;
 --text:#111827;
 --muted:#667085;
 --border:rgba(0,0,0,.08);
}
*{scrollbar-width:none}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,"Tahoma",sans-serif;
 min-height:100vh;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
.full{width:100%}
.center{display:flex;align-items:center;justify-content:center}
.screen{min-height:100vh}
.login-card{
 width:min(420px,92%);
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:28px;
 padding:30px;
 box-shadow:var(--shadow);
 text-align:center
}
.brand strong{font-size:35px;letter-spacing:-2px}
.brand span{display:block;color:var(--muted);font-size:14px;margin-top:3px}
.brand.mini strong{font-size:24px}
.btn{
 border:1px solid var(--border);
 background:var(--panel2);
 color:var(--text);
 padding:12px 15px;
 border-radius:13px;
 margin:5px 0;
 transition:.18s;
}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:white}
.btn.danger{background:rgba(239,68,68,.13);color:#ff7070}
.icon-btn{
 width:42px;height:42px;border:1px solid var(--border);
 border-radius:13px;background:var(--panel2);
 color:var(--text);font-size:22px
}
.topbar{
 height:65px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 16px;
 border-bottom:1px solid var(--border);
 background:var(--panel);
 position:sticky;top:0;z-index:20
}
#page{padding-bottom:82px}
.page{display:none;padding:16px}
.page.active{display:block}
.page-title{
 display:flex;align-items:center;justify-content:space-between;
 margin-bottom:15px
}
.page-title h2{margin:0 0 5px}
.page-title p{margin:0}
.list{display:flex;flex-direction:column;gap:7px}
.row{
 display:flex;align-items:center;gap:12px;
 padding:12px;
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:16px;
 cursor:pointer
}
.avatar{
 width:48px;height:48px;border-radius:50%;
 background:linear-gradient(135deg,var(--primary),#a855f7);
 display:flex;align-items:center;justify-content:center;
 color:#fff;font-weight:bold;flex:none;
 overflow:hidden
}
.avatar img,.big-avatar img{
 width:100%;height:100%;object-fit:cover
}
.grow{flex:1;min-width:0}
.row-title{font-weight:bold}
.row-sub{
 color:var(--muted);font-size:13px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.empty{
 text-align:center;color:var(--muted);
 padding:45px 10px
}
.bottom{
 position:fixed;bottom:0;left:0;right:0;height:70px;
 background:var(--panel);
 border-top:1px solid var(--border);
 display:flex;z-index:30
}
.nav{
 flex:1;border:0;background:none;color:var(--muted);
 font-size:12px
}
.nav.active{color:var(--primary)}
.nav span{display:block;font-size:22px;margin-bottom:2px}
.settings-card{
 background:var(--panel);
 padding:12px;
 border:1px solid var(--border);
 border-radius:20px
}
.settings-card .btn{display:block}
.cover{
 height:150px;border-radius:22px 22px 0 0;
 background:linear-gradient(135deg,#5148e8,#9c4dff,#18a999)
}
.profile-main{
 background:var(--panel);
 text-align:center;
 padding:0 18px 20px;
 border-radius:0 0 22px 22px;
 border:1px solid var(--border)
}
.big-avatar{
 width:105px;height:105px;
 border-radius:50%;
 background:linear-gradient(135deg,var(--primary),#a855f7);
 border:5px solid var(--panel);
 margin:-52px auto 10px;
 display:flex;align-items:center;justify-content:center;
 font-size:40px;font-weight:bold;overflow:hidden
}
.badges{margin:8px}
.badge{
 display:inline-block;padding:5px 9px;border-radius:20px;
 background:rgba(108,99,255,.15);
 color:#9d97ff;font-size:12px;margin:3px
}
.grid3{display:grid;grid-template-columns:1fr 1fr 70px;gap:7px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.profile-section{
 margin-top:15px;background:var(--panel);
 padding:16px;border:1px solid var(--border);
 border-radius:20px
}
.gift-grid{
 display:grid;grid-template-columns:repeat(3,1fr);gap:8px
}
.gift{
 background:var(--panel2);border-radius:15px;padding:15px;
 text-align:center;font-size:28px
}
.modal{
 position:fixed;inset:0;background:rgba(0,0,0,.65);
 z-index:100;display:flex;align-items:center;justify-content:center;
 padding:15px
}
.modal-box{
 width:min(470px,100%);
 max-height:90vh;overflow:auto;
 background:var(--panel);border:1px solid var(--border);
 border-radius:23px;padding:20px;
 box-shadow:var(--shadow)
}
.modal-head{
 display:flex;justify-content:space-between;align-items:center
}
.input,textarea,input{
 width:100%;border:1px solid var(--border);
 background:var(--panel2);color:var(--text);
 border-radius:12px;padding:12px;outline:none;
 margin:6px 0
}
textarea{min-height:90px;resize:vertical}
.chat-screen{
 position:fixed;inset:0;background:var(--bg);z-index:80;
 display:flex;flex-direction:column
}
.chat-head{
 height:65px;background:var(--panel);
 border-bottom:1px solid var(--border);
 display:flex;align-items:center;gap:10px;padding:8px 12px
}
.messages{
 flex:1;overflow:auto;padding:15px;
 display:flex;flex-direction:column;gap:7px
}
.msg{
 max-width:78%;padding:9px 12px;
 background:var(--panel);border:1px solid var(--border);
 border-radius:15px;align-self:flex-start
}
.msg.mine{
 align-self:flex-end;background:var(--primary);
 color:#fff;border-color:var(--primary)
}
.msg-time{font-size:9px;opacity:.65;margin-top:3px}
.chat-input{
 display:flex;gap:5px;padding:8px;
 background:var(--panel);border-top:1px solid var(--border)
}
.chat-input input{margin:0;flex:1}
.story{
 background:var(--panel);border:1px solid var(--border);
 padding:12px;border-radius:16px;margin-bottom:8px
}
.toast{
 position:fixed;bottom:82px;left:50%;transform:translateX(-50%);
 background:#111;color:white;padding:11px 17px;
 border-radius:13px;z-index:200;opacity:0;
 pointer-events:none;transition:.25s
}
.toast.show{opacity:1}
.color-options{
 display:grid;grid-template-columns:repeat(5,1fr);gap:8px
}
.color{
 height:42px;border-radius:12px;border:2px solid transparent
}
</style>
</head>

<body>

<section id="loginScreen" class="screen center">
 <div class="login-card">
  <div class="brand">
   <strong>ÀVanta</strong>
   <span>Messenger</span>
  </div>
  <p class="muted">پیام‌رسان سریع و حرفه‌ای</p>

  <button id="googleLogin" class="btn primary full">
   ورود با Google
  </button>

  <button id="guestLogin" class="btn full">
   ورود به‌عنوان مهمان
  </button>

  <div id="loginStatus" class="muted small"></div>
 </div>
</section>

<section id="mainScreen" class="screen hidden">

<header class="topbar">
 <div class="brand mini">
  <strong>ÀVanta</strong>
 </div>
 <button id="newButton" class="icon-btn">＋</button>
</header>

<main id="page">

<section id="chatsPage" class="page active">
 <div class="page-title">
  <div>
   <h2>Chats</h2>
   <p class="muted">پیام‌ها، گروه‌ها و کانال‌ها</p>
  </div>
  <button id="searchChats" class="icon-btn">⌕</button>
 </div>

 <div id="chatSearchBox" class="hidden">
  <input id="chatSearchInput" class="input" placeholder="جستجوی چت...">
 </div>

 <div id="chatList" class="list"></div>
 <div id="emptyChats" class="empty">هنوز چتی وجود ندارد.</div>
</section>

<section id="contactsPage" class="page">
 <div class="page-title">
  <div>
   <h2>مخاطبین</h2>
   <p class="muted">کاربران ÀVanta</p>
  </div>
  <button id="addContact" class="btn primary">افزودن</button>
 </div>
 <div id="contactsList" class="list"></div>
</section>

<section id="settingsPage" class="page">
 <div class="page-title"><h2>Settings</h2></div>

 <div class="settings-card">
  <button id="editInfo" class="btn full">Edit Info</button>
  <button id="setPhoto" class="btn full">Set Photo</button>
  <button id="profileColor" class="btn full">Change Profile Colour</button>
  <button id="nameEmoji" class="btn full">Premium Name Emoji</button>
  <button id="storyBtn" class="btn full">Add Story</button>
  <button id="premiumBtn" class="btn full">ÀVanta Premium</button>
  <button id="savedBtn" class="btn full">Saved Messages</button>
  <button id="adminBtn" class="btn primary full hidden">⚡ Admin Panel</button>
  <button id="themeBtn" class="btn full">🌙 تغییر حالت نمایش</button>
  <button id="logoutBtn" class="btn danger full">خروج</button>
 </div>
</section>

<section id="profilePage" class="page">

 <div id="profileCover" class="cover"></div>

 <div class="profile-main">
  <div id="bigAvatar" class="big-avatar">A</div>
  <h2 id="profileName">ÀVanta User</h2>
  <div id="profileUsername" class="muted">@user</div>
  <div id="profileBadges" class="badges"></div>
  <p id="profileBio" class="muted">بدون بیو</p>

  <div class="grid3">
   <button id="profileEdit" class="btn primary">Edit Info</button>
   <button id="profilePhoto" class="btn">Set Photo</button>
   <button id="profileMore" class="btn">•••</button>
  </div>
 </div>

 <div class="profile-section">
  <h3>🎁 Gift Collection</h3>
  <div id="giftCollection" class="gift-grid"></div>
 </div>

 <div class="profile-section">
  <h3>Stories</h3>
  <div id="profileStories"></div>
 </div>
</section>

</main>

<nav class="bottom">
 <button class="nav active" data-page="chatsPage">
  <span>◌</span>چت‌ها
 </button>
 <button class="nav" data-page="contactsPage">
  <span>♙</span>مخاطبین
 </button>
 <button class="nav" data-page="settingsPage">
  <span>◉</span>تنظیمات
 </button>
 <button class="nav" data-page="profilePage">
  <span>◎</span>پروفایل
 </button>
</nav>

</section>

<div id="modal" class="modal hidden">
 <div id="modalBox" class="modal-box"></div>
</div>

<div id="toast" class="toast"></div>

<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth,
 GoogleAuthProvider,
 signInWithPopup,
 signInAnonymously,
 onAuthStateChanged,
 signOut,
 updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getDatabase,
 ref,
 set,
 get,
 push,
 onValue,
 update,
 remove
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* ================= FIREBASE ================= */

const firebaseConfig={
 apiKey:"AIzaSyBsncHhhlqIi6qpf3hYtb0DOnq8Zjb-zpI",
 authDomain:"avanta-3db7e.firebaseapp.com",
 databaseURL:"https://avanta-3db7e-default-rtdb.firebaseio.com",
 projectId:"avanta-3db7e",
 storageBucket:"avanta-3db7e.firebasestorage.app",
 messagingSenderId:"1069911679999",
 appId:"1:1069911679999:web:avanta"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
const provider=new GoogleAuthProvider();


/* ================= STATE ================= */

let user=null;
let myData={};
let currentChat=null;
let chatsCache=[];
let contactsCache=[];
let messageListener=null;


/* ================= HELPERS ================= */

const $=id=>document.getElementById(id);

function toast(text){
 $("toast").textContent=text;
 $("toast").classList.add("show");
 setTimeout(()=>$("toast").classList.remove("show"),2200);
}

function esc(value=""){
 return String(value)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;");
}

function modal(html){
 $("modalBox").innerHTML=html;
 $("modal").classList.remove("hidden");
}

function closeModal(){
 $("modal").classList.add("hidden");
}

$("modal").addEventListener("click",e=>{
 if(e.target===$("modal")) closeModal();
});

function avatarHTML(data,size="avatar"){
 const letter=esc((data?.name||"A").charAt(0).toUpperCase());
 if(data?.photo){
  return `<div class="${size}"><img src="${data.photo}"></div>`;
 }
 return `<div class="${size}">${letter}</div>`;
}

function now(){
 return new Date().toLocaleTimeString("fa-IR",{
  hour:"2-digit",minute:"2-digit"
 });
}


/* ================= AUTH ================= */

$("googleLogin").onclick=async()=>{
 try{
  $("loginStatus").textContent="در حال ورود...";
  await signInWithPopup(auth,provider);
 }catch(e){
  console.error(e);
  $("loginStatus").textContent="ورود Google انجام نشد.";
  toast("خطا در ورود با Google");
 }
};

$("guestLogin").onclick=async()=>{
 try{
  $("loginStatus").textContent="در حال ورود...";
  await signInAnonymously(auth);
 }catch(e){
  console.error(e);
  $("loginStatus").textContent="ورود مهمان انجام نشد.";
  toast("Firebase Anonymous Auth را فعال کن");
 }
};

$("logoutBtn").onclick=async()=>{
 try{
  await signOut(auth);
 }catch(e){
  toast("خطا در خروج");
 }
};

onAuthStateChanged(auth,async u=>{
 user=u;

 if(!u){
  $("loginScreen").classList.remove("hidden");
  $("mainScreen").classList.add("hidden");
  return;
 }

 $("loginScreen").classList.add("hidden");
 $("mainScreen").classList.remove("hidden");

 await loadUser();
 listenContacts();
 listenChats();
});


/* ================= USER ================= */

async function loadUser(){

 const snap=await get(ref(db,"users/"+user.uid));

 if(snap.exists()){
  myData=snap.val();
 }else{

  myData={
   name:user.displayName || (user.isAnonymous?"Guest":"ÀVanta User"),
   username:"user_"+user.uid.slice(0,7),
   bio:"",
   photo:user.photoURL||"",
   premium:false,
   emoji:"",
   color:"#6c63ff",
   createdAt:Date.now()
  };

  await set(ref(db,"users/"+user.uid),myData);
 }

 renderProfile();

 if(myData.admin){
  $("adminBtn").classList.remove("hidden");
 }
}

function renderProfile(){

 const name=myData.name||"ÀVanta User";

 $("profileName").textContent=(myData.emoji||"")+name;

 $("profileUsername").textContent="@"+(myData.username||"user");

 $("profileBio").textContent=myData.bio||"بدون بیو";

 $("bigAvatar").innerHTML=myData.photo
  ? `<img src="${myData.photo}">`
  : esc(name.charAt(0).toUpperCase());

 $("profileBadges").innerHTML=
  (myData.premium?'<span class="badge">⭐ Premium</span>':"")+
  (myData.verified?'<span class="badge">✓ ÀVanta Verified</span>':"")+
  (user?.isAnonymous?'<span class="badge">Guest</span>':"");

 document.documentElement.style.setProperty(
  "--primary",
  myData.color||"#6c63ff"
 );

 renderGifts();
 renderStories();
}


/* ================= NAVIGATION ================= */

document.querySelectorAll(".nav").forEach(btn=>{
 btn.onclick=()=>{
  document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");

  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));

  $(btn.dataset.page).classList.add("active");
 };
});


/* ================= EDIT PROFILE ================= */

function editProfile(){

 modal(`
  <div class="modal-head">
   <h3>ویرایش پروفایل</h3>
   <button class="icon-btn" id="closeM">×</button>
  </div>

  <input id="editName" placeholder="نام"
   value="${esc(myData.name||"")}">

  <input id="editUsername" placeholder="Username"
   value="${esc(myData.username||"")}">

  <textarea id="editBio" placeholder="Bio">${esc(myData.bio||"")}</textarea>

  <button id="saveProfile" class="btn primary full">
   ذخیره تغییرات
  </button>
 `);

 $("closeM").onclick=closeModal;

 $("saveProfile").onclick=async()=>{

  const name=$("editName").value.trim()||"ÀVanta User";
  const username=$("editUsername").value
   .trim().replace(/^@/,"").replace(/\s/g,"_");

  const bio=$("editBio").value.trim();

  myData={
   ...myData,
   name,
   username:username||"user_"+user.uid.slice(0,7),
   bio
  };

  await update(ref(db,"users/"+user.uid),{
   name:myData.name,
   username:myData.username,
   bio:myData.bio
  });

  try{
   if(!user.isAnonymous){
    await updateProfile(user,{displayName:name});
   }
  }catch(e){}

  renderProfile();
  closeModal();
  toast("پروفایل ذخیره شد");
 };
}

$("editInfo").onclick=editProfile;
$("profileEdit").onclick=editProfile;


/* ================= PHOTO ================= */

function setPhoto(){

 modal(`
  <h3>Set Photo</h3>
  <p class="muted small">عکس از دستگاه انتخاب کن.</p>
  <input id="photoFile" type="file" accept="image/*">
  <button id="savePhoto" class="btn primary full">ذخیره</button>
 `);

 $("savePhoto").onclick=()=>{

  const file=$("photoFile").files[0];

  if(!file){
   toast("عکس انتخاب کن");
   return;
  }

  if(file.size>2*1024*1024){
   toast("حجم عکس باید کمتر از 2MB باشد");
   return;
  }

  const reader=new FileReader();

  reader.onload=async()=>{
   myData.photo=reader.result;

   await update(ref(db,"users/"+user.uid),{
    photo:reader.result
   });

   renderProfile();
   closeModal();
   toast("عکس پروفایل تغییر کرد");
  };

  reader.readAsDataURL(file);
 };
}

$("setPhoto").onclick=setPhoto;
$("profilePhoto").onclick=setPhoto;


/* ================= PROFILE COLOR ================= */

$("profileColor").onclick=()=>{

 const colors=[
  "#6c63ff","#e91e63","#2196f3","#00a884","#ff9800",
  "#9c27b0","#ef4444","#14b8a6","#f43f5e","#8b5cf6"
 ];

 modal(`
  <h3>Profile Colour</h3>
  <div class="color-options">
   ${colors.map(c=>`
    <button class="color" data-color="${c}"
     style="background:${c}"></button>
   `).join("")}
  </div>
 `);

 document.querySelectorAll(".color").forEach(b=>{
  b.onclick=async()=>{
   const color=b.dataset.color;

   myData.color=color;

   await update(ref(db,"users/"+user.uid),{color});

   document.documentElement.style.setProperty("--primary",color);

   closeModal();
   toast("رنگ پروفایل تغییر کرد");
  };
 });
};


/* ================= NAME EMOJI ================= */

$("nameEmoji").onclick=()=>{

 const emojis=["✨","🔥","💎","👑","⚡","🌙","🦋","🎯","💜","🚀"];

 modal(`
  <h3>Premium Name Emoji</h3>
  <p class="muted small">
   ${myData.premium?"یک ایموجی برای نام انتخاب کن":"این قابلیت برای Premium است."}
  </p>

  <div class="gift-grid">
   ${emojis.map(e=>`
    <button class="btn emojiChoice" data-e="${e}"
     style="font-size:25px">${e}</button>
   `).join("")}
  </div>
 `);

 document.querySelectorAll(".emojiChoice").forEach(b=>{
  b.onclick=async()=>{
   if(!myData.premium){
    toast("ابتدا Premium را فعال کن");
    return;
   }

   myData.emoji=b.dataset.e;

   await update(ref(db,"users/"+user.uid),{
    emoji:myData.emoji
   });

   renderProfile();
   closeModal();
  };
 });
};


/* ================= PREMIUM ================= */

$("premiumBtn").onclick=()=>{

 modal(`
  <div class="modal-head">
   <h2>⭐ ÀVanta Premium</h2>
   <button class="icon-btn" id="closePremium">×</button>
  </div>

  <p>امکانات Premium:</p>

  <div class="story">
   ⭐ Premium Badge<br>
   🎨 رنگ پروفایل<br>
   😊 Name Emoji<br>
   🎁 امکانات Gift<br>
   ✨ پروفایل ویژه
  </div>

  ${
   myData.premium
   ? `<button class="btn full">Premium فعال است ✓</button>`
   : `<button id="activatePremium" class="btn primary full">
       فعال‌سازی Premium آزمایشی
      </button>`
  }
 `);

 $("closePremium").onclick=closeModal;

 if($("activatePremium")){
  $("activatePremium").onclick=async()=>{
   myData.premium=true;

   await update(ref(db,"users/"+user.uid),{
    premium:true
   });

   renderProfile();
   closeModal();
   toast("Premium فعال شد ⭐");
  };
 }
};


/* ================= STORIES ================= */

async function addStory(){

 modal(`
  <h3>➕ Add Story</h3>
  <textarea id="storyText"
   placeholder="متن Story..."></textarea>

  <input id="storyFile" type="file" accept="image/*,video/*">

  <button id="saveStory" class="btn primary full">
   انتشار Story
  </button>
 `);

 $("saveStory").onclick=async()=>{

  const text=$("storyText").value.trim();
  const file=$("storyFile").files[0];

  if(!text && !file){
   toast("متن یا عکس انتخاب کن");
   return;
  }

  const publish=async(media="")=>{

   const story={
    uid:user.uid,
    name:myData.name,
    text,
    media,
    createdAt:Date.now()
   };

   await push(ref(db,"stories"),story);

   closeModal();
   toast("Story منتشر شد");
   renderStories();
  };

  if(file){

   if(file.size>3*1024*1024){
    toast("حجم فایل زیاد است");
    return;
   }

   const reader=new FileReader();

   reader.onload=()=>publish(reader.result);

   reader.readAsDataURL(file);

  }else{
   publish("");
  }
 };
}

$("storyBtn").onclick=addStory;


async function renderStories(){

function chatId(a,b){

}

function listenChats(){

 onValue(ref(db,"chats"),async snap=>{

   snap.forEach(x=>{

   </div>

  </header>

  <div id="messages" class="messages"></div>

  <div class="chat-input">

   <button id="chatEmoji" class="icon-btn">😊</button>

   <button id="chatGif" class="btn">GIF</button>

   <input id="messageInput" placeholder="پیام...">

   <button id="sendMessage" class="btn primary">

   </button>

  </div>
 `;

 document.body.appendChild(screen);

 $("backChat").onclick=()=>screen.remove();

 $("chatMenu").onclick=()=>{

  modal(`

   <button id="saveChat" class="btn full">
    🔖 ذخیره پیام‌ها
   </button>
   <button id="blockChat" class="btn danger full">

  $("saveChat").onclick=()=>{
   closeModal();
   toast("برای ذخیره، روی پیام موردنظر استفاده کن");
  };

  $("blockChat").onclick=()=>{
   closeModal();
   toast("کاربر Block شد");
  };

  $("reportChat").onclick=()=>{
   closeModal();
   toast("گزارش ثبت شد");
  };
 };

 $("chatEmoji").onclick=()=>{

  const emojis=["😀","😂","😍","🔥","❤️","👍","🎉","💎","😎","😭"];

  modal(`
   <h3>Emoji</h3>
   <div class="gift-grid">

     <button class="btn pickEmoji"
      data-e="${e}" style="font-size:24px">${e}</button>
    `).join("")}

  document.querySelectorAll(".pickEmoji").forEach(b=>{

   };
  });
 };

 };

   e.preventDefault();

  }

function messagesPath(){

 return ref(
  db,
  "messages/"+currentChat.id
 );
}


function listenMessages(){

 if(messageListener){
  messageListener();
  messageListener=null;
 }

 messageListener=onValue(
  messagesPath(),
  snap=>{

   const box=$("messages");
   if(!box)return;

   const arr=[];

   if(snap.exists()){
    snap.forEach(x=>{
     arr.push({
      id:x.key,
      ...x.val()
     });
    });
   }

   arr.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));

   box.innerHTML=arr.map(m=>`

    <div class="msg ${m.uid===user.uid?"mine":""}">

     <div>${esc(m.text||"")}</div>

     <div class="msg-time">
      ${esc(m.time||"")}
     </div>

    </div>

   `).join("");

   box.scrollTop=box.scrollHeight;
  }
 );
}


async function ensureChat(){

 const id=currentChat.id;

 const snap=await get(ref(db,"chats/"+id));

 if(snap.exists())return;

 const members={};

 if(currentChat.isChatObject){

  members[user.uid]=true;

 }else{

  members[user.uid]=true;
  members[id]=true;
 }

 await set(ref(db,"chats/"+id),{
  title:currentChat.other.name||"Chat",
  photo:currentChat.other.photo||"",
  members,
  createdAt:Date.now(),
  lastMessage:""
 });
}


async function sendMessage(){

 const input=$("messageInput");

 const text=input.value.trim();

 if(!text)return;

 try{

  await ensureChat();

  const msg={
   uid:user.uid,
   text,
   time:now(),
   createdAt:Date.now()
  };

  await push(messagesPath(),msg);

  await update(ref(db,"chats/"+currentChat.id),{
   lastMessage:text,
   updatedAt:Date.now()
  });

  input.value="";

 }catch(e){

  console.error(e);
  toast("ارسال پیام ناموفق بود");
 }
}
