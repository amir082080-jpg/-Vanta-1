<style>
:root{--bg:#0b1020;--panel:#11182b;--panel2:#171f35;--text:#f4f7ff;--muted:#94a0ba;--line:#27314b;--accent:#6d5dfc;--accent2:#8b7cff;--danger:#ef476f;--ok:#23c483;--shadow:0 20px 60px #0007}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}.app{height:100dvh;display:grid;grid-template-columns:330px 1fr;overflow:hidden}.sidebar{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.brand{padding:18px 20px;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:space-between}.brand b{color:var(--accent2)}.search{margin:0 14px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 13px;color:var(--text);outline:none;width:calc(100% - 28px)}.nav{display:flex;gap:6px;padding:0 12px 10px}.nav button,.iconbtn,.ghost{background:transparent;color:var(--muted);padding:10px;border-radius:12px}.nav button.active,.nav button:hover,.iconbtn:hover,.ghost:hover{background:var(--panel2);color:var(--text)}.list{overflow:auto;flex:1;padding:4px 8px}.item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;margin:2px 0;cursor:pointer}.item:hover,.item.active{background:var(--panel2)}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#21d4fd);font-weight:800;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.itemmain{min-width:0;flex:1}.itemmain strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.itemmain small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{display:flex;flex-direction:column;min-width:0;background:radial-gradient(circle at 80% 0,#1b2250 0,transparent 35%),var(--bg)}.top{height:64px;display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:#0d1426e8;backdrop-filter:blur(14px)}.top .title{flex:1}.top .title b{display:block}.top .title small{color:var(--muted)}.messages{flex:1;overflow:auto;padding:18px clamp(10px,4vw,80px);display:flex;flex-direction:column;gap:7px}.bubble{max-width:min(720px,86%);padding:9px 12px;border-radius:17px;background:var(--panel2);align-self:flex-start;box-shadow:0 3px 15px #0002;word-wrap:break-word}.bubble.me{align-self:flex-end;background:#2d276c}.bubble .sender{font-size:12px;font-weight:800;color:#a99fff;margin-bottom:3px}.bubble .meta{font-size:10px;color:#9ba4bb;text-align:left;margin-top:4px}.reply{border-right:3px solid var(--accent);background:#ffffff08;padding:5px 8px;margin-bottom:5px;border-radius:8px;font-size:12px}.msgimg,.msgfile{max-width:100%;border-radius:12px;margin-top:4px}.composer{padding:10px 14px;border-top:1px solid var(--line);background:#0d1426e8;display:flex;gap:7px;align-items:end}.composer textarea{flex:1;resize:none;max-height:140px;min-height:42px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:16px;padding:11px;outline:none}.send{background:var(--accent);color:#fff;border-radius:14px;padding:11px 16px;font-weight:800}.panel{position:fixed;inset:0;background:#0008;display:none;z-index:30;align-items:flex-start;justify-content:flex-end}.panel.open{display:flex}.drawer{width:min(430px,94vw);height:100%;background:var(--panel);padding:18px;overflow:auto;box-shadow:var(--shadow)}.modal{position:fixed;inset:0;background:#0009;z-index:50;display:none;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.card{width:min(620px,100%);max-height:90dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--text);outline:none}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.primary{background:var(--accent);color:white;padding:10px 14px;border-radius:12px;font-weight:800}.danger{background:#4a1728;color:#ff9ab2;padding:10px 14px;border-radius:12px}.tag{display:inline-flex;padding:4px 7px;border-radius:8px;background:#ffffff10;color:#b8c1d8;font-size:11px;margin:2px}.premium{color:#ffd166}.emoji{width:25px;height:25px;object-fit:contain;vertical-align:middle}.emojiGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.emojiGrid button{background:var(--panel2);border-radius:10px;padding:7px}.emojiGrid img{width:30px;height:30px}.profileHero{padding:25px;text-align:center;border-radius:18px;background:var(--profile-bg,linear-gradient(135deg,#1d2550,#161a31));margin-bottom:14px}.profileHero .avatar{width:86px;height:86px;margin:auto;font-size:28px}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#050811;color:#fff;padding:11px 15px;border:1px solid var(--line);border-radius:12px;z-index:100;display:none}.toast.show{display:block}.empty{margin:auto;color:var(--muted);text-align:center}.login{height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#27205b,transparent 45%),var(--bg)}.login .card{text-align:center;max-width:430px}.logo{font-size:48px;font-weight:1000;letter-spacing:-3px}.adminGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:15px;background:var(--panel2);border-radius:15px}.stat b{font-size:24px;display:block}.context{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:190px}.context button{display:block;width:100%;text-align:right;background:transparent;color:var(--text);padding:10px;border-radius:9px}.context button:hover{background:var(--panel2)}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:fixed;inset:0 0 0 auto;width:min(92vw,360px);z-index:20;transform:translateX(100%);transition:.2s}.sidebar.open{transform:translateX(0)}.messages{padding:12px 8px}.bubble{max-width:91%}.top{height:58px}.mobileMenu{display:block!important}}@media(min-width:761px){.mobileMenu{display:none!important}}
</style>

<body>
<div id="login" class="login"><div class="card"><div class="logo">À<span>Vanta</span></div><p id="loginStatus">پیام‌رسان اختصاصی ÀVanta</p><button id="googleBtn" class="primary" style="width:100%;margin:5px 0">ورود با Google</button><button id="guestBtn" class="ghost" style="width:100%">ورود مهمان</button><small style="color:var(--muted);display:block;margin-top:12px">با ورود مهمان نیز می‌توانی چت کنی؛ برای امکانات کامل حساب دائمی بساز.</small></div></div>
<div id="app" class="app hidden">
<aside id="sidebar" class="sidebar"><div class="brand"><span>À<b>Vanta</b></span><button class="iconbtn" id="settingsBtn">⚙</button></div><input id="search" class="search" placeholder="جستجوی کاربر، چت، کانال..."/><div class="nav"><button id="allBtn" class="active">چت‌ها</button><button id="savedBtn">ذخیره‌شده</button><button id="contactsBtn">کاربران</button></div><div id="chatList" class="list"></div></aside>
<main class="main"><header class="top"><button class="iconbtn mobileMenu" id="menuBtn">☰</button><div class="title"><b id="chatTitle">چت عمومی</b><small id="chatSub">ÀVanta</small></div><button class="iconbtn" id="profileBtn">پروفایل</button><button class="iconbtn" id="moreBtn">⋮</button></header><section id="messages" class="messages"></section><div id="replyBar" class="reply hidden"></div><div class="composer"><button class="iconbtn" id="attachBtn">＋</button><button class="iconbtn" id="emojiBtn">☺</button><textarea id="input" placeholder="پیام..."></textarea><button class="send" id="sendBtn">ارسال</button></div></main></div>
<div id="drawer" class="panel"><div class="drawer"><div class="row"><h2 style="flex:1">ÀVanta</h2><button class="iconbtn" id="closeDrawer">×</button></div><div id="drawerBody"></div></div></div>
<div id="modal" class="modal"><div class="card" id="modalCard"></div></div><div id="toast" class="toast"></div><input id="fileInput" type="file" hidden>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyBsncHhhlqIi6qpf3hYtb0DOnq8zjb-zpI",authDomain:"avanta-3db7e.firebaseapp.com",databaseURL:"https://avanta-3db7e-default-rtdb.firebaseio.com",projectId:"avanta-3db7e",storageBucket:"avanta-3db7e.firebasestorage.app",messagingSenderId:"879564538420",appId:"1:879564538420:web:a0fc85cc43a9347d92c061"};
const ADMIN_UID="NNY1ymTknwREwMo16ZI3lgFEni23";firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database();
const $=id=>document.getElementById(id);let me=null,profile=null,current={type:'public',id:'public',title:'چت عمومی'},unsubs=[],replyTo=null,emojiCache={},usersCache={},recording=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function toast(x){$('toast').textContent=x;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),2600)}
function path(p){return db.ref(p)}function uid(){return me?.uid}function isAdmin(){return uid()===ADMIN_UID}function now(){return Date.now()}
function avatar(u,size='avatar'){let n=esc(u?.displayName||u?.username||'U').slice(0,1).toUpperCase();return `<div class="${size}">${u?.photoURL?`<img src="${esc(u.photoURL)}">`:n}</div>`}
async function ensureUser(u){const ref=path('users/'+u.uid),snap=await ref.once('value');const old=snap.val()||{};profile={uid:u.uid,displayName:old.displayName||u.displayName||'کاربر ÀVanta',username:old.username||('user_'+u.uid.slice(0,8)),photoURL:old.photoURL||u.photoURL||'',premium:!!old.premium,premiumUntil:old.premiumUntil||0,vc:Number(old.vc||0),emojiId:old.emojiId||null,profileBg:old.profileBg||'',createdAt:old.createdAt||now(),lastSeen:now(),online:true};await ref.update(profile);}
async function bootUser(u){me=u;await ensureUser(u);$('login').classList.add('hidden');$('app').classList.remove('hidden');listenPresence();loadEmoji();loadChatList();openChat({type:'public',id:'public',title:'چت عمومی',sub:'گفتگوی عمومی'});}
auth.onAuthStateChanged(u=>{if(u)bootUser(u).catch(e=>{console.error(e);toast('خطا در بارگذاری حساب')})});
$('googleBtn').onclick=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){toast('ورود Google ناموفق: '+(e.code||'خطای شبکه'))}};
$('guestBtn').onclick=async()=>{try{await auth.signInAnonymously()}catch(e){toast('ورود مهمان ناموفق؛ Anonymous Auth را در Firebase فعال کن.')}};
function listenPresence(){const r=path('users/'+uid());const online=path('.info/connected');online.on('value',s=>{if(!s.val())return;r.update({online:true,lastSeen:firebase.database.ServerValue.TIMESTAMP});r.onDisconnect().update({online:false,lastSeen:firebase.database.ServerValue.TIMESTAMP})});}
function cleanUnsubs(){unsubs.forEach(x=>x&&x());unsubs=[]}
function openChat(c){current=c;replyTo=null;$('replyBar').classList.add('hidden');$('chatTitle').textContent=c.title;$('chatSub').textContent=c.sub||'';cleanUnsubs();const msgRef=path('messages/'+c.id);const fn=s=>renderMessages(s.val()||{});msgRef.on('value',fn);unsubs.push(()=>msgRef.off('value',fn));$('messages').innerHTML='<div class="empty">در حال بارگذاری...</div>';if(innerWidth<761)$('sidebar').classList.remove('open');}
function renderMessages(obj){const arr=Object.entries(obj).map(([id,v])=>({...v,id})).filter(v=>!v.deleted).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));if(!arr.length){$('messages').innerHTML='<div class="empty">هنوز پیامی نیست. اولین پیام را بفرست.</div>';return}$('messages').innerHTML=arr.map(m=>messageHTML(m)).join('');$('messages').scrollTop=$('messages').scrollHeight;$('messages').querySelectorAll('[data-mid]').forEach(el=>el.onclick=e=>msgMenu(e,el.dataset.mid));}
function messageHTML(m){const mine=m.senderUid===uid(),u=usersCache[m.senderUid]||{displayName:m.senderName,username:m.senderUsername,photoURL:m.senderPhoto,emojiId:m.senderEmojiId};const body=renderBody(m.text||'');const reacts=Object.entries(m.reactions||{}).map(([k,v])=>{let n=typeof v==='object'?Object.keys(v).length:Number(v);return `<span class="tag" data-react="${esc(k)}">${esc(k)} ${n}</span>`}).join('');return `<article class="bubble ${mine?'me':''}" data-mid="${m.id}">${!mine?`<div class="sender">${esc(u.displayName||'کاربر')} ${premiumBadge(u)}${customEmoji(u)}</div>`:''}${m.reply?`<div class="reply">${esc(m.reply.senderName||'')} : ${esc(m.reply.text||'')}</div>`:''}${body}<div class="meta">${time(m.createdAt)} ${m.edited?'ویرایش شد':''}</div>${reacts}</article>`}
function renderBody(t){let s=esc(t);s=s.replace(/\[emoji:([\w-]+)\]/g,(_,id)=>emojiCache[id]?`<img class="emoji" src="${esc(emojiCache[id].data)}" alt=":${esc(emojiCache[id].name)}:">`:`:${esc(id)}:`);return s.replace(/\n/g,'<br>')}
function customEmoji(u){return u?.emojiId&&emojiCache[u.emojiId]?`<img class="emoji" src="${esc(emojiCache[u.emojiId].data)}">`:''}function premiumBadge(u){return u?.premium?'<span class="premium">◆</span>':''}function time(t){return t?new Date(t).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}):''}
async function send(){const text=$('input').value.trim();if(!text)return;const id=current.id;const ref=path('messages/'+id).push();const p={senderUid:uid(),senderName:profile.displayName,senderUsername:profile.username,senderPhoto:profile.photoURL||'',senderEmojiId:profile.emojiId||null,text,createdAt:now()};if(replyTo)p.reply={id:replyTo.id,text:replyTo.text,senderName:replyTo.senderName};await ref.set(p);$('input').value='';replyTo=null;$('replyBar').classList.add('hidden');}
$('sendBtn').onclick=send;$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
function msgMenu(e,id){const m=path('messages/'+current.id+'/'+id);m.once('value').then(s=>{const v=s.val();const box=document.createElement('div');box.className='context';box.style.left=Math.min(e.clientX,innerWidth-210)+'px';box.style.top=Math.min(e.clientY,innerHeight-230)+'px';box.innerHTML=`<button data-a="reply">پاسخ</button><button data-a="react">واکنش</button><button data-a="save">ذخیره پیام</button>${v.senderUid===uid()?'<button data-a="del">حذف پیام</button>':''}`;document.body.appendChild(box);box.onclick=async ev=>{const a=ev.target.dataset.a;if(!a)return;box.remove();if(a==='reply'){replyTo={id,text:v.text,senderName:v.senderName};$('replyBar').textContent='پاسخ به: '+v.text;$('replyBar').classList.remove('hidden')}if(a==='react')react(v.id);if(a==='save')saveMessage(v);if(a==='del')m.update({deleted:true,deletedAt:now()})};setTimeout(()=>box.remove(),5000)})}
async function react(id){const x=prompt('واکنش را وارد کن (مثلاً ❤️)');if(!x)return;await path(`messages/${current.id}/${id}/reactions/${x}/${uid()}`).set(true)}
async function saveMessage(v){await path(`saved/${uid()}/${v.id}`).set({...v,savedAt:now(),sourceChat:current.id});toast('پیام ذخیره شد')}
function loadChatList(){const ref=path('users');const fn=s=>{const o=s.val()||{};Object.values(o).forEach(u=>usersCache[u.uid]=u);renderUsers(Object.values(o).filter(u=>u.uid!==uid()).slice(0,100))};ref.on('value',fn);unsubs.push(()=>ref.off('value',fn));}
function renderUsers(arr){$('chatList').innerHTML=`<div class="item active" data-public><div class="avatar">À</div><div class="itemmain"><strong>چت عمومی</strong><small>گفتگوی عمومی</small></div></div>`+arr.map(u=>`<div class="item" data-user="${u.uid}">${avatar(u)}<div class="itemmain"><strong>${esc(u.displayName)} ${premiumBadge(u)}${customEmoji(u)}</strong><small>${u.online?'آنلاین':'آخرین بازدید '+time(u.lastSeen)}</small></div></div>`).join('');$('chatList').querySelector('[data-public]').onclick=()=>openChat({type:'public',id:'public',title:'چت عمومی',sub:'گفتگوی عمومی'});$('chatList').querySelectorAll('[data-user]').forEach(x=>x.onclick=()=>{const u=usersCache[x.dataset.user];openChat({type:'dm',id:dmId(uid(),u.uid),title:u.displayName,sub:u.online?'آنلاین':'آفلاین',user:u})})}
function dmId(a,b){return [a,b].sort().join('_')}
async function loadEmoji(){const s=await path('emojis').once('value');emojiCache=s.val()||{};if(current)openChat(current)}
function showModal(html){$('modalCard').innerHTML=html;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
$('emojiBtn').onclick=()=>{showModal(`<div class="row"><h2>ایموجی ÀVanta</h2><button class="iconbtn" onclick="closeModal()">×</button></div><div id="emojiGrid" class="emojiGrid">${Object.entries(emojiCache).map(([id,e])=>`<button onclick="insertEmoji('${esc(id)}')"><img src="${esc(e.data)}" title=":${esc(e.name)}:"></button>`).join('')||'<p>ایموجی‌ای ساخته نشده.</p>'}</div>`)};
window.insertEmoji=id=>{ $('input').value+=' [emoji:'+id+']';closeModal();$('input').focus()};
$('attachBtn').onclick=()=>{$('fileInput').click()};$('fileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=await fileToData(f);const ref=path('messages/'+current.id).push();await ref.set({senderUid:uid(),senderName:profile.displayName,senderUsername:profile.username,senderPhoto:profile.photoURL||'',type:f.type.startsWith('image/')?'image':'file',fileName:f.name,fileData:data,createdAt:now()});toast('فایل ارسال شد')}catch(x){toast('فایل بزرگ است؛ حجم را کاهش بده')}};
function fileToData(f){return new Promise((res,rej)=>{if(f.size>3*1024*1024)return rej();if(f.type.startsWith('image/')){const im=new Image(),c=document.createElement('canvas'),r=new FileReader();r.onload=()=>{im.onload=()=>{let w=im.width,h=im.height,m=1280;if(w>m){h=h*m/w;w=m}c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/webp',.78))};im.src=r.result};r.readAsDataURL(f)}else{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)}})}
const oldRender=messageHTML;messageHTML=function(m){let h=oldRender(m);if(m.type==='image')h=h.replace(renderBody(m.text||''),`<img class="msgimg" src="${esc(m.fileData)}" alt="${esc(m.fileName||'image')}">`);if(m.type==='file')h=h.replace(renderBody(m.text||''),`<a class="tag" download="${esc(m.fileName)}" href="${esc(m.fileData)}">دانلود ${esc(m.fileName)}</a>`);return h};
$('profileBtn').onclick=()=>showProfile(profile);function showProfile(u){showModal(`<div class="profileHero" style="${u.profileBg?'--profile-bg:'+esc(u.profileBg):''}">${avatar(u)}<h2>${esc(u.displayName)} ${premiumBadge(u)}</h2><small>@${esc(u.username)} · ${u.online?'آنلاین':'آفلاین'}</small></div><p>${esc(u.bio||'')}</p><div class="row"><button class="primary" onclick="messageUser('${u.uid}')">Message</button><button class="ghost" onclick="giftUser('${u.uid}')">Send Gift</button></div><hr><button class="ghost" style="width:100%" onclick="editProfile()">ویرایش پروفایل</button>`) }window.messageUser=id=>{const u=usersCache[id];closeModal();if(u)openChat({type:'dm',id:dmId(uid(),id),title:u.displayName,sub:u.online?'آنلاین':'آفلاین',user:u})};
window.editProfile=()=>{showModal(`<h2>پروفایل</h2><div class="field"><label>نام</label><input id="pName" value="${esc(profile.displayName)}"></div><div class="field"><label>نام کاربری</label><input id="pUser" value="${esc(profile.username)}"></div><div class="field"><label>Bio</label><textarea id="pBio">${esc(profile.bio||'')}</textarea></div><div class="field"><label>رنگ پس‌زمینه ${profile.premium?'':'(فقط Premium)'}</label><input id="pBg" ${profile.premium?'':'disabled'} value="${esc(profile.profileBg||'linear-gradient(135deg,#1d2550,#161a31)')}"></div><button class="primary" onclick="saveProfile()">ذخیره</button>`)};
window.saveProfile=async()=>{const x={displayName:$('pName').value.trim()||'کاربر ÀVanta',username:$('pUser').value.trim().replace(/\s/g,'_')||('user_'+uid().slice(0,8)),bio:$('pBio').value,profileBg:profile.premium?$('pBg').value:profile.profileBg||''};await path('users/'+uid()).update(x);Object.assign(profile,x);toast('پروفایل ذخیره شد');closeModal();showProfile(profile)};
$('settingsBtn').onclick=()=>settings();function settings(){showModal(`<h2>Settings</h2><button class="ghost" style="width:100%;text-align:right" onclick="toggleTheme()">تغییر Dark / Light</button><button class="ghost" style="width:100%;text-align:right" onclick="premiumPage()">Premium و VC</button><button class="ghost" style="width:100%;text-align:right" onclick="folders()">Storage / Folders</button>${isAdmin()?'<button class="ghost" style="width:100%;text-align:right" onclick="adminPanel()">Admin Panel</button>':''}<button class="danger" style="width:100%;margin-top:15px" onclick="auth.signOut().then(()=>location.reload())">خروج</button>`)}
window.toggleTheme=()=>{document.documentElement.style.setProperty('--bg',getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()==='#0b1020'?'#f4f6fb':'#0b1020');if(document.documentElement.style.getPropertyValue('--bg')==='#f4f6fb'){document.documentElement.style.setProperty('--panel','#fff');document.documentElement.style.setProperty('--panel2','#eef1f7');document.documentElement.style.setProperty('--text','#182033');document.documentElement.style.setProperty('--muted','#68738a');document.documentElement.style.setProperty('--line','#dbe0ea')}else location.reload()};
window.premiumPage=()=>{showModal(`<h2>Premium</h2><p>موجودی: <b>${profile.vc||0} VC</b></p><div class="stat">۳ ماهه — 1000 VC</div><div class="stat">۶ ماهه — 1500 VC</div><div class="stat">۱ ساله — 2500 VC</div><p style="color:var(--muted)">فقط موجودی واقعی VC برای خرید قابل استفاده است. افزایش VC توسط کاربر در این رابط وجود ندارد.</p><button class="primary" onclick="buyPremium(1000,90)">خرید ۳ ماهه</button><button class="primary" onclick="buyPremium(1500,180)">خرید ۶ ماهه</button><button class="primary" onclick="buyPremium(2500,365)">خرید ۱ ساله</button>`)};
window.buyPremium=async(cost,days)=>{if((profile.vc||0)<cost)return toast('VC کافی نیست');const until=Math.max(profile.premiumUntil||0,now())+days*86400000;await path('users/'+uid()).update({vc:profile.vc-cost,premium:true,premiumUntil:until});profile.vc-=cost;profile.premium=true;profile.premiumUntil=until;toast('Premium فعال شد');closeModal()};
window.folders=()=>showModal(`<h2>Storage / Folders</h2><p>پیام‌های ذخیره‌شده و فایل‌های حساب در Firebase Realtime Database نگهداری می‌شوند. برای جلوگیری از Storage، تصاویر داخل DB به صورت Data URL فشرده ذخیره می‌شوند.</p><button class="primary" onclick="savedList()">Saved Messages</button>`);
window.savedList=async()=>{const s=await path('saved/'+uid()).once('value');const a=Object.values(s.val()||{});showModal(`<h2>Saved Messages</h2>${a.length?a.map(x=>`<div class="item"><div class="itemmain"><strong>${esc(x.senderName||'')}</strong><small>${esc(x.text||x.fileName||'')}</small></div></div>`).join(''):'<p>خالی است.</p>'}`)};
$('savedBtn').onclick=()=>savedList();$('contactsBtn').onclick=()=>{$('search').focus()};$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');$('closeDrawer').onclick=()=>$('drawer').classList.remove('open');$('moreBtn').onclick=()=>openCreateMenu();
function openCreateMenu(){showModal(`<h2>ساخت</h2><button class="ghost" style="width:100%;text-align:right" onclick="createGroup()">گروه جدید</button><button class="ghost" style="width:100%;text-align:right" onclick="createChannel()">کانال جدید</button><button class="ghost" style="width:100%;text-align:right" onclick="inviteLink()">Invite Link</button>`)}
window.createGroup=async()=>{const name=prompt('نام گروه');if(!name)return;const id=path('groups').push().key;await path('groups/'+id).set({name,owner:uid(),createdAt:now(),members:{[uid()]:true}});closeModal();toast('گروه ساخته شد')};
window.createChannel=async()=>{if(!profile.premium)return toast('ساخت کانال فقط برای Premium است');const name=prompt('نام کانال');if(!name)return;const id=path('channels').push().key;await path('channels/'+id).set({name,owner:uid(),createdAt:now(),members:{[uid()]:true},inviteCode:crypto.randomUUID().replaceAll('-','').slice(0,12)});closeModal();toast('کانال ساخته شد')};
window.inviteLink=()=>{const code=crypto.randomUUID().replaceAll('-','').slice(0,12);navigator.clipboard?.writeText(location.href+'#invite='+code);toast('لینک دعوت کپی شد')};
window.giftUser=async(to)=>{const s=await path('gifts').once('value'),g=s.val()||{};const a=Object.entries(g).filter(([id,x])=>Number(x.price)>0);if(!a.length)return toast('فعلاً گیفتی موجود نیست');showModal(`<h2>Send Gift</h2>${a.map(([id,x])=>`<button class="item" onclick="sendGift('${id}','${to}')"><strong>${esc(x.name)}</strong><span>${x.price} VC</span></button>`).join('')}`)};
window.sendGift=async(id,to)=>{const s=await path('gifts/'+id).once('value'),g=s.val();if(!g)return;if((profile.vc||0)<g.price)return toast('VC کافی نیست');const gift={giftId:id,name:g.name,from:uid(),to,price:g.price,createdAt:now()};const tx=await path('users/'+uid()+'/vc').transaction(v=>Number(v||0)-Number(g.price));if(!tx.committed)return toast('خرید ناموفق');await path('giftTransactions').push().set(gift);await path('giftInbox/'+to).push().set(gift);profile.vc-=g.price;toast('گیفت ارسال شد');closeModal()};
window.adminPanel=async()=>{if(!isAdmin())return;const [u,g,e]=await Promise.all([path('users').once('value'),path('gifts').once('value'),path('emojis').once('value')]);const us=Object.values(u.val()||{}),gs=Object.entries(g.val()||{}),es=Object.entries(e.val()||{});showModal(`<h2>Admin Panel</h2><div class="adminGrid"><div class="stat"><b>${us.length}</b>کاربر</div><div class="stat"><b>${gs.length}</b>گیفت</div><div class="stat"><b>${es.length}</b>ایموجی</div><div class="stat"><b>${us.filter(x=>x.premium).length}</b>Premium</div></div><hr><h3>افزایش VC</h3><div class="field"><input id="vcUid" placeholder="UID کاربر"></div><div class="field"><input id="vcAmt" type="number" placeholder="مقدار VC"></div><button class="primary" onclick="grantVC()">اعطا VC</button><hr><h3>ساخت Gift</h3><div class="field"><input id="giftName" placeholder="نام گیفت"></div><div class="field"><input id="giftPrice" type="number" placeholder="قیمت VC"></div><div class="field"><input id="giftData" placeholder="Emoji یا متن/داده گیفت"></div><button class="primary" onclick="createGift()">ساخت Gift</button><hr><h3>ساخت Custom Emoji</h3><input id="emojiFile" type="file" accept="image/*" onchange="adminEmoji(this)"><div class="field"><input id="emojiName" placeholder="نام ایموجی"></div><p style="color:var(--muted)">تصویر در مرورگر WebP و فشرده می‌شود و در RTDB ذخیره می‌گردد؛ Storage لازم نیست.</p><hr><button class="danger" onclick="cleanupOld()">پاکسازی پیام‌های قدیمی</button>`)};
window.grantVC=async()=>{if(!isAdmin())return;const id=$('vcUid').value.trim(),amt=Number($('vcAmt').value);if(!id||!amt||amt<1)return toast('اطلاعات نامعتبر');await path('users/'+id+'/vc').transaction(v=>Number(v||0)+amt);await path('adminLogs').push().set({action:'grantVC',target:id,amount:amt,by:uid(),createdAt:now()});toast('VC اعطا شد')};
window.createGift=async()=>{if(!isAdmin())return;const name=$('giftName').value.trim(),price=Number($('giftPrice').value),data=$('giftData').value;if(!name||!price)return toast('اطلاعات ناقص');await path('gifts').push().set({name,price,data,createdBy:uid(),createdAt:now()});toast('Gift ساخته شد')};
window.adminEmoji=async input=>{if(!isAdmin()||!input.files[0])return;const name=$('emojiName').value.trim()||'emoji';const data=await fileToData(input.files[0]);const id='ba'+Math.random().toString(16).slice(2,12);await path('emojis/'+id).set({name,data,createdBy:uid(),createdAt:now(),format:'webp-data-url'});emojiCache[id]={name,data};toast('Emoji ساخته شد');closeModal()};
window.cleanupOld=async()=>{if(!isAdmin())return;const days=Number(prompt('پیام‌های قدیمی‌تر از چند روز؟','30'));if(!days)return;const cutoff=now()-days*86400000;const root=await path('messages').once('value');let n=0;const updates={};root.forEach(chat=>chat.forEach(m=>{if((m.val().createdAt||0)<cutoff){updates[`messages/${chat.key}/${m.key}`]=null;n++}}));await db.ref().update(updates);toast(n+' پیام پاک شد')};
$('search').oninput=e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('#chatList .item').forEach(x=>x.style.display=(!q||x.textContent.toLowerCase().includes(q))?'flex':'none')};
// Group/channel discovery and joining through Firebase data, without fake buttons.
async function discoverSpaces(){const [g,c]=await Promise.all([path('groups').once('value'),path('channels').once('value')]);return [...Object.entries(g.val()||{}).map(([id,x])=>({...x,id,type:'group'})),...Object.entries(c.val()||{}).map(([id,x])=>({...x,id,type:'channel'}))]}
// Firebase/network diagnostics
window.addEventListener('online',()=>toast('اتصال اینترنت برقرار شد'));window.addEventListener('offline',()=>toast('اتصال اینترنت قطع شد'));window.addEventListener('error',e=>console.error('ÀVanta:',e.error||e.message));
// PWA service worker from a Blob; GitHub Pages/HTTPS required for SW scope.
if('serviceWorker'in navigator&&location.protocol!=='file:'){const sw=`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>caches.match(e.request))))`;navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'text/javascript'}))).catch(()=>{});}
</script></body></html>
