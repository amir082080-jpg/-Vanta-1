<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09070f">
<title>ÀVanta | First Stream</title>

<style>
:root{
  --bg:#06060a;
  --card:#11111a;
  --card2:#0d0d14;
  --line:#292936;
  --text:#f7f7fb;
  --muted:#9696a8;
  --accent:#8b5cf6;
  --accent2:#a78bfa;
  --danger:#ef4444;
  --ok:#22c55e;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
  overscroll-behavior:none;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -10%,rgba(139,92,246,.16),transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
  overflow-x:hidden;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:14px;
}

/* HEADER */

.header{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  margin-bottom:12px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:20px;
  background:rgba(17,17,26,.86);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  position:sticky;
  top:8px;
  z-index:20;
  box-shadow:0 10px 35px rgba(0,0,0,.22);
}

.logo{
  font-size:21px;
  font-weight:900;
  letter-spacing:.5px;
}

.logo span{
  color:var(--accent2);
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  color:#aaaabd;
  font-size:12px;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--ok);
  box-shadow:0 0 12px var(--ok);
}

/* CARDS */

.card{
  background:rgba(17,17,26,.86);
  border:1px solid rgba(255,255,255,.07);
  border-radius:22px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 12px 35px rgba(0,0,0,.16);
}

.card-title{
  font-size:16px;
  font-weight:900;
  margin-bottom:13px;
}

/* CHAT */

.chat-card{
  padding:0;
  overflow:hidden;
}

.chat-head{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid var(--line);
}

.chat-title{
  font-weight:900;
}

.online{
  font-size:11px;
  color:#7ee2a8;
}

.messages{
  height:440px;
  overflow-y:auto;
  overflow-x:hidden;
  padding:14px;
  overscroll-behavior:contain;
  scroll-behavior:smooth;
  contain:layout paint;
}

.messages::-webkit-scrollbar{
  width:5px;
}

.messages::-webkit-scrollbar-thumb{
  background:#30303c;
  border-radius:10px;
}

.message{
  display:flex;
  gap:9px;
  margin-bottom:12px;
  align-items:flex-start;
  animation:messageIn .18s ease-out;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(4px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.avatar{
  flex:0 0 34px;
  width:34px;
  height:34px;
  border-radius:50%;
  background:linear-gradient(135deg,#8b5cf6,#4c1d95);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:900;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.message-body{
  min-width:0;
  max-width:calc(100% - 43px);
}

.message-name{
  font-size:12px;
  color:var(--accent2);
  font-weight:900;
  margin-bottom:3px;
}

.message-text{
  display:inline-block;
  background:#171720;
  border:1px solid rgba(255,255,255,.055);
  border-radius:13px 13px 13px 4px;
  padding:8px 11px;
  line-height:1.65;
  font-size:14px;
  word-break:break-word;
}

.message-time{
  display:inline-block;
  color:#77778b;
  font-size:9px;
  margin-right:6px;
}

/* EMOJI */

.chat-emoji{
  display:inline-flex;
  vertical-align:middle;
  width:38px;
  height:38px;
  object-fit:contain;
  margin:0 2px;
  border-radius:7px;
}

.message-text img.chat-emoji{
  vertical-align:middle;
}

.emoji-only{
  background:transparent;
  border:0;
  padding:2px 0;
  font-size:0;
}

.emoji-only .chat-emoji{
  width:55px;
  height:55px;
}

/* INPUT */

.chat-input-area{
  min-height:64px;
  padding:10px;
  border-top:1px solid var(--line);
  display:flex;
  gap:8px;
  align-items:center;
}

.chat-input{
  flex:1;
  min-width:0;
  height:43px;
  border:1px solid #2b2b38;
  outline:none;
  border-radius:14px;
  background:#0b0b11;
  color:white;
  padding:0 13px;
  transition:border-color .15s;
}

.chat-input:focus{
  border-color:rgba(139,92,246,.75);
}

.send-btn,
.icon-btn{
  border:0;
  color:#fff;
  background:linear-gradient(135deg,#8b5cf6,#6d28d9);
  border-radius:13px;
  height:43px;
  min-width:43px;
  padding:0 13px;
  font-weight:900;
}

.send-btn:active,
.icon-btn:active,
button:active{
  transform:scale(.97);
}

.emoji-btn{
  width:43px;
  padding:0;
  font-size:20px;
}

/* EMOJI PANEL */

.emoji-panel{
  display:none;
  padding:10px;
  border-top:1px solid var(--line);
  background:#0b0b11;
  max-height:220px;
  overflow-y:auto;
}

.emoji-panel.open{
  display:block;
}

.emoji-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:7px;
}

.emoji-item{
  aspect-ratio:1;
  border:1px solid rgba(255,255,255,.05);
  border-radius:12px;
  background:#15151e;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  padding:5px;
}

.emoji-item img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* ADMIN */

.admin-panel{
  display:none;
}

.admin-panel.show{
  display:block;
}

.input{
  width:100%;
  height:43px;
  background:#0a0a10;
  color:#fff;
  border:1px solid #2b2b38;
  border-radius:13px;
  outline:none;
  padding:0 12px;
  margin-bottom:9px;
}

.btn{
  min-height:43px;
  border:0;
  border-radius:13px;
  padding:0 15px;
  font-weight:900;
  color:#fff;
  background:#242431;
}

.btn.primary{
  background:linear-gradient(135deg,#8b5cf6,#6d28d9);
}

.btn.danger{
  background:#491b22;
  color:#ff9aa6;
}

.btn:disabled{
  opacity:.5;
}

/* EMOJI ADMIN */

.upload-box{
  border:1px dashed #39394a;
  border-radius:16px;
  padding:14px;
  background:#0b0b11;
}

.file-label{
  min-height:43px;
  border-radius:13px;
  background:#191923;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  margin-bottom:9px;
}

#emojiFile{
  display:none;
}

.emoji-preview{
  width:70px;
  height:70px;
  border-radius:12px;
  object-fit:contain;
  display:none;
  margin:8px auto;
}

.admin-emoji-list{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-top:12px;
}

.admin-emoji{
  position:relative;
  background:#15151e;
  border:1px solid rgba(255,255,255,.06);
  border-radius:13px;
  padding:7px;
  min-height:90px;
  text-align:center;
}

.admin-emoji img{
  width:50px;
  height:50px;
  object-fit:contain;
}

.admin-emoji small{
  display:block;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  color:#aaa;
  margin-top:3px;
}

/* LOGIN */

.login-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.login-overlay.show{
  display:flex;
}

.login-box{
  width:100%;
  max-width:390px;
  background:#11111a;
  border:1px solid #30303d;
  border-radius:22px;
  padding:20px;
}

.login-title{
  font-size:20px;
  font-weight:900;
  margin-bottom:5px;
}

.login-sub{
  color:#88889b;
  font-size:12px;
  margin-bottom:18px;
}

.error{
  color:#ff8e9a;
  font-size:12px;
  min-height:18px;
  margin-bottom:7px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%) translateY(20px);
  opacity:0;
  pointer-events:none;
  background:#181821;
  border:1px solid #343443;
  border-radius:13px;
  padding:10px 15px;
  font-size:12px;
  z-index:200;
  transition:opacity .18s,transform .18s;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.empty{
  color:#77778a;
  text-align:center;
  padding:60px 10px;
  font-size:13px;
}

.loading{
  text-align:center;
  color:#77778a;
  padding:35px;
}

/* MOBILE */

@media(max-width:600px){
  .app{
    padding:9px;
  }

  .header{
    top:5px;
    height:58px;
    border-radius:17px;
  }

  .messages{
    height:calc(100dvh - 235px);
    min-height:300px;
    max-height:520px;
  }

  .emoji-grid{
    grid-template-columns:repeat(6,1fr);
  }

  .admin-emoji-list{
    grid-template-columns:repeat(4,1fr);
  }

  .message-text{
    font-size:13px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="logo">À<span>Vanta</span></div>
    <div class="status">
      <span class="status-dot"></span>
      آنلاین
    </div>
  </header>

  <section class="card">
    <div class="card-title">💜 به چت ÀVanta خوش اومدی</div>
    <div style="color:#9191a3;font-size:12px;line-height:1.8">

<!-- LOGIN -->

<div id="loginOverlay" class="login-overlay">

  <div class="login-box">

    <div class="login-title">ورود ادمین</div>

    <div class="login-sub">
      برای ورود، ایمیل و رمز ادمین را وارد کنید.
    </div>

    <input id="adminEmail" class="input" type="email" autocomplete="username" placeholder="ایمیل">

    <div id="loginError" class="error"></div>

    <button id="loginBtn" class="btn primary" style="width:100%;margin-bottom:8px">
      ورود
    </button>

    <button id="closeLoginBtn" class="btn" style="width:100%">
      بستن
    </button>

  </div>

</div>

<div id="toast" class="toast"></div>

<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  push,
  set,
  onValue,
  remove
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* =========================================================
   FIREBASE CONFIG
   همین اطلاعات پروژه خودت را اینجا نگه دار.
========================================================= */

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.firebasestorage.app",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};


/* =========================================================
   INIT
========================================================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


/* =========================================================
   ELEMENTS
========================================================= */

const messagesEl = document.getElementById("messages");

const chatInput = document.getElementById("chatInput");

const sendBtn = document.getElementById("sendBtn");

const emojiBtn = document.getElementById("emojiBtn");

const emojiPanel = document.getElementById("emojiPanel");

const emojiGrid = document.getElementById("emojiGrid");

const adminPanel = document.getElementById("adminPanel");

const adminLoginBtn = document.getElementById("adminLoginBtn");

const loginOverlay = document.getElementById("loginOverlay");

const closeLoginBtn = document.getElementById("closeLoginBtn");

const loginBtn = document.getElementById("loginBtn");

const adminEmail = document.getElementById("adminEmail");

const adminPassword = document.getElementById("adminPassword");

const loginError = document.getElementById("loginError");

const logoutBtn = document.getElementById("logoutBtn");

const emojiName = document.getElementById("emojiName");

const emojiFile = document.getElementById("emojiFile");

const emojiPreview = document.getElementById("emojiPreview");

const createEmojiBtn = document.getElementById("createEmojiBtn");

const adminEmojiList = document.getElementById("adminEmojiList");

const toast = document.getElementById("toast");


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let emojis = {};

let sending = false;


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function showToast(text){

  clearTimeout(toastTimer);

  toast.textContent = text;

  toast.classList.add("show");

  toastTimer = setTimeout(()=>{
    toast.classList.remove("show");
  },2200);

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   COMPRESS IMAGE
   ایموجی دیگر Storage نمی‌خواهد.
   عکس به Base64 تبدیل می‌شود.
========================================================= */

function compressImage(file){

  return new Promise((resolve,reject)=>{

    if(!file || !file.type.startsWith("image/")){
      reject(new Error("فایل تصویر نیست"));
      return;
    }

    const reader = new FileReader();

    reader.onload = ()=>{

      const img = new Image();

      img.onload = ()=>{

        const maxSize = 180;

        let width = img.width;

        let height = img.height;

        if(width > height){

          if(width > maxSize){
            height = Math.round(height * maxSize / width);
            width = maxSize;
          }

        }else{

          if(height > maxSize){
            width = Math.round(width * maxSize / height);
            height = maxSize;
          }

        }

        const canvas = document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");

        ctx.clearRect(0,0,width,height);

        ctx.drawImage(img,0,0,width,height);

        let quality = .82;

        let data = canvas.toDataURL("image/webp",quality);

        /*
          اگر مرورگر WebP را پشتیبانی نکند
          خروجی همچنان قابل استفاده خواهد بود.
        */

        if(data.length > 180000){

          quality = .65;

          data = canvas.toDataURL("image/jpeg",quality);

        }

        if(data.length > 280000){

          quality = .5;

          data = canvas.toDataURL("image/jpeg",quality);

        }

        if(data.length > 400000){

          reject(new Error("عکس خیلی بزرگ است. یک عکس ساده‌تر انتخاب کن."));

          return;
        }

        resolve(data);

      };

      img.onerror = ()=>reject(new Error("خواندن تصویر انجام نشد"));

      img.src = reader.result;

    };

    reader.onerror = ()=>reject(new Error("خواندن فایل انجام نشد"));

    reader.readAsDataURL(file);

  });

}


/* =========================================================
   PREVIEW
========================================================= */

emojiFile.addEventListener("change",async()=>{

  const file = emojiFile.files[0];

  if(!file){
    emojiPreview.style.display = "none";
    return;
  }

  try{

    const base64 = await compressImage(file);

    emojiPreview.src = base64;

    emojiPreview.style.display = "block";

  }catch(error){

    emojiPreview.style.display = "none";

    showToast(error.message);

  }

});


/* =========================================================
   LOAD EMOJIS
========================================================= */

onValue(
  ref(db,"emojis"),
  snapshot=>{

    emojis = snapshot.val() || {};

    renderEmojiPicker();

    renderAdminEmojis();

  },
  error=>{

    console.error(error);

    showToast("دریافت ایموجی‌ها انجام نشد.");

  }
);


/* =========================================================
   EMOJI PICKER
========================================================= */

function renderEmojiPicker(){

  emojiGrid.innerHTML = "";

  const list = Object.entries(emojis);

  if(!list.length){

    emojiGrid.innerHTML =
      '<div style="grid-column:1/-1;text-align:center;color:#777;padding:15px;font-size:12px">هنوز ایموجی ساخته نشده.</div>';

    return;

  }

  for(const [id,emoji] of list){

    if(!emoji || !emoji.image) continue;

    const button = document.createElement("button");

    button.className = "emoji-item";

    button.type = "button";

    const img = document.createElement("img");

    img.src = emoji.image;

    img.alt = emoji.name || "emoji";

    img.loading = "lazy";

    button.appendChild(img);

    button.addEventListener("click",()=>{

      insertEmojiToken(id);

    });

    emojiGrid.appendChild(button);

  }

}


/* =========================================================
   INSERT EMOJI TOKEN
========================================================= */

function insertEmojiToken(id){

  const token = `[[emoji:${id}]]`;

  const start = chatInput.selectionStart ?? chatInput.value.length;

  const end = chatInput.selectionEnd ?? chatInput.value.length;

  chatInput.value =
    chatInput.value.slice(0,start) +
    token +
    chatInput.value.slice(end);

  chatInput.focus();

  const newPosition = start + token.length;

  chatInput.setSelectionRange(newPosition,newPosition);

}


/* =========================================================
   RENDER MESSAGE CONTENT
   این قسمت مهم است:
   اسم ایموجی را نشان نمی‌دهد.
   عکس واقعی ایموجی را نشان می‌دهد.
========================================================= */

function renderMessageContent(text){

  const source = String(text ?? "");

  const regex = /\[\[emoji:([A-Za-z0-9_-]+)\]\]/g;

  let result = "";

  let lastIndex = 0;

  let match;

  let hasEmoji = false;

  while((match = regex.exec(source)) !== null){

    result += escapeHTML(source.slice(lastIndex,match.index));

    const id = match[1];

    const emoji = emojis[id];

    if(emoji && emoji.image){

      hasEmoji = true;

      result +=
        `<img class="chat-emoji" src="${escapeHTML(emoji.image)}" alt="${escapeHTML(emoji.name || "emoji")}" title="${escapeHTML(emoji.name || "")}">`;

    }else{

      /*
        اگر ایموجی حذف شده باشد، چیزی مثل اسم آن
        داخل چت نمایش نمی‌دهیم.
      */

    }

    lastIndex = regex.lastIndex;

  }

  result += escapeHTML(source.slice(lastIndex));

  return {
    html:result,
    hasEmoji
  };

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  if(sending) return;

  const text = chatInput.value.trim();

  if(!text) return;

  sending = true;

  sendBtn.disabled = true;

  try{

    let name = localStorage.getItem("avanta_chat_name");

    if(!name){

      name = prompt("اسمت رو وارد کن:");

      if(!name) return;

      name = name.trim().slice(0,30);

      if(!name) return;

      localStorage.setItem("avanta_chat_name",name);

    }

    await set(
      push(ref(db,"messages")),
      {
        name:name,
        text:text,
        uid:currentUser?.uid || null,
        createdAt:Date.now()
      }
    );

    chatInput.value = "";

  }catch(error){

    console.error(error);

    showToast("ارسال پیام انجام نشد.");

  }finally{

    sending = false;

    sendBtn.disabled = false;

    chatInput.focus();

  }

}

chatInput.addEventListener("keydown",event=>{

  if(event.key === "Enter" && !event.shiftKey){

    event.preventDefault();

    sendMessage();

  }

});


sendBtn.addEventListener("click",sendMessage);

/* =========================================================
   LOAD CHAT
========================================================= */

onValue(
  ref(db,"messages"),
  snapshot=>{

    const data = snapshot.val() || {};

    const list = Object.entries(data)
      .map(([id,msg])=>({
        id,
        ...(msg || {})
      }))
      .sort((a,b)=>(a.createdAt || 0)-(b.createdAt || 0));

    const wasNearBottom =
      messagesEl.scrollHeight -
      messagesEl.scrollTop -
      messagesEl.clientHeight <
      100;

    const fragment = document.createDocumentFragment();

    if(!list.length){

      const empty = document.createElement("div");

      empty.className = "empty";

      empty.textContent = "هنوز پیامی ارسال نشده 👀";

      fragment.appendChild(empty);

    }else{

      for(const msg of list.slice(-200)){

        const row = document.createElement("div");

        row.className = "message";

        const avatar = document.createElement("div");

        avatar.className = "avatar";

        const name =
          String(msg.name || "کاربر").slice(0,30);

        avatar.textContent =
          name.charAt(0).toUpperCase();

        const body = document.createElement("div");

        body.className = "message-body";

        const nameEl = document.createElement("div");

        nameEl.className = "message-name";

        nameEl.textContent = name;

        const textEl = document.createElement("div");

        const rendered =
          renderMessageContent(msg.text || "");

        textEl.className =
          rendered.hasEmoji && String(msg.text || "").replace(/\[\[emoji:[A-Za-z0-9_-]+\]\]/g,"").trim()===""
          ? "message-text emoji-only"
          : "message-text";

        textEl.innerHTML = rendered.html;

        const time = document.createElement("span");

        time.className = "message-time";

        if(msg.createdAt){

          const d = new Date(msg.createdAt);

          time.textContent =
            d.toLocaleTimeString("fa-IR",{
              hour:"2-digit",
              minute:"2-digit"
            });

        }

        body.appendChild(nameEl);

        body.appendChild(textEl);

        body.appendChild(time);

        row.appendChild(avatar);

        row.appendChild(body);

        fragment.appendChild(row);

      }

    }

    /*
      فقط وقتی لازم است DOM را عوض می‌کنیم.
      این کار باعث می‌شود صفحه کمتر تکان بخورد.
    */

    messagesEl.replaceChildren(fragment);

    if(wasNearBottom){

      requestAnimationFrame(()=>{

        messagesEl.scrollTop =
          messagesEl.scrollHeight;

      });

    }

  },
  error=>{

    console.error(error);

    messagesEl.innerHTML =
      '<div class="empty">خطا در دریافت چت.</div>';

  }
);

async function doLogin(){

  const email = adminEmail.value.trim();

  const password = adminPassword.value;

  if(!email || !password){

    loginError.textContent =
      "ایمیل و رمز را وارد کن.";

    return;

  }

  loginBtn.disabled = true;

  loginError.textContent = "";

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    loginOverlay.classList.remove("show");

    adminPassword.value = "";

  }catch(error){

    console.error(error);

    loginError.textContent =
      "ایمیل یا رمز عبور اشتباه است.";

  }finally{

    loginBtn.disabled = false;

  }

}


loginBtn.addEventListener("click",doLogin);

  if(event.key === "Enter"){

    event.preventDefault();

    doLogin();

});

/* =========================================================
   CREATE EMOJI
   بدون Firebase Storage
   Base64 -> Realtime Database
========================================================= */

createEmojiBtn.addEventListener("click",async()=>{

  if(!currentUser){

    showToast("اول وارد حساب ادمین شو.");

    return;

  }

  const name =
    emojiName.value.trim().slice(0,30);

  const file =
    emojiFile.files[0];

  if(!name){

    showToast("اسم ایموجی را وارد کن.");

    return;

  }

  if(!file){

    showToast("یک عکس انتخاب کن.");

    return;

  }

  createEmojiBtn.disabled = true;

  createEmojiBtn.textContent =
    "در حال ساخت...";

  try{

    const image =
      await compressImage(file);

    const newEmoji =
      push(ref(db,"emojis"));

    await set(newEmoji,{

      name:name,

      image:image,

      createdAt:Date.now(),

      createdBy:currentUser.uid

    });

    emojiName.value = "";

    emojiFile.value = "";

    emojiPreview.src = "";

    emojiPreview.style.display = "none";

    showToast("ایموجی با موفقیت ساخته شد 🎉");

  }catch(error){

    console.error(error);

    showToast(
      error?.message ||
      "ساخت ایموجی انجام نشد."
    );

  }finally{

    createEmojiBtn.disabled = false;

    createEmojiBtn.textContent =
      "ساخت ایموجی";

  }

});


/* =========================================================
   ADMIN EMOJI LIST
========================================================= */

function renderAdminEmojis(){

  adminEmojiList.innerHTML = "";

  const list =
    Object.entries(emojis);

  if(!list.length) return;

  for(const [id,emoji] of list){

    if(!emoji?.image) continue;

    const box =
      document.createElement("div");

    box.className = "admin-emoji";

    const img =
      document.createElement("img");

    img.src = emoji.image;

    img.alt = emoji.name || "emoji";

    const small =
      document.createElement("small");

    small.textContent =
      emoji.name || "بدون نام";

    const del =
      document.createElement("button");

    del.className = "btn danger";

    del.style.width = "100%";

    del.style.minHeight = "30px";

    del.style.padding = "0";

    del.style.fontSize = "10px";

    del.textContent = "حذف";

    del.addEventListener("click",async()=>{

      if(!currentUser) return;

      const ok =
        confirm(`ایموجی «${emoji.name || ""}» حذف شود؟`);

      if(!ok) return;

      try{

        await remove(
          ref(db,"emojis/"+id)
        );

        showToast("ایموجی حذف شد.");

      }catch(error){

        console.error(error);

        showToast("حذف ایموجی انجام نشد.");

      }

    });

    box.appendChild(img);

    box.appendChild(small);

    box.appendChild(del);

    adminEmojiList.appendChild(box);

  }

}
