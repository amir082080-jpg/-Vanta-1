<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ÀVanta Messenger</title>

<style>
:root{
  --accent:#7662ff;
  --bg:#080c13;
  --panel:#111923;
  --panel2:#172230;
  --line:#2a384b;
  --muted:#91a0b5;
  --danger:#ef476f;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:#fff;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif
}
body{overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer;color:#fff;border:0}
button:disabled{opacity:.5;cursor:not-allowed}

#app{
  width:100%;
  max-width:980px;
  height:100dvh;
  margin:auto;
  background:var(--bg);
  display:flex;
  flex-direction:column
}

.top{
  height:66px;
  min-height:66px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 12px;
  background:#0e151f;
  border-bottom:1px solid var(--line);
  z-index:5
}
.brand{
  font-size:21px;
  font-weight:1000;
  white-space:nowrap
}
.brand b{color:#a493ff}

.search{
  flex:1;
  min-width:50px;
  background:#182331;
  border:1px solid #2c3b4e;
  color:#fff;
  border-radius:17px;
  padding:10px 12px;
  outline:none
}

main{
  flex:1;
  overflow:auto;
  padding:14px 12px 100px
}
.page{display:none}
.page.on{display:block}

.card,.row{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:21px;
  padding:14px;
  margin-bottom:10px
}
.row{
  display:flex;
  align-items:center;
  gap:11px;
  transition:.12s;
  cursor:pointer
}
.row:active{transform:scale(.985)}

.title{
  font-size:21px;
  font-weight:950;
  margin-bottom:5px
}
.muted{color:var(--muted)}
.small{font-size:12px}
.grow{flex:1;min-width:0}

.avatar{
  width:52px;
  height:52px;
  border-radius:18px;
  display:grid;
  place-items:center;
  flex:none;
  background:linear-gradient(135deg,#806bff,#21c9ff);
  font-weight:950;
  overflow:hidden
}
.avatar img{
  width:100%;
  height:100%;
  object-fit:cover
}
.avatar.big{
  width:120px;
  height:120px;
  border-radius:35px;
  margin:4px auto 12px;
  font-size:42px
}

.btn{
  background:#1b2634;
  border:1px solid #34445a;
  border-radius:15px;
  padding:10px 13px;
  font-weight:800;
  transition:.12s
}
.btn:active{transform:scale(.96)}
.primary{
  background:linear-gradient(135deg,#7b65ff,#4d83ff);
  border-color:#8274ff
}
.danger{
  background:#481e2b;
  border-color:#713347
}
.full{
  width:100%;
  margin-top:7px
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}
.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px
}

.input,.textarea{
  width:100%;
  background:#0a1018;
  border:1px solid #314055;
  border-radius:15px;
  color:#fff;
  padding:11px;
  outline:none;
  margin:4px 0 8px
}
.textarea{
  min-height:90px;
  resize:vertical
}

.bottom{
  position:fixed;
  bottom:9px;
  left:50%;
  transform:translateX(-50%);
  width:min(960px,calc(100% - 16px));
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  padding:6px;
  background:#111a25ee;
  border:1px solid #34445b;
  border-radius:27px;
  backdrop-filter:blur(20px);
  z-index:20;
  box-shadow:0 12px 45px #0008
}
.bottom button{
  background:transparent;
  border-radius:21px;
  padding:7px 3px;
  color:#8997aa
}
.bottom button.on{
  background:#7461ff22;
  color:#fff
}
.navico{
  font-size:21px;
  display:block;
  line-height:22px
}

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  z-index:50;
  display:none;
  align-items:flex-end;
  padding:8px
}
.modal.on{display:flex}
.sheet{
  width:min(720px,100%);
  max-height:92dvh;
  overflow:auto;
  background:#101923;
  border:1px solid #34445a;
  border-radius:28px;
  padding:16px
}
.sheethead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px
}

.chat{
  position:fixed;
  inset:0;
  z-index:40;
  background:#080d14;
  display:none;
  flex-direction:column
}
.chat.on{display:flex}
.chathead{
  height:66px;
  min-height:66px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px;
  background:#111a24;
  border-bottom:1px solid var(--line)
}
.messages{
  flex:1;
  overflow:auto;
  padding:13px
}
.msg{
  max-width:82%;
  width:max-content;
  background:#172434;
  border:1px solid #2d3c50;
  border-radius:18px;
  padding:8px 11px;
  margin:6px 0;
  overflow-wrap:anywhere
}
.msg.mine{
  margin-right:auto;
  background:#4d3e9b;
  border-color:#6d5bc3
}
.msg img{
  max-width:270px;
  border-radius:13px;
  display:block
}
.msg .time{
  display:block;
  font-size:10px;
  opacity:.6;
  margin-top:4px
}
.composer{
  display:flex;
  gap:6px;
  padding:8px;
  border-top:1px solid var(--line);
  background:#0e151f
}
.composer input{
  flex:1;
  min-width:0;
  background:#182331;
  border:1px solid #314055;
  border-radius:18px;
  color:#fff;
  padding:10px;
  outline:none
}

.toast{
  position:fixed;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  z-index:100;
  background:#172230;
  border:1px solid #40506a;
  border-radius:15px;
  padding:10px 15px;
  display:none;
  max-width:90%;
  text-align:center
}
.toast.on{display:block}

.empty{
  text-align:center;
  padding:30px 10px;
  color:var(--muted)
}

.login{
  position:fixed;
  inset:0;
  background:radial-gradient(circle at 50% 0,#221c4b,#080c13 55%);
  z-index:200;
  display:grid;
  place-items:center;
  padding:20px
}
.login.hide{display:none}
.loginbox{
  width:min(440px,100%);
  background:#111923ee;
  border:1px solid #35445a;
  border-radius:30px;
  padding:24px;
  text-align:center;
  box-shadow:0 20px 80px #0009
}
.logoBig{
  font-size:42px;
  font-weight:1000
}
.logoBig b{color:#a493ff}

.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 9px;
  border-radius:999px;
  background:linear-gradient(135deg,#9c86ff,#547dff);
  font-size:11px;
  font-weight:950
}
.premiummark{
  width:23px;
  height:23px;
  border-radius:50%;
  display:inline-grid;
  place-items:center;
  background:radial-gradient(circle,#eee7ff,#8068ff 54%,#33238f);
  box-shadow:0 0 13px #8977ff;
  font-weight:1000
}

.color{
  width:43px;
  height:43px;
  border-radius:50%;
  border:2px solid #fff3
}
.colors{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center
}

.stat{
  font-size:22px;
  font-weight:950
}

@media(max-width:500px){
  .top{gap:6px}
  .brand{font-size:18px}
  .btn{padding:9px 10px}
}
</style>
</head>

<body>

<div id="toast" class="toast"></div>

<!-- LOGIN -->
<div id="login" class="login">
  <div class="loginbox">
    <div class="logoBig">À<b>Vanta</b></div>
    <div class="muted" style="margin-bottom:22px">Messenger</div>

    <button id="googleLogin" class="btn primary full">
      ورود با Google
    </button>

    <button id="guestLogin" class="btn full">
      ورود به‌عنوان مهمان
    </button>

    <div id="loginStatus" class="muted small" style="margin-top:12px"></div>
  </div>
</div>

<div id="app">

<header class="top">
  <div class="brand">À<b>Vanta</b></div>
  <input id="search" class="search" placeholder="جستجوی چت یا مخاطب">
  <button id="newBtn" class="btn primary">＋</button>
</header>

<main>

<!-- CHATS -->
<section id="chatsPage" class="page on">

  <div class="card">
    <div class="title">Chats</div>
    <div class="muted small">
      پیام‌ها، گروه‌ها، کانال‌ها و Saved Messages
    </div>
  </div>

  <div id="chatList"></div>

</section>

<!-- CONTACTS -->
<section id="contactsPage" class="page">

  <div class="card">
    <div class="title">مخاطبین</div>

    <input
      id="contactInput"
      class="input"
      placeholder="UID یا username"
    >

    <button id="findContact" class="btn primary full">
      افزودن مخاطب
    </button>
  </div>

  <div id="contactsList"></div>

</section>

<!-- SETTINGS -->
<section id="settingsPage" class="page">

  <div class="card">

    <div class="title">Settings</div>

    <button id="editInfo" class="btn full">
      Edit Info
    </button>

    <button id="setPhoto" class="btn full">
      Set Photo
    </button>

    <button id="profileColor" class="btn full">
      Change Profile Colour
    </button>

    <button id="nameEmoji" class="btn full">
      Premium Name Emoji
    </button>

    <button id="storyBtn" class="btn full">
      Add Story
    </button>

    <button id="premiumBtn" class="btn full">
      ÀVanta Premium
    </button>

    <button id="savedBtn" class="btn full">
      Saved Messages
    </button>

    <button
      id="adminBtn"
      class="btn primary full"
      style="display:none"
    >
      ⚡ Admin Panel
    </button>

    <button id="logoutBtn" class="btn danger full">
      خروج
    </button>

  </div>

  <div class="card">

    <div class="title">Create</div>

    <div class="grid2">

      <button id="groupBtn" class="btn primary">
        👥 Group
      </button>

      <button id="channelBtn" class="btn primary">
        📢 Channel
      </button>

      <button id="giftBtn" class="btn">
        🎁 Gifts
      </button>

      <button id="gifMakerBtn" class="btn">
        GIF
      </button>

    </div>

  </div>

</section>

<!-- PROFILE -->
<section id="profilePage" class="page">

  <div class="card" style="text-align:center">

    <div id="bigAvatar"></div>

    <h2 id="profileName" style="margin:6px 0"></h2>

    <div id="profileUsername" class="muted"></div>

    <div id="profileBadges" style="margin:10px"></div>

    <div id="profileBio" class="muted"></div>

    <div class="grid3" style="margin-top:15px">

      <button id="profileEdit" class="btn primary">
        Edit Info
      </button>

      <button id="profilePhoto" class="btn">
        Set Photo
      </button>

      <button id="profileMore" class="btn">
        •••
      </button>

    </div>

  </div>

  <div class="card">

    <div class="title">
      Gift Collection
    </div>

    <div id="giftCollection" class="empty">
      هنوز Giftی دریافت نشده.
    </div>

  </div>

  <div class="card">

    <div class="title">
      Stories
    </div>

    <div id="storyList" class="empty">
      هنوز Storyای نیست.
    </div>

  </div>

</section>

</main>

<nav class="bottom">

  <button data-page="contactsPage">
    <span class="navico">♙</span>
    مخاطبین
  </button>

  <button data-page="chatsPage" class="on">
    <span class="navico">◌</span>
    چت‌ها
  </button>

  <button data-page="settingsPage">
    <span class="navico">◉</span>
    تنظیمات
  </button>

  <button data-page="profilePage">
    <span class="navico">◎</span>
    پروفایل
  </button>

</nav>

</div>

<input id="photoFile" type="file" accept="image/*" hidden>
<input id="storyFile" type="file" accept="image/*,video/*" hidden>
<input id="gifFile" type="file" accept="image/gif" hidden>

<!-- MODAL -->
<div id="modal" class="modal">

  <div class="sheet">

    <div class="sheethead">

      <h3 id="modalTitle">
        ÀVanta
      </h3>

      <button id="closeModal" class="btn">
        ×
      </button>

    </div>

    <div id="modalBody"></div>

  </div>

</div>

<!-- CHAT -->
<div id="chat" class="chat">

<header class="chathead">

  <button id="backChat" class="btn">
    ‹
  </button>

  <div id="chatAvatar" class="avatar">
    A
  </div>

  <div class="grow">

    <b id="chatTitle">
      Chat
    </b>

    <div id="chatSub" class="muted small"></div>

  </div>

  <button id="chatMenu" class="btn">
    •••
  </button>

</header>

<div id="messages" class="messages"></div>

<div class="composer">

  <button id="chatGif" class="btn">
    GIF
  </button>

  <input
    id="messageInput"
    placeholder="پیام..."
    autocomplete="off"
  >

  <button id="sendMessage" class="btn primary">
    ➤
  </button>

</div>

</div>

<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signInAnonymously,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  set,
  get,
  push,
  onValue,
  update,
  remove
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBsncHhhlqIi6qpf3hYtb0DOnq8Zjb-zpI",

  authDomain:
    "avanta-3db7e.firebaseapp.com",

  databaseURL:
    "https://avanta-3db7e-default-rtdb.firebaseio.com",

  projectId:
    "avanta-3db7e",

  storageBucket:
    "avanta-3db7e.firebasestorage.app",

  messagingSenderId:
    "879564538420",

  appId:
    "1:879564538420:web:a0fc85cc43a9347d92c061"

};

const ADMIN_UID =
  "NNY1ymTknwREwMo16ZI3lgFEni23";


const firebaseApp =
  initializeApp(firebaseConfig);

const auth =
  getAuth(firebaseApp);

const db =
  getDatabase(firebaseApp);


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
  document.getElementById(id);

let user = null;
let profile = null;
let activeChat = null;

let userChatsUnsub = null;
let contactsUnsub = null;
let profileUnsub = null;
let messagesUnsub = null;


function toast(text){

  const el = $("toast");

  el.textContent = text;

  el.classList.add("on");

  clearTimeout(window.__toastTimer);

  window.__toastTimer =
    setTimeout(
      () => el.classList.remove("on"),
      2500
    );

}


function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char]));

}


function friendlyError(error){

  const code =
    error?.code || "";

  const map = {

    "auth/popup-blocked":
      "Popup ورود توسط مرورگر مسدود شد.",

    "auth/popup-closed-by-user":
      "پنجره ورود بسته شد.",

    "auth/network-request-failed":
      "اتصال اینترنت یا Firebase مشکل دارد.",

    "auth/unauthorized-domain":
      "دامنه سایت در Firebase مجاز نیست.",

    "auth/operation-not-allowed":
      "این روش ورود در Firebase فعال نیست.",

    "auth/invalid-credential":
      "اطلاعات ورود معتبر نیست.",

    "PERMISSION_DENIED":
      "Firebase Rules اجازه این عملیات را نمی‌دهد."

  };

  return (
    map[code] ||
    error?.message ||
    "خطای نامشخص"
  );

}


function openModal(title, html){

  $("modalTitle").textContent =
    title;

  $("modalBody").innerHTML =
    html;

  $("modal").classList.add("on");

}


function closeModal(){

  $("modal").classList.remove("on");

}


$("closeModal").onclick =
  closeModal;


$("modal").addEventListener(
  "click",
  event => {

    if(event.target === $("modal")){
      closeModal();
    }

  }
);


/* =========================================================
   AVATAR
========================================================= */

function avatarHTML(obj, big = false){

  const name =
    obj?.name ||
    "A";

  const first =
    name.trim().charAt(0).toUpperCase() ||
    "A";

  const color =
    obj?.profileColor ||
    "#7662ff";

  return `
    <div
      class="avatar ${big ? "big" : ""}"
      style="background:${esc(color)}"
    >
      ${
        obj?.photo
          ? `<img src="${esc(obj.photo)}" alt="">`
          : esc(first)
      }
    </div>
  `;

}


/* =========================================================
   AUTH
========================================================= */

$("googleLogin").onclick =
  async () => {

    $("loginStatus").textContent =
      "در حال ورود...";

    try{

      const provider =
        new GoogleAuthProvider();

      await signInWithPopup(
        auth,
        provider
      );

    }catch(error){

      const message =
        friendlyError(error);

      $("loginStatus").textContent =
        message;

      toast(message);

    }

  };


$("guestLogin").onclick =
  async () => {

    $("loginStatus").textContent =
      "در حال ورود به‌عنوان مهمان...";

    try{

      await signInAnonymously(auth);

    }catch(error){

      const message =
        friendlyError(error);

      $("loginStatus").textContent =
        message;

      toast(message);

    }

  };


$("logoutBtn").onclick =
  async () => {

    try{

      await signOut(auth);

    }catch(error){

      toast(friendlyError(error));

    }

  };


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
  auth,
  async currentUser => {

    user = currentUser;

    if(!currentUser){

      $("login").classList.remove("hide");

      if(userChatsUnsub) userChatsUnsub();
      if(contactsUnsub) contactsUnsub();
      if(profileUnsub) profileUnsub();
      if(messagesUnsub) messagesUnsub();

      return;

    }

    $("login").classList.add("hide");

    try{

      const snapshot =
        await get(
          ref(
            db,
            "users/" + currentUser.uid
          )
        );

      if(!snapshot.exists()){

        profile = {

          uid: currentUser.uid,

          name:
            currentUser.displayName ||
            "ÀVanta User",

          username:
            currentUser.email
              ? currentUser.email
                  .split("@")[0]
                  .replace(/[^a-zA-Z0-9_]/g,"")
              : "guest_" +
                currentUser.uid.slice(0,7),

          email:
            currentUser.email || "",

          photo:
            currentUser.photoURL || "",

          bio:"",

          premium:false,

          profileColor:"#7662ff",

          nameEmoji:"",

          createdAt:Date.now()

        };

        await set(
          ref(
            db,
            "users/" + currentUser.uid
          ),
          profile
        );

      }else{

        profile =
          snapshot.val();

      }


      $("adminBtn").style.display =
        currentUser.uid === ADMIN_UID
          ? "block"
          : "none";


      renderAll();

      subscribeRealtime();

    }catch(error){

      toast(
        friendlyError(error)
      );

    }

  }
);


/* =========================================================
   REALTIME
========================================================= */

function subscribeRealtime(){

  if(userChatsUnsub)
    userChatsUnsub();

  if(contactsUnsub)
    contactsUnsub();

  if(profileUnsub)
    profileUnsub();


  profileUnsub =
    onValue(
      ref(db,"users/"+user.uid),
      snapshot => {

        if(snapshot.exists()){

          profile =
            snapshot.val();

          renderProfile();

        }

      }
    );


  userChatsUnsub =
    onValue(
      ref(db,"userChats/"+user.uid),
      () => {

        renderChats();

      }
    );


  contactsUnsub =
    onValue(
      ref(db,"contacts/"+user.uid),
      () => {

        renderContacts();

      }
    );

}


/* =========================================================
   RENDER
========================================================= */

function renderAll(){

  renderProfile();

  renderChats();

  renderContacts();

  renderStories();

}


/* =========================================================
   PROFILE
========================================================= */

function renderProfile(){

  if(!profile)
    return;

  $("bigAvatar").outerHTML =
    avatarHTML(profile,true)
      .replace(
        '<div class="avatar big"',
        '<div id="bigAvatar" class="avatar big"'
      );


  $("profileName").innerHTML =
    esc(
      profile.name ||
      "ÀVanta User"
    ) +

    (
      profile.nameEmoji
        ? ` <span>${esc(profile.nameEmoji)}</span>`
        : ""
    );


  $("profileUsername").textContent =
    "@" +
    (
      profile.username ||
      "user"
    );


  $("profileBadges").innerHTML =
    profile.premium

      ? `
        <span class="badge">
          <span class="premiummark">À</span>
          ÀVanta Premium
        </span>
      `

      : "";


  $("profileBio").textContent =
    profile.bio ||
    "بدون Bio";


  renderGiftCollection();

}


/* =========================================================
   CHATS
========================================================= */

/* =========================================================
   FIND USER
========================================================= */

async function findUser(query){

  query =
    String(query || "")
      .replace(/^@/,"")
      .trim();

  if(!query)
    return null;


  const snapshot =
    await get(
      ref(db,"users")
    );

  const users =
    snapshot.val() || {};


  for(
    const [uid,data]
    of Object.entries(users)
  ){

    if(
      uid === query ||
      String(data.username || "")
        .toLowerCase() ===
      query.toLowerCase()
    ){

      return {
        uid,
        ...data
      };

    }

  }

  return null;

}

async function openPrivateChat(contact){

  if(!user || !contact?.uid)
    return;


  const chatId =
    [user.uid,contact.uid]
      .sort()
      .join("_");


  const metadata = {

    name:
      contact.name ||
      "User",

    type:"private",

    photo:
      contact.photo || "",

    otherUid:
      contact.uid,

    updatedAt:
      Date.now()

  };


  try{

    await update(
      ref(
        db,
        `chats/${chatId}`
      ),
      metadata
    );


    await set(
      ref(
        db,
        `userChats/${user.uid}/${chatId}`
      ),
      metadata
    );


    await set(
      ref(
        db,
        `userChats/${contact.uid}/${chatId}`
      ),
      {

        ...metadata,

        name:
          profile.name,

        otherUid:
          user.uid,

        photo:
          profile.photo || ""

      }
    );


    openChat({
      id:chatId,
      ...metadata
    });

  }catch(error){

    toast(
      friendlyError(error)
    );

  }

}


/* =========================================================
   OPEN CHAT
========================================================= */

function openChat(chat){

  if(!chat?.id)
    return;


  activeChat =
    chat.id;


  $("chat").classList.add("on");


  $("chatTitle").textContent =
    chat.name ||
    "Chat";


  $("chatSub").textContent =
    chat.type === "saved"
      ? "Saved Messages"
      : (
          chat.type ||
          "chat"
        );


  $("chatAvatar").innerHTML =
    avatarHTML(chat)
      .replace(
        /^<div[^>]*>/,
        ""
      )
      .replace(
        /<\/div>$/,
        ""
      );


  subscribeMessages();

}


/* =========================================================
   MESSAGES REALTIME
========================================================= */

function subscribeMessages(){

  if(messagesUnsub){

    messagesUnsub();

    messagesUnsub =
      null;

  }


  if(!activeChat)
    return;


  messagesUnsub =
    onValue(
      ref(
        db,
        `messages/${activeChat}`
      ),
      snapshot => {

        const data =
          snapshot.val() || {};


        const messages =
          Object.entries(data)
            .map(
              ([id,value]) => ({
                id,
                ...value
              })
            )
            .sort(
              (a,b) =>
                (a.createdAt || 0) -
                (b.createdAt || 0)
            );


        const box =
          $("messages");


        if(!messages.length){

          box.innerHTML = `
            <div class="empty">
              هنوز پیامی نیست.
            </div>
          `;

          return;

        }


        box.innerHTML = "";


        messages.forEach(message => {

          const div =
            document.createElement("div");

          div.className =
            "msg" +
            (
              message.uid === user.uid
                ? " mine"
                : ""
            );


          if(message.gif){

            div.innerHTML = `
              <img
                src="${esc(message.gif)}"
                alt="GIF"
              >
              <span class="time">
                ${message.uid === user.uid ? "✓✓" : ""}
              </span>
            `;

          }else{

            div.innerHTML = `
              <div>
                ${esc(message.text || "")}
              </div>

              <span class="time">
                ${message.uid === user.uid ? "✓✓" : ""}
              </span>
            `;

          }


          box.appendChild(div);

        });


        box.scrollTop =
          box.scrollHeight;

      },
      error => {

        toast(
          friendlyError(error)
        );

      }
    );

}

/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  const text =
    $("messageInput")
      .value
      .trim();


  if(!text){

    return;

  }


  if(!activeChat){

    toast(
      "ابتدا یک چت باز کن"
    );

    return;

  }


  if(!user){

    toast(
      "ابتدا وارد حساب شو"
    );

    return;

  }


  const now =
    Date.now();


  try{

    const messageRef =
      push(
        ref(
          db,
          `messages/${activeChat}`
        )
      );


    await set(
      messageRef,
      {

        uid:
          user.uid,

        name:
          profile.name ||
          "User",

        text,

        createdAt:
          now

      }
    );


    /*
      مهم:
      Saved Messages و چت خصوصی و گروه
      همه از همین مسیر پیام استفاده می‌کنند.
    */


    const chatSnapshot =
      await get(
        ref(
          db,
          `userChats/${user.uid}/${activeChat}`
        )
      );


    const existing =
      chatSnapshot.exists()
        ? chatSnapshot.val()
        : {

            name:
              $("chatTitle").textContent,

            type:
              $("chatSub").textContent

          };


    await update(
      ref(
        db,
        `userChats/${user.uid}/${activeChat}`
      ),
      {

        ...existing,

        lastMessage:
          text,

        updatedAt:
          now

      }
    );


    await update(
      ref(
        db,
        `chats/${activeChat}`
      ),
      {

        lastMessage:
          text,

        updatedAt:
          now

      }
    );


    $("messageInput").value = "";


  }catch(error){

    toast(
      "ارسال نشد: " +
      friendlyError(error)
    );

  }

}


$("sendMessage").onclick =
  sendMessage;


$("messageInput").addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);

async function renderStories(){

        ref(

          `stories/${user.uid}`
        )
      );


    const data =
      snapshot.val() || {};


    const stories =
      Object.values(data)
        .filter(
          story =>
            (story.expiresAt || 0) >
            Date.now()
        );


    if(!stories.length){

      $("storyList").textContent =
        "هنوز Storyای نیست.";

      return;

    }


    $("storyList").innerHTML =
      stories
        .map(
          story =>
            story.type?.startsWith("video")
              ? `
                <video
                  controls
                  src="${esc(story.data)}"
                  style="
                    width:100%;
                    border-radius:18px
                  "
                ></video>
              `
              : `
                <img
                  src="${esc(story.data)}"
                  style="
                    width:100%;
                    border-radius:18px
                  "
                  alt=""
                >
              `
        )
        .join("");

  }catch(error){

    $("storyList").textContent =
      "خطا در خواندن Story";

  }

}

async function createCommunity(type){

  openModal(
    type === "group"
      ? "Create Group"
      : "Create Channel",

    `

      <input
        id="communityName"
        class="input"
        placeholder="Name"
      >

      <input
        id="communityUsername"
        class="input"
        placeholder="Username"
      >

      <textarea
        id="communityBio"
        class="textarea"
        placeholder="Description"
      ></textarea>

      <button
        id="createCommunity"
        class="btn primary full"
      >
        Create
      </button>

    `
  );


  $("createCommunity").onclick =
    async () => {

      const name =
        $("communityName")
          .value
          .trim();


      if(!name){

        toast(
          "نام را وارد کن"
        );

        return;

      }


      try{

        const chatId =
          push(
            ref(db,"chats")
          ).key;


        const metadata = {

          name,

          type,

          username:
            $("communityUsername")
              .value
              .trim()
              .replace(/^@/,""),

          bio:
            $("communityBio").value,

          owner:
            user.uid,

          updatedAt:
            Date.now()

        };


        await set(
          ref(
            db,
            `chats/${chatId}`
          ),
          metadata
        );


        await set(
          ref(
            db,
            `chatMembers/${chatId}/${user.uid}`
          ),
          {

            role:"owner",

            joinedAt:
              Date.now()

          }
        );


        await set(
          ref(
            db,
            `userChats/${user.uid}/${chatId}`
          ),
          metadata
        );


        closeModal();

        toast(
          type === "group"
            ? "✓ گروه ساخته شد"
            : "✓ کانال ساخته شد"
        );

      }catch(error){

        toast(
          friendlyError(error)
        );

      }

    };

}


$("groupBtn").onclick =
  () => createCommunity("group");


$("channelBtn").onclick =
  () => createCommunity("channel");

    }

async function openGiftShop(target){

  const gifts =
    getLocalGifts();


  openModal(
    "VANTA Gifts",

    `

      <div class="grid2">

        ${
          gifts.map(
            gift => `

              <div
                class="card"
                style="text-align:center"
              >

                <div
                  style="font-size:44px"
                >
                  ${gift.icon}
                </div>

                <b>
                  ${esc(gift.name)}
                </b>

                <div class="muted small">
                  ${gift.price} VC
                </div>

                <button
                  class="btn primary full sendGift"
                  data-gift="${gift.id}"
                >
                  Send
                </button>

              </div>

            `
          ).join("")
        }

      </div>

    `
  );


  document
    .querySelectorAll(".sendGift")
    .forEach(button => {

      button.onclick =
        async () => {

          if(!activeChat){

            toast(
              "اول وارد چت شو"
            );

            return;

          }


          const gift =
            gifts.find(
              item =>
                item.id ===
                button.dataset.gift
            );


          if(!gift)
            return;


          try{

            const now =
              Date.now();


            await set(
              push(
                ref(
                  db,
                  `messages/${activeChat}`
                )
              ),
              {

                uid:
                  user.uid,

                name:
                  profile.name,

                text:
                  `🎁 ${gift.name}`,

                gift,

                createdAt:
                  now

              }
            );


            await update(
              ref(
                db,
                `chats/${activeChat}`
              ),
              {

                lastMessage:
                  `🎁 ${gift.name}`,

                updatedAt:
                  now

              }
            );


            closeModal();

            toast(
              "✓ Gift ارسال شد"
            );

          }catch(error){

            toast(
              friendlyError(error)
            );

          }

        };

    });

}


$("giftBtn").onclick =
  () => openGiftShop();

========================================================= */

async function renderGiftCollection(){

  if(!user)
    return;


  try{

    const snapshot =
      await get(
        ref(
          db,
          `giftCollections/${user.uid}`
        )
      );


    const data =
      snapshot.val() || {};


    const gifts =
      Object.values(data);


    if(!gifts.length){

      $("giftCollection").textContent =
        "هنوز Giftی دریافت نشده.";

      return;

    }


    $("giftCollection").innerHTML =
      gifts
        .map(
          gift => `
            <div class="row">
              <div style="font-size:38px">
                ${esc(gift.icon || "🎁")}
              </div>

              <div class="grow">
                <b>
                  ${esc(gift.name || "Gift")}
                </b>

                <div class="muted small">
                  ${esc(gift.fromName || "")}
                </div>
              </div>
            </div>
          `
        )
        .join("");

  }catch(error){

    $("giftCollection").textContent =
      "هنوز Giftی دریافت نشده.";

  }

}

/* =========================================================
   NAVIGATION
========================================================= */

document
  .querySelectorAll(".bottom button")
  .forEach(button => {

    button.onclick =
      () => {

        document
          .querySelectorAll(".page")
          .forEach(page =>
            page.classList.remove("on")
          );


        const page =
          $(button.dataset.page);


        if(page)
          page.classList.add("on");


        document
          .querySelectorAll(".bottom button")
          .forEach(item =>
            item.classList.toggle(
              "on",
              item === button
            )
          );

      };

  });

========================================================= */

function applySearch(){

  const query =
    $("search")
      .value
      .trim()
      .toLowerCase();


  document
    .querySelectorAll(
      "#chatList .row"
    )
    .forEach(row => {

      row.style.display =
        row.textContent
          .toLowerCase()
          .includes(query)
          ? ""
          : "none";

    });

}


$("search").oninput =
  applySearch;
