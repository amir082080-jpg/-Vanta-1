async function boot(x){let s=await D.ref('users/'+x.uid).once('value'),o=s.val()||{};user={uid:x.uid,displayName:o.displayName||x.displayName||'کاربر ÀVanta',username:o.username||'user_'+x.uid.slice(0,8),photoURL:o.photoURL||x.photoURL||'',bio:o.bio||'',premium:!!o.premium,premiumUntil:Number(o.premiumUntil||0),vc:Number(o.vc||0),emojiId:o.emojiId||null,profileBg:o.profileBg||'',online:true,lastSeen:Date.now()};await D.ref('users/'+x.uid).update(user);const c=D.ref('users/'+x.uid);D.ref('.info/connected').on('value',z=>{if(z.val()){c.update({online:true,lastSeen:firebase.database.ServerValue.TIMESTAMP});c.onDisconnect().update({online:false,lastSeen:firebase.database.ServerValue.TIMESTAMP})}});$('login').classList.add('hide');$('app').classList.remove('hide');await load();open(cur)}async function authError(e,where){console.error('ÀVanta Auth',where,e);let code=e&&e.code||'unknown';let msg=e&&e.message||'خطای نامشخص';if(code==='auth/operation-not-allowed')msg='این روش ورود در Firebase فعال نیست.';else if(code==='auth/network-request-failed')msg='اتصال به Firebase برقرار نشد.';else if(code==='auth/popup-blocked')msg='پنجره ورود Google مسدود شد؛ دوباره تلاش کن.';else if(code==='auth/popup-closed-by-user')msg='پنجره ورود بسته شد.';else if(code==='auth/unauthorized-domain')msg='دامنه فعلی در Firebase Authentication مجاز نشده است.';else if(code==='auth/invalid-api-key')msg='Firebase API Key نادرست است.';else if(code==='auth/too-many-requests')msg='تلاش‌های زیاد؛ کمی بعد دوباره امتحان کن.';toast(where+': '+msg);return code}
A.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});

function renderList(){let q=($('search').value||'').toLowerCase();let arr=Object.values(users).filter(u=>u.uid!==me()&&(`${u.displayName} ${u.username}`).toLowerCase().includes(q));$('list').innerHTML=`<div class="item" onclick="open({type:'public',id:'public',title:'چت عمومی',sub:'گفتگوی عمومی'})">${av({displayName:'À'})}<div><b>چت عمومی</b><small> گفتگوی عمومی</small></div></div>`+arr.map(u=>`<div class="item" onclick="dm('${esc(u.uid)}')">${av(u)}<div><b>${esc(u.displayName)} ${prem(u)}</b><small>${u.online?'آنلاین':'آفلاین'}</small></div></div>`).join('')}
$('search').oninput=renderList;async function dm(id){let u=users[id];if(!u)return;let k=[me(),id].sort().join('_');await D.ref('privateChats/'+me()+'/'+k).set({id:k,otherUid:id,title:u.displayName,updatedAt:Date.now()});await D.ref('privateChats/'+id+'/'+k).set({id:k,otherUid:me(),title:user.displayName,updatedAt:Date.now()});open({type:'dm',id:k,title:u.displayName,sub:u.online?'آنلاین':'آفلاین',other:id})}
function path(c){return c.type==='dm'?'privateMessages/'+c.id:c.type==='group'||c.type==='channel'?c.type+'Messages/'+c.id:'messages/public'}function open(c){off.forEach(f=>f());off=[];cur=c;$('ct').textContent=c.title;$('cs').textContent=c.sub||'';$('msgs').innerHTML='<div class="empty">در حال بارگذاری...</div>';let r=D.ref(path(c));let f=s=>renderMsgs(s.val()||{});r.on('value',f);off.push(()=>r.off('value',f));$('side').classList.remove('open')}
function textHTML(t){let s=esc(t||'').replace(/\n/g,'<br>');s=s.replace(/\[emoji:([\w-]+)\]/g,(_,id)=>emojis[id]?`<img class="em" src="${esc(emojis[id].data)}">`:':emoji:');return s}
function renderMsgs(o){let a=Object.entries(o).map(([id,v])=>({...v,id})).filter(x=>!x.deleted).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));$('msgs').innerHTML=a.length?a.map(m=>{let mine=m.senderUid===me(),u=users[m.senderUid]||{displayName:m.senderName,photoURL:m.senderPhoto, premium:m.senderPremium,premiumUntil:m.senderPremiumUntil};let body=m.type==='image'?`<img src="${esc(m.data)}">`:m.type==='voice'?`<audio controls src="${esc(m.data)}"></audio>`:m.type==='file'?`<a href="${esc(m.data)}" download="${esc(m.name)}">${esc(m.name)}</a>`:textHTML(m.text);let rs=Object.entries(m.reactions||{}).map(([r,v])=>`<button class="ghost" onclick="react('${m.id}','${esc(r)}')">${esc(r)} ${Object.keys(v||{}).length}</button>`).join('');return `<article class="msg ${mine?'me':''}" onclick="msgMenu(event,'${m.id}')">${!mine?`<div class="sender">${esc(u.displayName)} ${prem(u)}</div>`:''}${m.reply?`<div class="box">پاسخ به ${esc(m.reply.senderName)}<br>${textHTML(m.reply.text)}</div>`:''}${body}<div class="meta">${m.createdAt?new Date(m.createdAt).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}):''}</div>${rs}</article>`}).join(''):'<div class="empty">هنوز پیامی نیست.</div>';$('msgs').scrollTop=$('msgs').scrollHeight}

async function msgMenu(e,id){let s=await D.ref(path(cur)+'/'+id).once('value'),m=s.val();if(!m)return;modal(`<h3>پیام</h3><div class="row"><button class="primary" onclick="doReply('${id}')">پاسخ</button><button class="primary" onclick="react('${id}','❤️')">❤️</button><button class="primary" onclick="react('${id}','👍')">👍</button><button class="primary" onclick="saveMsg('${id}')">ذخیره</button>${m.senderUid===me()?`<button class="danger" onclick="delMsg('${id}')">حذف</button>`:''}</div>`)}window.doReply=async id=>{let s=await D.ref(path(cur)+'/'+id).once('value'),m=s.val();reply={id,text:m.text||'',senderName:m.senderName||''};$('reply').textContent='پاسخ به: '+(m.text||'فایل');$('reply').classList.remove('hide');close()};window.react=async(id,r)=>{let p=path(cur)+'/'+id+'/reactions/'+r+'/'+me(),s=await D.ref(p).once('value');await D.ref(p).set(!s.exists())};window.saveMsg=async id=>{let s=await D.ref(path(cur)+'/'+id).once('value');await D.ref('saved/'+me()+'/'+id).set({...s.val(),savedAt:Date.now()});toast('ذخیره شد');close()};window.delMsg=async id=>{await D.ref(path(cur)+'/'+id).update({deleted:true});close()};
function toData(f,max=900){return new Promise((res,rej)=>{if(f.size>7e6)return rej();let r=new FileReader();r.onload=()=>{if(!f.type.startsWith('image/'))return res(r.result);let i=new Image();i.onload=()=>{let w=i.width,h=i.height;if(Math.max(w,h)>max){if(w>h){h=h*max/w;w=max}else{w=w*max/h;h=max}}let c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);res(c.toDataURL('image/webp',.78))};i.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}$('file').onclick=()=>$('fi').click();$('fi').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=await toData(f),type=f.type.startsWith('image/')?'image':'file';await D.ref(path(cur)).push().set({senderUid:me(),senderName:user.displayName,senderPhoto:user.photoURL,type,data:d,name:f.name,createdAt:Date.now()});toast('ارسال شد')}catch{toast('فایل بزرگ یا نامعتبر است')}e.target.value=''};
$('emoji').onclick=()=>modal(`<h3>Custom Emoji</h3><div class="emojiGrid">${Object.entries(emojis).map(([id,e])=>`<button onclick="ins('${id}')"><img src="${esc(e.data)}"></button>`).join('')||'<p>ایموجی موجود نیست.</p>'}</div>`);window.ins=id=>{$('text').value+=' [emoji:'+id+']';close();$('text').focus()};
$('prof').onclick=()=>profilePage(user);function profilePage(u){modal(`<div style="text-align:center;padding:12px;background:${u.premium?esc(u.profileBg||'#20264a'):'#20264a'};border-radius:15px">${av(u)}<h2>${esc(u.displayName)} ${prem(u)}</h2><small>@${esc(u.username)}</small></div><p>${esc(u.bio||'')}</p><div class="row"><button class="primary" onclick="editProfile()">ویرایش پروفایل</button>${u.uid!==me()?`<button class="primary" onclick="dm('${u.uid}');close()">Message</button><button class="primary" onclick="gift('${u.uid}')">Send Gift</button>`:''}</div>`)}function editProfile(){modal(`<h2>ویرایش پروفایل</h2><div class="field"><label>تصویر پروفایل</label><input id="avatar" type="file" accept="image/*"></div><div class="field"><label>نام</label><input id="pn" value="${esc(user.displayName)}"></div><div class="field"><label>Username</label><input id="pu" value="${esc(user.username)}"></div><div class="field"><label>Bio</label><textarea id="pb">${esc(user.bio)}</textarea></div><div class="field"><label>پس‌زمینه Premium</label><input id="bg" ${user.premium?'':'disabled'} value="${esc(user.profileBg||'#20264a')}"></div><button class="primary" onclick="saveProfile()">ذخیره</button>`)}window.saveProfile=async()=>{let photo=user.photoURL,f=$('avatar').files[0];if(f)photo=await toData(f,700);let x={displayName:$('pn').value.trim()||'کاربر ÀVanta',username:$('pu').value.trim()||'user_'+me().slice(0,8),bio:$('pb').value,photoURL:photo,profileBg:user.premium?$('bg').value:user.profileBg||''};await D.ref('users/'+me()).update(x);Object.assign(user,x);users[me()]=user;close();renderList();profilePage(user);toast('پروفایل ذخیره شد')};
$('more').onclick=()=>menu();function menu(){modal(`<h2>ÀVanta</h2><button class="ghost" style="width:100%;text-align:right" onclick="saved()">Saved Messages</button><button class="ghost" style="width:100%;text-align:right" onclick="premium()">Premium / VC</button><button class="ghost" style="width:100%;text-align:right" onclick="spaces()">Groups / Channels</button>${admin()?'<button class="ghost" style="width:100%;text-align:right" onclick="adminPanel()">Admin Panel</button>':''}<button class="ghost" style="width:100%;text-align:right" onclick="settings()">Settings</button>`)}async function saved(){let s=await D.ref('saved/'+me()).once('value'),a=Object.values(s.val()||{});modal('<h2>Saved Messages</h2>'+ (a.length?a.map(x=>`<div class="box">${textHTML(x.text||x.name||'فایل')}</div>`).join(''):'<p>خالی است.</p>'))}function premium(){modal(`<h2>Premium</h2><p>موجودی: <b>${user.vc||0} VC</b></p><div class="box">۳ ماهه — 1000 VC</div><div class="box">۶ ماهه — 1500 VC</div><div class="box">۱ ساله — 2500 VC</div><div class="row"><button class="primary" onclick="buy(1000,90)">۳ ماه</button><button class="primary" onclick="buy(1500,180)">۶ ماه</button><button class="primary" onclick="buy(2500,365)">۱ سال</button></div>`)}window.buy=async(c,d)=>{let tx=await D.ref('users/'+me()+'/vc').transaction(v=>Number(v||0)>=c?Number(v)-c:undefined);if(!tx.committed)return toast('VC کافی نیست');let until=Math.max(Date.now(),Number(user.premiumUntil||0))+d*864e5;await D.ref('users/'+me()).update({premium:true,premiumUntil:until});user.vc=tx.snapshot.val();user.premium=true;user.premiumUntil=until;toast('Premium فعال شد');close()};function settings(){modal(`<h2>Settings</h2><button class="ghost" style="width:100%;text-align:right" onclick="toggleTheme()">Dark / Light</button><button class="ghost" style="width:100%;text-align:right" onclick="A.signOut().then(()=>location.reload())">خروج</button>`)}
async function spaces(){let [g,c]=await Promise.all([D.ref('groups').once('value'),D.ref('channels').once('value')]),a=[];g.forEach(x=>a.push({...x.val(),id:x.key,type:'group'}));c.forEach(x=>a.push({...x.val(),id:x.key,type:'channel'}));modal('<h2>Groups / Channels</h2><button class="primary" onclick="createGroup()">ساخت گروه</button><button class="primary" onclick="createChannel()">ساخت کانال</button>'+a.map(x=>`<div class="box"><b>${esc(x.name)}</b><small> · ${x.type}</small><div class="row"><button class="primary" onclick="join('${x.type}','${x.id}')">${x.members?.[me()]?'باز کردن':'عضویت'}</button><button class="ghost" onclick="invite('${x.type}','${x.id}','${esc(x.inviteCode||'')}')">Invite</button></div></div>`).join(''))}window.createGroup=async()=>{let n=prompt('نام گروه');if(!n)return;let id=D.ref('groups').push().key,code=Math.random().toString(36).slice(2,12);await D.ref('groups/'+id).set({name:n,owner:me(),createdAt:Date.now(),inviteCode:code,members:{[me()]:true}});toast('گروه ساخته شد');spaces()};window.createChannel=async()=>{if(!(user.premium&&user.premiumUntil>Date.now()))return toast('ساخت کانال فقط Premium است');let n=prompt('نام کانال');if(!n)return;let id=D.ref('channels').push().key,code=Math.random().toString(36).slice(2,12);await D.ref('channels/'+id).set({name:n,owner:me(),createdAt:Date.now(),inviteCode:code,members:{[me()]:true}});toast('کانال ساخته شد');spaces()};window.join=async(t,id)=>{let root=t==='group'?'groups':'channels',s=await D.ref(root+'/'+id).once('value'),x=s.val();await D.ref(root+'/'+id+'/members/'+me()).set(true);close();open({type:t,id,title:x.name,sub:t==='channel'?'کانال':'گروه'})};window.invite=(t,id,c)=>{let u=location.href.split('#')[0]+'#invite='+t+'/'+id+'/'+c;navigator.clipboard?.writeText(u);toast('لینک دعوت کپی شد')};
async function gift(to){let s=await D.ref('gifts').once('value'),g=s.val()||{};let a=Object.entries(g);if(!a.length)return toast('Gift موجود نیست');modal('<h2>Send Gift</h2>'+a.map(([id,x])=>`<div class="box"><b>${esc(x.name)}</b> — ${x.price} VC <button class="primary" onclick="sendGift('${id}','${to}')">ارسال</button></div>`).join(''))}window.sendGift=async(id,to)=>{let s=await D.ref('gifts/'+id).once('value'),g=s.val();if(!g)return;if(Number(user.vc)<Number(g.price))return toast('VC کافی نیست');let tx=await D.ref('users/'+me()+'/vc').transaction(v=>Number(v||0)>=Number(g.price)?Number(v)-Number(g.price):undefined);if(!tx.committed)return toast('خرید ناموفق');await D.ref('giftInbox/'+to).push().set({giftId:id,name:g.name,price:g.price,from:me(),createdAt:Date.now()});user.vc=tx.snapshot.val();toast('Gift ارسال شد');close()};
async function adminPanel(){if(!admin())return;let [u,g,e]=await Promise.all([D.ref('users').once('value'),D.ref('gifts').once('value'),D.ref('emojis').once('value')]);let U=[];u.forEach(x=>U.push(x.val()));modal(`<h2>Admin Panel</h2><p>Users: ${U.length} · Emoji: ${Object.keys(e.val()||{}).length} · Gifts: ${Object.keys(g.val()||{}).length}</p><hr><h3>افزایش VC</h3><div class="field"><input id="uid" placeholder="UID کاربر"></div><div class="field"><input id="amount" type="number" placeholder="VC"></div><button class="primary" onclick="grant()">اعطا VC</button><hr><h3>ساخت Gift</h3><div class="field"><input id="gn" placeholder="نام Gift"></div><div class="field"><input id="gp" type="number" placeholder="قیمت VC"></div><button class="primary" onclick="mkGift()">ساخت</button><hr><h3>Custom Emoji</h3><input id="en" placeholder="نام Emoji"><input id="ef" type="file" accept="image/*"><button class="primary" onclick="mkEmoji()">ساخت Emoji</button>`)}window.grant=async()=>{if(!admin())return;let id=$('uid').value,a=Number($('amount').value);if(!id||a<1)return toast('اطلاعات ناقص');await D.ref('users/'+id+'/vc').transaction(v=>Number(v||0)+a);await D.ref('adminLogs').push().set({action:'grantVC',target:id,amount:a,by:me(),createdAt:Date.now()});toast('VC اضافه شد')};window.mkGift=async()=>{if(!admin())return;let n=$('gn').value,p=Number($('gp').value);if(!n||p<1)return;await D.ref('gifts').push().set({name:n,price:p,createdBy:me(),createdAt:Date.now()});toast('Gift ساخته شد')};window.mkEmoji=async()=>{if(!admin())return;let f=$('ef').files[0];if(!f)return;try{let d=await toData(f,700),id='ba'+Math.random().toString(16).slice(2,12);await D.ref('emojis/'+id).set({name:$('en').value||'emoji',data:d,createdBy:me(),createdAt:Date.now(),format:'webp-data-url'});emojis[id]={data:d};toast('Emoji ساخته شد');close()}catch{toast('تصویر نامعتبر/بزرگ است')}};
$('menu').onclick=()=>$('side').classList.toggle('open');$('usersTab').onclick=renderList;$('savedTab').onclick=saved;$('spaceTab').onclick=spaces;
if(localStorage.getItem('avantaTheme')==='light')document.body.classList.add('light');
function toggleTheme(){document.body.classList.toggle('light');localStorage.setItem('avantaTheme',document.body.classList.contains('light')?'light':'dark');close()}
window.addEventListener('online',()=>toast('اتصال برقرار شد'));window.addEventListener('offline',()=>toast('اینترنت قطع شد'));
</script></body></html>
