<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ÀVanta Messenger</title>
<style>
:root{--a:#7662ff;--bg:#080c13;--p:#111923;--p2:#172230;--l:#2a384b;--m:#91a0b5}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:#fff;border:0}#app{height:100dvh;max-width:960px;margin:auto;background:var(--bg);display:flex;flex-direction:column}.top{height:66px;display:flex;align-items:center;gap:8px;padding:9px 12px;background:#0e151f;border-bottom:1px solid var(--l)}.brand{font-weight:1000;font-size:21px;white-space:nowrap}.brand b,.logo b{color:#a493ff}.search{flex:1;min-width:50px;background:#182331;border:1px solid #2c3b4e;color:#fff;border-radius:17px;padding:10px 12px;outline:0}main{flex:1;overflow:auto;padding:14px 12px 100px}.page{display:none}.page.on{display:block}.card,.row{background:var(--p);border:1px solid var(--l);border-radius:21px;padding:14px;margin-bottom:10px}.row{display:flex;align-items:center;gap:11px;transition:.15s}.row:active{transform:scale(.985)}.title{font-size:21px;font-weight:950;margin-bottom:5px}.muted{color:var(--m)}.small{font-size:12px}.grow{flex:1;min-width:0}.avatar{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,#806bff,#21c9ff);font-weight:950;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.big{width:118px;height:118px;border-radius:35px;margin:4px auto 10px;font-size:42px}.btn{background:#1b2634;border:1px solid #34445a;border-radius:15px;padding:10px 13px;font-weight:800;transition:.15s}.btn:active{transform:scale(.96)}.primary{background:linear-gradient(135deg,#7b65ff,#4d83ff);border-color:#8274ff}.danger{background:#481e2b;border-color:#713347}.full{width:100%;margin-top:7px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bottom{position:fixed;bottom:9px;left:50%;transform:translateX(-50%);width:min(940px,calc(100% - 16px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;background:#111a25ee;border:1px solid #34445b;border-radius:27px;backdrop-filter:blur(20px);z-index:20;box-shadow:0 12px 45px #0008}.bottom button{background:transparent;border-radius:21px;padding:7px 3px;color:#8997aa}.bottom button.on{background:#7461ff22;color:#fff}.navico{font-size:21px;display:block;line-height:22px}.input,.textarea{width:100%;background:#0a1018;border:1px solid #314055;border-radius:15px;color:#fff;padding:11px;outline:0;margin:4px 0 8px}.textarea{min-height:90px;resize:vertical}.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:linear-gradient(135deg,#9c86ff,#547dff);font-size:11px;font-weight:950;box-shadow:0 0 17px #806cff66}.premiummark{width:23px;height:23px;border-radius:50%;display:inline-grid;place-items:center;background:radial-gradient(circle,#eee7ff,#8068ff 54%,#33238f);box-shadow:0 0 13px #8977ff;font-weight:1000}.modal{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:flex-end;padding:8px}.modal.on{display:flex}.sheet{width:min(720px,100%);max-height:92dvh;overflow:auto;background:#101923;border:1px solid #34445a;border-radius:28px;padding:16px}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.chat{position:fixed;inset:0;z-index:40;background:#080d14;display:none;flex-direction:column}.chat.on{display:flex}.chathead{height:66px;display:flex;align-items:center;gap:9px;padding:8px;background:#111a24;border-bottom:1px solid var(--l)}.messages{flex:1;overflow:auto;padding:13px}.msg{max-width:80%;width:max-content;background:#172434;border:1px solid #2d3c50;border-radius:18px;padding:8px 11px;margin:6px 0}.msg.mine{margin-right:auto;background:#4d3e9b;border-color:#6d5bc3}.msg img,.msg video{max-width:260px;border-radius:13px;display:block}.composer{display:flex;gap:6px;padding:8px;border-top:1px solid var(--l);background:#0e151f}.composer input{flex:1;min-width:0;background:#182331;border:1px solid #314055;border-radius:18px;color:#fff;padding:10px;outline:0}.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;background:#172230;border:1px solid #40506a;border-radius:15px;padding:10px 15px;display:none;max-width:90%;text-align:center}.toast.on{display:block}.empty{text-align:center;padding:30px 10px;color:var(--m)}.login{position:fixed;inset:0;background:radial-gradient(circle at 50% 0,#221c4b,#080c13 55%);z-index:200;display:grid;place-items:center;padding:20px}.login.hide{display:none}.loginbox{width:min(440px,100%);background:#111923ee;border:1px solid #35445a;border-radius:30px;padding:24px;text-align:center;box-shadow:0 20px 80px #0009}.logo{font-size:42px;font-weight:1000}.spinner{width:17px;height:17px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.color{width:43px;height:43px;border-radius:50%;border:2px solid #fff3}.colors{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.stat{font-size:22px;font-weight:950}@media(max-width:500px){.top{gap:6px}.brand{font-size:18px}.btn{padding:9px 10px}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="login" class="login"><div class="loginbox"><div class="logo">À<b>Vanta</b></div><div class="muted" style="margin-bottom:22px">Messenger</div><button id="googleLogin" class="btn primary full">ورود با Google</button><button id="guestLogin" class="btn full">ورود به‌عنوان مهمان</button><div id="loginStatus" class="muted small" style="margin-top:12px"></div></div></div>
<div id="app">
<header class="top"><div class="brand">À<b>Vanta</b></div><input id="search" class="search" placeholder="جستجوی چت یا مخاطب"><button id="newBtn" class="btn primary">＋</button></header>
<main>
<section id="chatsPage" class="page on"><div class="card"><div class="title">Chats</div><div class="muted small">پیام‌ها، گروه‌ها، کانال‌ها و Saved Messages</div></div><div id="chatList"></div></section>
<section id="contactsPage" class="page"><div class="card"><div class="title">مخاطبین</div><input id="contactInput" class="input" placeholder="UID یا username"><button id="findContact" class="btn primary full">افزودن مخاطب</button></div><div id="contactsList"></div></section>
<section id="settingsPage" class="page"><div class="card"><div class="title">Settings</div><button id="editInfo" class="btn full">Edit Info</button><button id="setPhoto" class="btn full">Set Photo</button><button id="profileColor" class="btn full">Change Profile Colour</button><button id="nameEmoji" class="btn full">Premium Name Emoji</button><button id="storyBtn" class="btn full">Add Story</button><button id="premiumBtn" class="btn full">ÀVanta Premium</button><button id="savedBtn" class="btn full">Saved Messages</button><button id="adminBtn" class="btn primary full" style="display:none">⚡ ورود مدیریت</button><button id="logoutBtn" class="btn danger full">خروج</button></div><div class="card"><div class="title">Create</div><div class="grid2"><button id="groupBtn" class="btn primary">👥 Group</button><button id="channelBtn" class="btn primary">📢 Channel</button><button id="giftBtn" class="btn">🎁 Gifts</button><button id="gifMakerBtn" class="btn">GIF</button></div></div></section>
<section id="profilePage" class="page"><div class="card" style="text-align:center"><div id="bigAvatar"></div><h2 id="profileName" style="margin:6px 0"></h2><div id="profileUsername" class="muted"></div><div id="profileBadges" style="margin:10px"></div><div id="profileBio" class="muted"></div><div class="grid3" style="margin-top:15px"><button id="profileEdit" class="btn primary">Edit Info</button><button id="profilePhoto" class="btn">Set Photo</button><button id="profileMore" class="btn">•••</button></div></div><div class="card"><div class="title">Gift Collection</div><div id="giftCollection" class="empty">هنوز Giftای دریافت نشده.</div></div><div class="card"><div class="title">Stories</div><div id="storyList" class="empty">هنوز Storyای نیست.</div></div></section>
</main>
<nav class="bottom"><button data-page="contactsPage"><span class="navico">♙</span>مخاطبین</button><button data-page="chatsPage" class="on"><span class="navico">◌</span>چت‌ها</button><button data-page="settingsPage"><span class="navico">◉</span>تنظیمات</button><button data-page="profilePage"><span class="navico">◎</span>پروفایل</button></nav>
</div>
<input id="photoFile" type="file" accept="image/*" hidden><input id="storyFile" type="file" accept="image/*,video/*" hidden><input id="gifFile" type="file" accept="image/gif" hidden>
<div id="modal" class="modal"><div class="sheet"><div class="sheethead"><h3 id="modalTitle">ÀVanta</h3><button id="closeModal" class="btn">×</button></div><div id="modalBody"></div></div></div>
<div id="chat" class="chat"><header class="chathead"><button id="backChat" class="btn">‹</button><div id="chatAvatar" class="avatar">A</div><div class="grow"><b id="chatTitle">Chat</b><div id="chatSub" class="muted small"></div></div><button id="chatMenu" class="btn">•••</button></header><div id="messages" class="messages"></div><div class="composer"><button id="chatGif" class="btn">GIF</button><input id="messageInput" placeholder="پیام..."><button id="sendMessage" class="btn primary">➤</button></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInAnonymously,onAuthStateChanged,signOut,reauthenticateWithPopup}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getDatabase,ref,set,get,push,onValue,update,remove}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyBsncHhhlqIi6qpf3hYtb0DOnq8Zjb-zpI",authDomain:"avanta-3db7e.firebaseapp.com",databaseURL:"https://avanta-3db7e-default-rtdb.firebaseio.com",projectId:"avanta-3db7e",storageBucket:"avanta-3db7e.firebasestorage.app",messagingSenderId:"879564538420",appId:"1:879564538420:web:a0fc85cc43a9347d92c061"};
const ADMIN_UID="NNY1ymTknwREwMo16ZI3lgFEni23";const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);const $=id=>document.getElementById(id);let user=null,profile=null,activeChat=null,unsubs=[];
const toast=t=>{const x=$("toast");x.textContent=t;x.classList.add("on");clearTimeout(window._toast);window._toast=setTimeout(()=>x.classList.remove("on"),2300)};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const avatar=o=>`<div class="avatar" style="background:${esc(o?.profileColor||"#7662ff")}">${o?.photo?`<img src="${esc(o.photo)}">`:esc((o?.name||"A").slice(0,1).toUpperCase())}</div>`;
function modal(t,h){$("modalTitle").textContent=t;$("modalBody").innerHTML=h;$("modal").classList.add("on")}function closeModal(){$("modal").classList.remove("on")}$('closeModal').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};
function err(e){const m={"auth/popup-blocked":"Popup مرورگر مسدود است.","auth/popup-closed-by-user":"ورود لغو شد.","auth/network-request-failed":"اتصال اینترنت مشکل دارد.","auth/unauthorized-domain":"دامنه در Firebase مجاز نشده است.","auth/operation-not-allowed":"این روش ورود در Firebase فعال نیست.","PERMISSION_DENIED":"Firebase Rules اجازه این عملیات را نمی‌دهد."};return m[e?.code]||e?.message||"خطای نامشخص"}
$('googleLogin').onclick=async()=>{ $('loginStatus').textContent="در حال ورود...";try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$('loginStatus').textContent=err(e);toast(err(e))} };
$('guestLogin').onclick=async()=>{ $('loginStatus').textContent="در حال ورود...";try{await signInAnonymously(auth)}catch(e){$('loginStatus').textContent=err(e);toast(err(e))} };
$('logoutBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{user=u;if(!u){$('login').classList.remove('hide');return}$('login').classList.add('hide');try{const s=await get(ref(db,'users/'+u.uid));if(!s.exists()){profile={uid:u.uid,name:u.displayName||'ÀVanta User',username:u.email?.split('@')[0]||'guest_'+u.uid.slice(0,6),email:u.email||'',photo:u.photoURL||'',bio:'',premium:false,profileColor:'#7662ff',nameEmoji:'',createdAt:Date.now()};await set(ref(db,'users/'+u.uid),profile)}else profile=s.val();$('adminBtn').style.display=u.uid===ADMIN_UID?'block':'none';renderAll();subscribe()}catch(e){toast(err(e))}});
function subscribe(){unsubs.forEach(f=>f&&f());unsubs=[];unsubs.push(onValue(ref(db,'users/'+user.uid),s=>{profile=s.val()||profile;renderAll()}));unsubs.push(onValue(ref(db,'userChats/'+user.uid),renderChats));unsubs.push(onValue(ref(db,'contacts/'+user.uid),renderContacts));}
function renderAll(){renderProfile();renderStories();renderChats();renderContacts()}
function renderProfile(){if(!profile)return;$('bigAvatar').outerHTML=`<div id="bigAvatar" class="avatar big" style="background:${esc(profile.profileColor||'#7662ff')}">${profile.photo?`<img src="${esc(profile.photo)}">`:esc((profile.name||'A').slice(0,1).toUpperCase())}</div>`;$('profileName').innerHTML=esc(profile.name||'ÀVanta User')+(profile.nameEmoji?` <span>${esc(profile.nameEmoji)}</span>`:'');$('profileUsername').textContent='@'+(profile.username||'user');$('profileBadges').innerHTML=profile.premium?'<span class="badge"><span class="premiummark">À</span>ÀVanta Premium</span>':'';$('profileBio').textContent=profile.bio||'';renderGifts()}
async function renderChats(){if(!user)return;const box=$('chatList');try{const s=await get(ref(db,'userChats/'+user.uid)),d=s.val()||{},a=Object.entries(d).map(([id,v])=>({id,...v})).sort((x,y)=>(y.updatedAt||0)-(x.updatedAt||0));box.innerHTML=a.length?'':'<div class="empty">هنوز چتی ندارید.</div>';a.forEach(c=>{const x=document.createElement('div');x.className='row';x.innerHTML=avatar(c)+`<div class="grow"><b>${esc(c.name)}</b><div class="muted small">${esc(c.lastMessage||c.type||'chat')}</div></div><span class="muted small">${esc(c.type||'')}</span>`;x.onclick=()=>openChat(c);box.appendChild(x)})}catch(e){box.innerHTML='<div class="empty">خطا در Chats</div>';toast(err(e))}}
async function renderContacts(){if(!user)return;const box=$('contactsList');try{const s=await get(ref(db,'contacts/'+user.uid)),d=s.val()||{},a=Object.entries(d).map(([id,v])=>({id,...v}));box.innerHTML=a.length?'':'<div class="empty">مخاطبی ندارید.</div>';a.forEach(c=>{const x=document.createElement('div');x.className='row';x.innerHTML=avatar(c)+`<div class="grow"><b>${esc(c.name)}</b><div class="muted small">@${esc(c.username||'')}</div></div><button class="btn primary">Chat</button>`;x.onclick=()=>openUser(c);x.querySelector('button').onclick=e=>{e.stopPropagation();openPrivate(c)};box.appendChild(x)})}catch(e){toast(err(e))}}
async function findUser(q){q=q.replace(/^@/,'').trim();const s=await get(ref(db,'users'));for(const [uid,p] of Object.entries(s.val()||{}))if(uid===q||String(p.username||'').toLowerCase()===q.toLowerCase())return{uid,...p};return null}
$('findContact').onclick=async()=>{const q=$('contactInput').value.trim();if(!q)return toast('UID یا username را وارد کن');try{const p=await findUser(q);if(!p)return toast('کاربر پیدا نشد');if(p.uid===user.uid)return toast('خودت را نمی‌توانی اضافه کنی');await set(ref(db,`contacts/${user.uid}/${p.uid}`),{uid:p.uid,name:p.name,username:p.username||'',photo:p.photo||'',bio:p.bio||'',premium:!!p.premium,profileColor:p.profileColor||'#7662ff'});$('contactInput').value='';toast('مخاطب اضافه شد')}catch(e){toast(err(e))}};
function openUser(c){modal('Profile',`<div style="text-align:center">${avatar(c)}<h2>${esc(c.name)}</h2><div class="muted">@${esc(c.username||'')}</div>${c.premium?'<div style="margin:10px"><span class="badge">ÀVanta Premium</span></div>':''}<p class="muted">${esc(c.bio||'')}</p><div class="grid2"><button id="um" class="btn primary">Message</button><button id="ug" class="btn">🎁 Gift</button></div></div>`);$('um').onclick=()=>{closeModal();openPrivate(c)};$('ug').onclick=()=>{closeModal();openPrivate(c).then(()=>giftShop(c))}}
async function openPrivate(c){const id=[user.uid,c.uid].sort().join('_'),meta={name:c.name,type:'private',photo:c.photo||'',otherUid:c.uid,updatedAt:Date.now()};await update(ref(db,'chats/'+id),meta);await set(ref(db,`userChats/${user.uid}/${id}`),meta);await set(ref(db,`userChats/${c.uid}/${id}`),{...meta,name:profile.name,otherUid:user.uid});openChat({id,...meta})}
function openChat(c){activeChat=c.id;$('chat').classList.add('on');$('chatTitle').textContent=c.name;$('chatSub').textContent=c.type||'chat';$('chatAvatar').innerHTML='';$('chatAvatar').style.background=c.profileColor||'#7662ff';if(c.photo){const im=document.createElement('img');im.src=c.photo;im.alt='';$('chatAvatar').appendChild(im)}else $('chatAvatar').textContent=(c.name||'A').slice(0,1).toUpperCase();subscribeMessages()}
function subscribeMessages(){if(window.msgUnsub)window.msgUnsub();window.msgUnsub=onValue(ref(db,`messages/${activeChat}`),s=>{const a=Object.values(s.val()||{}).sort((x,y)=>(x.createdAt||0)-(y.createdAt||0)),box=$('messages');box.innerHTML=a.length?'':'<div class="empty">هنوز پیامی نیست.</div>';a.forEach(m=>{const d=document.createElement('div');d.className='msg'+(m.uid===user.uid?' mine':'');d.innerHTML=m.gif?`<img src="${esc(m.gif)}">`:m.video?`<video controls src="${esc(m.video)}"></video>`:`<div>${esc(m.text||'')}</div>`;box.appendChild(d)});box.scrollTop=box.scrollHeight})}
$('backChat').onclick=()=>{ $('chat').classList.remove('on');activeChat=null;if(window.msgUnsub){window.msgUnsub();window.msgUnsub=null} };
async function sendMessage(){const v=$('messageInput').value.trim();if(!v||!activeChat)return;try{const now=Date.now();await set(push(ref(db,`messages/${activeChat}`)),{uid:user.uid,name:profile.name,text:v,createdAt:now});await update(ref(db,`chats/${activeChat}`),{lastMessage:v,updatedAt:now});await update(ref(db,`userChats/${user.uid}/${activeChat}`),{lastMessage:v,updatedAt:now});if(activeChat.startsWith(user.uid+'_')||activeChat.endsWith('_'+user.uid)){const other=activeChat.split('_').find(x=>x!==user.uid);if(other)await update(ref(db,`userChats/${other}/${activeChat}`),{lastMessage:v,updatedAt:now})}$('messageInput').value=''}catch(e){toast(err(e))}}
$('sendMessage').onclick=sendMessage;$('messageInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};
$('chatGif').onclick=()=>$('gifFile').click();$('gifMakerBtn').onclick=()=>$('gifFile').click();
$('gifFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f||!activeChat)return;if(f.size>3e6)return toast('GIF حداکثر 3MB');const r=new FileReader();r.onload=async()=>{try{await set(push(ref(db,`messages/${activeChat}`)),{uid:user.uid,name:profile.name,gif:r.result,createdAt:Date.now()});toast('GIF ارسال شد')}catch(x){toast(err(x))}};r.readAsDataURL(f)};
async function saveProfile(x){await update(ref(db,'users/'+user.uid),x);profile={...profile,...x};renderAll()}
function editInfo(){modal('Edit Info',`<input id="en" class="input" value="${esc(profile.name||'')}" placeholder="Name"><input id="eu" class="input" value="${esc(profile.username||'')}" placeholder="Username"><textarea id="eb" class="textarea" placeholder="Bio">${esc(profile.bio||'')}</textarea><button id="saveInfo" class="btn primary full">Save</button>`);$('saveInfo').onclick=async()=>{try{const n=$('en').value.trim()||'ÀVanta User',u=$('eu').value.trim().replace(/^@/,'')||'user';await saveProfile({name:n,username:u,bio:$('eb').value});closeModal();toast('ذخیره شد')}catch(e){toast(err(e))}}}
$('editInfo').onclick=editInfo;$('profileEdit').onclick=editInfo;$('setPhoto').onclick=$('profilePhoto').onclick=()=>$('photoFile').click();
$('photoFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!f.type.startsWith('image/'))return toast('فایل عکس معتبر نیست');if(f.size>1.8e6)return toast('عکس حداکثر 1.8MB');const r=new FileReader();r.onload=async()=>{try{await saveProfile({photo:r.result});toast('عکس تغییر کرد')}catch(x){toast(err(x))}};r.readAsDataURL(f)};
$('profileColor').onclick=()=>{if(!profile?.premium)return toast('این قابلیت فقط برای Premium است');const cs=['#7662ff','#21c9ff','#ff4f9a','#36d89a','#ffad45','#a85cff','#ef62ff','#4d8cff'];modal('Change Profile Colour',`<div class="colors">${cs.map(c=>`<button class="color" data-c="${c}" style="background:${c}"></button>`).join('')}</div>`);document.querySelectorAll('.color').forEach(b=>b.onclick=async()=>{try{await saveProfile({profileColor:b.dataset.c});closeModal();toast('رنگ تغییر کرد')}catch(e){toast(err(e))}})};
$('nameEmoji').onclick=()=>{if(!profile?.premium)return toast('این قابلیت فقط برای Premium است');const em=['✦','✧','⚡','◆','◈','✪','♛','☄','À'];modal('Premium Name Emoji',`<div class="grid3">${em.map(x=>`<button class="btn pem">${x}</button>`).join('')}</div>`);document.querySelectorAll('.pem').forEach(b=>b.onclick=async()=>{try{await saveProfile({nameEmoji:b.textContent});closeModal();toast('Emoji فعال شد')}catch(e){toast(err(e))}})};
$('premiumBtn').onclick=()=>modal('ÀVanta Premium',`<div style="text-align:center"><div class="premiummark" style="width:74px;height:74px;font-size:34px;margin:auto">À</div><h2>ÀVanta Premium</h2><p class="muted">رنگ پروفایل، Emoji نام و Giftهای ویژه.</p><button id="pd" class="btn primary full">فعال‌سازی</button></div>`);document.addEventListener('click',async e=>{if(e.target.id==='pd'){try{await saveProfile({premium:true});closeModal();toast('Premium فعال شد')}catch(x){toast(err(x))}}});
$('storyBtn').onclick=()=>$('storyFile').click();$('storyFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!/^(image\/|video\/)/.test(f.type))return toast('فرمت Story معتبر نیست');if(f.size>2e6)return toast('Story حداکثر 2MB');const r=new FileReader();r.onload=async()=>{try{await set(push(ref(db,`stories/${user.uid}`)),{data:r.result,type:f.type,createdAt:Date.now(),expiresAt:Date.now()+86400000});toast('Story منتشر شد');renderStories()}catch(x){toast(err(x))}};r.readAsDataURL(f)};
async function renderStories(){if(!user)return;try{const s=await get(ref(db,`stories/${user.uid}`)),a=Object.values(s.val()||{}).filter(x=>(x.expiresAt||0)>Date.now());$('storyList').innerHTML=a.length?a.map(x=>x.type?.startsWith('video')?`<video controls src="${esc(x.data)}" style="max-width:100%;border-radius:18px"></video>`:`<img src="${esc(x.data)}" style="max-width:100%;border-radius:18px">`).join(''):'هنوز Storyای نیست.'}catch(e){}}
async function renderGifts(asModal=false){if(!user)return;try{const s=await get(ref(db,`giftReceived/${user.uid}`)),a=Object.values(s.val()||{});const html=a.length?a.map(g=>`<div class="row"><div style="font-size:35px">${esc(g.icon||'🎁')}</div><div class="grow"><b>${esc(g.name||'Gift')}</b><div class="muted small">از ${esc(g.fromName||'کاربر')} • ${new Date(g.createdAt||Date.now()).toLocaleDateString('fa-IR')}</div></div></div>`).join(''):'<div class="empty">هنوز Giftای دریافت نشده.</div>';if(asModal)modal('Gift Collection',html);else $('giftCollection').innerHTML=html}catch(e){if(asModal)toast(err(e))}}
function defaultGifts(){return[{id:'rose',name:'Crystal Rose',icon:'🌹',price:10},{id:'star',name:'VANTA Star',icon:'⭐',price:25},{id:'crown',name:'Royal Crown',icon:'👑',price:50},{id:'gem',name:'ÀVanta Gem',icon:'💎',price:100}]}
async function giftShop(target){let gifts=defaultGifts();try{const s=await get(ref(db,'gifts'));if(s.exists())gifts=[...gifts,...Object.entries(s.val()).map(([id,g])=>({id,...g}))]}catch(e){}modal('VANTA Gifts',`<div class="grid2">${gifts.map(g=>`<div class="card" style="text-align:center"><div style="font-size:44px">${esc(g.icon)}</div><b>${esc(g.name)}</b><div class="muted small">${Number(g.price)||0} VC</div><button class="btn primary full sg" data-id="${esc(g.id)}">Send</button></div>`).join('')}</div>`);document.querySelectorAll('.sg').forEach(b=>b.onclick=async()=>{if(!activeChat){toast('اول وارد چت شو');return}const g=gifts.find(x=>x.id===b.dataset.id);try{const now=Date.now();await set(push(ref(db,`messages/${activeChat}`)),{uid:user.uid,name:profile.name,text:`🎁 ${g.name}`,gift:g,createdAt:now});if(target?.uid)await set(push(ref(db,`giftReceived/${target.uid}`)),{...g,fromUid:user.uid,fromName:profile.name,createdAt:now});closeModal();toast('Gift ارسال شد')}catch(e){toast(err(e))}})}
$('giftBtn').onclick=()=>giftShop();
function createCommunity(type){modal(type==='group'?'Create Group':'Create Channel',`<input id="cn" class="input" placeholder="Name"><input id="cu" class="input" placeholder="Username"><textarea id="cb" class="textarea" placeholder="Description"></textarea><button id="cc" class="btn primary full">Create</button>`);$('cc').onclick=async()=>{const name=$('cn').value.trim();if(!name)return toast('نام را وارد کن');try{const id=push(ref(db,'chats')).key,meta={name,type,username:$('cu').value.trim().replace(/^@/,''),bio:$('cb').value,owner:user.uid,updatedAt:Date.now()};await set(ref(db,`chats/${id}`),meta);await set(ref(db,`chatMembers/${id}/${user.uid}`),{role:'owner',joinedAt:Date.now()});await set(ref(db,`userChats/${user.uid}/${id}`),meta);closeModal();toast(type==='group'?'گروه ساخته شد':'کانال ساخته شد')}catch(e){toast(err(e))}}}
$('groupBtn').onclick=()=>createCommunity('group');$('channelBtn').onclick=()=>createCommunity('channel');
$('savedBtn').onclick=async()=>{const id='saved_'+user.uid,meta={name:'Saved Messages',type:'saved',owner:user.uid,updatedAt:Date.now()};try{await set(ref(db,`userChats/${user.uid}/${id}`),meta);openChat({id,...meta})}catch(e){toast(err(e))}};
$('newBtn').onclick=()=>modal('Create',`<div class="grid2"><button id="ng" class="btn primary">👥 Group</button><button id="nc" class="btn primary">📢 Channel</button><button id="ns" class="btn">💾 Saved Messages</button><button id="nf" class="btn">GIF</button></div>`);
$('modalBody').addEventListener('click',async e=>{
 const id=e.target.id;
 if(id==='ng'){closeModal();createCommunity('group');return}
 if(id==='nc'){closeModal();createCommunity('channel');return}
 if(id==='ns'){closeModal();$('savedBtn').click();return}
 if(id==='nf'){closeModal();$('gifFile').click();return}
 if(id==='mc'){closeModal();$('profileColor').click();return}
 if(id==='me'){closeModal();$('nameEmoji').click();return}
 if(id==='ms'){closeModal();$('storyBtn').click();return}
 if(id==='mg'){closeModal();await renderGifts(true);return}
 if(id==='closeChatMenu'){closeModal();return}
 if(id==='clearChat'){
   if(!activeChat)return toast('چتی باز نیست');
   if(!confirm('همه پیام‌های این چت پاک شوند؟'))return;
   try{await remove(ref(db,`messages/${activeChat}`));closeModal();toast('✓ پیام‌ها پاک شدند')}catch(x){toast(err(x))}
 }
});
async function adminOpen(){if(!user||user.uid!==ADMIN_UID)return toast('دسترسی مدیریت ندارید');if(user.isAnonymous)return toast('برای مدیریت باید با Google وارد شوی');try{await reauthenticateWithPopup(user,new GoogleAuthProvider())}catch(e){return toast('تأیید مدیریت انجام نشد: '+err(e))}modal('ÀVANTA ADMIN',`<div class="grid2"><button id="au" class="btn">Users</button><button id="av" class="btn">VANTAcoin</button><button id="ag" class="btn">Gift Manager</button><button id="ap" class="btn">Premium</button><button id="as" class="btn">Stats</button></div>`);$('au').onclick=async()=>{try{const s=await get(ref(db,'users')),a=Object.values(s.val()||{});modal('Users',`<div class="stat">${a.length}</div><div class="muted">Registered users</div>${a.slice(0,50).map(x=>`<div class="row">${avatar(x)}<div class="grow"><b>${esc(x.name)}</b><div class="muted small">@${esc(x.username||'')}</div></div>${x.premium?'<span class="badge">Premium</span>':''}</div>`).join('')}`)}catch(e){toast(err(e))}};$('av').onclick=()=>modal('VANTAcoin',`<input id="vu" class="input" placeholder="User UID"><input id="va" class="input" type="number" placeholder="Amount"><button id="vg" class="btn primary full">Grant VC</button>`);$('vg').onclick=async()=>{try{const uid=$('vu').value.trim(),n=Number($('va').value);if(!uid||!Number.isFinite(n))return toast('اطلاعات ناقص');const s=await get(ref(db,`wallets/${uid}/vc`));await set(ref(db,`wallets/${uid}/vc`),(Number(s.val())||0)+n);closeModal();toast('VC ثبت شد')}catch(e){toast(err(e))}};$('ag').onclick=()=>modal('Gift Manager',`<input id="gn" class="input" placeholder="Gift name"><input id="gi" class="input" placeholder="Emoji"><input id="gp" class="input" type="number" placeholder="VC price"><button id="gc" class="btn primary full">Create Gift</button>`);$('gc').onclick=async()=>{try{const name=$('gn').value.trim();if(!name)return toast('نام Gift را وارد کن');const id=push(ref(db,'gifts')).key;await set(ref(db,`gifts/${id}`),{name,icon:$('gi').value||'💎',price:Number($('gp').value)||0,createdAt:Date.now()});closeModal();toast('Gift ساخته شد')}catch(e){toast(err(e))}};$('ap').onclick=()=>modal('Premium Manager',`<input id="pu" class="input" placeholder="User UID"><div class="grid2"><button id="pg" class="btn primary">Grant</button><button id="pr" class="btn danger">Revoke</button></div>`);$('pg').onclick=async()=>{try{await update(ref(db,'users/'+$('pu').value.trim()),{premium:true});toast('Premium granted')}catch(e){toast(err(e))}};$('pr').onclick=async()=>{try{await update(ref(db,'users/'+$('pu').value.trim()),{premium:false});toast('Premium revoked')}catch(e){toast(err(e))}};$('as').onclick=async()=>{try{const s=await get(ref(db,'users'));modal('Stats',`<div class="card"><div class="stat">${Object.keys(s.val()||{}).length}</div><div class="muted">Users</div></div>`)}catch(e){toast(err(e))}}}
$('adminBtn').onclick=adminOpen;
$('chatMenu').onclick=()=>modal('Chat',`<div class="grid2"><button id="clearChat" class="btn danger">Clear Messages</button><button id="closeChatMenu" class="btn">Close</button></div>`);$('modalBody').addEventListener('click',async e=>{if(e.target.id==='closeChatMenu')closeModal();if(e.target.id==='clearChat'){if(!activeChat)return;try{await remove(ref(db,`messages/${activeChat}`));closeModal();toast('پیام‌ها پاک شدند')}catch(x){toast(err(x))}}});
document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));$(b.dataset.page).classList.add('on');document.querySelectorAll('.bottom button').forEach(x=>x.classList.toggle('on',x===b))});
$('search').oninput=async e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('#chatList .row').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'':'none');if(q.length>=2&&!document.querySelector('#chatList .row:not([style*="display: none"])')){try{const s=await get(ref(db,'users'));const hit=Object.entries(s.val()||{}).map(([uid,p])=>({uid,...p})).filter(p=>p.uid!==user?.uid&&(String(p.name||'').toLowerCase().includes(q)||String(p.username||'').toLowerCase().includes(q))).slice(0,8);if(hit.length){const box=$('chatList');const old=box.querySelector('.searchResults');if(old)old.remove();const wrap=document.createElement('div');wrap.className='searchResults card';wrap.innerHTML='<div class="title">نتیجه کاربران</div>';hit.forEach(p=>{const r=document.createElement('div');r.className='row';r.innerHTML=avatar(p)+`<div class="grow"><b>${esc(p.name||'User')}</b><div class="muted small">@${esc(p.username||'')}</div></div>`;r.onclick=()=>openPrivate(p);wrap.appendChild(r)});box.prepend(wrap)}}catch(_){}}};
</script></body></html>
