<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="ÀVanta Messenger">
<title>ÀVanta Messenger</title>

<style>
:root{
  --bg:#080d19;
  --panel:#101728;
  --panel2:#172139;
  --panel3:#202c49;
  --line:#293653;
  --text:#f7f8ff;
  --muted:#8f9ab1;
  --accent:#7667ff;
  --accent2:#9c92ff;
  --danger:#ef476f;
  --ok:#2acb91;
  --gold:#ffd166;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

#login{
  width:100%;
  height:100dvh;
  display:grid;
  place-items:center;
  padding:18px;
  background:
    radial-gradient(circle at 50% 0,#332b77,transparent 45%),
    var(--bg);
}

.login-card{
  width:min(420px,100%);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:26px;
  padding:30px;
  text-align:center;
  box-shadow:0 30px 100px #0009;
}

.logo{
  font-size:50px;
  font-weight:1000;
  letter-spacing:-4px;
}
.logo span{color:var(--accent2)}

.login-sub{
  color:var(--muted);
  margin:5px 0 25px;
}

.btn{
  border:0;
  color:var(--text);
  background:var(--panel3);
  padding:11px 15px;
  border-radius:13px;
  font-weight:800;
}
.btn:hover{filter:brightness(1.12)}
.btn.primary{background:var(--accent)}
.btn.danger{background:#4b1829;color:#ffb4c5}
.btn.gold{background:#705b14;color:#ffe99a}
.btn.full{width:100%;margin-top:8px}

.app{
  height:100dvh;
  display:grid;
  grid-template-columns:340px 1fr;
  overflow:hidden;
}

.sidebar{
  background:var(--panel);
  border-left:1px solid var(--line);
  display:flex;
  flex-direction:column;
  min-width:0;
}

.brand{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 15px;
  font-size:23px;
  font-weight:950;
}
.brand span{color:var(--accent2)}

.icon{
  background:transparent;
  border:0;
  color:var(--muted);
  padding:10px;
  border-radius:11px;
}
.icon:hover{
  color:var(--text);
  background:var(--panel2);
}

.search{
  margin:0 12px 10px;
  width:calc(100% - 24px);
  padding:11px;
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:13px;
  outline:0;
}

.tabs{
  display:flex;
  gap:5px;
  padding:0 10px 8px;
}
.tabs button{
  flex:1;
  border:0;
  color:var(--muted);
  background:transparent;
  padding:9px;
  border-radius:10px;
}
.tabs button.active,
.tabs button:hover{
  color:var(--text);
  background:var(--panel2);
}

.list{
  flex:1;
  overflow:auto;
  padding:5px 8px;
}

.chat-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:14px;
  cursor:pointer;
}
.chat-item:hover,
.chat-item.active{
  background:var(--panel2);
}

.avatar{
  width:44px;
  height:44px;
  min-width:44px;
  border-radius:50%;
  overflow:hidden;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--accent),#22b9d5);
  font-weight:900;
}
.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.chat-text{
  min-width:0;
  flex:1;
}
.chat-text b,
.chat-text small{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.chat-text small{
  color:var(--muted);
  font-size:12px;
}

.main{
  min-width:0;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 80% 0,#1e2551,transparent 35%),
    var(--bg);
}

.top{
  height:65px;
  display:flex;
  align-items:center;
  gap:5px;
  padding:8px 12px;
  border-bottom:1px solid var(--line);
  background:#0c1324e8;
  backdrop-filter:blur(15px);
  z-index:5;
}

.title{
  flex:1;
  min-width:0;
}
.title b,
.title small{
  display:block;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.title small{
  color:var(--muted);
  font-size:12px;
}

.messages{
  flex:1;
  overflow:auto;
  padding:16px clamp(8px,5vw,90px);
  display:flex;
  flex-direction:column;
  gap:7px;
}

.bubble{
  max-width:min(720px,91%);
  align-self:flex-start;
  background:var(--panel2);
  border-radius:18px;
  padding:9px 12px;
  overflow-wrap:anywhere;
  box-shadow:0 3px 15px #0002;
}
.bubble.me{
  align-self:flex-end;
  background:#302a70;
}

.sender{
  color:#aaa0ff;
  font-size:12px;
  font-weight:850;
  margin-bottom:4px;
}

.meta{
  color:var(--muted);
  font-size:10px;
  margin-top:5px;
}

.reply{
  background:#ffffff0b;
  border-right:3px solid var(--accent);
  padding:6px 8px;
  border-radius:8px;
  margin-bottom:6px;
  font-size:12px;
}

.custom-emoji{
  width:29px;
  height:29px;
  object-fit:contain;
  vertical-align:middle;
}

.msg-img{
  max-width:100%;
  max-height:400px;
  display:block;
  border-radius:13px;
}

.composer{
  border-top:1px solid var(--line);
  padding:9px 11px;
  display:flex;
  gap:6px;
  align-items:flex-end;
  background:#0c1324e8;
}

.composer textarea{
  flex:1;
  min-height:43px;
  max-height:150px;
  resize:none;
  padding:10px;
  color:var(--text);
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:16px;
  outline:0;
}

.reply-bar{
  margin:0 11px;
  padding:8px 10px;
  border-right:3px solid var(--accent);
  background:var(--panel2);
  border-radius:9px;
  font-size:12px;
}

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:#0009;
  display:none;
  align-items:center;
  justify-content:center;
  padding:14px;
}
.modal.open{display:flex}

.card{
  width:min(680px,100%);
  max-height:92dvh;
  overflow:auto;
  padding:20px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:23px;
  box-shadow:0 30px 100px #0009;
}

.field{
  margin:10px 0;
}
.field label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:5px;
}
.field input,
.field textarea{
  width:100%;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:11px;
  padding:10px;
  color:var(--text);
  outline:0;
}
.field textarea{min-height:90px}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.row>*{flex:1}

.profile{
  text-align:center;
  padding:25px;
  border-radius:18px;
  background:var(--profile-bg,linear-gradient(135deg,#252c60,#151a31));
  margin-bottom:12px;
}
.profile .avatar{
  width:92px;
  height:92px;
  margin:auto;
  font-size:30px;
}

.premium{
  color:var(--gold);
  font-weight:950;
}

.space{
  padding:13px;
  background:var(--panel2);
  border-radius:14px;
  margin:8px 0;
}

.statgrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}
.stat{
  background:var(--panel2);
  border-radius:14px;
  padding:13px;
}
.stat b{
  display:block;
  font-size:23px;
}

.emoji-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}
.emoji-grid button{
  border:0;
  background:var(--panel2);
  border-radius:10px;
  padding:7px;
}

.context{
  position:fixed;
  z-index:150;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:13px;
  padding:5px;
  min-width:190px;
  box-shadow:0 20px 70px #0009;
}
.context button{
  width:100%;
  background:transparent;
  color:var(--text);
  border:0;
  text-align:right;
  padding:9px;
  border-radius:8px;
}
.context button:hover{background:var(--panel2)}

.empty{
  margin:auto;
  color:var(--muted);
  text-align:center;
  padding:30px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:75px;
  transform:translateX(-50%);
  z-index:300;
  display:none;
  background:#050811;
  border:1px solid var(--line);
  padding:10px 15px;
  border-radius:12px;
}
.toast.show{display:block}

.mobile-only{display:none}

.light{
  --bg:#f4f6fa;
  --panel:#fff;
  --panel2:#eef1f7;
  --panel3:#e1e6ef;
  --line:#d6ddea;
  --text:#192033;
  --muted:#68748b;
}
.light .top,
.light .composer{
  background:#fffffff0;
}

@media(max-width:760px){
  .app{grid-template-columns:1fr}

  .sidebar{
    position:fixed;
    inset:0 0 0 auto;
    width:min(92vw,360px);
    z-index:20;
    transform:translateX(100%);
    transition:.2s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .mobile-only{display:block}
  .bubble{max-width:94%}
  .messages{padding:10px 7px}
  .top{height:59px}
}
</style>
</head>

<body>

<section id="login">
  <div class="login-card">
    <div class="logo">À<span>Vanta</span></div>
    <div class="login-sub">پیام‌رسان اختصاصی ÀVanta</div>

    <button id="googleBtn" class="btn primary full">
      ورود با Google
    </button>

    <button id="guestBtn" class="btn full">
      ورود مهمان
    </button>

    <small style="display:block;color:var(--muted);margin-top:13px">
      Google و Guest باید در Firebase Authentication فعال باشند.
    </small>
  </div>
</section>

<div id="app" class="app hidden">

  <aside id="sidebar" class="sidebar">

    <div class="brand">
      <span>ÀVanta</span>
      <button id="settingsBtn" class="icon">⚙</button>
    </div>

    <input id="search" class="search" placeholder="جستجو...">

    <div class="tabs">
      <button id="tabChats" class="active">چت‌ها</button>
      <button id="tabSaved">ذخیره‌شده</button>
      <button id="tabSpaces">فضاها</button>
    </div>

    <div id="chatList" class="list"></div>

  </aside>

  <main class="main">

    <header class="top">

      <button id="menuBtn" class="icon mobile-only">☰</button>

      <div class="title">
        <b id="chatTitle">چت عمومی</b>
        <small id="chatSub">گفتگوی عمومی</small>
      </div>

      <button id="profileBtn" class="icon">
        پروفایل
      </button>

      <button id="moreBtn" class="icon">
        ⋮
      </button>

    </header>

    <section id="messages" class="messages"></section>

    <div id="replyBar" class="reply-bar hidden"></div>

    <div class="composer">

      <button id="attachBtn" class="icon">＋</button>

      <button id="emojiBtn" class="icon">☺</button>

      <button id="voiceBtn" class="icon">●</button>

      <textarea id="input" placeholder="پیام..."></textarea>

      <button id="sendBtn" class="btn primary">
        ارسال
      </button>

    </div>

  </main>
</div>

<div id="modal" class="modal">
  <div id="modalCard" class="card"></div>
</div>

<div id="toast" class="toast"></div>

<input id="fileInput" type="file" hidden>
<input id="avatarInput" type="file" accept="image/*" hidden>
<input id="emojiFile" type="file" accept="image/*" hidden>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script>
/* ============================================================
   ÀVANTA FIREBASE
   ============================================================ */

const firebaseConfig = {
  apiKey: "AIzaSyBsncHhhlqIi6qpf3hYtb0DOnq8Zjb-zpI",
  authDomain: "avanta-3db7e.firebaseapp.com",
  databaseURL: "https://avanta-3db7e-default-rtdb.firebaseio.com",
  projectId: "avanta-3db7e",
  storageBucket: "avanta-3db7e.firebasestorage.app",
  messagingSenderId: "879564538420",
  appId: "1:879564538420:web:a0fc85cc43a9347d92c061",
  measurementId: "G-P3LP14QTQT"
};

const ADMIN_UID =
  "NNY1ymTknwREwMo16ZI3lgFEni23";

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let me = null;
let profile = null;

let users = {};
let emojis = {};
let chatIndex = {};

let currentChat = {
  type:"public",
  id:"public",
  title:"چت عمومی",
  sub:"گفتگوی عمومی"
};

let listeners = [];
let replyTo = null;

const $ = id => document.getElementById(id);

const UID = () =>
  auth.currentUser ? auth.currentUser.uid : null;

const isAdmin = () =>
  UID() === ADMIN_UID;

const now = () => Date.now();

function escapeHTML(value){
  return String(value ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );
}

function toast(text){
  $("toast").textContent = text;
  $("toast").classList.add("show");

  clearTimeout(window.__toast);

  window.__toast = setTimeout(()=>{
    $("toast").classList.remove("show");
  },3000);
}

function openModal(html){
  $("modalCard").innerHTML = html;
  $("modal").classList.add("open");
}

function closeModal(){
  $("modal").classList.remove("open");
}

$("modal").addEventListener("click",e=>{
  if(e.target.id === "modal"){
    closeModal();
  }
});

/* ============================================================
   FIREBASE ERROR HANDLING
   ============================================================ */

function firebaseError(error){

  const code = error?.code || "unknown";

  const messages = {

    "auth/api-key-not-valid":
      "API Key Firebase معتبر نیست.",

    "auth/network-request-failed":
      "اتصال شبکه به Firebase برقرار نشد.",

    "auth/operation-not-allowed":
      "این روش ورود در Firebase فعال نیست.",

    "auth/unauthorized-domain":
      "دامنه سایت در Authorized domains Firebase ثبت نشده.",

    "auth/popup-blocked":
      "مرورگر Popup ورود را مسدود کرده.",

    "auth/popup-closed-by-user":
      "پنجره ورود بسته شد.",

    "auth/invalid-credential":
      "اطلاعات ورود معتبر نیست.",

    "auth/too-many-requests":
      "تعداد تلاش زیاد است؛ کمی بعد دوباره امتحان کن.",

    "auth/internal-error":
      "خطای داخلی Firebase رخ داده.",

    "auth/invalid-api-key":
      "API Key Firebase نامعتبر است."
  };

  return `${messages[code] || error?.message || "Firebase Error"} [${code}]`;
}

/* ============================================================
   AUTH
   ============================================================ */

$("googleBtn").onclick = async ()=>{

  try{

    const provider =
      new firebase.auth.GoogleAuthProvider();

    provider.setCustomParameters({
      prompt:"select_account"
    });

    /*
      Redirect برای موبایل پایدارتر از Popup است.
    */

    await auth.signInWithRedirect(provider);

  }catch(error){

    console.error(error);

    toast(firebaseError(error));
  }
};

$("guestBtn").onclick = async ()=>{

  try{

    await auth.signInAnonymously();

  }catch(error){

    console.error(
      "ÀVanta Guest Login Error:",
      error
    );

    toast(firebaseError(error));
  }
};

auth.getRedirectResult()
.catch(error=>{
  console.error(
    "Google Redirect:",
    error
  );

  if(error?.code){
    toast(firebaseError(error));
  }
});

auth.onAuthStateChanged(async user=>{

  if(!user){
    $("login").classList.remove("hidden");
    $("app").classList.add("hidden");
    return;
  }

  try{

    await startApplication(user);

  }catch(error){

    console.error(error);

    toast(firebaseError(error));
  }
});

/* ============================================================
   PROFILE
   ============================================================ */

async function startApplication(user){

  me = user;

  await ensureProfile(user);

  setupPresence();

  await loadDatabaseData();

  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");

  await openChat({
    type:"public",
    id:"public",
    title:"چت عمومی",
    sub:"گفتگوی عمومی"
  });
}

async function ensureProfile(user){

  const ref =
    db.ref("users/" + user.uid);

  const snap =
    await ref.once("value");

  const old =
    snap.val() || {};

  profile = {

    uid:user.uid,

    displayName:
      old.displayName ||
      user.displayName ||
      "کاربر ÀVanta",

    username:
      old.username ||
      "user_" + user.uid.slice(0,8),

    photoURL:
      old.photoURL ||
      user.photoURL ||
      "",

    bio:
      old.bio || "",

    premium:
      !!old.premium,

    premiumUntil:
      Number(old.premiumUntil || 0),

    vc:
      Number(old.vc || 0),

    emojiId:
      old.emojiId || null,

    profileBg:
      old.profileBg || "",

    createdAt:
      old.createdAt || now(),

    online:true,

    lastSeen:
      now()
  };

  await ref.update(profile);

  users[user.uid] = profile;
}

/* ============================================================
   ONLINE
   ============================================================ */

function setupPresence(){

  const userRef =
    db.ref("users/" + UID());

  const connectedRef =
    db.ref(".info/connected");

  connectedRef.on("value",snap=>{

    if(!snap.val()){
      return;
    }

    userRef.update({
      online:true,
      lastSeen:
        firebase.database.ServerValue.TIMESTAMP
    });

    userRef.onDisconnect().update({
      online:false,
      lastSeen:
        firebase.database.ServerValue.TIMESTAMP
    });

  });
}

/* ============================================================
   LOAD DATA
   ============================================================ */

async function loadDatabaseData(){

  const [
    usersSnap,
    emojiSnap,
    chatsSnap
  ] = await Promise.all([

    db.ref("users").once("value"),

    db.ref("emojis").once("value"),

    db.ref("privateChats/" + UID())
      .once("value")
  ]);

  users = {};

  Object.values(usersSnap.val() || {})
    .forEach(user=>{
      if(user?.uid){
        users[user.uid] = user;
      }
    });

  emojis =
    emojiSnap.val() || {};

  chatIndex =
    chatsSnap.val() || {};

  renderChatList();
}

/* ============================================================
   AVATAR / PREMIUM / EMOJI
   ============================================================ */

function avatar(user,sizeClass="avatar"){

  const name =
    user?.displayName ||
    user?.username ||
    "U";

  const letter =
    escapeHTML(
      name.slice(0,1).toUpperCase()
    );

  return `
    <div class="${sizeClass}">
      ${
        user?.photoURL
        ?
        `<img src="${escapeHTML(user.photoURL)}">`
        :
        letter
      }
    </div>
  `;
}

function premiumBadge(user){

  if(
    user?.premium &&
    Number(user.premiumUntil || 0) > now()
  ){

    return `<span class="premium">◆</span>`;
  }

  return "";
}

function customEmoji(user){

  if(
    user?.emojiId &&
    emojis[user.emojiId]
  ){

    return `
      <img
        class="custom-emoji"
        src="${escapeHTML(emojis[user.emojiId].data)}"
      >
    `;
  }

  return "";
}

function renderText(text){

  let result =
    escapeHTML(text || "");

  result =
    result.replace(
      /\[emoji:([\w-]+)\]/g,
      (_,id)=>{

        if(!emojis[id]){
          return ":" + escapeHTML(id) + ":";
        }

        return `
          <img
            class="custom-emoji"
            src="${escapeHTML(emojis[id].data)}"
          >
        `;
      }
    );

  return result.replace(/\n/g,"<br>");
}

/* ============================================================
   CHAT LIST
   ============================================================ */

function renderChatList(){

  const search =
    ($("search").value || "")
      .toLowerCase();

  const privateChats =
    Object.values(chatIndex)
      .sort(
        (a,b)=>
          (b.updatedAt || 0) -
          (a.updatedAt || 0)
      );

  const people =
    Object.values(users)
      .filter(user=>
        user.uid !== UID() &&
        (
          !search ||
          (
            (user.displayName || "") +
            " " +
            (user.username || "")
          )
          .toLowerCase()
          .includes(search)
        )
      )
      .slice(0,80);

  $("chatList").innerHTML = `

    <div
      id="publicChatItem"
      class="chat-item active"
    >

async function openPrivateChat(otherUid){

    users[otherUid];

  if(!user){

    return;
  }

  const cid =
    [UID(),otherUid]
      .sort()
      .join("_");

  const data = {

    id:cid,

    type:"dm",

    otherUid,

    title:user.displayName,

    sub:
      user.online
      ? "آنلاین"
      : "آفلاین",

    updatedAt:now()
  };

  await db.ref(
    "privateChats/" +
    UID() +
    "/" +
    cid
  ).set(data);

  await db.ref(
    "privateChats/" +
    otherUid +
    "/" +
    cid
  ).set({

    ...data,

    otherUid:UID(),

    title:profile.displayName

/* ============================================================
   CHAT ENGINE
   ============================================================ */

function stopListeners(){

  listeners.forEach(stop=>{
    try{
      stop();
    }catch{}
  });

  listeners = [];
}

async function openChat(chat){

  currentChat = chat;

  replyTo = null;

  $("replyBar")
    .classList
    .add("hidden");

  $("chatTitle").textContent =
    chat.title || "چت";

  $("chatSub").textContent =
    chat.sub || "";

  stopListeners();

  $("messages").innerHTML =
    `<div class="empty">در حال بارگذاری...</div>`;

  const path =
    chat.type === "dm"
    ?
    "privateMessages/" +
    chat.dbId
    :
    chat.type === "public"
    ?
    "messages/public"
    :
    (
      chat.type === "group"
      ?
      "groupMessages/" + chat.id
      :
      "channelMessages/" + chat.id
    );

  const ref =
    db.ref(path);

  const handler =
    snap=>{
      drawMessages(
        snap.val() || {}
      );
    };

  ref.on("value",handler);

  listeners.push(
    ()=>ref.off("value",handler)
  );

  if(innerWidth < 760){
    $("sidebar")
      .classList
      .remove("open");
  }
}

function drawMessages(data){

  const messages =
    Object.entries(data)
      .map(([id,value])=>({
        ...value,
        id
      }))
      .filter(msg=>!msg.deleted)
      .sort(
        (a,b)=>
          (a.createdAt || 0) -
          (b.createdAt || 0)
      );

  if(!messages.length){

    $("messages").innerHTML =
      `
      <div class="empty">
        هنوز پیامی نیست.
        <br>
        اولین پیام را بفرست.
      </div>
      `;

    return;
  }

  $("messages").innerHTML =
    messages
      .map(messageHTML)
      .join("");

  document
    .querySelectorAll("[data-mid]")
    .forEach(el=>{
      el.onclick =
        e=>
          messageMenu(
            e,
            el.dataset.mid
          );
    });

  $("messages").scrollTop =
    $("messages").scrollHeight;
}

function messageHTML(message){

  const mine =
    message.senderUid === UID();

  const user =
    users[message.senderUid] ||
    {
      displayName:
        message.senderName ||
        "کاربر",

      username:
        message.senderUsername,

      photoURL:
        message.senderPhoto,

      emojiId:
        message.senderEmojiId,

      premium:
        message.senderPremium,

      premiumUntil:
        message.senderPremiumUntil
    };

  let body = "";

  if(message.type === "image"){

    body = `
      <img
        class="msg-img"
        src="${escapeHTML(message.fileData)}"
      >
    `;

  }else if(message.type === "file"){

    body = `
      <a
        href="${escapeHTML(message.fileData)}"
        download="${escapeHTML(message.fileName || "file")}"
        style="color:#d8d2ff"
      >
        دانلود ${escapeHTML(message.fileName || "فایل")}
      </a>
    `;

  }else if(message.type === "voice"){

    body = `
      <audio
        controls
        src="${escapeHTML(message.fileData)}"
        style="max-width:280px"
      ></audio>
    `;

  }else{

    body =
      renderText(
        message.text || ""
      );
  }

  const reactions =
    Object.entries(
      message.reactions || {}
    )
    .map(([reaction,value])=>{

      const count =
        typeof value === "object"
        ?
        Object.keys(value).length
        :
        Number(value || 0);

      return `
        <button
          class="react"
          onclick="
            event.stopPropagation();
            reactMessage(
              '${escapeHTML(message.id)}',
              '${escapeHTML(reaction)}'
            )
          "
        >
          ${escapeHTML(reaction)}
          ${count}
        </button>
      `;

    })
    .join("");

  return `

    <article
      class="bubble ${mine ? "me" : ""}"
      data-mid="${escapeHTML(message.id)}"
    >

      ${
        mine
        ?
        ""
        :
        `
        <div class="sender">
          ${escapeHTML(user.displayName)}
          ${premiumBadge(user)}
          ${customEmoji(user)}
        </div>
        `
      }

      ${
        message.reply
        ?
        `
        <div class="reply">
          <b>
            ${escapeHTML(
              message.reply.senderName || ""
            )}
          </b>
          <br>
          ${renderText(
            message.reply.text || ""
          )}
        </div>
        `
        :
        ""
      }

      ${body}

      <div class="meta">
        ${message.createdAt
          ? new Date(
              message.createdAt
            ).toLocaleTimeString(
              "fa-IR",
              {
                hour:"2-digit",
                minute:"2-digit"
              }
            )
          : ""
        }

        ${
          message.edited
          ? " · ویرایش‌شده"
          : ""
        }
      </div>

      ${reactions}

    </article>
  `;
}

async function sendMessage(){

  const input =
    $("input");

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  const message = {

    senderUid:
      UID(),

    senderName:
      profile.displayName,

    senderUsername:
      profile.username,

    senderPhoto:
      profile.photoURL || "",

    senderEmojiId:
      profile.emojiId || null,

    senderPremium:
      profile.premium,

    senderPremiumUntil:
      profile.premiumUntil,

    text,

    createdAt:
      now()
  };

  if(replyTo){
    message.reply =
      replyTo;
  }

  let path;

  if(currentChat.type === "dm"){

    path =
      "privateMessages/" +
      currentChat.dbId;

  }else if(currentChat.type === "public"){

    path =
      "messages/public";

  }else if(currentChat.type === "group"){

    path =
      "groupMessages/" +
      currentChat.id;

  }else{

    path =
      "channelMessages/" +
      currentChat.id;
  }

  await db.ref(path)
    .push()
    .set(message);

  if(currentChat.type === "dm"){

    const update = {
      updatedAt:now(),
      lastMessage:
        text.slice(0,100)
    };

    await db.ref(
      "privateChats/" +
      UID() +
      "/" +
      currentChat.dbId
    ).update(update);

    if(currentChat.user){

      await db.ref(
        "privateChats/" +
        currentChat.user.uid +
        "/" +
        currentChat.dbId
      ).update(update);
    }
  }

  input.value = "";

  replyTo = null;

  $("replyBar")
    .classList
    .add("hidden");
}

$("sendBtn").onclick =
  sendMessage;

$("input").addEventListener(
  "keydown",
  event=>{

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();
    }
  }
);

async function messageMenu(event,id){

  const path =
    currentChat.type === "dm"
    ?
    "privateMessages/" +
    currentChat.dbId
    :
    currentChat.type === "public"
    ?
    "messages/public"
    :
    currentChat.type === "group"
    ?
    "groupMessages/" +
    currentChat.id
    :
    "channelMessages/" +
    currentChat.id;

  const snap =
    await db.ref(path+"/"+id)
      .once("value");

  const message =
    snap.val();

  if(!message){
    return;
  }

  document
    .querySelector(".context")
    ?.remove();

  const menu =
    document.createElement("div");

  menu.className =
    "context";

  menu.style.left =
    Math.min(
      event.clientX,
      innerWidth - 205
    ) + "px";

  menu.style.top =
    Math.min(
      event.clientY,
      innerHeight - 270
    ) + "px";

  menu.innerHTML = `

    <button data-action="reply">
      پاسخ
    </button>

    <button data-action="react">
      واکنش
    </button>

    <button data-action="save">
      ذخیره
    </button>

    <button data-action="pin">
      پین
    </button>

    ${
      message.senderUid === UID()
      ?
      `
      <button data-action="edit">
        ویرایش
      </button>

      <button data-action="delete">
        حذف
      </button>
      `
      :
      ""
    }

  `;

  document.body.appendChild(menu);

  menu.onclick =
    async event=>{

      const action =
        event.target.dataset.action;

      if(!action){
        return;
      }

      menu.remove();

      if(action === "reply"){

        replyTo = {

          id,

          text:
            message.text ||
            message.fileName ||
            "فایل",

          senderName:
            message.senderName ||
            ""
        };

        $("replyBar").textContent =
          "پاسخ به: " +
          replyTo.text;

        $("replyBar")
          .classList
          .remove("hidden");
      }

      if(action === "react"){

        const reaction =
          prompt(
            "واکنش را وارد کن"
          );

        if(reaction){
          reactMessage(
            id,
            reaction
          );
        }
      }

      if(action === "save"){

        await db.ref(
          "saved/" +
          UID() +
          "/" +
          id
        ).set({

          ...message,

          savedAt:
            now(),

          sourceChat:
            currentChat.id
        });

        toast(
          "پیام ذخیره شد"
        );
      }

      if(action === "pin"){

        await db.ref(
          "pinned/" +
          currentChat.id +
          "/" +
          id
        ).set({
          ...message,
          pinnedAt:now()
        });

        toast(
          "پیام پین شد"
        );
      }

      if(action === "delete"){

        await db.ref(path+"/"+id)
          .update({
            deleted:true,
            deletedAt:now()
          });
      }

      if(action === "edit"){

        const newText =
          prompt(
            "متن جدید",
            message.text || ""
          );

        if(newText !== null){

          await db.ref(
            path+"/"+id
          ).update({

            text:newText,

            edited:true
          });
        }
      }
    };

  setTimeout(
    ()=>menu.remove(),
    5000
  );
}

async function reactMessage(id,reaction){

  const ref =
    db.ref(
      (
        currentChat.type === "dm"
        ?
        "privateMessages/"+currentChat.dbId
        :
        currentChat.type === "public"
        ?
        "messages/public"
        :
        currentChat.type === "group"
        ?
        "groupMessages/"+currentChat.id
        :
        "channelMessages/"+currentChat.id
      )
      +
      "/" +
      id +
      "/reactions/" +
      reaction +
      "/" +
      UID()
    );

  const snap =
    await ref.once("value");

  await ref.set(
    snap.exists()
    ? null
    : true
  );
}

/* ============================================================
   IMAGE / FILE / EMOJI COMPRESSION
   ============================================================ */

async function compressImage(
  file,
  maxSize=1280,
  quality=.78
){

  if(file.size > 7 * 1024 * 1024){
    throw new Error(
      "FILE_TOO_LARGE"
    );
  }

  if(!file.type.startsWith("image/")){

    return new Promise(
      (resolve,reject)=>{

        const reader =
          new FileReader();

        reader.onload =
          ()=>resolve(
            reader.result
          );

        reader.onerror =
          reject;

        reader.readAsDataURL(file);
      }
    );
  }

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload = ()=>{

        const image =
          new Image();

        image.onload = ()=>{

          let width =
            image.width;

          let height =
            image.height;

          const largest =
            Math.max(
              width,
              height
            );

          if(largest > maxSize){

            const scale =
              maxSize / largest;

            width *= scale;
            height *= scale;
          }

          const canvas =
            document.createElement(
              "canvas"
            );

          canvas.width =
            Math.round(width);

          canvas.height =
            Math.round(height);

          const ctx =
            canvas.getContext(
              "2d"
            );

          ctx.drawImage(
            image,
            0,
            0,
            canvas.width,
            canvas.height
          );

          resolve(
            canvas.toDataURL(
              "image/webp",
              quality
            )
          );
        };

        image.onerror =
          reject;

        image.src =
          reader.result;
      };

      reader.onerror =
        reject;

      reader.readAsDataURL(file);
    }
  );
}

   ============================================================ */

$("voiceBtn").onclick =
  async ()=>{

    if(
      window.avantaRecorder &&
      window.avantaRecorder.state ===
      "recording"
    ){

      window.avantaRecorder.stop();

      return;
    }

    try{

      const stream =
        await navigator.mediaDevices
          .getUserMedia({
            audio:true
          });

      const chunks = [];

      const recorder =
        new MediaRecorder(
          stream
        );

      window.avantaRecorder =
        recorder;

      recorder.ondataavailable =
        event=>{
          chunks.push(
            event.data
          );
        };

      recorder.onstop =
        ()=>{

          stream
            .getTracks()
            .forEach(track=>
              track.stop()
            );

          const blob =
            new Blob(
              chunks,
              {
                type:"audio/webm"
              }
            );

          if(blob.size > 5e6){

            toast(
              "ویس بیش از حد بزرگ است."
            );

            return;
          }

          const reader =
            new FileReader();

          reader.onload =
            async ()=>{

              let path;

              if(currentChat.type === "dm"){

                path =
                  "privateMessages/" +
                  currentChat.dbId;

              }else if(currentChat.type === "public"){

                path =
                  "messages/public";

              }else if(currentChat.type === "group"){

                path =
                  "groupMessages/" +
                  currentChat.id;

              }else{

                path =
                  "channelMessages/" +
                  currentChat.id;
              }

              await db.ref(path)
                .push()
                .set({

                  senderUid:UID(),

                  senderName:
                    profile.displayName,

                  type:"voice",

                  fileData:
                    reader.result,

                  createdAt:now()
                });
            };

          reader.readAsDataURL(blob);

          window.avantaRecorder =
            null;
        };

      recorder.start();

      toast(
        "ضبط شروع شد؛ دوباره دکمه را بزن."
      );

    }catch(error){

      toast(
        "دسترسی میکروفون داده نشد."
      );
    }
  };

window.purchaseGift =
  async (
    giftId,
    receiver
  )=>{

    const snap =
      await db.ref(
        "gifts/" + giftId
      ).once("value");

    const gift =
      snap.val();

    if(!gift){
      return;
    }

    const price =
      Number(
        gift.price || 0
      );

    const userRef =
      db.ref(
        "users/" +
        UID() +
        "/vc"
      );

    const transaction =
      await userRef.transaction(
        balance=>{

          balance =
            Number(
              balance || 0
            );

          if(balance < price){
            return;
          }

          return balance - price;
        }
      );

    if(!transaction.committed){

      toast(
        "VC کافی نیست."
      );

      return;
    }

    const giftData = {

      giftId,

      name:
        gift.name,

      price,

      from:
        UID(),

      to:
        receiver,

      createdAt:
        now()
    };

    await db.ref(
      "giftTransactions"
    ).push().set(
      giftData
    );

    await db.ref(
      "giftInbox/" +
      receiver
    ).push().set(
      giftData
    );

    profile.vc -= price;

    toast(
      "Gift ارسال شد."
    );

    closeModal();
  };

window.buyPremium =
  async (
    cost,
    days
  )=>{

    const balance =
      Number(
        profile.vc || 0
      );

    if(balance < cost){

      toast(
        "VC کافی نیست."
      );

      return;
    }

    const newBalance =
      balance - cost;

    const newUntil =
      Math.max(
        Number(
          profile.premiumUntil || 0
        ),
        now()
      )
      +
      days *
      86400000;

    await db.ref(
      "users/" + UID()
    ).update({

      vc:
        newBalance,

      premium:
        true,

      premiumUntil:
        newUntil
    });

    profile.vc =
      newBalance;

    profile.premium =
      true;

    profile.premiumUntil =
      newUntil;

    closeModal();

    toast(
      "Premium فعال شد."
    );
  };

window.adminGrantVC =
  async ()=>{

    if(!isAdmin()){
      return;
    }

    const uid =
      $("adminVCUid")
        .value
        .trim();

    const amount =
      Number(
        $("adminVCAmount")
          .value
      );

    if(!uid || amount < 1){

      toast(
        "اطلاعات نامعتبر است."
      );

      return;
    }

    const ref =
      db.ref(
        "users/" +
        uid +
        "/vc"
      );

    const transaction =
      await ref.transaction(
        value =>
          Number(
            value || 0
          ) + amount
      );

    if(!transaction.committed){

      toast(
        "اعطای VC ناموفق بود."
      );

      return;
    }

    await db.ref(
      "adminLogs"
    ).push().set({

      action:
        "grantVC",

      target:
        uid,

      amount,

      by:
        UID(),

      createdAt:
        now()
    });

    toast(
      "VC با موفقیت اعطا شد."
    );

    openAdmin();
  };

window.cleanupOldMessages =
  async ()=>{

    if(!isAdmin()){
      return;
    }

    const days =
      Number(
        prompt(
          "پیام‌های قدیمی‌تر از چند روز حذف شوند؟",
          "30"
        )
      );

    if(!days){
      return;
    }

    const cutoff =
      now() -
      days *
      86400000;

    const updates = {};

    for(
      const root
      of [
        "messages",
        "privateMessages",
        "groupMessages",
        "channelMessages"
      ]
    ){

      const snap =
        await db.ref(root)
          .once("value");

      snap.forEach(chat=>{

        chat.forEach(message=>{

          const value =
            message.val();

          if(
            Number(
              value?.createdAt || 0
            ) < cutoff
          ){

            updates[
              root +
              "/" +
              chat.key +
              "/" +
              message.key
            ] = null;
          }

        });

      });
    }

    if(
      Object.keys(updates).length
    ){

      await db.ref()
        .update(updates);
    }

    toast(
      "پاکسازی انجام شد."
    );
  };

function toggleTheme(){

  document.body
    .classList
    .toggle("light");

  localStorage.setItem(
    "avanta-theme",
    document.body.classList.contains(
      "light"
    )
    ?
    "light"
    :
    "dark"
  );
}

if(
  localStorage.getItem(
    "avanta-theme"
  ) === "light"
){

  document.body
    .classList
    .add("light");
}

/* ============================================================
   INVITE LINK
   ============================================================ */

async function checkInvite(){

  if(
    !location.hash.startsWith(
      "#invite="
    )
  ){

    return;
  }

  if(!UID()){
    return;
  }

  const value =
    location.hash
      .slice(8)
      .split("/");

  if(value.length !== 3){
    return;
  }

  const [
    type,
    id,
    code
  ] = value;

  const root =
    type === "group"
    ?
    "groups/"
    :
    "channels/";

  const snap =
    await db.ref(
      root + id
    ).once("value");

  const space =
    snap.val();

  if(
    space &&
    space.inviteCode === code
  ){

    await db.ref(
      root +
      id +
      "/members/" +
      UID()
    ).set(true);

    toast(
      "عضویت انجام شد."
    );

    await openChat({

      type,

      id,

      title:
        space.name,

      sub:
        type === "channel"
        ?
        "کانال"
        :
        "گروه"
    });
  }

  history.replaceState(
    null,
    "",
    location.pathname +
    location.search
  );
}

setTimeout(
  checkInvite,
  1500
);

/* ============================================================
   PWA
   ============================================================ */

if(
  "serviceWorker" in navigator
){

  window.addEventListener(
    "load",
    ()=>{

      /*
        Service Worker فقط وقتی اجرا می‌شود
        که سایت روی HTTPS یا localhost باشد.
      */

      const sw = `

        const CACHE =
          "avanta-v1";

        self.addEventListener(
          "install",
          event=>{

            self.skipWaiting();

            event.waitUntil(
              caches.open(CACHE)
            );
          }
        );

        self.addEventListener(
          "activate",
          event=>{
            event.waitUntil(
              self.clients.claim()
            );
          }
        );

        self.addEventListener(
          "fetch",
          event=>{

            if(
              event.request.method !==
              "GET"
            ){
              return;
            }

            event.respondWith(

              fetch(event.request)
              .catch(
                ()=>caches.match(
                  event.request
                )
              )

            );
          }
        );

      `;

      /*
        Blob Service Worker
        ممکن است در بعضی مرورگرها مسدود باشد؛
        بنابراین خطا را نادیده می‌گیریم.
      */

      try{

        const blob =
          new Blob(
            [sw],
            {
              type:
                "text/javascript"
            }
          );

        const url =
          URL.createObjectURL(
            blob
          );

        navigator.serviceWorker
          .register(url)
          .catch(()=>{});

      }catch{}
    }
  );
}
</script>
