<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ÀVanta Messenger</title>

<style>
:root{
  --accent:#7662ff;
  --bg:#080c13;
  --panel:rgba(17,25,35,.72);
  --panel2:rgba(23,34,48,.78);
  --line:rgba(120,145,180,.22);
  --muted:#91a0b5;
  --glass:rgba(18,27,40,.68);
  --glass2:rgba(35,48,68,.55);
  --blur:22px;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  background:
    radial-gradient(circle at 10% 0,#282052 0,transparent 32%),
    radial-gradient(circle at 100% 100%,#102f4d 0,transparent 30%),
    var(--bg);
  color:#fff;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif
}
body{overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer;color:#fff;border:0}
button:disabled{opacity:.5;cursor:not-allowed}
#app{
  height:100dvh;max-width:960px;margin:auto;
  background:rgba(8,12,19,.76);
  display:flex;flex-direction:column;
  position:relative;
  backdrop-filter:blur(12px)
}
.top{
  height:66px;display:flex;align-items:center;gap:9px;
  padding:9px 12px;background:rgba(14,21,31,.72);
  border-bottom:1px solid var(--line);
  position:relative;z-index:5;
  backdrop-filter:blur(var(--blur))
}
.brand{font-weight:1000;font-size:21px;white-space:nowrap}
.brand b,.logoBig b{color:#a493ff}
.search{
  flex:1;min-width:50px;background:rgba(24,35,49,.72);
  border:1px solid var(--line);color:#fff;
  border-radius:17px;padding:10px 12px;outline:0
}
main{flex:1;overflow:auto;padding:14px 12px 100px}
.page{display:none}.page.on{display:block}
.card,.row{
  background:var(--glass);
  border:1px solid var(--line);
  border-radius:21px;padding:14px;margin-bottom:10px;
  box-shadow:0 10px 35px rgba(0,0,0,.12);
  backdrop-filter:blur(var(--blur))
}
.row{display:flex;align-items:center;gap:11px;transition:.15s}
.row:active{transform:scale(.985)}
.title{font-size:21px;font-weight:950;margin-bottom:5px}
.muted{color:var(--muted)}
.small{font-size:12px}
.grow{flex:1;min-width:0}
.avatar{
  width:52px;height:52px;border-radius:18px;
  display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,#806bff,#21c9ff);
  font-weight:950;overflow:hidden
}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.big{
  width:118px;height:118px;border-radius:35px;
  margin:4px auto 10px;font-size:42px
}
.cover{
  height:145px;border-radius:22px;
  background:linear-gradient(135deg,#6d5ce7,#1cc7ff);
  background-size:cover;background-position:center;
  margin:-14px -14px 12px
}
.btn{
  background:rgba(27,38,52,.75);
  border:1px solid rgba(100,125,155,.32);
  border-radius:15px;padding:10px 13px;font-weight:800;
  transition:.15s;
  backdrop-filter:blur(15px)
}
.btn:active{transform:scale(.96)}
.primary{
  background:linear-gradient(135deg,#7b65ff,#4d83ff);
  border-color:#8274ff
}
.danger{background:#481e2b;border-color:#713347}
.full{width:100%;margin-top:7px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bottom{
  position:fixed;bottom:9px;left:50%;
  transform:translateX(-50%);
  width:min(940px,calc(100% - 16px));
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:4px;padding:6px;background:rgba(17,26,37,.72);
  border:1px solid rgba(100,125,155,.28);border-radius:27px;
  backdrop-filter:blur(25px);z-index:20;
  box-shadow:0 12px 45px #0008
}
.bottom button{
  background:transparent;border-radius:21px;
  padding:7px 3px;color:#8997aa
}
.bottom button.on{background:#7461ff22;color:#fff}
.navico{font-size:21px;display:block;line-height:22px}
.input,.textarea{
  width:100%;background:rgba(10,16,24,.72);
  border:1px solid #314055;border-radius:15px;
  color:#fff;padding:11px;outline:0;margin:4px 0 8px
}
.textarea{min-height:90px;resize:vertical}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 9px;border-radius:999px;
  background:linear-gradient(135deg,#9c86ff,#547dff);
  font-size:11px;font-weight:950;
  box-shadow:0 0 17px #806cff66
}
.premiummark{
  width:23px;height:23px;border-radius:50%;
  display:inline-grid;place-items:center;
  background:radial-gradient(circle,#eee7ff,#8068ff 54%,#33238f);
  box-shadow:0 0 13px #8977ff;font-weight:1000
}
.modal{
  position:fixed;inset:0;background:#000b;z-index:50;
  display:none;align-items:flex-end;padding:8px
}
.modal.on{display:flex}
.sheet{
  width:min(720px,100%);max-height:92dvh;
  overflow:auto;background:rgba(16,25,35,.88);
  border:1px solid rgba(100,125,155,.35);
  border-radius:28px;padding:16px;
  backdrop-filter:blur(28px)
}
.sheethead{
  display:flex;align-items:center;
  justify-content:space-between;margin-bottom:8px
}
.chat{
  position:fixed;inset:0;z-index:40;background:#080d14;
  display:none;flex-direction:column
}
.chat.on{display:flex}
.chathead{
  height:66px;display:flex;align-items:center;gap:9px;
  padding:8px;background:rgba(17,26,36,.78);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(22px)
}
.messages{flex:1;overflow:auto;padding:13px}
.msg{
  max-width:80%;width:max-content;
  background:rgba(23,36,52,.88);
  border:1px solid #2d3c50;
  border-radius:18px;padding:8px 11px;margin:6px 0;
  position:relative
}
.msg.mine{
  margin-right:auto;background:rgba(77,62,155,.92);
  border-color:#6d5bc3
}
.msg img{max-width:260px;border-radius:13px;display:block}
.msg.emoji-message{
  background:transparent!important;
  border:0!important;padding:3px!important
}
.msg.emoji-message img{
  width:72px;height:72px;max-width:72px;max-height:72px;
  object-fit:contain;border-radius:0
}
.msg .gift-message{display:flex;align-items:center;gap:9px;font-weight:800}
.msg .gift-icon{font-size:36px}
.reply-box{
  border-right:3px solid #9b89ff;
  background:#ffffff12;padding:6px 8px;
  border-radius:9px;margin-bottom:6px;
  font-size:12px
}
.reactionbar{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.reaction{
  background:#ffffff12;border:1px solid #ffffff16;
  padding:3px 7px;border-radius:999px;font-size:12px
}
.message-actions{
  display:flex;gap:6px;flex-wrap:wrap;margin-top:7px
}
.message-actions button{
  font-size:11px;padding:5px 8px
}
.composer{
  display:flex;gap:6px;padding:8px;
  border-top:1px solid var(--line);
  background:rgba(14,21,31,.82);
  backdrop-filter:blur(22px)
}
.composer input{
  flex:1;min-width:0;background:#182331;
  border:1px solid #314055;border-radius:18px;
  color:#fff;padding:10px;outline:0
}
.toast{
  position:fixed;top:14px;left:50%;
  transform:translateX(-50%);z-index:100;
  background:rgba(23,34,48,.94);border:1px solid #40506a;
  border-radius:15px;padding:10px 15px;
  display:none;max-width:90%;text-align:center;
  backdrop-filter:blur(20px)
}
.toast.on{display:block}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.login{
  position:fixed;inset:0;
  background:
    radial-gradient(circle at 50% 0,#221c4b,#080c13 55%);
  z-index:200;display:grid;place-items:center;padding:20px
}
.login.hide{display:none}
.loginbox{
  width:min(440px,100%);background:rgba(17,25,35,.8);
  border:1px solid #35445a;border-radius:30px;
  padding:24px;text-align:center;
  box-shadow:0 20px 80px #0009;
  backdrop-filter:blur(28px)
}
.logoBig{font-size:42px;font-weight:1000}
.spinner{
  width:17px;height:17px;border:2px solid #ffffff55;
  border-top-color:#fff;border-radius:50%;
  display:inline-block;animation:spin .7s linear infinite;
  vertical-align:middle
}
@keyframes spin{to{transform:rotate(360deg)}}
.color{
  width:43px;height:43px;border-radius:50%;
  border:2px solid #fff3
}
.colors{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stat{font-size:22px;font-weight:950}
.shopItem{text-align:center}
.emojiBox{
  display:grid;place-items:center;height:90px;
  border-radius:18px;background:#0b111a;
  border:1px solid var(--line);overflow:hidden
}
.emojiBox img{max-width:80px;max-height:80px}
.verified{color:#65e0a4;font-weight:900}
.coverPreview{
  height:100px;border-radius:18px;
  background-size:cover;background-position:center;margin:8px 0
}
.emoji-picker{
  display:grid;grid-template-columns:repeat(6,1fr);
  gap:7px;max-height:55dvh;overflow:auto
}
.emoji-picker-item{
  min-height:58px;background:#0b111a;
  border:1px solid #2d3c50;border-radius:15px;
  display:flex;align-items:center;justify-content:center;
  padding:5px;font-size:30px
}
.emoji-picker-item:active{transform:scale(.94)}
.emoji-tabs{
  display:flex;gap:5px;overflow:auto;margin-bottom:9px
}
.emoji-tab{
  white-space:nowrap;background:#ffffff0b;
  border:1px solid #ffffff12;border-radius:12px;padding:7px 10px
}
.emoji-tab.on{background:#7662ff44}
.wallet{
  background:linear-gradient(135deg,#5745c7,#2a75d7);
  border-radius:23px;padding:20px;
  box-shadow:0 15px 45px #4e43c755
}
.walletBalance{font-size:34px;font-weight:1000}
.settingsRow{
  display:flex;align-items:center;gap:12px;
  padding:13px 5px;border-bottom:1px solid #ffffff0c
}
.settingsIcon{
  width:42px;height:42px;border-radius:14px;
  display:grid;place-items:center;
  background:#ffffff0d;font-size:21px
}
.settingsRow:last-child{border-bottom:0}
.linkbox{
  background:#080e16;border:1px solid #314055;
  border-radius:14px;padding:10px;word-break:break-all;
  direction:ltr;text-align:left
}

/* ÀVanta Glass Refresh */
:root{--accent:#36e0a0;--accent2:#27bfff;--green:#36e0a0;--blue:#27bfff;--bg:#050b0c;--panel:rgba(12,25,24,.66);--glass:rgba(10,28,27,.58);--glass2:rgba(14,39,46,.52);--line:rgba(100,240,205,.18)}
html,body{background:radial-gradient(circle at 8% 0,#0c5a4c55,transparent 30%),radial-gradient(circle at 100% 10%,#1265a855,transparent 32%),radial-gradient(circle at 50% 100%,#064c3c44,transparent 35%),var(--bg)}
#app{background:rgba(3,12,12,.62)}
.top{background:rgba(6,22,21,.58);border-bottom-color:rgba(90,235,190,.18)}
.brand{font-size:24px;letter-spacing:.5px;text-shadow:0 0 20px #36e0a066;font-family:Georgia,serif}
.brand b,.logoBig b{color:#36e0a0}
.card,.row{background:linear-gradient(145deg,rgba(20,53,49,.54),rgba(9,25,34,.48));border-color:rgba(95,235,205,.18);box-shadow:0 14px 45px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.05)}
.btn{background:rgba(15,35,39,.62);border-color:rgba(100,230,210,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.primary{background:linear-gradient(135deg,#20b987,#168bd8);border-color:#43e3b2}
.search,.input,.textarea{background:rgba(5,20,22,.58);border-color:rgba(100,230,210,.18)}
.bottom{background:rgba(7,25,27,.62);border-color:rgba(90,230,200,.2)}
.bottom button.on{background:linear-gradient(135deg,#22b98922,#1caee022);color:#fff}
.chat{background:radial-gradient(circle at 0 0,#0d403855,transparent 30%),#050c0d}
.chathead,.composer{background:rgba(7,25,27,.65);border-color:rgba(100,230,210,.16)}
.composer input{background:rgba(11,29,33,.7);border-color:rgba(100,230,210,.18)}
.msg{background:linear-gradient(145deg,rgba(24,55,55,.76),rgba(12,34,40,.7));border-color:rgba(100,230,210,.16);border-radius:20px 20px 20px 7px;backdrop-filter:blur(18px)}
.msg.mine{background:linear-gradient(145deg,rgba(24,130,102,.82),rgba(20,104,153,.78));border-color:rgba(110,240,210,.3);border-radius:20px 20px 7px 20px}
.avatar{background:linear-gradient(135deg,#1acb91,#20aee8)!important;box-shadow:0 8px 24px #16c89a22}
.cover{background:linear-gradient(135deg,#0b765d,#0874ad)}
.login{background:radial-gradient(circle at 50% 0,#0d5a4d,#061013 55%)}
.loginbox{background:rgba(8,28,29,.68);border-color:rgba(100,240,205,.22);box-shadow:0 25px 100px #000b,inset 0 1px 0 #ffffff12}
.logoBig{font-family:Georgia,serif;letter-spacing:-2px;text-shadow:0 0 28px #32dfaa55}
.explore-hero{position:relative;overflow:hidden}.explore-hero:after{content:"ÀVanta";position:absolute;left:18px;bottom:8px;font:900 38px Georgia,serif;color:#36e0a012;transform:rotate(-8deg);pointer-events:none}
.inline-premium-emoji{width:25px;height:25px;object-fit:contain;vertical-align:middle;display:inline-block;margin:0 2px}.message-text{white-space:pre-wrap;word-break:break-word}
.post-card{background:linear-gradient(145deg,rgba(16,43,42,.7),rgba(10,28,37,.62));border:1px solid rgba(100,230,210,.18);border-radius:24px;padding:15px;margin:10px 0;backdrop-filter:blur(20px);box-shadow:0 15px 45px #0003}.post-text{font-size:17px;line-height:1.8;margin:10px 0}.post-image{width:100%;max-height:440px;object-fit:cover;border-radius:18px;display:block}

@media(max-width:500px){
  .top{gap:6px}.brand{font-size:18px}
  .btn{padding:9px 10px}
  .emoji-picker{grid-template-columns:repeat(5,1fr)}
}
</style>
</head>

<body>

<div id="toast" class="toast"></div>

<div id="login" class="login">
  <div class="loginbox">
    <div class="logoBig">À<b>Vanta</b></div>
    <div class="muted" style="margin-bottom:22px">Messenger</div>

    <button id="googleLogin" class="btn primary full">🔵 ورود با Google</button>

    <div id="loginStatus" class="muted small" style="margin-top:12px"></div>
  </div>
</div>

<div id="app">

<header class="top">
  <div class="brand">À<b>Vanta</b></div>
  <input id="search" class="search" placeholder="جستجوی چت یا مخاطب">
  <button id="newBtn" class="btn primary">＋</button>
</header>

<main>

<section id="chatsPage" class="page on">
  <div class="card">
    <div class="title">Chats</div>
    <div class="muted small">پیام‌ها، گروه‌ها و کانال‌ها</div>
  </div>
  <div id="chatList"></div>
</section>

<section id="explorePage" class="page">
  <div class="card explore-hero">
    <div class="title">Explore</div>
    <div class="muted small">پست‌های منتشرشده در ÀVanta</div>
    <button id="newPostBtn" class="btn primary full">＋ ساخت پست</button>
  </div>
  <div id="exploreList"></div>
</section>

<section id="contactsPage" class="page">
  <div class="card">
    <div class="title">مخاطبین</div>
    <input id="contactInput" class="input" placeholder="UID یا username">
    <button id="findContact" class="btn primary full">افزودن مخاطب</button>
  </div>
  <div id="contactsList"></div>
</section>

<section id="settingsPage" class="page">

  <div class="card">
    <div class="title">Settings</div>

    <div class="settingsRow">
      <div class="settingsIcon">👤</div>
      <div class="grow">
        <b>Edit Info</b>
        <div class="muted small">نام، Username و Bio</div>
      </div>
      <button id="editInfo" class="btn">›</button>
    </div>

    <div class="settingsRow">
      <div class="settingsIcon">🖼️</div>
      <div class="grow"><b>Set Photo</b></div>
      <button id="setPhoto" class="btn">›</button>
    </div>

    <div class="settingsRow">
      <div class="settingsIcon">🎨</div>
      <div class="grow"><b>Profile Colour</b></div>
      <button id="profileColor" class="btn">›</button>
    </div>

    <div class="settingsRow">
      <div class="settingsIcon">✨</div>
      <div class="grow"><b>Premium Name Emoji</b></div>
      <button id="nameEmoji" class="btn">›</button>
    </div>

    <div class="settingsRow">
      <div class="settingsIcon">⭕</div>
      <div class="grow"><b>Stories</b></div>
      <button id="storyBtn" class="btn">›</button>
    </div>

    <div class="settingsRow">
      <div class="settingsIcon">💎</div>
      <div class="grow"><b>ÀVanta Premium</b></div>
      <button id="premiumBtn" class="btn">›</button>
    </div>

    <div class="settingsRow">
      <div class="settingsIcon">🔖</div>
      <div class="grow"><b>Saved Messages</b></div>
      <button id="savedBtn" class="btn">›</button>
    </div>

    <button id="adminBtn" class="btn primary full" style="display:none">
      ⚡ Admin Panel
    </button>

    <button id="logoutBtn" class="btn danger full">خروج</button>
  </div>

  <div class="card">
    <div class="title">Create</div>
    <div class="grid2">
      <button id="groupBtn" class="btn primary">👥 Group</button>
      <button id="channelBtn" class="btn primary">📢 Channel</button>
      <button id="gifMakerBtn" class="btn">GIF</button>
    </div>
  </div>

</section>

<section id="profilePage" class="page">

  <div class="card">
    <div id="profileCover" class="cover"></div>

    <div style="text-align:center">
      <div id="bigAvatar"></div>

      <h2 id="profileName" style="margin:6px 0"></h2>
      <div id="profileUsername" class="muted"></div>
      <div id="profileBadges" style="margin:10px"></div>
      <div id="profileBio" class="muted"></div>

      <div class="grid3" style="margin-top:15px">
        <button id="profileEdit" class="btn primary">Edit Info</button>
        <button id="profilePhoto" class="btn">Set Photo</button>
        <button id="profileMore" class="btn">•••</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="title">Stories</div>
    <div id="storyList" class="empty">هنوز Storyای نیست.</div>
  </div>

</section>

</main>

<nav class="bottom">
  <button data-page="explorePage"><span class="navico">✦</span>اکسپلور</button>
  <button data-page="contactsPage">
    <span class="navico">♙</span>مخاطبین
  </button>
  <button data-page="chatsPage" class="on">
    <span class="navico">◌</span>چت‌ها
  </button>
  <button data-page="settingsPage">
    <span class="navico">⚙</span>تنظیمات
  </button>
  <button data-page="profilePage">
    <span class="navico">◎</span>پروفایل
  </button>
</nav>

</div>

<input id="photoFile" type="file" accept="image/*" hidden>
<input id="coverFile" type="file" accept="image/*" hidden>
<input id="storyFile" type="file" accept="image/*,video/*" hidden>
<input id="gifFile" type="file" accept="image/gif" hidden>
<input id="postImageFile" type="file" accept="image/*" hidden>

<div id="modal" class="modal">
  <div class="sheet">
    <div class="sheethead">
      <h3 id="modalTitle">ÀVanta</h3>
      <button id="closeModal" class="btn">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div id="chat" class="chat">

<header class="chathead">
  <button id="backChat" class="btn">‹</button>
  <div id="chatAvatar" class="avatar">A</div>

  <div class="grow">
    <b id="chatTitle">Chat</b>
    <div id="chatSub" class="muted small"></div>
  </div>

  <button id="chatMenu" class="btn">•••</button>
</header>

<div id="messages" class="messages"></div>

<div class="composer">
  <button id="chatEmoji" class="btn" title="Emoji">😊</button>
  <button id="chatGif" class="btn">GIF</button>
  <input id="messageInput" placeholder="پیام...">
  <button id="sendMessage" class="btn primary">➤</button>
</div>

</div>

/* =========================================================
   USERNAME
========================================================= */

async function claimUsername(uid,username,oldUsername=""){
  const n=normId(username);

  if(!n||n.length<3){
    throw Object.assign(
      new Error("Username must be at least 3 characters"),
      {code:"username/invalid"}
    );
  }

  const old=normId(oldUsername);

  if(old===n)return n;

  const rr=ref(db,"usernames/"+n);

  const tx=await runTransaction(
    rr,
    current=>{
      if(current===null)return uid;
      if(current===uid)return uid;
      return;
    }
  );

  if(!tx.committed){
    throw Object.assign(
      new Error("Username already taken"),
      {code:"username/taken"}
    );
  }

  if(old&&old!==n){
    const oldRef=ref(db,"usernames/"+old);
    const os=await get(oldRef);

    if(os.exists()&&os.val()===uid){
      await remove(oldRef);
    }
  }

  return n;
}

async function claimCommunityUsername(
  chatId,
  username,
  oldUsername=""
){
  const n=normId(username);
  if(!n)return "";

  const rr=ref(db,"communityUsernames/"+n);

  const tx=await runTransaction(
    rr,
    current=>{
      if(current===null)return chatId;
      if(current===chatId)return chatId;
      return;
    }
  );

  if(!tx.committed){
    throw Object.assign(
      new Error("Community username already taken"),
      {code:"community/username-taken"}
    );
  }

  const old=normId(oldUsername);

  if(old&&old!==n){
    const or=ref(db,"communityUsernames/"+old);
    const os=await get(or);

    if(os.exists()&&os.val()===chatId){
      await remove(or);
    }
  }

  return n;
}

function communityLink(username,id){
  const slug=normId(username);
  return location.origin+
    location.pathname+
    "?join="+
    encodeURIComponent(slug||id);
}

async function joinFromLink(){
  const raw=new URLSearchParams(location.search).get("join");

  if(!raw||!user)return;

  try{
    const q=normId(raw);

    let chatId=q
      ?(await get(
          ref(db,"communityUsernames/"+q)
        )).val()
      :null;

    if(!chatId)chatId=raw;

    const cs=await get(ref(db,"chats/"+chatId));

    if(!cs.exists()){
      toast("لینک گروه یا کانال معتبر نیست");
      return;
    }

    const meta=cs.val();

    if(meta.type!=="group"&&meta.type!=="channel"){
      return;
    }

    await set(
      ref(db,`chatMembers/${chatId}/${user.uid}`),
      {
        role:meta.owner===user.uid?"owner":"member",
        joinedAt:Date.now()
      }
    );

    await set(
      ref(db,`userChats/${user.uid}/${chatId}`),
      meta
    );

    history.replaceState({}, "", location.pathname);

    toast("با موفقیت وارد شدی");
    startChatSubscription();

  }catch(e){
    toast(friendlyError(e));
  }
}

========================================================= */

async function findUser(q){

  q=q.replace(/^@/,"").trim();

  const direct=await get(ref(db,"users/"+q));

  if(direct.exists()){
    return {
      uid:q,
      ...direct.val()
    };
  }

  const s=await get(ref(db,"users"));

  for(
    const [uid,p]
    of Object.entries(s.val()||{})
  ){
    if(
      String(p.username||"").toLowerCase()===
      q.toLowerCase()
    ){
      return {
        uid,
        ...p
      };
    }
  }

  return null;
}

/* =========================================================
   SEND TEXT
========================================================= */

async function sendMessage(){

  if(chatMeta?.type==="group" || chatMeta?.type==="channel"){
    const ms=await get(ref(db,`chatMembers/${activeChat}/${user.uid}`));
    const mem=ms.val();
    if(mem?.banned){ return toast("دسترسی شما به این گپ محدود شده است"); }
  }

  const v=$("messageInput")
    .value
    .trim();

  if(!v||!activeChat)return;

  try{

    const msg={
      uid:user.uid,
      name:profile.name,
      text:v,
      createdAt:Date.now()
    };

    const peMatch=v.match(/\[\[PE:([^\]]+)\]\]/);
    if(peMatch){
      const pe=(premiumEmojisLoaded?premiumEmojisCache:[]).find(x=>String(x.id||"")===peMatch[1]);
      if(pe) msg.premiumInline={id:pe.id,name:pe.name||"Premium Emoji",data:pe.data,type:pe.type||"image/png"};
    }

    if(replyTo){
      msg.replyTo={
        id:replyTo.id,
        uid:replyTo.uid,
        name:replyTo.name,
        text:replyTo.text||""
      };
    }

    await set(
      push(ref(db,`messages/${activeChat}`)),
      msg
    );

    await update(
      ref(db,`chats/${activeChat}`),
      {
        lastMessage:v,
        updatedAt:Date.now()
      }
    );

    await update(
      ref(db,`userChats/${user.uid}/${activeChat}`),
      {
        lastMessage:v,
        updatedAt:Date.now()
      }
    );

    $("messageInput").value="";
    replyTo=null;

  }catch(e){
    toast(friendlyError(e));
  }
}

$("sendMessage").onclick=sendMessage;

$("messageInput").onkeydown=e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
};

   MESSAGE RENDER
========================================================= */

function renderMessage(m,id){

  const mine=m.uid===user.uid;

  let content="";

  if(m.premiumEmoji){

    const src=
      m.premiumEmoji.data||
      m.premiumEmoji.src||
      "";

    content=src
      ?`<img src="${esc(src)}" alt="${esc(m.premiumEmoji.name||"Emoji")}">`
      :esc(m.premiumEmoji.fallback||"😊");

  }else if(m.gif){

    content=`
      <img
        src="${esc(m.gif)}"
        alt="GIF"
      >
    `;

  }else{

    let safeText=esc(m.text||"");
    if(m.premiumInline?.data){
      const token=esc(`[[PE:${m.premiumInline.id||""}]]`);
      const img=`<img class="inline-premium-emoji" src="${esc(m.premiumInline.data)}" alt="${esc(m.premiumInline.name||"Premium Emoji")}">`;
      safeText=safeText.replace(token,img);
    }
    content=`<div class="message-text">${safeText}</div>`;
  }

  const reply=m.replyTo
    ?`
      <div class="reply-box">
        ↩ ${esc(m.replyTo.name||"")}
        <br>
        ${esc(m.replyTo.text||"")}
      </div>
    `
    :"";

  const reactions=Object.entries(m.reactions||{})
    .map(([emoji,count])=>
      `<span class="reaction">${esc(emoji)} ${count}</span>`
    ).join("");

  return `
    <div
      class="msg ${mine?"mine":""} ${
        m.premiumEmoji?"emoji-message":""
      }"
      data-message-id="${esc(id)}"
    >

      ${reply}
      ${content}

      ${
        reactions
        ?`<div class="reactionbar">${reactions}</div>`
        :""
      }

      <div class="message-actions">

        <button
          class="btn replyMsg"
          data-id="${esc(id)}"
        >↩ Reply</button>

        <button
          class="btn reactMsg"
          data-id="${esc(id)}"
        >😊</button>

        ${
          (mine&&m.text)
          ?`
            <button class="btn editMsg" data-id="${esc(id)}">✏️</button>
          ` : ""
        }

        ${(ownerUser() || (chatMeta?.type==="group" || chatMeta?.type==="channel") && chatMeta?.owner===user.uid)
          ?`<button class="btn danger deleteMsg" data-id="${esc(id)}">🗑️ حذف</button>`
          : (mine ? `<button class="btn danger deleteMsg" data-id="${esc(id)}">🗑️ حذف</button>` : "")
        }

      </div>

    </div>
  `;
}


/* =========================================================
   LIVE MESSAGES
========================================================= */

function subscribeMessages(){

  if(window.msgUnsub){
    window.msgUnsub();
  }

  window.msgUnsub=
    onValue(
      ref(db,`messages/${activeChat}`),
      s=>{

        const entries=
          Object.entries(s.val()||{})
          .sort(
            (a,b)=>
              (a[1].createdAt||0)-
              (b[1].createdAt||0)
          );

        const box=$("messages");

        box.innerHTML=
          entries.length
          ?""
          :`
            <div class="empty">
              هنوز پیامی نیست.
            </div>
          `;

        entries.forEach(([id,m])=>{
          box.insertAdjacentHTML(
            "beforeend",
            renderMessage(m,id)
          );
        });

        box.querySelectorAll(".replyMsg")
          .forEach(b=>{
            b.onclick=()=>{
              const id=b.dataset.id;
              const entry=entries.find(x=>x[0]===id);
              if(!entry)return;

              replyTo={
                id,
                ...entry[1]
              };

              $("messageInput").placeholder=
                "↩ پاسخ به "+
                (entry[1].name||"پیام")+"...";

              $("messageInput").focus();
            };
          });

        box.querySelectorAll(".reactMsg")
          .forEach(b=>{
            b.onclick=()=>{
              openReactionPicker(b.dataset.id);
            };
          });

        box.querySelectorAll(".deleteMsg")
          .forEach(b=>{
            b.onclick=async()=>{
              try{
                await remove(
                  ref(
                    db,
                    `messages/${activeChat}/${b.dataset.id}`
                  )
                );
                toast("پیام حذف شد");
              }catch(e){
                toast(friendlyError(e));
              }
            };
          });

        box.querySelectorAll(".editMsg")
          .forEach(b=>{
            b.onclick=async()=>{

              const entry=
                entries.find(x=>x[0]===b.dataset.id);

              if(!entry)return;

              const old=entry[1].text||"";

              const nv=prompt(
                "ویرایش پیام",
                old
              );

              if(nv===null)return;

              const value=nv.trim();

              if(!value)return;

              try{
                await update(
                  ref(
                    db,
                    `messages/${activeChat}/${b.dataset.id}`
                  ),
                  {
                    text:value,
                    edited:true,
                    editedAt:Date.now()
                  }
                );

                toast("پیام ویرایش شد");

              }catch(e){
                toast(friendlyError(e));
              }
            };
          });

        box.scrollTop=box.scrollHeight;
      }
    );
}

/* =========================================================
   PROFILE SAVE
========================================================= */

async function saveProfile(fields){

  if(fields.username!==undefined){

    const desired=normId(fields.username);

    if(!desired){
      throw new Error("Username نامعتبر است");
    }

    const claimed=
      await claimUsername(
        user.uid,
        desired,
        profile.username||""
      );

    fields={
      ...fields,
      username:claimed
    };
  }

  await update(
    ref(db,"users/"+user.uid),
    fields
  );

  profile={
    ...profile,
    ...fields
  };

  renderProfile();
}

async function createCommunity(type){

  modal(
    type==="group"
    ?"Create Group"
    :"Create Channel",

    `
      <input
        id="communityName"
        class="input"
        placeholder="Name"
      >

      <input
        id="communityUsername"
        class="input"
        placeholder="Username / Link"
      >

      <textarea
        id="communityBio"
        class="textarea"
        placeholder="Description"
      ></textarea>

      <button
        id="createCommunity"
        class="btn primary full"
      >
        Create
      </button>
    `
  );

  $("createCommunity").onclick=async()=>{

    const name=
      $("communityName")
      .value
      .trim();

    if(!name){
      return toast("نام را وارد کن");
    }

    const raw=
      $("communityUsername")
      .value
      .trim();

    try{

      const id=
        push(ref(db,"chats")).key;

      const uname=
        normId(raw)||
        ("avanta_"+id.slice(0,8));

      const finalName=
        await claimCommunityUsername(
          id,
          uname
        );

      const meta={
        name,
        type,
        username:finalName,
        bio:$("communityBio").value,
        owner:user.uid,
        updatedAt:Date.now(),
        inviteLink:communityLink(
          finalName,
          id
        )
      };

      await set(
        ref(db,`chats/${id}`),
        meta
      );

      await set(
        ref(
          db,
          `chatMembers/${id}/${user.uid}`
        ),
        {
          role:"owner",
          joinedAt:Date.now()
        }
      );

      await set(
        ref(
          db,
          `userChats/${user.uid}/${id}`
        ),
        meta
      );

      closeModal();
      startChatSubscription();

      modal(
        type==="group"
        ?"گروه ساخته شد"
        :"کانال ساخته شد",

        `
          <div class="card">

            <div class="title">
              ${esc(name)}
            </div>

            <div class="muted">
              لینک ${type==="group"?"گروه":"کانال"}:
            </div>

            <div class="linkbox">
              ${esc(meta.inviteLink)}
            </div>

            <button
              id="copyCommunityLink"
              class="btn primary full"
            >
              کپی لینک
            </button>

            <button
              id="openCreatedChat"
              class="btn full"
            >
              باز کردن
            </button>

          </div>
        `
      );

      $("copyCommunityLink").onclick=async()=>{

        try{
          await navigator.clipboard.writeText(
            meta.inviteLink
          );
          toast("لینک کپی شد");
        }catch(e){
          toast(meta.inviteLink);
        }
      };

      $("openCreatedChat").onclick=()=>{
        closeModal();
        openChat({
          id,
          ...meta
        });
      };

    }catch(e){
      toast(friendlyError(e));
    }
  };
}

      .sort((a,b)=>(b.approvedAt||b.createdAt||0)-(a.approvedAt||a.createdAt||0));
    box.innerHTML=posts.length?posts.map(x=>`
      <article class="post-card">
        <div class="row" style="background:transparent;border:0;padding:0;margin:0">
          ${avatar({name:x.authorName,photo:x.authorPhoto,profileColor:x.authorColor})}
          <div class="grow"><b>${esc(x.authorName||"ÀVanta User")}</b><div class="muted small">@${esc(x.authorUsername||"")}</div></div>
        </div>
        <div class="post-text">${esc(x.text||"")}</div>
        ${x.image?`<img class="post-image" src="${esc(x.image)}" alt="">`:""}
        <div class="muted small">${new Date(x.approvedAt||x.createdAt||Date.now()).toLocaleString("fa-IR")}</div>
      </article>`).join("") : `<div class="empty">هنوز پستی منتشر نشده.</div>`;
  }catch(e){ box.innerHTML=`<div class="empty">${esc(friendlyError(e))}</div>`; }
}

$("newPostBtn").onclick=()=>{
  modal("ساخت پست",`
    <textarea id="postText" class="textarea" placeholder="چی می‌خوای منتشر کنی؟"></textarea>
    <button id="postImagePick" class="btn full">🖼️ افزودن عکس</button>
    <div id="postImagePreview" class="coverPreview"></div>
    <button id="submitPost" class="btn primary full">ارسال برای بررسی</button>
  `);
  let image="";
  $("postImagePick").onclick=()=>$("postImageFile").click();
  $("postImageFile").onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    if(f.size>2500000)return toast("عکس حداکثر 2.5MB");
    const r=new FileReader(); r.onload=()=>{image=r.result;$("postImagePreview").style.backgroundImage=`url("${image}")`;}; r.readAsDataURL(f);
  };
  $("submitPost").onclick=async()=>{
    const text=$("postText").value.trim();
    if(!text&&!image)return toast("متن یا عکس لازم است");
    try{
      const id=push(ref(db,"pendingPosts")).key;
      await set(ref(db,`pendingPosts/${id}`),{uid:user.uid,authorName:profile.name,authorUsername:profile.username||"",authorPhoto:profile.photo||"",authorColor:profile.profileColor||"#36e0a0",text,image,createdAt:Date.now()});
      closeModal(); toast("پست برای بررسی ادمین ارسال شد");
    }catch(e){toast(friendlyError(e));}
  };
};

/* =========================================================
   ADMIN EMOJI BUILDER
========================================================= */

function openAdminEmojiBuilder(){

  if(!ownerUser()){
    return toast(
      "دسترسی فقط برای Admin است"
    );
  }

  modal(
    "Premium Emoji Builder",
    `
      <p class="muted small">
        تصویر را انتخاب کن؛
        به Base64 تبدیل و در Firebase ذخیره می‌شود.
      </p>

      <input
        id="emojiName"
        class="input"
        placeholder="نام Emoji"
      >

      <input
        id="emojiFileAdmin"
        type="file"
        accept="image/*"
        class="input"
      >

      <input
        id="emojiId"
        class="input"
        placeholder="ID اختیاری"
      >

      <button
        id="savePremiumEmoji"
        class="btn primary full"
      >
        ساخت Emoji
      </button>

      <div
        id="emojiPreview"
        class="emojiBox"
      >
        Preview
      </div>
    `
  );

  $("emojiFileAdmin").onchange=async()=>{

    const f=
      $("emojiFileAdmin")
      .files[0];

    if(!f)return;

    if(f.size>700000){
      toast(
        "برای Base64 بهتر است تصویر زیر 700KB باشد"
      );
      return;
    }

    try{

      const data=await fileData(f);

      $("emojiPreview").innerHTML=
        `<img src="${esc(data)}" alt="">`;

    }catch(e){
      toast(friendlyError(e));
    }
  };

  $("savePremiumEmoji").onclick=async()=>{

    try{

      const f=
        $("emojiFileAdmin")
        .files[0];

      const name=
        $("emojiName")
        .value
        .trim();

      if(!f||!name){
        return toast(
          "نام و تصویر لازم است"
        );
      }

      if(f.size>700000){
        return toast(
          "تصویر باید زیر 700KB باشد"
        );
      }

      const data=await fileData(f);

      const id=
        $("emojiId").value.trim()||
        push(ref(db,"premiumEmojis")).key;

      await set(
        ref(
          db,
          `premiumEmojis/${id}`
        ),
        {
          id,
          name,
          data,
          type:f.type,
          createdAt:Date.now(),
          owner:user.uid
        }
      );

      premiumEmojisLoaded=false;
      premiumEmojisCache=[];

      closeModal();
      toast("Premium Emoji ساخته شد");

    }catch(x){
      toast(friendlyError(x));
    }
  };
}


/* =========================================================
   ADMIN PANEL
========================================================= */

$("adminBtn").onclick=()=>{

  if(user.uid!==ADMIN_UID)return;

  modal(
    "ÀVANTA ADMIN",
    `
      <div class="grid2">
        <button id="adminPosts" class="btn primary">📝 پست‌های در انتظار</button>
        <button id="adminMessages" class="btn">🗑️ مدیریت پیام‌ها</button>
      </div>
    `
  );



  $("adminPosts").onclick=async()=>{
    const snap=await get(ref(db,"pendingPosts"));
    const posts=Object.entries(snap.val()||{});
    modal("پست‌های در انتظار", posts.length ? posts.map(([id,x])=>`
      <div class="post-card">
        <div class="muted small">${esc(x.authorName||"کاربر")} · ${new Date(x.createdAt||Date.now()).toLocaleString("fa-IR")}</div>
        <div class="post-text">${esc(x.text||"")}</div>
        ${x.image?`<img class="post-image" src="${esc(x.image)}" alt="">`:""}
        <div class="grid2">
          <button class="btn primary approvePost" data-id="${esc(id)}">انتشار</button>
          <button class="btn danger rejectPost" data-id="${esc(id)}">رد</button>
        </div>
      </div>`).join("") : `<div class="empty">پست در انتظاری نیست.</div>`);
    document.querySelectorAll(".approvePost").forEach(b=>b.onclick=async()=>{
      const id=b.dataset.id; const ps=await get(ref(db,`pendingPosts/${id}`)); const x=ps.val(); if(!x)return;
      await set(ref(db,`posts/${id}`),{...x,approvedAt:Date.now(),approvedBy:user.uid});
      await remove(ref(db,`pendingPosts/${id}`)); toast("پست منتشر شد"); closeModal(); renderExplore();
    });
    document.querySelectorAll(".rejectPost").forEach(b=>b.onclick=async()=>{ await remove(ref(db,`pendingPosts/${b.dataset.id}`)); toast("پست رد شد"); closeModal(); });
  };

  $("adminMessages").onclick=()=>{
    if(!activeChat)return toast("اول یک چت را باز کن");
    closeModal();
    toast("در چت، حذف پیام برای ادمین فعال است");
  };

};


/* =========================================================
   CHAT MENU
========================================================= */

$("chatMenu").onclick=()=>{

  modal(
    "Chat",
    `
      <div class="grid2">
        ${(chatMeta?.type==="group"||chatMeta?.type==="channel")&&chatMeta?.owner===user.uid ? `<button id="communityLinkBtn" class="btn primary">🔗 لینک گپ</button><button id="communityBanBtn" class="btn danger">🚫 بن کاربر</button>` : ""}

        <button
          id="clearChat"
          class="btn danger"
        >
          Clear
        </button>

        <button
          id="shareChat"
          class="btn"
        >
          Share
        </button>

        <button
          id="closeChatMenu"
          class="btn"
        >
          Close
        </button>

      </div>
    `
  );

  const cl=$("communityLinkBtn");
  if(cl)cl.onclick=async()=>{
    const link=chatMeta?.inviteLink||communityLink(chatMeta?.username,activeChat);
    try{await navigator.clipboard.writeText(link);toast("لینک گپ کپی شد");}catch(e){toast(link);}
  };
  const cb=$("communityBanBtn");
  if(cb)cb.onclick=async()=>{
    const uid=prompt("UID کاربری که می‌خواهی بن کنی:"); if(!uid)return;
    await update(ref(db,`chatMembers/${activeChat}/${uid}`),{banned:true,bannedAt:Date.now(),bannedBy:user.uid});
    toast("کاربر بن شد");
  };

  $("clearChat").onclick=async()=>{

    if(!activeChat)return;
    const canClear=ownerUser() || ((chatMeta?.type==="group"||chatMeta?.type==="channel") && chatMeta?.owner===user.uid);
    if(!canClear)return toast("فقط ادمین/مالک گپ می‌تواند پیام‌ها را پاک کند");

    try{

      await set(
        ref(
          db,
          `messages/${activeChat}`
        ),
        null
      );

      closeModal();
      toast("پیام‌ها پاک شدند");

    }catch(x){
      toast(friendlyError(x));
    }
  };

  $("shareChat").onclick=async()=>{

    const text=
      chatMeta?.name||
      "ÀVanta Chat";

    try{

      if(navigator.share){
        await navigator.share({
          title:text,
          text:"چت در ÀVanta Messenger"
        });
      }else{
        await navigator.clipboard.writeText(text);
        toast("نام چت کپی شد");
      }

    }catch(e){}
  };

  $("closeChatMenu").onclick=
    closeModal;
};


/* =========================================================
   BACK CHAT
========================================================= */

$("backChat").onclick=()=>{

  $("chat").classList.remove("on");

  activeChat=null;
  chatMeta=null;
  replyTo=null;

  $("messageInput").placeholder="پیام...";

  if(window.msgUnsub){
    window.msgUnsub();
    window.msgUnsub=null;
  }
};


/* =========================================================
   BOTTOM NAV
========================================================= */

document
  .querySelectorAll(".bottom button")
  .forEach(b=>{

    b.onclick=()=>{

      document
        .querySelectorAll(".page")
        .forEach(x=>
          x.classList.remove("on")
        );

      $(b.dataset.page)
        .classList.add("on");

      document
        .querySelectorAll(".bottom button")
        .forEach(x=>
          x.classList.toggle(
            "on",
            x===b
          )
        );
    };
  });


/* =========================================================
   SEARCH
========================================================= */

$("search").oninput=e=>{

  const q=
    e.target.value
    .toLowerCase();

  document
    .querySelectorAll(
      "#chatList .row"
    )
    .forEach(x=>{

      x.style.display=
        x.textContent
          .toLowerCase()
          .includes(q)
          ?""
          :"none";
    });
};
