<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="description" content="ÀVanta Messenger">
<title>ÀVanta Messenger</title>

<link rel="manifest" href="data:application/manifest+json,{
  %22name%22:%22ÀVanta Messenger%22,
  %22short_name%22:%22ÀVanta%22,
  %22start_url%22:%22.%22,
  %22display%22:%22standalone%22,
  %22background_color%22:%22%23111318%22,
  %22theme_color%22:%22%23111318%22
}">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

:root{
  --bg:#0e1014;
  --panel:#15181e;
  --panel2:#1b1f27;
  --panel3:#222732;
  --border:rgba(255,255,255,.07);
  --text:#f4f6fa;
  --muted:#9299a7;
  --accent:#7c5cff;
  --accent2:#9a7cff;
  --danger:#ff526d;
  --success:#39d98a;
  --shadow:0 20px 60px rgba(0,0,0,.35);
}

body.light{
  --bg:#f3f5f8;
  --panel:#ffffff;
  --panel2:#f0f2f6;
  --panel3:#e6e9ef;
  --border:rgba(0,0,0,.08);
  --text:#17191d;
  --muted:#69717f;
  --shadow:0 20px 50px rgba(0,0,0,.12);
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  font-family:
    Inter,
    Vazirmatn,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,textarea{
  font:inherit
}

button{
  border:0;
  cursor:pointer;
  color:inherit
}

.hidden{
  display:none!important
}

#app{
  width:100%;
  height:100%;
  display:flex;
  overflow:hidden;
  background:var(--bg);
}

#toast{
  position:fixed;
  z-index:9999;
  left:50%;
  bottom:25px;
  transform:translate(-50%,30px);
  background:#20242d;
  color:white;
  padding:12px 18px;
  border-radius:14px;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  box-shadow:var(--shadow);
  max-width:90%;
  text-align:center;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0)
}

/* AUTH */

#auth{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 20% 20%,rgba(124,92,255,.2),transparent 30%),
    radial-gradient(circle at 80% 80%,rgba(70,180,255,.12),transparent 30%),
    var(--bg);
}

.auth-card{
  width:min(430px,100%);
  background:rgba(21,24,30,.9);
  border:1px solid var(--border);
  border-radius:28px;
  padding:34px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(25px);
  animation:pop .55s cubic-bezier(.2,.8,.2,1);
}

body.light .auth-card{
  background:rgba(255,255,255,.92)
}

.logo{
  font-size:32px;
  font-weight:900;
  letter-spacing:-1.5px;
}

.logo span{
  color:var(--accent)
}

.auth-sub{
  color:var(--muted);
  margin:8px 0 28px;
}

.auth-input{
  width:100%;
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:15px;
  padding:14px 16px;
  outline:0;
  margin-bottom:10px;
  transition:.2s;
}

.auth-input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(124,92,255,.12)
}

.primary{
  width:100%;
  background:var(--accent);
  color:white;
  border-radius:15px;
  padding:14px;
  font-weight:800;
  transition:.2s;
}

.primary:hover{
  transform:translateY(-1px);
  filter:brightness(1.08)
}

.secondary{
  width:100%;
  background:var(--panel2);
  color:var(--text);
  border-radius:15px;
  padding:14px;
  margin-top:10px;
}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--muted);
  margin:18px 0;
  font-size:12px;
}

.divider:before,.divider:after{
  content:"";
  height:1px;
  flex:1;
  background:var(--border)
}

/* APP */

.sidebar{
  width:340px;
  min-width:340px;
  border-left:1px solid var(--border);
  background:var(--panel);
  display:flex;
  flex-direction:column;
  position:relative;
  z-index:10;
}

.sidebar-top{
  padding:17px;
  border-bottom:1px solid var(--border);
}

.top-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.brand-small{
  font-size:22px;
  font-weight:900;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:13px;
  background:var(--panel2);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.2s;
  font-size:18px;
}

.icon-btn:hover{
  background:var(--panel3);
  transform:translateY(-1px)
}

.search{
  margin-top:14px;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:14px;
  padding:11px 14px;
  width:100%;
  color:var(--text);
  outline:none;
}

.chat-list{
  overflow:auto;
  flex:1;
  padding:8px;
}

.chat-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border-radius:16px;
  cursor:pointer;
  transition:.18s;
}

.chat-item:hover{
  background:var(--panel2)
}

.chat-item.active{
  background:rgba(124,92,255,.15)
}

.avatar{
  width:49px;
  height:49px;
  min-width:49px;
  border-radius:50%;
  background:linear-gradient(135deg,#7256ff,#a88cff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  overflow:hidden;
  color:white;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover
}

.chat-info{
  min-width:0;
  flex:1
}

.chat-name{
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.chat-last{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.bottom-nav{
  display:flex;
  border-top:1px solid var(--border);
  padding:8px;
  gap:5px;
}

.bottom-nav button{
  flex:1;
  background:transparent;
  padding:10px 5px;
  color:var(--muted);
  border-radius:13px;
  font-size:11px;
}

.bottom-nav button.active{
  background:var(--panel2);
  color:var(--text)
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  position:relative;
}

.empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:var(--muted);
  gap:8px;
}

.empty strong{
  color:var(--text);
  font-size:22px
}

.chat-header{
  min-height:70px;
  padding:12px 18px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:12px;
  background:rgba(14,16,20,.72);
  backdrop-filter:blur(20px);
  z-index:5;
}

body.light .chat-header{
  background:rgba(255,255,255,.75)
}

.header-info{
  flex:1
}

.header-name{
  font-weight:900
}

.online{
  font-size:12px;
  color:var(--success);
  margin-top:3px
}

.messages{
  flex:1;
  overflow:auto;
  padding:25px clamp(10px,4vw,70px);
  display:flex;
  flex-direction:column;
  gap:6px;
}

.message-row{
  display:flex;
  animation:messageIn .22s ease;
}

.message-row.mine{
  justify-content:flex-start
}

.message{
  max-width:min(620px,80%);
  padding:10px 13px;
  border-radius:18px;
  background:var(--panel2);
  border:1px solid var(--border);
  position:relative;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.mine .message{
  background:linear-gradient(135deg,#7053ee,#6045d8)
}

.message-author{
  font-size:11px;
  font-weight:900;
  color:var(--accent2);
  margin-bottom:4px
}

.mine .message-author{
  color:#e9e2ff
}

.message-text{
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.55
}

.message-time{
  font-size:9px;
  opacity:.6;
  margin-top:4px;
  text-align:left
}

.custom-emoji{
  height:25px;
  width:25px;
  object-fit:contain;
  vertical-align:middle;
  display:inline-block;
}

.emoji-large{
  max-width:130px;
  max-height:130px;
  object-fit:contain;
  display:block;
}

.reply-box{
  border-right:3px solid var(--accent);
  padding-right:8px;
  margin-bottom:7px;
  opacity:.75;
  font-size:11px;
}

.message-actions{
  position:absolute;
  left:-45px;
  top:0;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  display:flex;
  gap:4px;
}

.message:hover .message-actions{
  opacity:1;
  pointer-events:auto
}

.message-actions button{
  width:30px;
  height:30px;
  border-radius:9px;
  background:var(--panel3);
}

.composer-wrap{
  padding:12px 18px 18px;
  border-top:1px solid var(--border);
}

.reply-preview{
  background:var(--panel2);
  border-radius:12px;
  padding:8px 12px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:12px;
}

.composer{
  display:flex;
  align-items:flex-end;
  gap:8px;
}

.message-input{
  flex:1;
  min-height:48px;
  max-height:140px;
  resize:none;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:17px;
  padding:13px 15px;
  color:var(--text);
  outline:none;
}

.message-input:focus{
  border-color:rgba(124,92,255,.5)
}

.send-btn{
  width:48px;
  height:48px;
  border-radius:16px;
  background:var(--accent);
  color:white;
}

/* PANELS */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  backdrop-filter:blur(5px);
}

.modal{
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:24px;
  box-shadow:var(--shadow);
  animation:pop .3s ease;
}

.modal-head{
  padding:18px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-weight:900;
}

.modal-body{
  padding:18px
}

.profile-cover{
  height:150px;
  border-radius:18px;
  margin-bottom:-35px;
  background:linear-gradient(135deg,#7256ff,#c084fc);
}

.profile-center{
  position:relative;
  padding:0 20px 20px;
}

.profile-avatar{
  width:85px;
  height:85px;
  border-radius:27px;
  border:5px solid var(--panel);
  background:var(--panel3);
  margin-bottom:10px;
}

.profile-name{
  font-size:22px;
  font-weight:900
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:4px 8px;
  border-radius:8px;
  background:rgba(124,92,255,.15);
  color:#a78bfa;
  font-size:11px;
  font-weight:900;
  margin-right:5px;
}

.profile-actions{
  display:flex;
  gap:8px;
  margin-top:16px;
}

.profile-actions button{
  flex:1;
  background:var(--panel2);
  border-radius:13px;
  padding:12px;
}

.profile-actions .primary-small{
  background:var(--accent);
  color:white
}

.menu-list{
  display:flex;
  flex-direction:column;
  gap:6px
}

.menu-list button{
  width:100%;
  background:transparent;
  padding:14px;
  border-radius:13px;
  text-align:right;
}

.menu-list button:hover{
  background:var(--panel2)
}

.form-label{
  font-size:12px;
  color:var(--muted);
  margin:14px 0 7px;
  display:block
}

.form-control{
  width:100%;
  padding:12px;
  border-radius:13px;
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
  outline:none
}

.row{
  display:flex;
  gap:8px
}

.row>*{
  flex:1
}

.section{
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:17px;
  padding:15px;
  margin-bottom:10px;
}

.section-title{
  font-weight:900;
  margin-bottom:12px
}

.admin-stat{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.stat{
  padding:15px;
  background:var(--panel2);
  border-radius:14px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:22px
}

.stat small{
  color:var(--muted)
}

/* EMOJI PICKER */

.picker{
  position:absolute;
  bottom:75px;
  right:20px;
  width:min(360px,calc(100vw - 40px));
  max-height:350px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow);
  padding:12px;
  z-index:20;
  overflow:auto;
}

.emoji-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.emoji-grid button{
  aspect-ratio:1;
  border-radius:10px;
  background:transparent;
  font-size:23px;
}

.emoji-grid button:hover{
  background:var(--panel2)
}

/* MOBILE */

.mobile-menu{
  display:none
}

@media(max-width:800px){
  .sidebar{
    width:100%;
    min-width:0;
  }

  .main{
    display:none
  }

  #app.chat-open .sidebar{
    display:none
  }

  #app.chat-open .main{
    display:flex
  }

  .mobile-menu{
    display:flex
  }

  .message{
    max-width:88%
  }

  .message-actions{
    display:none
  }

  .chat-header{
    padding:10px
  }

  .messages{
    padding:15px 10px
  }

  .composer-wrap{
    padding:8px
  }
}

@keyframes pop{
  from{
    opacity:0;
    transform:scale(.94) translateY(12px)
  }
  to{
    opacity:1;
    transform:scale(1) translateY(0)
  }
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(7px)
  }
  to{
    opacity:1;
    transform:translateY(0)
  }
}
</style>
</head>

<body>

<div id="toast"></div>

<!-- AUTH -->
<section id="auth">

  <div class="auth-card">

    <div class="logo">À<span>Vanta</span></div>
    <div class="auth-sub">Gaming • Chat • Community</div>

    <div id="loginBox">

      <input id="email"
             class="auth-input"
             type="email"
             placeholder="ایمیل">

      <input id="password"
             class="auth-input"
             type="password"
             placeholder="رمز عبور">

      <button class="primary" onclick="emailLogin()">
        ورود
      </button>

      <button class="secondary" onclick="emailRegister()">
        ساخت حساب
      </button>

      <div class="divider">یا</div>

      <button class="secondary" onclick="googleLogin()">
        ورود با Google
      </button>

      <button class="secondary" onclick="guestLogin()">
        ورود مهمان
      </button>

    </div>

    <div id="authLoading" class="hidden">
      در حال اتصال به ÀVanta...
    </div>

  </div>

</section>


<!-- APP -->
<div id="app" class="hidden">

  <aside class="sidebar">

    <div class="sidebar-top">

      <div class="top-row">

        <div class="brand-small">ÀVanta</div>

        <div style="display:flex;gap:6px">

          <button class="icon-btn"
                  title="پروفایل"
                  onclick="openMyProfile()">
            ◉
          </button>

          <button class="icon-btn"
                  title="تنظیمات"
                  onclick="openSettings()">
            ⚙
          </button>

        </div>

      </div>

      <input
        id="userSearch"
        class="search"
        placeholder="جستجوی کاربران..."
        oninput="searchUsers(this.value)"
      >

    </div>

    <div id="chatList" class="chat-list">

      <div class="chat-item active"
           onclick="openPublicChat()">

        <div class="avatar">À</div>

        <div class="chat-info">

          <div class="chat-name">
            ÀVanta Community
          </div>

          <div class="chat-last">
            چت عمومی
          </div>

        </div>

      </div>

    </div>

    <div class="bottom-nav">

      <button class="active"
              onclick="openPublicChat()">
        چت
      </button>

      <button onclick="openChannels()">
        کانال‌ها
      </button>

      <button onclick="openGroups()">
        گروه‌ها
      </button>

      <button onclick="openPremium()">
        Premium
      </button>

    </div>

  </aside>


  <main class="main">

    <div id="emptyState" class="empty">

      <strong>ÀVanta</strong>
      <span>یک گفتگو را انتخاب کنید</span>

    </div>


    <section id="chatView" class="hidden"
             style="height:100%;display:flex;flex-direction:column">

      <header class="chat-header">

        <button class="icon-btn mobile-menu"
                onclick="closeMobileChat()">
          ←
        </button>

        <div class="avatar" id="headerAvatar">
          À
        </div>

        <div class="header-info">

          <div id="headerName"
               class="header-name">
            ÀVanta Community
          </div>

          <div id="headerStatus"
               class="online">
            آنلاین
          </div>

        </div>

        <button class="icon-btn"
                onclick="openChatInfo()">
          ⋮
        </button>

      </header>


      <div id="messages"
           class="messages">
      </div>


      <div id="emojiPicker"
           class="picker hidden">

        <div class="emoji-grid" id="emojiGrid">

          <button onclick="insertEmoji('😀')">😀</button>
          <button onclick="insertEmoji('😂')">😂</button>
          <button onclick="insertEmoji('😍')">😍</button>
          <button onclick="insertEmoji('😎')">😎</button>
          <button onclick="insertEmoji('😭')">😭</button>
          <button onclick="insertEmoji('😈')">😈</button>
          <button onclick="insertEmoji('🤡')">🤡</button>
          <button onclick="insertEmoji('🔥')">🔥</button>
          <button onclick="insertEmoji('❤️')">❤️</button>
          <button onclick="insertEmoji('💎')">💎</button>
          <button onclick="insertEmoji('🚀')">🚀</button>
          <button onclick="insertEmoji('🎮')">🎮</button>
          <button onclick="insertEmoji('🦾')">🦾</button>
          <button onclick="insertEmoji('🫀')">🫀</button>

        </div>

        <div id="customEmojiGrid"
             class="emoji-grid"
             style="margin-top:10px">
        </div>

      </div>


      <div class="composer-wrap">

        <div id="replyPreview"
             class="reply-preview hidden">

          <span id="replyText"></span>

          <button onclick="cancelReply">
            ×
          </button>

        </div>

        <div class="composer">

          <button class="icon-btn"
                  onclick="toggleEmojiPicker()">
            ☺
          </button>

          <textarea
            id="messageInput"
            class="message-input"
            rows="1"
            placeholder="پیام..."
            onkeydown="handleMessageKey(event)"
          ></textarea>

          <button class="send-btn"
                  onclick="sendMessage()">
            ➤
          </button>

        </div>

      </div>

    </section>

  </main>

</div>


<!-- MODAL -->
<div id="modalRoot" class="overlay hidden"
     onclick="closeModalOutside(event)">

  <div id="modal"
       class="modal">
  </div>

</div>


<script>

const $ = id => document.getElementById(id);

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function toast(text){

  const t = $("toast");

  t.textContent = text;

  t.classList.add("show");

  clearTimeout(window.__toast);

  window.__toast =
    setTimeout(() => t.classList.remove("show"),3000);

}

function openModal(html){

  $("modal").innerHTML = html;

  $("modalRoot").classList.remove("hidden");

}

function closeModal(){

  $("modalRoot").classList.add("hidden");

  $("modal").innerHTML = "";

}

function closeModalOutside(e){

  if(e.target === $("modalRoot"))
    closeModal();

}

function now(){

  return Date.now();

}

function initials(name){

  const n = String(name || "User").trim();

  return n ? n[0].toUpperCase() : "U";

    db.ref("messages").off(
      "value",
      messageListener
    );

  }

  const query =
    db.ref("messages")
      .orderByChild("createdAt")
      .limitToLast(100);

  messageListener =
    snap => renderMessages(snap);

  query.on("value",messageListener);

}


function renderMessages(snapshot){

  const box = $("messages");

  box.innerHTML = "";

  const data = snapshot.val() || {};

  const messages =
    Object.entries(data)
      .map(([id,m]) => ({id,...m}))
      .sort((a,b) =>
        Number(a.createdAt || 0) -
        Number(b.createdAt || 0)
      );

  for(const m of messages){

    /*
      جلوگیری از نمایش داده‌های خراب
    */

    if(!m.uid)
      continue;

    const mine =
      m.uid === currentUser?.uid;

    const row =
      document.createElement("div");

    row.className =
      "message-row " +
      (mine ? "mine" : "");

    let text =
      escapeHTML(m.text || "");

    /*
      نمایش ایموجی‌های اختصاصی
      با فرمت:
      :emojiId:
    */

    text = renderCustomEmojiText(text);

    let reply = "";

    if(m.replyTo?.text){

      reply = `
        <div class="reply-box">
          ${escapeHTML(m.replyTo.text)}
        </div>
      `;

    }

    row.innerHTML = `

      <div class="message">

        <div class="message-actions">

          <button onclick="replyMessage('${m.id}')">
            ↩
          </button>

          <button onclick="reactMessage('${m.id}','❤️')">
            ♥
          </button>

        </div>

        ${
          !mine
          ? `<div class="message-author">
              ${escapeHTML(m.displayName || "User")}
             </div>`
          : ""
        }

        ${reply}

        <div class="message-text">
          ${text}
        </div>

        <div class="message-time">
          ${formatTime(m.createdAt)}
        </div>

        ${
          m.reactions
          ? renderReactions(m.reactions)
          : ""
        }

      </div>

    `;

    box.appendChild(row);

  }

  box.scrollTop = box.scrollHeight;

}

/*
  فشرده‌سازی تصویر در مرورگر.
  سپس Blob به DataURL تبدیل می‌شود.
  CompressionStream در مرورگرهای جدید
  برای کاهش حجم payload استفاده می‌شود.
*/

async function compressImage(file){

  if(!file)
    throw new Error("فایل وجود ندارد");

  if(file.size > 5 * 1024 * 1024)
    throw new Error("حداکثر فایل اولیه 5MB است");

  const bitmap =
    await createImageBitmap(file);

  const max = 256;

  let width = bitmap.width;
  let height = bitmap.height;

  if(width > height){

    if(width > max){

      height =
        Math.round(height * max / width);

      width = max;

    }

  }else{

    if(height > max){

      width =
        Math.round(width * max / height);

      height = max;

    }

  }

  const canvas =
    document.createElement("canvas");

  canvas.width = width;
  canvas.height = height;

  const ctx =
    canvas.getContext("2d");

  ctx.clearRect(0,0,width,height);

  ctx.drawImage(
    bitmap,
    0,
    0,
    width,
    height
  );

  const blob =
    await new Promise(resolve =>
      canvas.toBlob(
        resolve,
        "image/webp",
        .78
      )
    );

  const buffer =
    await blob.arrayBuffer();

  /*
    نام ساختار داخلی برای نسخه ایموجی:
    bA368
  */

  let payload;

  if("CompressionStream" in window){

    try{

      const cs =
        new CompressionStream("gzip");

      const stream =
        new Blob([buffer])
          .stream()
          .pipeThrough(cs);

      const compressed =
        await new Response(stream)
          .arrayBuffer();

      payload =
        arrayBufferToBase64(compressed);

    }catch(e){

      payload =
        arrayBufferToBase64(buffer);

    }

  }else{

    payload =
      arrayBufferToBase64(buffer);

  }

  return {

    format:"bA368",

    mime:"image/webp",

    width,

    height,

    compressed:
      "gzip",

    data:payload

  };

}


function arrayBufferToBase64(buffer){

  const bytes =
    new Uint8Array(buffer);

  let binary = "";

  const chunk = 0x8000;

  for(
    let i=0;
    i<bytes.length;
    i+=chunk
  ){

    binary += String.fromCharCode(
      ...bytes.subarray(
        i,
        Math.min(i+chunk,bytes.length)
      )
    );

  }

  return btoa(binary);

}


function base64ToUint8Array(base64){

  const binary =
    atob(base64);

  const arr =
    new Uint8Array(binary.length);

  for(let i=0;i<binary.length;i++)
    arr[i] = binary.charCodeAt(i);

  return arr;

}


async function emojiToDataURL(emoji){

  if(!emoji?.data)
    return "";

  let bytes =
    base64ToUint8Array(emoji.data);

  if(emoji.compressed === "gzip"){

    try{

      if("DecompressionStream" in window){

        const ds =
          new DecompressionStream("gzip");

        const stream =
          new Blob([bytes])
            .stream()
            .pipeThrough(ds);

        const decompressed =
          await new Response(stream)
            .arrayBuffer();

        bytes =
          new Uint8Array(decompressed);

      }

    }catch(e){

      return "";

    }

  }

  let binary = "";

  const chunk = 0x8000;

  for(
    let i=0;
    i<bytes.length;
    i+=chunk
  ){

    binary += String.fromCharCode(
      ...bytes.subarray(
        i,
        Math.min(i+chunk,bytes.length)
      )
    );

  }

  return `data:${emoji.mime};base64,${btoa(binary)}`;

}

async function saveCustomEmoji(){

  if(!isAdminUser())
    return toast("دسترسی غیرمجاز");

  const name =
    $("emojiName")
      .value
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9_]/g,"_");

  const file =
    $("emojiFile").files[0];

  const premium =
    $("emojiPremium").value === "true";

  if(!name)
    return toast("نام ایموجی را وارد کن");

  if(!file)
    return toast("تصویر انتخاب کن");

  try{

    toast("در حال فشرده‌سازی...");

    const packed =
      await compressImage(file);

    /*
      RTDB محدودیت حجم دارد.
      برای جلوگیری از خراب شدن دیتابیس:
      ایموجی بیش از 300KB ذخیره نمی‌شود.
    */

    if(packed.data.length > 420000)
      return toast(
        "ایموجی هنوز بزرگ است؛ تصویر کوچک‌تری انتخاب کن"
      );

    await db.ref(
      "customEmojis/" + name
    ).set({

      id:name,

      name,

      owner:ADMIN_UID,

      premium,

      createdAt:
        firebase.database.ServerValue.TIMESTAMP,

      storageType:
        "rtdb-compressed",

      payload:packed

    });

    toast("ایموجی ساخته شد");

    closeModal();

    loadCustomEmojis();

  }catch(e){

    toast(
      "خطا: " + (e.message || e)
    );

  }

}


function loadCustomEmojis(){

  db.ref("customEmojis")
    .on("value",async snap => {

      customEmojis =
        snap.val() || {};

      renderCustomEmojiPicker();

    });

}

  const box =

  if(!box)
    return;

  box.innerHTML = "";

  for(const [id,emoji] of

    /*

    */

    if(emoji.premium){

      const premium =
        Number(
          currentProfile?.premiumUntil || 0
        ) > now();

      if(!premium && !isAdmin)
        continue;

    }

    const url =
      await emojiToDataURL(
        emoji.payload
      );

    if(!url)
      continue;

    const btn =
      document.createElement("button");

    btn.title = ":" + id + ":";

    btn.innerHTML =
      `<img class="custom-emoji"
            src="${url}">`;

    btn.onclick = () =>
      insertCustomEmoji(id);

    box.appendChild(btn);

  }

}


function insertCustomEmoji(id){

  const input =
    $("messageInput");

  const value =
    input.value;

  const start =
    input.selectionStart;

  const end =
    input.selectionEnd;

  const code =
    ":" + id + ":";

  input.value =
    value.substring(0,start) +
    code +
    value.substring(end);

  input.focus();

  input.selectionStart =
    input.selectionEnd =
      start + code.length;

}


function renderCustomEmojiText(text){

  return text.replace(
    /:([a-zA-Z0-9_]+):/g,
    (match,id) => {

      const emoji =
        customEmojis[id];

      if(!emoji)
        return match;

      return `
        <img
          class="custom-emoji"
          src=""
          data-custom-id="${escapeHTML(id)}"
          alt="${escapeHTML(match)}"
        >
      `;

    }
  );

}


/*
  بعد از render پیام‌ها، تصاویر اختصاصی
  را async داخل پیام قرار می‌دهیم.
*/

async function hydrateMessageEmojis(){

  const images =
    document.querySelectorAll(
      "img[data-custom-id]"
    );

  for(const img of images){

    const id =
      img.dataset.customId;

    const emoji =
      customEmojis[id];

    if(!emoji)
      continue;

    const url =
      await emojiToDataURL(
        emoji.payload
      );

    if(url)
      img.src = url;

  }

}

async function buyPremium(cost,months){

  if(!currentUser)
    return;

  if(isAdminUser())
    return toast("Admin نیازی به خرید Premium ندارد");

  /*
    این عملیات حتماً باید با Firebase Rules
    محدود شود تا کاربر نتواند VC را جعل کند.
  */

  const ref =
    db.ref("users/" + currentUser.uid);

  const result =
    await ref.transaction(user => {

      if(!user)
        return user;

      const vc =
        Number(user.vc || 0);

      if(vc < cost)
        return;

      const current =
        Number(user.premiumUntil || 0);

      const base =
        Math.max(current,now());

      const until =
        new Date(base);

      until.setMonth(
        until.getMonth() + months
      );

      user.vc = vc - cost;

      user.premium = true;

      user.premiumUntil =
        until.getTime();

      return user;

    });

  if(!result.committed){

    toast("موجودی VC کافی نیست یا عملیات انجام نشد");

    return;

  }

  currentProfile =
    result.snapshot.val();

  toast("Premium فعال شد");

  openPremium();

}

async function buyGift(id){

  if(!currentUser)
    return;

  const giftSnap =
    await db.ref("gifts/" + id)
      .once("value");

  const gift =
    giftSnap.val();

  if(!gift)
    return toast("گیفت پیدا نشد");

  const price =
    Number(gift.price || 0);

  if(price <= 0)
    return toast("قیمت گیفت نامعتبر است");

  const ref =
    db.ref("users/" + currentUser.uid + "/vc");

  const result =
    await ref.transaction(vc => {

      vc = Number(vc || 0);

      if(vc < price)
        return;

      return vc - price;

    });

  if(!result.committed){

    toast("VC کافی نیست");

    return;

  }

  await db.ref("purchases").push({

    uid:currentUser.uid,

    giftId:id,

    price,

    createdAt:
      firebase.database.ServerValue.TIMESTAMP

  });

  currentProfile.vc =
    result.snapshot.val();

  toast("گیفت خریداری شد");

}

async function adminGrantPremium(){

    Number($("premiumMonths").value);

    return toast("مدت نامعتبر است");

  const userRef =
    db.ref("users/" + uid);

  const snap =
    await userRef.once("value");

  if(!snap.exists())
    return toast("کاربر پیدا نشد");

  const user =
    snap.val();

  const current =
    Number(user.premiumUntil || 0);

  const base =
    Math.max(current, Date.now());

  const date =
    new Date(base);

  date.setMonth(
    date.getMonth() + months
  );

  await userRef.update({

    premium:true,

    premiumUntil:
      date.getTime(),

    premiumGrantedBy:
      ADMIN_UID,

    premiumUpdatedAt:
      firebase.database.ServerValue.TIMESTAMP

  });

  toast("Premium فعال شد");

}

async function cleanupMessages(){

  if(!isAdminUser())
    return toast("دسترسی غیرمجاز");

  const days =
    Number(prompt(
      "پیام‌های قدیمی‌تر از چند روز حذف شوند؟",
      "30"
    ));

  if(!Number.isFinite(days) || days < 1)
    return;

  if(!confirm(
    `پیام‌های قدیمی‌تر از ${days} روز حذف شوند؟`
  ))
    return;

  const cutoff =
    Date.now() -
    days * 24 * 60 * 60 * 1000;

  const snap =
    await db.ref("messages")
      .orderByChild("createdAt")
      .endAt(cutoff)
      .once("value");

  const data =
    snap.val() || {};

  const updates = {};

  Object.keys(data).forEach(id => {
    updates["/messages/" + id] = null;
  });

  if(Object.keys(updates).length)
    await db.ref().update(updates);

  toast(
    `${Object.keys(updates).length} پیام پاک شد`
  );

}

let searchTimer = null;

function searchUsers(value){

  clearTimeout(searchTimer);

  const q =
    String(value || "")
      .trim()
      .toLowerCase();

  if(!q)
    return;

  searchTimer =
    setTimeout(async () => {

      const snap =
        await db.ref("users")
          .once("value");

      const users =
        snap.val() || {};

      const matches =
        Object.entries(users)
          .filter(([uid,u]) => {

            const name =
              String(
                u.displayName || ""
              ).toLowerCase();

            const email =
              String(
                u.email || ""
              ).toLowerCase();

            return (
              name.includes(q) ||
              email.includes(q) ||
              uid.toLowerCase().includes(q)
            );

          })
          .slice(0,20);

      renderSearchResults(matches);

    },250);

}

/* =========================================================
   PRIVATE CHAT
========================================================= */

function privateChatId(a,b){

  return [a,b]
    .sort()
    .join("_");

}


async function openPrivateChat(uid){

  if(!currentUser || uid === currentUser.uid)
    return;

  const snap =
    await db.ref("users/" + uid)
      .once("value");

  if(!snap.exists())
    return toast("کاربر پیدا نشد");

  const user =
    snap.val();

  currentChat =
    privateChatId(
      currentUser.uid,
      uid
    );

  currentChatType = "private";

  $("emptyState")
    .classList.add("hidden");

  $("chatView")
    .classList.remove("hidden");

  $("headerName")
    .textContent =
      user.displayName || "User";

  $("headerStatus")
    .textContent =
      user.online
      ? "آنلاین"
      : "آخرین بازدید " +
        formatTime(user.lastSeen);

  if(user.photoURL){

    $("headerAvatar").innerHTML =
      `<img src="${escapeHTML(user.photoURL)}">`;

  }else{

    $("headerAvatar").textContent =
      initials(user.displayName);

  }

  $("app").classList.add("chat-open");

  listenPrivateMessages(
    currentUser.uid,
    uid
  );

}


function listenPrivateMessages(uid1,uid2){

  if(messageListener){

    if(currentChatType === "public"){

      db.ref("messages").off(
        "value",
        messageListener
      );

    }

  }

  const ref =
    db.ref(
      "privateMessages/" +
      privateChatId(uid1,uid2)
    )
    .orderByChild("createdAt")
    .limitToLast(100);

  messageListener =
    snap => renderMessages(snap);

  /*
    renderMessages برای Private نیز
    با همان ساختار message کار می‌کند.
  */

  ref.on("value",messageListener);

}


/* =========================================================
   OVERRIDE MESSAGE LISTENER SUPPORT
========================================================= */

const oldRenderMessages =
  renderMessages;

renderMessages = function(snapshot){

  oldRenderMessages(snapshot);

  /*
    ایموجی‌های bA368 بعد از ساخته‌شدن
    پیام‌ها hydrate می‌شوند.
  */

  hydrateMessageEmojis();

};


/* =========================================================
   SEND PRIVATE MESSAGE SUPPORT
========================================================= */

const oldSendMessage =
  sendMessage;

sendMessage = async function(){

  if(currentChatType !== "private")
    return oldSendMessage();

  if(!currentUser)
    return;

  const input =
    $("messageInput");

  const text =
    input.value.trim();

  if(!text)
    return;

  const message = {

    uid:currentUser.uid,

    displayName:
      currentProfile?.displayName ||
      "User",

    text,

    createdAt:
      firebase.database.ServerValue.TIMESTAMP,

    type:"text"

  };

  if(replyTarget){

    message.replyTo = {

      id:replyTarget.id,

      text:
        String(replyTarget.text || "")
          .slice(0,500)

    };

  }

  try{

    await db.ref(
      "privateMessages/" + currentChat
    ).push(message);

    input.value = "";

    replyTarget = null;

    $("replyPreview")
      .classList.add("hidden");

  }catch(e){

    toast(firebaseError(e));

  }

};

/* =========================================================
   SERVICE WORKER / PWA
========================================================= */

if("serviceWorker" in navigator){

  const sw = `

    const CACHE = "avanta-v1";

    self.addEventListener(
      "install",
      e => {

        self.skipWaiting();

      }
    );

    self.addEventListener(
      "activate",
      e => {

        e.waitUntil(
          self.clients.claim()
        );

      }
    );

    self.addEventListener(
      "fetch",
      e => {

        e.respondWith(

          fetch(e.request)
            .catch(
              () => caches.match(e.request)
            )

        );

      }
    );

  `;

  try{

    const blob =
      new Blob(
        [sw],
        {type:"text/javascript"}
      );

    const url =
      URL.createObjectURL(blob);

    navigator.serviceWorker
      .register(url)
      .catch(() => {});

  }catch(e){}

}
