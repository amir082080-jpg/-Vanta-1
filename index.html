<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="ÀVanta Messenger">
<title>ÀVanta Messenger</title>

<style>
*{box-sizing:border-box}
:root{
 --bg:#0b1020;
 --panel:#111827;
 --panel2:#172033;
 --border:#263247;
 --text:#f5f7fb;
 --muted:#8995aa;
 --accent:#7c5cff;
 --accent2:#9b87ff;
 --danger:#ef4444;
 --success:#22c55e;
 --gold:#f5c542;
 --bubble:#1c2740;
}
body.light{
 --bg:#f2f5fa;
 --panel:#fff;
 --panel2:#eef2f8;
 --border:#dce3ed;
 --text:#182033;
 --muted:#6b7280;
 --bubble:#e8edf6;
}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,"Segoe UI",sans-serif;
 overflow:hidden;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.app{height:100vh;display:flex}
.sidebar{
 width:330px;background:var(--panel);border-left:1px solid var(--border);
 display:flex;flex-direction:column;z-index:5;
}
.brand{
 height:70px;padding:14px 18px;border-bottom:1px solid var(--border);
 display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800;
}
.logo{
 width:42px;height:42px;border-radius:13px;
 display:grid;place-items:center;
 background:linear-gradient(135deg,var(--accent),#20c8ff);
 color:white;font-weight:900;
}
.search{padding:12px}
.search input{
 width:100%;padding:12px 15px;border-radius:13px;
 border:1px solid var(--border);background:var(--panel2);color:var(--text);outline:0;
}
.nav{padding:5px 10px}
.nav button{
 width:100%;padding:12px;border-radius:12px;background:transparent;
 color:var(--text);text-align:right;margin-bottom:4px;
}
.nav button:hover,.nav button.active{background:var(--panel2)}
.userMini{
 margin-top:auto;padding:12px;border-top:1px solid var(--border);
 display:flex;align-items:center;gap:10px;
}
.avatar{
 width:42px;height:42px;border-radius:50%;object-fit:cover;
 background:linear-gradient(135deg,var(--accent),#22d3ee);
 display:grid;place-items:center;font-weight:bold;color:white;
}
.userInfo{flex:1;min-width:0}
.userName{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:11px;color:var(--muted)}
.chat{
 flex:1;display:flex;flex-direction:column;min-width:0;
}
.chatHead{
 height:70px;border-bottom:1px solid var(--border);
 background:var(--panel);display:flex;align-items:center;
 padding:10px 18px;gap:12px;
}
.chatHeadInfo{flex:1}
.chatTitle{font-weight:800}
.chatSub{font-size:12px;color:var(--muted);margin-top:3px}
.messages{
 flex:1;overflow-y:auto;padding:20px;
 display:flex;flex-direction:column;gap:8px;
}
.message{
 max-width:min(75%,620px);padding:9px 12px;border-radius:16px;
 background:var(--bubble);align-self:flex-start;
 position:relative;word-break:break-word;
}
.message.mine{
 align-self:flex-end;background:linear-gradient(135deg,var(--accent),#6250db);
}
.messageMeta{font-size:10px;color:#b8c0d0;margin-top:5px}
.replyBox{
 font-size:11px;padding:5px 8px;border-right:3px solid var(--accent);
 background:rgba(0,0,0,.12);border-radius:7px;margin-bottom:5px;
}
.reactionRow{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.reaction{
 background:rgba(255,255,255,.1);padding:2px 7px;border-radius:12px;font-size:12px;
}
.composer{
 padding:12px;border-top:1px solid var(--border);background:var(--panel);
 display:flex;gap:8px;align-items:end;
}
.composer textarea{
 flex:1;resize:none;min-height:44px;max-height:130px;
 background:var(--panel2);color:var(--text);border:1px solid var(--border);
 border-radius:15px;padding:12px;outline:0;
}
.iconBtn,.sendBtn{
 width:44px;height:44px;border-radius:13px;background:var(--panel2);color:var(--text);
}
.sendBtn{background:var(--accent);color:#fff}
.page{
 flex:1;overflow:auto;padding:25px;
}
.card{
 background:var(--panel);border:1px solid var(--border);
 border-radius:20px;padding:20px;margin-bottom:15px;
}
.card h2,.card h3{margin-top:0}
.profileTop{
 display:flex;align-items:center;gap:15px;margin-bottom:20px;
}
.bigAvatar{width:90px;height:90px;border-radius:25px;object-fit:cover}
.badge{
 display:inline-flex;align-items:center;gap:4px;
 background:rgba(245,197,66,.12);color:var(--gold);
 padding:4px 8px;border-radius:9px;font-size:11px;
}
.primary{
 background:var(--accent);color:white;padding:11px 16px;border-radius:12px;
}
.secondary{
 background:var(--panel2);color:var(--text);padding:11px 16px;border-radius:12px;
}
.danger{background:var(--danger);color:#fff;padding:10px 15px;border-radius:10px}
.form{
 display:grid;gap:10px;
}
.form input,.form textarea,.form select{
 background:var(--panel2);border:1px solid var(--border);
 color:var(--text);padding:12px;border-radius:12px;outline:0;
}
.grid{
 display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;
}
.emojiCard,.giftCard{
 background:var(--panel2);border:1px solid var(--border);
 border-radius:16px;padding:15px;text-align:center;
}
.emojiCard img,.giftCard .gift{
 width:70px;height:70px;object-fit:contain;margin:auto;
}
.emojiPicker{
 position:absolute;bottom:70px;right:15px;
 width:min(390px,calc(100vw - 30px));max-height:330px;
 overflow:auto;background:var(--panel);border:1px solid var(--border);
 border-radius:18px;padding:12px;box-shadow:0 20px 50px #0008;z-index:20;
}
.emojiGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.emojiItem{
 aspect-ratio:1;background:var(--panel2);border-radius:10px;
 display:grid;place-items:center;padding:5px;
}
.emojiItem img{width:31px;height:31px;object-fit:contain}
.modal{
 position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:100;
 padding:15px;
}
.modalBox{
 width:min(600px,100%);max-height:90vh;overflow:auto;
 background:var(--panel);border:1px solid var(--border);
 border-radius:22px;padding:20px;
}
.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.close{background:transparent;color:var(--text);font-size:25px}
.toast{
 position:fixed;bottom:25px;left:50%;transform:translateX(-50%);
 background:#151b2b;color:#fff;padding:12px 18px;border-radius:12px;
 z-index:200;box-shadow:0 10px 30px #0006;
}
.onlineDot{
 width:9px;height:9px;border-radius:50%;background:var(--success);
 display:inline-block;
}
.empty{text-align:center;color:var(--muted);padding:50px 10px}
.adminTabs{display:flex;gap:6px;overflow:auto;margin-bottom:15px}
.adminTabs button{white-space:nowrap}
.login{
 height:100vh;display:grid;place-items:center;padding:20px;
 background:radial-gradient(circle at top,#202950,var(--bg) 55%);
}
.loginBox{
 width:min(430px,100%);background:var(--panel);
 border:1px solid var(--border);border-radius:25px;padding:28px;text-align:center;
}
.loginBox .logo{margin:auto}
.install{
 position:fixed;bottom:15px;right:15px;z-index:50;
}
@media(max-width:760px){
 .sidebar{width:72px}
 .sidebar .brand span,.sidebar .search,.sidebar .nav span,
 .sidebar .userInfo{display:none}
 .brand{justify-content:center;padding:10px}
 .nav button{text-align:center}
 .userMini{justify-content:center}
 .message{max-width:86%}
 .page{padding:15px}
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginScreen" class="login">
 <div class="loginBox">
  <div class="logo">À</div>
  <h1>ÀVanta</h1>
  <p style="color:var(--muted)">Gaming • Chat • Community</p>

  <button class="primary" style="width:100%;margin-top:10px"
          onclick="loginGoogle()">
   🔵 ورود با Google
  </button>

  <button class="secondary" style="width:100%;margin-top:10px"
          onclick="loginGuest()">
   👤 ورود مهمان
  </button>

  <p id="loginError" style="color:#ef4444;font-size:13px"></p>
 </div>
</div>

<!-- ================= APP ================= -->

<div id="app" class="app hidden">

 <aside class="sidebar">

  <div class="brand">
   <div class="logo">À</div>
   <span>ÀVanta</span>
  </div>

  <div class="search">
   <input id="searchInput" placeholder="جستجو...">
  </div>

  <nav class="nav">

   <button onclick="openPage('home')" id="navHome">

   </button>

   <button onclick="openPublicChat()" id="navChat">

   <button onclick="openPage('private')">
    👤 <span>پیام‌های خصوصی</span>
   </button>

   <button onclick="openPage('saved')">
    ⭐ <span>پیام‌های ذخیره‌شده</span>
   </button>

   <button onclick="openPage('channels')">
    📢 <span>کانال‌ها</span>
   </button>

   <button onclick="openPage('groups')">
    👥 <span>گروه‌ها</span>
   </button>

   <button onclick="openPage('gifts')">
    🎁 <span>VANTA Gifts</span>
   </button>

   <button onclick="openPage('profile')">
    👤 <span>پروفایل</span>
   </button>

   <button onclick="openPage('settings')">

   </button>

   <button id="adminNav" class="hidden" onclick="openPage('admin')">
    👑 <span>پنل مدیریت</span>

  <div class="userMini">

    <div class="status">

 </aside>

 <main class="chat">

  <header class="chatHead">
   <button class="iconBtn" onclick="toggleSidebar()">☰</button>

   <div class="chatHeadInfo">
    <div id="chatTitle" class="chatTitle">ÀVanta</div>
    <div id="chatSub" class="chatSub">Gaming • Chat • Community</div>
   </div>

   <button class="iconBtn" onclick="openPage('profile')">👤</button>
  </header>

  <section id="content" class="messages"></section>

  <div id="composer" class="composer hidden">

   <button class="iconBtn" onclick="toggleEmojiPicker()">😀</button>

   <textarea id="messageInput"
             placeholder="پیام خود را بنویس..."
             rows="1"></textarea>

   <button class="sendBtn" onclick="sendMessage()">➤</button>

   <div id="emojiPicker" class="emojiPicker hidden">
    <div id="emojiGrid" class="emojiGrid"></div>
   </div>

  </div>

 </main>
</div>

<!-- ================= MODAL ================= -->

<div id="modal" class="modal hidden">
 <div class="modalBox">
  <div class="modalHead">
   <h3 id="modalTitle">ÀVanta</h3>
   <button class="close" onclick="closeModal()">×</button>
  </div>
  <div id="modalBody"></div>
 </div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module">

/* =========================================================
   FIREBASE
   ========================================================= */

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth,
 onAuthStateChanged,
 GoogleAuthProvider,
 signInWithPopup,
 signInAnonymously,
 signOut,
 updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getDatabase,
 ref,
 set,
 get,
 push,
 update,
 remove,
 onValue,
 onDisconnect,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {
 apiKey:"AIzaSyBsncHhhlqIi6qpf3hYtb0DOnq8Zjb-zpI",
 authDomain:"avanta-3db7e.firebaseapp.com",
 databaseURL:"https://avanta-3db7e-default-rtdb.firebaseio.com",
 projectId:"avanta-3db7e",
 storageBucket:"avanta-3db7e.firebasestorage.app",
 messagingSenderId:"879564538420",
 appId:"1:879564538420:web:a0fc85cc43a9347d92c061"
};

const ADMIN_UID="NNY1ymTknwREwMo16ZI3lgFEni23";

const appFirebase=initializeApp(firebaseConfig);
const auth=getAuth(appFirebase);
const db=getDatabase(appFirebase);


/* =========================================================
   STATE
   ========================================================= */

let currentUser=null;
let currentProfile=null;
let currentChat="public";
let currentChatType="public";
let currentChannel=null;
let currentGroup=null;
let unsubscribeMessages=null;

let EMOJIS={};
let USERS={};
let CHANNELS={};
let GROUPS={};
let GIFTS={};

const $=id=>document.getElementById(id);


/* =========================================================
   UTILITIES
   ========================================================= */

function esc(v){
 return String(v??"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function toast(text){
 $("toast").textContent=text;
 $("toast").classList.remove("hidden");
 setTimeout(()=>$("toast").classList.add("hidden"),2500);
}

function isAdmin(){
 return currentUser?.uid===ADMIN_UID;
}

function openModal(title,body){
 $("modalTitle").textContent=title;
 $("modalBody").innerHTML=body;
 $("modal").classList.remove("hidden");
}

window.closeModal=()=>{
 $("modal").classList.add("hidden");
};

function avatarHTML(profile,size="avatar"){
 if(profile?.photoURL)
  return `<img class="${size}" src="${esc(profile.photoURL)}">`;

 return `<div class="${size}">${esc(
  (profile?.displayName||"A").charAt(0).toUpperCase()
 )}</div>`;
}

function emojiByName(name){
 return Object.values(EMOJIS).find(x=>x.name===name);
}

function emojiHTML(name,cls="av-emoji"){
 const e=emojiByName(name);
 if(!e?.data)return "";
 return `<img class="${cls}"
 src="${e.data}"
 alt="${esc(name)}"
 title="${esc(name)}">`;
}


/* =========================================================
   AUTH
   ========================================================= */

window.loginGoogle=async()=>{
 try{
  const provider=new GoogleAuthProvider();
  await signInWithPopup(auth,provider);
 }catch(e){
  $("loginError").textContent=
   "ورود Google انجام نشد: "+friendlyFirebaseError(e);
 }
};

window.loginGuest=async()=>{
 try{
  await signInAnonymously(auth);
 }catch(e){
  $("loginError").textContent=
   friendlyFirebaseError(e);
 }
};

window.logout=async()=>{
 await signOut(auth);
};

function friendlyFirebaseError(e){
 const code=e?.code||"";

 if(code.includes("network"))
  return "خطای شبکه Firebase. اینترنت یا VPN را بررسی کنید.";

 if(code.includes("popup"))
  return "پنجره ورود بسته شد یا اجازه Popup داده نشد.";

 if(code.includes("unauthorized"))
  return "این عملیات اجازه دسترسی ندارد.";

 return e?.message||"خطای نامشخص Firebase";
}


/* =========================================================
   AUTH STATE
   ========================================================= */

onAuthStateChanged(auth,async user=>{

 if(!user){
  currentUser=null;
  $("loginScreen").classList.remove("hidden");
  $("app").classList.add("hidden");
  return;
 }

 currentUser=user;

 $("loginScreen").classList.add("hidden");
 $("app").classList.remove("hidden");

 await createOrLoadProfile();

 setupPresence();

 loadUsers();
 loadEmojis();
 loadChannels();
 loadGroups();
 loadGifts();

 if(isAdmin())
  $("adminNav").classList.remove("hidden");

 openPublicChat();

});


/* =========================================================
   PROFILE
   ========================================================= */

async function createOrLoadProfile(){

 const r=ref(db,"users/"+currentUser.uid);
 const snap=await get(r);

 if(snap.exists()){
  currentProfile=snap.val();
 }else{

  currentProfile={
   uid:currentUser.uid,
   displayName:
    currentUser.displayName ||
    (currentUser.isAnonymous?"Guest":"User"),
   photoURL:currentUser.photoURL||"",
   firstName:"",
   lastName:"",
   premium:false,
   premiumUntil:0,
   vc:0,
   customEmoji:"",
   profileColor:"",
   createdAt:Date.now()
  };

  await set(r,currentProfile);
 }

 updateMiniProfile();
}

function updateMiniProfile(){

 const name=
  currentProfile?.displayName ||
  currentUser?.displayName ||
  "User";

 $("miniName").innerHTML=
  esc(name)+
  emojiHTML(currentProfile?.customEmoji,"av-emoji-name")+
  (currentProfile?.premium?" 💎":"");

 if(currentProfile?.photoURL)
  $("miniAvatar").innerHTML=
   `<img class="avatar" src="${esc(currentProfile.photoURL)}">`;
 else
  $("miniAvatar").textContent=name.charAt(0);

}

async function saveProfile(){

 const first=$("pfFirst").value.trim();
 const last=$("pfLast").value.trim();
 const name=
  ($("pfName").value.trim() ||
   `${first} ${last}`.trim() ||
   "User");

 const color=$("pfColor").value;

 currentProfile={
  ...currentProfile,
  firstName:first,
  lastName:last,
  displayName:name,
  profileColor:color
 };

 await update(
  ref(db,"users/"+currentUser.uid),
  currentProfile
 );

 if(!currentUser.isAnonymous){
  try{
   await updateProfile(currentUser,{
    displayName:name
   });
  }catch{}
 }

 updateMiniProfile();
 toast("✅ پروفایل ذخیره شد");
}


/* =========================================================
   PRESENCE
   ========================================================= */

function setupPresence(){

 const statusRef=
  ref(db,"presence/"+currentUser.uid);

 set(statusRef,{
  online:true,
  lastSeen:Date.now()
 });

 onDisconnect(statusRef).set({
  online:false,
  lastSeen:serverTimestamp()
 });

}


/* =========================================================
   USERS
   ========================================================= */

function loadUsers(){

 onValue(ref(db,"users"),snap=>{
  USERS=snap.exists()?snap.val():{};
 });
}


/* =========================================================
   EMOJI SYSTEM
   ========================================================= */

async function compressEmoji(file){

 return new Promise((resolve,reject)=>{

  const reader=new FileReader();

  reader.onload=()=>{

   const img=new Image();

   img.onload=()=>{

    const MAX=256;

    let w=img.width;
    let h=img.height;

    if(w>MAX||h>MAX){

     if(w>h){
      h=Math.round(h*MAX/w);
      w=MAX;
     }else{
      w=Math.round(w*MAX/h);
      h=MAX;
     }

    }

    const canvas=document.createElement("canvas");

    canvas.width=w;
    canvas.height=h;

    const ctx=canvas.getContext("2d");

    ctx.clearRect(0,0,w,h);
    ctx.drawImage(img,0,0,w,h);

    resolve(
     canvas.toDataURL("image/webp",.8)
    );

   };

   img.onerror=reject;
   img.src=reader.result;

  };

  reader.onerror=reject;
  reader.readAsDataURL(file);

 });
}


async function loadEmojis(){

 onValue(ref(db,"emojis"),snap=>{

  EMOJIS=snap.exists()?snap.val():{};

  renderEmojiPicker();

 });

}


function renderEmojiPicker(){

 const grid=$("emojiGrid");

 if(!grid)return;

 grid.innerHTML="";

 Object.entries(EMOJIS).forEach(([id,e])=>{

  if(e.premium &&
     !currentProfile?.premium &&
     !isAdmin()) return;

  const b=document.createElement("button");

  b.className="emojiItem";

  b.innerHTML=
   `<img src="${e.data}" title="${esc(e.name)}">`;

  b.onclick=()=>{
   insertEmoji(e.name);
  };

  grid.appendChild(b);

 });

}


function insertEmoji(name){

 const input=$("messageInput");

 /*
  ایموجی اختصاصی به صورت کد متنی
  ذخیره می‌شود و هنگام نمایش به تصویر تبدیل می‌شود.
 */

 input.value+=` :${name}: `;
 input.focus();

}


window.createEmoji=async()=>{

 if(!isAdmin()){
  toast("⛔ فقط Admin");
  return;
 }

 const name=$("adminEmojiName").value.trim();
 const file=$("adminEmojiFile").files[0];
 const premium=$("adminEmojiPremium").checked;

 if(!name||!file){
  toast("نام و عکس را وارد کن");
  return;
 }

 if(file.size>10*1024*1024){
  toast("❌ حجم فایل اولیه بیشتر از 10MB است");
  return;
 }

 try{

  const data=await compressEmoji(file);

  const emoji={
   name:name,
   data:data,
   premium:premium,
   createdAt:Date.now(),
   createdBy:ADMIN_UID
  };

  const newRef=push(ref(db,"emojis"));

  await set(newRef,emoji);

  $("adminEmojiName").value="";
  $("adminEmojiFile").value="";

  toast("😀 ایموجی ساخته شد");

 }catch(e){
  toast("❌ خطا: "+e.message);
 }

};


window.deleteEmoji=async id=>{

 if(!isAdmin())return;

 if(!confirm("ایموجی حذف شود؟"))return;

 await remove(ref(db,"emojis/"+id));

 toast("ایموجی حذف شد");
};


/* =========================================================
   MESSAGE RENDER
   ========================================================= */

function renderMessageText(text){

 let safe=esc(text);

 /*
  :emoji-name:
  را به تصویر اختصاصی تبدیل می‌کنیم.
 */

 safe=safe.replace(
  /:([a-zA-Z0-9_\-\u0600-\u06FF]+):/g,
  (match,name)=>{
   const e=emojiByName(name);
   if(!e)return match;
   return emojiHTML(name,"av-emoji");
  }
 );

 return safe.replace(/\n/g,"<br>");
}


/* =========================================================
   CHAT
   ========================================================= */

window.openPublicChat=()=>{

 currentChat="public";
 currentChatType="public";

 $("chatTitle").textContent="💬 چت عمومی";
 $("chatSub").textContent="همه کاربران ÀVanta";

 $("composer").classList.remove("hidden");

 listenMessages("public");

};

function listenMessages(path){

 if(unsubscribeMessages){
  unsubscribeMessages();
  unsubscribeMessages=null;
 }

 const r=ref(db,"messages/"+path);

 unsubscribeMessages=onValue(r,snap=>{

  const data=snap.exists()?snap.val():{};

  renderMessages(data);

 });

}

function renderMessages(data){

 const box=$("content");

 box.className="messages";

 box.innerHTML="";

 const entries=Object.entries(data||{})
  .sort((a,b)=>
   (a[1].createdAt||0)-(b[1].createdAt||0)
  );

 if(!entries.length){
  box.innerHTML=
   `<div class="empty">هنوز پیامی وجود ندارد 💬</div>`;
  return;
 }

 entries.forEach(([id,m])=>{

  const mine=m.uid===currentUser.uid;
  const user=USERS[m.uid]||{displayName:m.name||"User"};

  const div=document.createElement("div");

  div.className=
   "message "+(mine?"mine":"");

  let reply="";

  if(m.replyTo){
   reply=
    `<div class="replyBox">
      ↩️ پاسخ به پیام
      <br>${esc(m.replyText||"")}
     </div>`;
  }

  let reactions="";

  if(m.reactions){

   reactions=
    `<div class="reactionRow">`+
    Object.entries(m.reactions)
     .map(([r,c])=>
      `<span class="reaction">${esc(r)} ${c}</span>`
     ).join("")+
    `</div>`;

  }

  div.innerHTML=`
   ${reply}
   <div>
    <b>
     ${esc(user.displayName||"User")}
     ${user.premium?"💎":""}
     ${emojiHTML(user.customEmoji,"av-emoji-name")}
    </b>
   </div>
   <div style="margin-top:4px">
    ${renderMessageText(m.text||"")}
   </div>
   <div class="messageMeta">
    ${new Date(m.createdAt||Date.now()).toLocaleTimeString("fa-IR",{
     hour:"2-digit",
     minute:"2-digit"
    })}
   </div>
   ${reactions}
   <div style="margin-top:5px">
    <button class="secondary"
      style="padding:3px 7px;font-size:11px"
      onclick="reactMessage('${id}','❤️')">❤️</button>
    <button class="secondary"
      style="padding:3px 7px;font-size:11px"
      onclick="reactMessage('${id}','😂')">😂</button>
    <button class="secondary"
      style="padding:3px 7px;font-size:11px"
      onclick="replyMessage('${id}')">↩️</button>
    <button class="secondary"
      style="padding:3px 7px;font-size:11px"
      onclick="saveMessage('${id}')">⭐</button>
   </div>
  `;

  box.appendChild(div);

 });

 box.scrollTop=box.scrollHeight;

}

window.sendMessage=async()=>{

 const input=$("messageInput");
 const text=input.value.trim();

 if(!text)return;

 let path=currentChat;

 if(currentChatType==="channel")
  path="channel_"+currentChannel;

 if(currentChatType==="group")
  path="group_"+currentGroup;

 const message={
  uid:currentUser.uid,
  name:currentProfile?.displayName||"User",
  text:text,
  createdAt:Date.now()
 };

 const r=push(ref(db,"messages/"+path));

 await set(r,message);

 input.value="";

};


$("messageInput").addEventListener("keydown",e=>{

 if(e.key==="Enter"&&!e.shiftKey){

  e.preventDefault();
  sendMessage();

 }

});


window.reactMessage=async(id,reaction)=>{

 let path=currentChat;

 if(currentChatType==="channel")
  path="channel_"+currentChannel;

 if(currentChatType==="group")
  path="group_"+currentGroup;

 const r=
  ref(db,`messages/${path}/${id}/reactions/${reaction}`);

 const snap=await get(r);

 await set(
  r,
  (snap.exists()?snap.val():0)+1
 );

};

window.saveMessage=async id=>{

 let path=currentChat;

 const snap=
  await get(
   ref(db,`messages/${path}/${id}`)
  );

 if(!snap.exists())return;

 await set(
  ref(db,
   `savedMessages/${currentUser.uid}/${id}`
  ),
  snap.val()
 );

 toast("⭐ پیام ذخیره شد");

};

window.adminAddVC=async uid=>{

 if(!isAdmin())return;

 const amount=Number(
  prompt("مقدار VC:")
 );

 if(!amount||amount<=0)return;

 const user=USERS[uid];

 await update(
  ref(db,"users/"+uid),
  {
   vc:Number(user?.vc||0)+amount
  }
 );

 toast("🪙 VC اضافه شد");

};


window.adminGivePremium=async uid=>{

 if(!isAdmin())return;

 const days=Number(
  prompt("مدت Premium به روز:")
 );

 if(!days||days<=0)return;

 await update(
  ref(db,"users/"+uid),
  {
   premium:true,
   premiumUntil:
    Date.now()+days*86400000
  }
 );

 toast("💎 Premium فعال شد");

};

window.createGift=async()=>{

 if(!isAdmin())return;

 const name=$("giftName").value.trim();
 const emoji=$("giftEmoji").value.trim();
 const price=Number($("giftPrice").value);

 if(!name||!price)return;

 const id=push(ref(db,"gifts")).key;

 await set(
  ref(db,"gifts/"+id),
  {
   id,
   name,
   emoji:emoji||"🎁",
   price,
   createdAt:Date.now(),
   createdBy:ADMIN_UID
  }
 );

 toast("🎁 گیفت ساخته شد");

 adminGiftTab();

};


window.deleteGift=async id=>{

 if(!isAdmin())return;

 if(!confirm("گیفت حذف شود؟"))return;

 await remove(
  ref(db,"gifts/"+id)
 );

 adminGiftTab();

};

$("searchInput").addEventListener(
 "input",
 function(){

  const q=this.value.toLowerCase();

  if(!q)return;

  const results=
   Object.values(USERS)
    .filter(u=>
     String(u.displayName||"")
      .toLowerCase()
      .includes(q)
    );

  if(results.length){

   $("content").className="page";

   $("content").innerHTML=
    results.map(u=>`

     <div class="card">

      <h3>
       ${esc(u.displayName||"User")}
       ${u.premium?"💎":""}
       ${emojiHTML(
        u.customEmoji,
        "av-emoji-name"
       )}
      </h3>

      <button class="primary"
       onclick="startPrivateById('${u.uid}')">
       Message
      </button>

     </div>

    `).join("");

  }

 });

if(localStorage.getItem("avantaTheme")==="light")
 document.body.classList.add("light");


/* =========================================================
   SERVICE WORKER / PWA
   ========================================================= */

if("serviceWorker" in navigator){

 const sw=`
 self.addEventListener("install",e=>self.skipWaiting());
 self.addEventListener("activate",e=>self.clients.claim());
 self.addEventListener("fetch",e=>{});
 `;

 try{

  const blob=
   new Blob([sw],{type:"text/javascript"});

  const url=
   URL.createObjectURL(blob);

  navigator.serviceWorker.register(url)
   .catch(()=>{});

 }catch{}

}
