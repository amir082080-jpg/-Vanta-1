<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<meta name="description" content="ÀVanta — Gaming • Chat • Community • Premium • VANTAcoin • Gifts">
<title>ÀVanta</title>

<link rel="manifest" href="data:application/manifest+json,{"name":"ÀVanta","short_name":"ÀVanta","start_url":".","display":"standalone","background_color":"%230b0f19","theme_color":"%230b0f19"}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
 --bg:#080b12;
 --panel:#0e131d;
 --panel2:#141a26;
 --panel3:#1a2130;
 --text:#f4f7ff;
 --muted:#8d98ad;
 --line:rgba(255,255,255,.07);
 --accent:#7c5cff;
 --accent2:#9b83ff;
 --danger:#ff5571;
 --success:#35d49a;
 --gold:#f6c85f;
 --shadow:0 18px 50px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Vazirmatn,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button,input,textarea,select{font-family:inherit}
button{border:0;cursor:pointer}
.hidden{display:none!important}
.app{height:100dvh;display:flex;position:relative}
.sidebar{
 width:330px;min-width:330px;background:var(--panel);
 border-left:1px solid var(--line);display:flex;flex-direction:column;
 z-index:20
}
.brand{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.logo{
 width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#7655ff,#b58cff);
 display:grid;place-items:center;font-weight:900;font-size:20px;box-shadow:0 10px 30px #7655ff35
}
.brand b{font-size:20px}
.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.search{padding:12px}
.search input,.field input,.field textarea,.field select{
 width:100%;background:var(--panel2);border:1px solid var(--line);outline:none;
 color:var(--text);border-radius:13px;padding:12px 14px
}
.search input:focus,.field input:focus,.field textarea:focus{border-color:var(--accent)}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:4px}
.nav button{
 background:transparent;color:var(--muted);text-align:right;padding:12px 14px;
 border-radius:12px;font-size:14px;display:flex;align-items:center;gap:12px
}
.nav button:hover,.nav button.active{background:var(--panel2);color:#fff}
.nav i{font-style:normal;width:24px;text-align:center;font-size:18px}
.userMini{margin:auto 12px 12px;padding:12px;background:var(--panel2);border:1px solid var(--line);border-radius:15px;display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#6650ff,#222a3b);display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.userMini .u{flex:1;min-width:0}
.userMini .u b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userMini .u small{color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:66px;min-height:66px;border-bottom:1px solid var(--line);background:rgba(14,19,29,.88);backdrop-filter:blur(20px);display:flex;align-items:center;padding:0 18px;gap:12px}
.topbar .title{font-weight:800;flex:1}
.topbar .title small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.iconbtn{width:42px;height:42px;background:var(--panel2);color:#fff;border-radius:12px;font-size:18px}
.content{flex:1;min-height:0;overflow:auto}
.screen{height:100%;overflow:auto;padding:24px}
.hero{
 min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
 background:radial-gradient(circle at 50% 20%,#7655ff18,transparent 38%)
}
.heroLogo{width:110px;height:110px;border-radius:32px;display:grid;place-items:center;background:linear-gradient(135deg,#7351ff,#b18aff);font-size:48px;font-weight:900;box-shadow:0 30px 80px #7655ff35;margin-bottom:25px}
.hero h1{font-size:42px;margin:0 0 8px}
.hero p{color:var(--muted);max-width:600px;line-height:2}
.socials{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:20px}
.socials a,.primary,.secondary,.danger,.gold{
 text-decoration:none;color:#fff;border-radius:12px;padding:11px 17px;display:inline-flex;align-items:center;gap:7px
}
.primary{background:linear-gradient(135deg,var(--accent),#a179ff)}
.secondary{background:var(--panel2);border:1px solid var(--line)}
.danger{background:#ff557122;color:#ff7990;border:1px solid #ff557133}
.gold{background:#f6c85f1a;color:var(--gold);border:1px solid #f6c85f33}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px}
.card p{color:var(--muted);font-size:13px;line-height:1.8}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat strong{font-size:25px;display:block;margin-top:5px}
.stat span{color:var(--muted);font-size:12px}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sectionTitle h2{margin:0}
.list{display:flex;flex-direction:column;gap:9px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px;display:flex;align-items:center;gap:12px}
.item .grow{flex:1;min-width:0}
.item .grow b{display:block}
.item .grow small{color:var(--muted)}
.chat{height:100%;display:flex;flex-direction:column}
.messages{flex:1;overflow:auto;padding:25px 7%;display:flex;flex-direction:column;gap:9px}
.msg{max-width:min(680px,82%);align-self:flex-start;display:flex;gap:8px}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.bubble{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:9px 13px;position:relative;word-break:break-word}
.mine .bubble{background:#5e48c7;border-color:#765ce9}
.msgmeta{font-size:10px;color:#9da7ba;margin-top:5px}
.reply{font-size:11px;color:#c9c3ff;border-right:3px solid #a78bfa;padding:4px 8px;margin-bottom:7px;background:#ffffff08;border-radius:7px}
.chatInput{padding:12px 6%;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--panel)}
.chatInput textarea{flex:1;resize:none;max-height:110px;background:var(--panel2);color:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;outline:0}
.send{width:48px;border-radius:14px;background:var(--accent);color:#fff}
.emojiBar{display:flex;gap:5px;overflow:auto;padding:6px 0}
.emojiBtn{background:transparent;font-size:22px;padding:3px}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:18px}
.tab{background:var(--panel2);color:var(--muted);padding:10px 15px;border-radius:11px;white-space:nowrap}
.tab.active{background:var(--accent);color:#fff}
.modal{
 position:fixed;inset:0;background:#0009;backdrop-filter:blur(8px);z-index:100;display:grid;place-items:center;padding:18px
}
.modalBox{width:min(620px,100%);max-height:90dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.field{margin-bottom:13px}
.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
.field textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.profileHead{display:flex;gap:18px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:20px;border-radius:20px;margin-bottom:18px}
.bigAvatar{width:90px;height:90px;border-radius:28px}
.badge{font-size:10px;background:#f6c85f1c;color:#f6c85f;border:1px solid #f6c85f33;padding:3px 7px;border-radius:8px}
.online{display:inline-block;width:8px;height:8px;background:var(--success);border-radius:50%;margin-left:5px}
.customEmoji{width:23px;height:23px;object-fit:contain;vertical-align:middle}
.storeItem{display:flex;align-items:center;gap:14px}
.giftIcon{font-size:40px;width:60px;text-align:center}
.login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:500;padding:20px}
.loginBox{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:25px;padding:30px;text-align:center}
.loginBox .heroLogo{width:85px;height:85px;font-size:35px;margin:0 auto 18px}
.toast{position:fixed;bottom:20px;left:20px;z-index:1000;background:#151b28;border:1px solid var(--line);padding:12px 16px;border-radius:13px;box-shadow:var(--shadow);transform:translateY(100px);opacity:0;transition:.25s}
.toast.show{transform:translateY(0);opacity:1}
.mobileMenu{display:none}
@media(max-width:850px){
 .sidebar{position:fixed;right:0;top:0;bottom:0;transform:translateX(100%);transition:.25s;width:min(330px,88vw);box-shadow:-20px 0 60px #0008}
 .sidebar.open{transform:translateX(0)}
 .mobileMenu{display:block}
 .stats{grid-template-columns:repeat(2,1fr)}
 .screen{padding:15px}
 .messages{padding:18px 3%}
 .chatInput{padding:10px 3%}
 .hero h1{font-size:32px}
}
</style>
</head>

<body>

<div id="login" class="login hidden">
 <div class="loginBox">
  <div class="heroLogo">À</div>
  <h1>ÀVanta</h1>
  <p style="color:var(--muted)">Gaming • Chat • Community</p>
  <div class="actions" style="flex-direction:column">
   <button class="primary" id="googleLogin">🔐 ورود با Google</button>
   <button class="secondary" id="guestLogin">👤 ورود مهمان</button>
  </div>
  <p id="loginError" style="color:var(--danger);font-size:12px"></p>
 </div>
</div>

<div class="app hidden" id="app">
 <aside class="sidebar" id="sidebar">
  <div class="brand">
   <div class="logo">À</div>
   <div><b>ÀVanta</b><small>Gaming • Chat • Community</small></div>
  </div>

  <div class="search"><input id="searchInput" placeholder="جستجو..."></div>

  <nav class="nav">
   <button class="active" data-screen="home"><i>🏠</i>خانه</button>
   <button data-screen="chat"><i>💬</i>چت عمومی</button>
   <button data-screen="private"><i>✉️</i>پیام‌های خصوصی</button>
   <button data-screen="saved"><i>⭐</i>پیام‌های ذخیره‌شده</button>
   <button data-screen="channels"><i>📢</i>کانال‌ها</button>
   <button data-screen="groups"><i>👥</i>گروه‌ها</button>
   <button data-screen="premium"><i>💎</i>Premium</button>
   <button data-screen="gifts"><i>🎁</i>VANTA Gifts</button>
   <button data-screen="profile"><i>👤</i>پروفایل</button>
   <button data-screen="settings"><i>⚙️</i>تنظیمات</button>
   <button id="adminNav" class="hidden" data-screen="admin"><i>👑</i>پنل مدیریت</button>
  </nav>

  <div class="userMini">
   <div class="avatar" id="miniAvatar">À</div>
   <div class="u"><b id="miniName">کاربر</b><small id="miniVC">0 VC</small></div>
   <button class="iconbtn" id="logoutBtn">↪</button>
  </div>
 </aside>

 <main class="main">
  <header class="topbar">
   <button class="iconbtn mobileMenu" id="menuBtn">☰</button>
   <div class="title" id="topTitle">ÀVanta<small>Gaming • Chat • Community</small></div>
   <button class="iconbtn" id="profileQuick">👤</button>
  </header>
  <div class="content" id="content"></div>
 </main>
</div>

<div id="modal" class="modal hidden">
 <div class="modalBox">
  <div class="modalHead"><h3 id="modalTitle">ÀVanta</h3><button class="iconbtn" id="modalClose">×</button></div>
  <div id="modalBody"></div>
 </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
 getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,signInAnonymously,signOut,
 updateProfile
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
 getDatabase,ref,set,push,get,update,remove,onValue,onDisconnect,serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import {
 getStorage,ref as storageRef,uploadBytes,getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";

const firebaseConfig={
 apiKey:"YOUR_FIREBASE_API_KEY",
 authDomain:"avanta-3db7e.firebaseapp.com",
 databaseURL:"https://avanta-3db7e-default-rtdb.firebaseio.com",
 projectId:"avanta-3db7e",
 storageBucket:"avanta-3db7e.firebasestorage.app",
 messagingSenderId:"879564538420",
 appId:"1:879564538420:web:a0fc85cc43a9347d92c061"
};

const ADMIN_UID="NNY1ymTknwREwMo16ZI3lgFEni23";

const appFB=initializeApp(firebaseConfig);
const auth=getAuth(appFB);
const db=getDatabase(appFB);
const storage=getStorage(appFB);

let me=null;
let userData={};
let currentScreen="home";
let currentChat="public";
let replyTo=null;
let customEmojis=[];
let gifts=[];
let allUsers={};

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const isAdmin=()=>me?.uid===ADMIN_UID;
const isPremium=()=>!!userData.premium && (userData.premiumUntil===0 || userData.premiumUntil>Date.now());

function toast(text){
 $("toast").textContent=text;
 $("toast").classList.add("show");
 clearTimeout(window.__toast);
 window.__toast=setTimeout(()=>$("toast").classList.remove("show"),2600);
}

function modal(title,html){
 $("modalTitle").textContent=title;
 $("modalBody").innerHTML=html;
 $("modal").classList.remove("hidden");
}
function closeModal(){$("modal").classList.add("hidden")}
$("modalClose").onclick=closeModal;
$("modal").onclick=e=>{if(e.target===$("modal"))closeModal()};

function avatarHTML(u,cls="avatar"){
 const img=u?.photoURL||u?.photo||"";
 return `<div class="${cls}">${img?`<img src="${esc(img)}">`:esc((u?.displayName||u?.name||"À").slice(0,1))}</div>`;
}

function userNameHTML(u){
 let extra="";
 if(u?.premium) extra+=` <span class="badge">💎 Premium</span>`;
 if(u?.emojiUrl) extra+=` <img class="customEmoji" src="${esc(u.emojiUrl)}">`;
 return `<b>${esc(u?.displayName||u?.name||"کاربر")}${extra}</b>`;
}

async function ensureUser(user){
 const r=ref(db,"users/"+user.uid);
 const snap=await get(r);
 if(!snap.exists()){
  const name=user.displayName||"کاربر";
  await set(r,{
   uid:user.uid,
   displayName:name,
   photoURL:user.photoURL||"",
   email:user.email||"",
   guest:user.isAnonymous||false,
   vc:0,
   premium:false,
   premiumUntil:0,
   createdAt:serverTimestamp(),
   lastSeen:serverTimestamp()
  });
 }
 const s=await get(r);
 userData=s.val()||{};
}

async function presence(){
 if(!me)return;
 const statusRef=ref(db,"status/"+me.uid);
 await set(statusRef,{online:true,lastSeen:serverTimestamp()});
 onDisconnect(statusRef).set({online:false,lastSeen:serverTimestamp()});
 update(ref(db,"users/"+me.uid),{lastSeen:serverTimestamp()});
}

onAuthStateChanged(auth,async user=>{
 if(!user){
  $("login").classList.remove("hidden");
  $("app").classList.add("hidden");
  return;
 }
 me=user;
 try{
  await ensureUser(user);
  await presence();
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  if(isAdmin())$("adminNav").classList.remove("hidden");
  refreshMini();
  loadRealtime();
  navigate("home");
 }catch(e){
  console.error(e);
  $("loginError").textContent="خطا در اتصال به Firebase: "+e.message;
 }
});

$("googleLogin").onclick=async()=>{
 try{
  $("loginError").textContent="";
  await signInWithPopup(auth,new GoogleAuthProvider());
 }catch(e){
  $("loginError").textContent="ورود Google انجام نشد. اتصال اینترنت و تنظیمات Firebase را بررسی کنید.";
 }
};

$("guestLogin").onclick=async()=>{
 try{
  $("loginError").textContent="";
  await signInAnonymously(auth);
 }catch(e){
  $("loginError").textContent="ورود مهمان انجام نشد: "+e.message;
 }
};

$("logoutBtn").onclick=()=>signOut(auth);
$("menuBtn").onclick=()=>$("sidebar").classList.toggle("open");
$("profileQuick").onclick=()=>navigate("profile");

document.querySelectorAll(".nav button").forEach(btn=>{
 btn.onclick=()=>navigate(btn.dataset.screen);
});

function refreshMini(){
 $("miniName").innerHTML=userNameHTML(userData);
 $("miniVC").textContent=(userData.vc||0)+" VC";
 $("miniAvatar").outerHTML=avatarHTML(userData,"avatar");
 const x=document.querySelector(".userMini .avatar");
 if(x)x.id="miniAvatar";
}

function loadRealtime(){
 if(!me)return;

 onValue(ref(db,"users"),snap=>{
  allUsers=snap.val()||{};
  if(allUsers[me.uid]){
   userData=allUsers[me.uid];
   refreshMini();
  }
  if(currentScreen==="private"||currentScreen==="profile")render();
 });

 onValue(ref(db,"emojis"),snap=>{
  customEmojis=Object.entries(snap.val()||{}).map(([id,v])=>({id,...v}));
  if(currentScreen==="chat")render();
 });

 onValue(ref(db,"gifts"),snap=>{
  gifts=Object.entries(snap.val()||{}).map(([id,v])=>({id,...v}));
  if(currentScreen==="gifts"||currentScreen==="admin")render();
 });
}

function navigate(screen){
 currentScreen=screen;
 $("sidebar").classList.remove("open");
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.screen===screen));
 const titles={
  home:"خانه",chat:"چت عمومی",private:"پیام‌های خصوصی",saved:"پیام‌های ذخیره‌شده",
  channels:"کانال‌ها",groups:"گروه‌ها",premium:"AVanta Premium",
  gifts:"VANTA Gifts",profile:"پروفایل",settings:"تنظیمات",admin:"پنل مدیریت"
 };
 $("topTitle").innerHTML=esc(titles[screen]||"ÀVanta")+"<small>Gaming • Chat • Community</small>";
 render();
}

function render(){
 if(!me)return;
 if(currentScreen==="home")renderHome();
 else if(currentScreen==="chat")renderChat("public");
 else if(currentScreen==="private")renderPrivate();
 else if(currentScreen==="saved")renderSaved();
 else if(currentScreen==="channels")renderChannels();
 else if(currentScreen==="groups")renderGroups();
 else if(currentScreen==="premium")renderPremium();
 else if(currentScreen==="gifts")renderGifts();
 else if(currentScreen==="profile")renderProfile();
 else if(currentScreen==="settings")renderSettings();
 else if(currentScreen==="admin")renderAdmin();
}

function renderHome(){
 $("content").innerHTML=`
 <section class="screen">
  <div class="hero">
   <div class="heroLogo">À</div>
   <h1>ÀVanta</h1>
   <p>Gaming • Chat • Community • Premium • VANTAcoin • Gifts</p>
   <div class="actions">
    <button class="primary" id="enterMessenger">💬 ورود به ÀVanta Messenger</button>
   </div>
   <div class="socials">
    <a class="secondary" href="https://discord.com" target="_blank">🎮 Discord</a>
    <a class="secondary" href="https://t.me" target="_blank">✈️ Telegram</a>
    <a class="secondary" href="https://youtube.com" target="_blank">▶️ YouTube</a>
    <a class="secondary" href="https://instagram.com" target="_blank">📷 Instagram</a>
   </div>
  </div>
 </section>`;
 $("enterMessenger").onclick=()=>navigate("chat");
}

function chatHeader(){
 return `<div class="tabs">
  <button class="tab active">💬 عمومی</button>
  <button class="tab" onclick="window.AVPrivate()">✉️ خصوصی</button>
 </div>`;
}

function renderChat(type){
 currentChat=type;
 $("content").innerHTML=`
 <section class="chat">
  <div class="messages" id="messages"><div style="text-align:center;color:var(--muted)">در حال بارگذاری پیام‌ها...</div></div>
  <div class="chatInput">
   <div style="flex:1">
    <div id="replyBox" class="reply hidden"></div>
    <div class="emojiBar" id="emojiBar"></div>
    <textarea id="messageInput" rows="1" placeholder="پیامت را بنویس..."></textarea>
   </div>
   <button class="send" id="sendBtn">➤</button>
  </div>
 </section>`;

 customEmojis.forEach(e=>{
  const b=document.createElement("button");
  b.className="emojiBtn";
  b.innerHTML=e.url?`<img class="customEmoji" src="${esc(e.url)}">`:"😀";
  b.onclick=()=>insertEmoji(e.url?`[emoji:${e.id}]`:(e.char||"😀"));
  $("emojiBar").appendChild(b);
 });
 ["😀","😂","😍","🔥","❤️","👍","🎮","💎","😭","🤣"].forEach(x=>{
  const b=document.createElement("button");
  b.className="emojiBtn";b.textContent=x;b.onclick=()=>insertEmoji(x);$("emojiBar").appendChild(b);
 });

 $("sendBtn").onclick=sendPublicMessage;
 $("messageInput").onkeydown=e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendPublicMessage()}
 };
 listenMessages();
}

function insertEmoji(x){
 const input=$("messageInput");
 input.value+=x;
 input.focus();
}

function formatMessage(text){
 let s=esc(text);
 s=s.replace(/\[emoji:([^\]]+)\]/g,(a,id)=>{
  const e=customEmojis.find(x=>x.id===id);
  return e?.url?`<img class="customEmoji" src="${esc(e.url)}">`:a;
 });
 return s.replace(/\n/g,"<br>");
}

function listenMessages(){
 const path=currentChat==="public"?"messages/public":"messages/"+currentChat;
 onValue(ref(db,path),snap=>{
  const data=snap.val()||{};
  const arr=Object.entries(data).map(([id,v])=>({id,...v})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const box=$("messages");
  if(!box)return;
  box.innerHTML=arr.slice(-200).map(m=>messageHTML(m)).join("")||
   `<div style="text-align:center;color:var(--muted);margin:auto">هنوز پیامی وجود ندارد 👋</div>`;
  box.querySelectorAll("[data-reply]").forEach(x=>x.onclick=()=>{
   const m=arr.find(y=>y.id===x.dataset.reply);
   if(m){replyTo=m;$("replyBox").classList.remove("hidden");$("replyBox").textContent="↩ "+(m.text||"")}
  });
  box.querySelectorAll("[data-react]").forEach(x=>x.onclick=()=>reactMessage(x.dataset.react,x.dataset.emoji));
  box.scrollTop=box.scrollHeight;
 });
}

 return `<div class="msg ${mine?"mine":""}">
  ${avatarHTML(u)}
  <div>
   <div class="bubble">
    ${!mine?userNameHTML(u):""}
    ${m.replyText?`<div class="reply">↩ ${esc(m.replyText)}</div>`:""}

 file.onchange=()=>compressImage(file.files[0]).then(x=>{
  $("emojiPreview").innerHTML=`<img src="${x}" style="width:70px;height:70px;object-fit:contain">`;

 $("createEmoji").onclick=async()=>{
  const name=$("emojiName").value.trim()||"ÀVanta Emoji";
  const char=$("emojiChar").value.trim()||"😀";
  const f=file.files[0];
  let url="";
  if(f){
   const compressed=await compressBlob(f);
   const path="emojis/"+Date.now()+"_"+Math.random().toString(36).slice(2)+".jpg";
   const sref=storageRef(storage,path);
   await uploadBytes(sref,compressed,{contentType:"image/jpeg"});
   url=await getDownloadURL(sref);
  }
  const id=push(ref(db,"emojis")).key;
  await set(ref(db,"emojis/"+id),{id,name,char,url,createdAt:Date.now(),premium:true});
  closeModal();toast("ایموجی ساخته شد 😀");render();
 };
 document.querySelectorAll("[data-delete-emoji]").forEach(b=>b.onclick=async()=>{
  await remove(ref(db,"emojis/"+b.dataset.deleteEmoji));adminEmoji();
 });
}

function compressImage(file){
 return compressBlob(file).then(blob=>URL.createObjectURL(blob));
}

function compressBlob(file){
 return new Promise((resolve,reject)=>{
  const img=new Image();
  const reader=new FileReader();
  reader.onload=()=>{
   img.onload=()=>{
    const max=256;
    let w=img.width,h=img.height;
    if(w>max||h>max){
     const scale=Math.min(max/w,max/h);w*=scale;h*=scale;
    }
    const c=document.createElement("canvas");
    c.width=Math.round(w);c.height=Math.round(h);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>b?resolve(b):reject(new Error("compression failed")),"image/jpeg",.82);
   };
   img.onerror=reject;img.src=reader.result;
  };
  reader.onerror=reject;reader.readAsDataURL(file);
 });
}

async function cleanMessages(){
 if(!confirm("پیام‌های قدیمی حذف شوند؟"))return;
 const snap=await get(ref(db,"messages/public"));
 const data=snap.val()||{};
 const cutoff=Date.now()-30*86400000;
 const changes={};
 Object.entries(data).forEach(([id,m])=>{if(m.createdAt&&m.createdAt<cutoff)changes[id]=null});
 await update(ref(db,"messages/public"),changes);
 toast("پیام‌های قدیمی پاک شدند");
}
