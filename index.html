<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AVanta | First Stream</title>

<meta name="description"
content="AVanta - Gaming, Streaming & Entertainment">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
    Tahoma,
    Arial,
    sans-serif;

    background:#07070b;
    color:#fff;

    overflow-x:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input{
    font-family:inherit;
}


/* =========================================================
   BACKGROUND
========================================================= */

.background{
    position:fixed;
    inset:0;
    z-index:-10;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(125,50,255,.12),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(0,180,255,.07),
            transparent 35%
        ),
        #07070b;
}

.orb{
    position:absolute;
    width:400px;
    height:400px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.15;
}

.orb-one{
    background:#8b3dff;
    top:-180px;
    right:-100px;
}

.orb-two{
    background:#006eff;
    bottom:-200px;
    left:-120px;
}

.grid{
    position:absolute;
    inset:0;
    opacity:.08;

    background-image:
        linear-gradient(
            rgba(255,255,255,.08) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.08) 1px,
            transparent 1px
        );

    background-size:50px 50px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 85%
        );
}


/* =========================================================
   INTRO
========================================================= */

#intro{
    position:fixed;
    inset:0;
    z-index:9999;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    background:#07070b;

    animation:
        introOut 1s ease 2s forwards;
}

.intro-logo{
    font-size:58px;
    font-weight:900;
    letter-spacing:-4px;
}

.intro-logo span{
    color:#a65cff;
}

.intro-line{
    width:120px;
    height:2px;
    margin:20px 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            #a65cff,
            transparent
        );
}

#intro p{
    color:#777;
    font-size:11px;
    letter-spacing:6px;
}

@keyframes introOut{

    to{
        opacity:0;
        visibility:hidden;
        pointer-events:none;
    }

}


/* =========================================================
   NAVBAR
========================================================= */

.navbar{
    width:min(1180px,92%);
    margin:20px auto;

    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 22px;

    border:1px solid rgba(255,255,255,.07);

    border-radius:20px;

    background:
        rgba(10,10,15,.65);

    backdrop-filter:blur(20px);

    position:sticky;
    top:15px;
    z-index:100;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:-1px;
}

.logo span{
    color:#a65cff;
}

.navbar nav{
    display:flex;
    gap:30px;
}

.navbar nav a{
    color:#888;
    font-size:13px;
    transition:.25s;
}

.navbar nav a:hover{
    color:#fff;
}

.join-button{
    padding:11px 18px;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #984eff,
            #6125c5
        );

    font-size:12px;

    box-shadow:
        0 0 25px rgba(142,64,255,.2);
}


/* =========================================================
   HERO
========================================================= */

.hero{
    width:min(1180px,92%);
    min-height:700px;

    margin:auto;

    display:grid;
    grid-template-columns:1.1fr .9fr;

    align-items:center;

    gap:50px;
}

.hero-content{
    padding-top:50px;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;

    padding:9px 14px;

    border-radius:30px;

    border:1px solid rgba(166,92,255,.2);

    background:
        rgba(166,92,255,.07);

    color:#b995ff;

    font-size:11px;
}

.dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#62ee91;

    box-shadow:
        0 0 12px #62ee91;
}

.welcome{
    margin-top:28px;

    color:#777;

    letter-spacing:5px;

    font-size:12px;
}

.hero h1{
    margin-top:8px;

    font-size:
        clamp(70px,12vw,150px);

    line-height:.9;

    letter-spacing:-8px;

    font-weight:900;
}

.hero h1 span{
    color:#a65cff;
}

.description{
    margin-top:30px;

    color:#999;

    line-height:2;

    font-size:14px;
}

.countdown-box{
    margin-top:35px;

    width:min(560px,100%);

    padding:22px;

    border-radius:20px;

    border:1px solid rgba(255,255,255,.07);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.015)
        );

    backdrop-filter:blur(20px);
}

.countdown-title{
    color:#999;
    font-size:10px;
    letter-spacing:3px;

    display:flex;
    align-items:center;
    gap:8px;
}

.countdown-title span{
    width:6px;
    height:6px;

    border-radius:50%;
    background:#a65cff;

    box-shadow:
        0 0 12px #a65cff;
}

.countdown{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:10px;

    margin-top:18px;
}

.time-box{
    text-align:center;
    min-width:75px;
}

.time-box strong{
    display:block;

    font-size:30px;

    font-weight:800;
}

.time-box small{
    color:#666;
    font-size:10px;
}

.separator{
    color:#65439b;
}

.date{
    text-align:center;

    margin-top:17px;

    color:#777;

    font-size:10px;

    letter-spacing:3px;
}

#finished{
    text-align:center;
    margin-top:10px;
    color:#a65cff;
    font-size:12px;
}


/* =========================================================
   HERO VISUAL
========================================================= */

.hero-visual{
    min-height:500px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
}

.avatar{
    width:260px;
    height:260px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            #211036,
            #0b0910 70%
        );

    border:
        1px solid rgba(166,92,255,.35);

    box-shadow:
        0 0 80px rgba(140,62,255,.25),
        inset 0 0 50px rgba(140,62,255,.08);

    position:relative;
    z-index:2;
}

.avatar::before{
    content:"";

    position:absolute;
    inset:-20px;

    border-radius:50%;

    border:
        1px solid rgba(166,92,255,.18);

    animation:
        rotate 12s linear infinite;
}

.avatar-text{
    font-size:70px;
    font-weight:900;
    letter-spacing:-5px;
}

.avatar-text span{
    color:#a65cff;
}

.ring{
    position:absolute;

    border-radius:50%;

    border:1px solid rgba(166,92,255,.15);
}

.ring-one{
    width:400px;
    height:400px;
}

.ring-two{
    width:500px;
    height:500px;
    border-style:dashed;
    opacity:.4;

    animation:
        rotate 25s linear infinite;
}

.floating{
    position:absolute;

    padding:10px 14px;

    border-radius:12px;

    background:
        rgba(15,12,23,.8);

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(15px);

    color:#aaa;

    font-size:10px;

    z-index:4;
}

.floating-one{
    top:18%;
    right:3%;
}

.floating-two{
    bottom:17%;
    left:3%;
}

@keyframes rotate{
    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   SECTIONS
========================================================= */

.section{
    width:min(1050px,92%);

    margin:
        100px auto;
}

.section-heading{
    display:flex;
    align-items:center;

    gap:15px;

    margin-bottom:30px;
}

.section-heading span{
    color:#7043a8;
    font-size:12px;
}

.section-heading h2{
    font-size:28px;
}

.section-heading b{
    color:#a65cff;
}

.about-card{
    display:flex;
    align-items:center;
    gap:30px;

    padding:35px;

    border-radius:25px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.012)
        );

    border:1px solid rgba(255,255,255,.07);
}

.about-logo{
    width:90px;
    height:90px;

    min-width:90px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            #914cff,
            #3c1b78
        );

    font-size:27px;
    font-weight:900;
}

.about-text h3{
    margin-bottom:12px;
}

.about-text p{
    color:#888;
    line-height:2;
    font-size:13px;
    margin-top:5px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.info-card{
    padding:28px;

    border-radius:20px;

    border:1px solid rgba(255,255,255,.06);

    background:
        rgba(255,255,255,.025);

    transition:.3s;
}

.info-card:hover{
    transform:translateY(-6px);

    border-color:
        rgba(166,92,255,.25);

    background:
        rgba(166,92,255,.05);
}

.card-icon{
    font-size:30px;
    margin-bottom:20px;
}

.info-card h3{
    margin-bottom:10px;
}

.info-card p{
    color:#777;
    font-size:12px;
    line-height:1.8;
}


/* =========================================================
   SOCIAL
========================================================= */

.social-section{
    text-align:center;
}

.social-section .section-heading{
    justify-content:center;
}

.social-description{
    color:#777;
    font-size:13px;
    line-height:2;
}

.socials{
    margin-top:30px;

    display:grid;
    grid-template-columns:repeat(4,1fr);

    gap:12px;
}

.social-card{
    padding:20px;

    display:flex;
    flex-direction:column;
    gap:10px;
    align-items:center;

    border-radius:18px;

    border:1px solid rgba(255,255,255,.06);

    background:
        rgba(255,255,255,.025);

    transition:.3s;
}

.social-card:hover{
    transform:translateY(-5px);

    background:
        rgba(166,92,255,.07);

    border-color:
        rgba(166,92,255,.2);
}

.social-card strong{
    font-size:25px;
}

.social-card span{
    font-size:11px;
    color:#888;
}


/* =========================================================
   CHAT
========================================================= */

#avanta-chat{
    width:min(1050px,92%);

    margin:120px auto;

    position:relative;
}

.chat-shell{
    position:relative;

    border-radius:28px;

    padding:1px;

    background:
        linear-gradient(
            135deg,
            rgba(166,92,255,.5),
            rgba(255,255,255,.05),
            rgba(0,190,255,.15)
        );

    box-shadow:
        0 30px 100px rgba(0,0,0,.35);
}

.chat-container{
    border-radius:27px;

    padding:30px;

    background:
        rgba(9,9,14,.96);

    backdrop-filter:blur(25px);
}


/* CHAT HEADER */

.chat-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:25px;
}

.chat-brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.chat-brand-icon{
    width:48px;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            #9a4dff,
            #5720b3
        );

    box-shadow:
        0 0 25px rgba(154,77,255,.25);
}

.chat-brand h2{
    font-size:21px;
}

.chat-brand p{
    margin-top:4px;
    color:#666;
    font-size:10px;
}

.live{
    display:flex;
    align-items:center;
    gap:7px;

    color:#777;

    font-size:10px;
}

.live-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#4be58a;

    box-shadow:
        0 0 12px #4be58a;
}


/* STATUS */

#chat-status{
    color:#666;
    font-size:10px;

    margin-bottom:10px;
}


/* MESSAGES */

#chat-messages{
    height:420px;

    overflow-y:auto;

    padding:15px;

    border-radius:18px;

    background:
        rgba(0,0,0,.2);

    border:1px solid rgba(255,255,255,.05);
}

#chat-messages::-webkit-scrollbar{
    width:5px;
}

#chat-messages::-webkit-scrollbar-thumb{
    background:#6c36bb;
    border-radius:10px;
}

.chat-message{
    display:flex;
    gap:11px;

    padding:13px;

    margin-bottom:9px;

    border-radius:15px;

    background:
        rgba(255,255,255,.025);

    border:1px solid rgba(255,255,255,.045);

    animation:
        messageIn .25s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(5px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message-avatar{
    width:38px;
    height:38px;

    min-width:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    color:#b991ff;

    background:
        rgba(145,76,255,.12);

    border:1px solid rgba(145,76,255,.12);

    font-size:12px;
    font-weight:bold;
}

.message-content{
    flex:1;
    min-width:0;
}

.message-top{
    display:flex;
    gap:8px;
    align-items:center;

    margin-bottom:4px;
}

.chat-name{
    color:#b98aff;
    font-size:12px;
    font-weight:bold;
}

.chat-time{
    color:#444;
    font-size:9px;
}

.chat-text{
    color:#bbb;
    font-size:12px;
    line-height:1.8;
    word-break:break-word;
}

.chat-actions{
    display:flex;
    gap:5px;
    margin-top:8px;
}

.chat-action{
    border:0;

    padding:5px 8px;

    border-radius:7px;

    color:#fff;

    font-size:9px;

    cursor:pointer;
}

.delete-btn{
    background:#7c2738;
}

.ban-btn{
    background:#542b8c;
}


/* EMPTY */

.empty-chat{
    height:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:10px;

    color:#555;

    font-size:11px;
}

.empty-chat-icon{
    font-size:32px;
    opacity:.4;
}


/* INPUT */

.chat-form{
    display:grid;

    grid-template-columns:150px 1fr 110px;

    gap:8px;

    margin-top:12px;
}

.chat-input{
    height:48px;

    width:100%;

    padding:0 14px;

    color:#fff;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid rgba(255,255,255,.07);

    border-radius:12px;

    outline:none;

    font-size:11px;

    transition:.2s;
}

.chat-input:focus{
    border-color:
        rgba(166,92,255,.45);

    box-shadow:
        0 0 20px rgba(166,92,255,.08);
}

.chat-input::placeholder{
    color:#4f4f4f;
}

#chat-send{
    border:0;

    border-radius:12px;

    color:#fff;

    font-size:11px;
    font-weight:bold;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #984dff,
            #6029bd
        );

    transition:.25s;
}

#chat-send:hover{
    transform:translateY(-2px);

    box-shadow:
        0 8px 25px rgba(130,55,240,.25);
}


/* ADMIN */

.admin-login{
    margin-top:25px;

    padding-top:20px;

    border-top:
        1px solid rgba(255,255,255,.05);
}

.admin-title{
    color:#666;
    font-size:10px;
    margin-bottom:10px;
}

.admin-form{
    display:flex;
    gap:7px;
}

.admin-input{
    height:40px;

    padding:0 12px;

    background:#0b0b10;

    color:#fff;

    border:
        1px solid rgba(255,255,255,.06);

    border-radius:9px;

    outline:none;

    font-size:10px;
}

.admin-login-btn{
    height:40px;

    padding:0 15px;

    border:0;

    border-radius:9px;

    background:#6635a8;

    color:#fff;

    cursor:pointer;

    font-size:10px;
}

#admin-status{
    margin-top:7px;
    color:#555;
    font-size:9px;
}

#admin-panel{
    display:none;

    margin-bottom:15px;

    padding:10px 13px;

    border-radius:10px;

    background:
        rgba(146,76,255,.07);

    border:
        1px solid rgba(146,76,255,.15);

    color:#b995ff;

    font-size:10px;
}

#admin-logout{
    float:left;

    border:0;

    padding:5px 9px;

    border-radius:7px;

    color:#aaa;

    background:
        rgba(255,255,255,.05);

    cursor:pointer;

    font-size:9px;
}


/* =========================================================
   FOOTER
========================================================= */

footer{
    text-align:center;

    padding:
        60px 20px
        35px;

    border-top:
        1px solid rgba(255,255,255,.05);

    margin-top:100px;
}

.footer-logo{
    font-size:24px;
    font-weight:900;
}

.footer-logo span{
    color:#a65cff;
}

footer p{
    margin-top:8px;

    color:#555;

    font-size:10px;
}

footer small{
    display:block;

    margin-top:20px;

    color:#444;

    font-size:9px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

    .navbar{
        height:62px;
    }

    .navbar nav{
        display:none;
    }

    .hero{
        grid-template-columns:1fr;
        text-align:center;

        min-height:auto;

        padding:
            70px 0
            40px;
    }

    .hero-content{
        padding-top:20px;
    }

    .badge{
        margin:auto;
    }

    .description{
        font-size:12px;
    }

    .hero-visual{
        min-height:390px;
    }

    .avatar{
        width:190px;
        height:190px;
    }

    .avatar-text{
        font-size:52px;
    }

    .ring-one{
        width:300px;
        height:300px;
    }

    .ring-two{
        width:360px;
        height:360px;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .socials{
        grid-template-columns:
            repeat(2,1fr);
    }

    .about-card{
        flex-direction:column;
        text-align:center;
    }

    .chat-container{
        padding:18px;
    }

    .chat-form{
        grid-template-columns:1fr;
    }

    #chat-send{
        height:45px;
    }

    .admin-form{
        flex-direction:column;
    }

    .admin-input,
    .admin-login-btn{
        width:100%;
    }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media(max-width:450px){

    .hero h1{
        font-size:75px;
        letter-spacing:-5px;
    }

    .countdown{
        gap:3px;
    }

    .time-box{
        min-width:55px;
    }

    .time-box strong{
        font-size:22px;
    }

    .separator{
        font-size:15px;
    }

    .socials{
        grid-template-columns:1fr 1fr;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background">

    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
    <div class="grid"></div>

</div>


<!-- =====================================================
     INTRO
===================================================== -->

<div id="intro">

    <div class="intro-logo">
        <span>AV</span>anta
    </div>

    <div class="intro-line"></div>

    <p>FIRST STREAM</p>

</div>


<!-- =====================================================
     NAVBAR
===================================================== -->

<header class="navbar">

    <a href="#home" class="logo">
        A<span>V</span>anta
    </a>

    <nav>

        <a href="#home">خانه</a>

        <a href="#about">درباره من</a>

        <a href="#social">شبکه‌ها</a>

        <a href="#avanta-chat">چت</a>

    </nav>

    <a href="#social" class="join-button">
        همراه شو
    </a>

</header>


<!-- ===================
