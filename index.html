<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ÀVanta Messenger</title>

<style>
:root{
--bg:#080b12;--panel:#101620;--panel2:#151d29;--panel3:#1b2533;
--line:#293548;--text:#f7f9ff;--muted:#8d9aad;
--accent:#795cff;--accent2:#21c9ff;--danger:#ff5577;--success:#35d39a;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:active{transform:scale(.97)}
.hidden{display:none!important}

#app{width:100%;height:100dvh;max-width:1050px;margin:auto;background:
radial-gradient(circle at 20% 0,#27215355,transparent 35%),
radial-gradient(circle at 100% 100%,#0d516255,transparent 30%),var(--bg);
position:relative;overflow:hidden}

.topbar{
height:66px;padding:9px 12px;display:flex;align-items:center;gap:9px;
border-bottom:1px solid var(--line);background:#0d121acc;backdrop-filter:blur(20px);
position:relative;z-index:10
}
.brand{font-size:21px;font-weight:950;white-space:nowrap}
.brand i{font-style:normal;color:#9b8bff}
.search{height:44px;flex:1;min-width:80px;background:var(--panel2);
border:1px solid var(--line);border-radius:17px;padding:0 14px;color:#fff;outline:0}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px #795cff18}

.icon{
width:43px;height:43px;border:1px solid var(--line);border-radius:15px;
background:var(--panel2);color:#fff;display:grid;place-items:center;font-size:20px
}

.pages{height:calc(100dvh - 66px);overflow:auto;padding:14px 12px 105px}
.page{display:none;animation:page .22s ease}
.page.active{display:block}
@keyframes page{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.card{
background:linear-gradient(180deg,#141b26,#101620);
border:1px solid var(--line);border-radius:23px;padding:15px;margin-bottom:12px;
box-shadow:0 15px 45px #0005
}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12px}
.title{font-size:20px;font-weight:900;margin:2px 0 14px}

.btn{
border:0;border-radius:15px;padding:11px 15px;font-weight:850;color:#fff;
background:var(--panel3);border:1px solid var(--line);transition:.15s
}
.btn.primary{background:linear-gradient(135deg,var(--accent),#4e83ff);border-color:#8473ff}
.btn.danger{background:#451b29;color:#ffb0c0;border-color:#743045}
.btn.success{background:#123b32;color:#7dffd1;border-color:#236c59}
.btn.full{width:100%}

.input,.textarea,.select{
width:100%;background:#0b1017;color:#fff;border:1px solid var(--line);
border-radius:15px;padding:12px;outline:0;margin:5px 0 10px
}
.textarea{min-height:90px;resize:vertical}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent)}

.list{display:flex;flex-direction:column;gap:8px}
.item{
display:flex;align-items:center;gap:11px;padding:11px;border:1px solid #253043;
background:#121a25;border-radius:19px;transition:.15s
}
.item:hover{background:#172130}
.avatar{
width:52px;height:52px;border-radius:17px;flex:none;display:grid;place-items:center;
font-weight:950;font-size:19px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));
overflow:hidden
}
.avatar img{width:100%;height:100%;object-fit:cover}

.badge{
display:inline-flex;align-items:center;justify-content:center;gap:5px;
height:25px;padding:0 9px;border-radius:999px;color:#fff;font-size:11px;font-weight:950;
background:linear-gradient(135deg,#b18cff,#657cff);
box-shadow:0 0 18px #806bff88;vertical-align:middle
}
.avanta-mark{
display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;
background:radial-gradient(circle,#d9d0ff,#755dff 55%,#3c2ba5);
box-shadow:0 0 13px #806bff,0 0 28px #806bff55;
font-weight:1000;font-size:12px;color:#fff
}

.bottom{
position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
width:min(1020px,calc(100% - 18px));padding:7px;display:grid;grid-template-columns:repeat(4,1fr);
gap:6px;background:#111821eF;border:1px solid #334055;border-radius:27px;
box-shadow:0 20px 70px #000b;backdrop-filter:blur(22px);z-index:50
}
.bottom button{
border:0;background:transparent;color:#8d98aa;border-radius:20px;min-height:58px;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px
}
.bottom button.active{color:#fff;background:#795cff18;box-shadow:inset 0 0 0 1px #795cff45}
.navIcon{font-size:23px;line-height:1}

.profile{
text-align:center;padding:22px
}
.bigAvatar{
width:116px;height:116px;border-radius:34px;margin:0 auto 13px;display:grid;place-items:center;
overflow:hidden;font-size:39px;font-weight:1000;
background:linear-gradient(135deg,var(--accent),var(--accent2));
box-shadow:0 0 35px #795cff55
}
.bigAvatar img{width:100%;height:100%;object-fit:cover}

.profileMenu{
display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px
}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#151e2a;border:1px solid var(--line);border-radius:17px;padding:12px}
.stat b{font-size:20px;display:block;margin-top:3px}

.modal{
position:fixed;inset:0;background:#000b;z-index:100;display:none;
align-items:flex-end;justify-content:center;padding:9px
}
.modal.open{display:flex}
.sheet{
width:min(760px,100%);max-height:92dvh;overflow:auto;background:#111821;
border:1px solid #354258;border-radius:28px;padding:17px;
animation:sheet .2s ease
}
@keyframes sheet{from{opacity:0;transform:translateY(35px)}to{opacity:1;transform:none}}

.profileLarge{text-align:center}
.profileLarge .bigAvatar{width:130px;height:130px}

.chat{
position:fixed;inset:0;background:#090d14;z-index:80;display:none;flex-direction:column
}
.chat.open{display:flex}
.chatHead{
height:65px;display:flex;align-items:center;gap:9px;padding:8px 10px;
background:#111821;border-bottom:1px solid var(--line)
}
.messages{flex:1;overflow:auto;padding:15px}
.message{
max-width:78%;padding:9px 12px;border-radius:18px;background:#161f2c;
border:1px solid #293548;margin:6px 0;word-break:break-word
}
.message.mine{margin-right:auto;background:linear-gradient(135deg,#4f3fa0,#315ba1);border-color:#6658bc}
.message img{max-width:100%;border-radius:12px}
.composer{
display:flex;gap:7px;padding:9px;background:#0d131b;border-top:1px solid var(--line)
}
.composer input{flex:1;min-width:0;background:#171f2b;border:1px solid var(--line);
border-radius:17px;color:#fff;padding:12px;outline:0}

.gifts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.gift{
background:#151e2a;border:1px solid #2b374a;border-radius:20px;padding:14px;text-align:center
}
.giftIcon{font-size:44px;margin:4px}
.pill{display:inline-block;padding:4px 8px;border-radius:9px;background:#253247;color:#bfcbe0;font-size:10px;margin:4px}

.toast{
position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:200;
background:#18212e;border:1px solid #3b4960;border-radius:15px;padding:11px 16px;
display:none;box-shadow:0 12px 35px #0008
}
.toast.show{display:block;animation:toast .2s}
@keyframes toast{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}

.color{
width:34px;height:34px;border-radius:50%;border:2px solid #fff4;cursor:pointer
}
.empty{text-align:center;padding:30px;color:var(--muted)}

@media(max-width:650px){
.stats{grid-template-columns:1fr 1fr}
.grid3{grid-template-columns:1fr 1fr 1fr}
}
</style>
</head>

<body>

<div id="toast" class="toast"></div>

<div id="authModal" class="modal open">
<div class="sheet" style="text-align:center">
<div class="brand" style="font-size:38px;margin:20px">À<i>Vanta</i></div>
<div class="muted" style="margin-bottom:22px">Messenger</div>
<button id="googleBtn" class="btn primary full">ورود با Google</button>
<button id="guestBtn" class="btn full" style="margin-top:8px">ورود مهمان</button>

</div>
</div>

<div id="app">

<header class="topbar">
<div class="brand">À<i>Vanta</i></div>
<input id="search" class="search" placeholder="جستجوی چت، مخاطب یا username">
<button id="newBtn" class="icon">＋</button>
</header>

<main class="pages">

<section id="chats" class="page active">
<div class="card">
<div class="row between">
<div><div class="title" style="margin:0">Chats</div><div class="muted small">پیام‌های اخیر</div></div>
<button id="savedBtn" class="btn">Saved</button>
</div>
</div>

</section>

<section id="contacts" class="page">

<div class="title">مخاطبین</div>
<input id="contactSearch" class="input" placeholder="@username یا UID">
<button id="findContact" class="btn primary full">پیدا کردن کاربر</button>
</div>
<div id="contactList" class="list"></div>
</section>

<section id="settings" class="page">
<div class="card">
<div class="title">Settings</div>

<button id="editInfo" class="btn full">Edit Info</button>
<button id="setPhoto" class="btn full" style="margin-top:7px">Set Photo</button>
<button id="profileColor" class="btn full" style="margin-top:7px">Change Profile Colour</button>
<button id="nameEmoji" class="btn full" style="margin-top:7px">Premium Name Emoji</button>
<button id="storyBtn" class="btn full" style="margin-top:7px">Add Story</button>
<button id="premiumBtn" class="btn full" style="margin-top:7px">ÀVanta Premium</button>
<button id="savedSettings" class="btn full" style="margin-top:7px">Saved Messages</button>

<button id="adminBtn" class="btn primary full hidden" style="margin-top:12px">⚡ ÀVanta Control Center</button>
</div>

<div class="card">
<div class="title">Create</div>
<div class="grid2">
<button id="groupBtn" class="btn primary">＋ Group</button>
<button id="channelBtn" class="btn primary">＋ Channel</button>
<button id="giftBtn" class="btn">🎁 Gift Shop</button>
<button id="gifMakerBtn" class="btn">GIF Maker</button>
</div>
</div>
</section>

<section id="profile" class="page">

<div class="card profile">
<div id="myAvatar" class="bigAvatar">A</div>

<h2 id="myName" style="margin:5px 0">ÀVanta User</h2>

<div id="myUsername" class="muted">@user</div>

<div id="myBadges" style="margin:10px"></div>

<div id="myBio" class="muted"></div>

<div class="profileMenu">
<button id="profileEdit" class="btn primary">Edit Info</button>
<button id="profilePhoto" class="btn">Set Photo</button>
<button id="profileMore" class="btn">•••</button>
</div>
</div>

<div class="card">
<div class="title">Special IDs</div>
<div id="specialIds" class="muted">
@AVANTA · @VANTA · @AV · @A7 · @V7
</div>
</div>

<div class="card">
<div class="title">Gift Collection</div>
<div id="myGifts" class="empty">هنوز Gift دریافت نکرده‌ای.</div>
</div>

</section>

</main>

<nav class="bottom">
<button data-page="contacts">
<span class="navIcon">♙</span>
مخاطبین
</button>

<button data-page="chats" class="active">
<span class="navIcon">◌</span>
چت‌ها
</button>

<button data-page="settings">
<span class="navIcon">◉</span>
تنظیمات
</button>

<button data-page="profile">
<span class="navIcon">◎</span>
پروفایل
</button>
</nav>

</div>

<div id="modal" class="modal">
<div class="sheet">
<div class="row between">
<h3 id="modalTitle" style="margin:0">ÀVanta</h3>
<button id="closeModal" class="icon">×</button>
</div>
<div id="modalBody" style="margin-top:14px"></div>
</div>
</div>

<div id="chat" class="chat">

<header class="chatHead">
<button id="backChat" class="icon">‹</button>
<div id="chatAvatar" class="avatar">A</div>
<div class="grow">
<b id="chatTitle">Chat</b>
<div id="chatStatus" class="muted small"></div>
</div>
<button id="chatProfile" class="icon">◎</button>
</header>

<div id="messages" class="messages"></div>

<div class="composer">
<input id="messageInput" placeholder="پیام...">
<input id="gifFile" type="file" accept="image/gif" hidden>
<button id="gifBtn" class="icon" style="width:48px">GIF</button>
<button id="sendBtn" class="btn primary">➤</button>
</div>

</div>

<input id="photoFile" type="file" accept="image/*" hidden>
<input id="storyFile" type="file" accept="image/*,video/*" hidden>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
GoogleAuthProvider,
signInWithPopup,
signInAnonymously,
updateProfile
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
getDatabase,
ref,
get,
set,
update,
push,
remove,
onValue
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig={
apiKey:"AIzaSyBsncHhhlqIi6qpf3hYtb0DOnq8Zjb-zpI",
authDomain:"avanta-3db7e.firebaseapp.com",
databaseURL:"https://avanta-3db7e-default-rtdb.firebaseio.com",
projectId:"avanta-3db7e",
storageBucket:"avanta-3db7e.firebasestorage.app",
messagingSenderId:"879564538420",
appId:"1:879564538420:web:a0fc85cc43a9347d92c061"
};

const ADMIN_UID="NNY1ymTknwREwMo16ZI3lgFEni23";

const firebaseApp=initializeApp(firebaseConfig);
const auth=getAuth(firebaseApp);
const db=getDatabase(firebaseApp);

let user=null;
let userData={};
let activeChat=null;
let messageListener=null;


/* =========================================================
   HELPERS
========================================================= */

const $=id=>document.getElementById(id);

function escapeHTML(value){
return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function toast(text){
$("toast").textContent=text;
$("toast").classList.add("show");
clearTimeout(window.__toast);
window.__toast=setTimeout(()=>{
$("toast").classList.remove("show");
},1900);
}

function openModal(title,html){
$("modalTitle").textContent=title;
$("modalBody").innerHTML=html;
$("modal").classList.add("open");
}

function closeModal(){
$("modal").classList.remove("open");
}

$("closeModal").onclick=closeModal;

$("modal").addEventListener("click",e=>{
if(e.target===$("modal"))closeModal();
});

function userRef(){
return ref(db,"users/"+user.uid);
}

async function saveUser(data){
await update(userRef(),data);
userData={...userData,...data};
renderProfile();
}

function avatar(data,size=""){
const letter=(data?.name||"U").trim().slice(0,1).toUpperCase();

return `
<div class="avatar ${size}">
${data?.photo
?`<img src="${escapeHTML(data.photo)}">`
:escapeHTML(letter)}
</div>`;
}


/* =========================================================
   NAVIGATION
========================================================= */

document.querySelectorAll(".bottom button").forEach(btn=>{
btn.onclick=()=>{
const page=btn.dataset.page;

document.querySelectorAll(".page").forEach(p=>{
p.classList.remove("active");
});

$(page).classList.add("active");

document.querySelectorAll(".bottom button").forEach(x=>{
x.classList.toggle("active",x===btn);
});
};
});


/* =========================================================
   AUTH
========================================================= */

$("googleBtn").onclick=async()=>{
try{
const provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});
await signInWithPopup(auth,provider);
}catch(error){

let message=error.message;

if(error.code==="auth/unauthorized-domain"){
message="دامنه سایت در Firebase Authentication > Settings > Authorized domains اضافه نشده.";
}

if(error.code==="auth/popup-blocked"){
message="Popup توسط مرورگر مسدود شده است.";
}

$("authError").textContent=message;
}
};

$("guestBtn").onclick=async()=>{
try{
await signInAnonymously(auth);
}catch(error){
$("authError").textContent=error.message;
}
};

onAuthStateChanged(auth,async currentUser=>{
if(!currentUser)return;

user=currentUser;

$("authModal").classList.remove("open");

await loadUser();

$("app").classList.remove("hidden");

loadChats();
loadContacts();
});


/* =========================================================
   USER
========================================================= */

async function loadUser(){

const snapshot=await get(userRef());

if(snapshot.exists()){

userData=snapshot.val();

}else{

userData={
name:user.displayName||"ÀVanta User",
username:"user_"+user.uid.slice(0,7),
bio:"",
premium:false,
vc:0,
createdAt:Date.now()
};

await set(userRef(),userData);
}

renderProfile();

$("adminBtn").classList.toggle(
"hidden",
user.uid!==ADMIN_UID
);
}

function renderProfile(){

const name=userData.name||user.displayName||"ÀVanta User";
const username=userData.username||"user_"+user.uid.slice(0,7);

$("myName").textContent=name;
$("myUsername").textContent="@"+username;
$("myBio").textContent=userData.bio||"";

$("myAvatar").innerHTML=userData.photo
?`<img src="${escapeHTML(userData.photo)}">`
:escapeHTML(name.slice(0,1).toUpperCase());

$("myAvatar").style.background=
userData.color||"linear-gradient(135deg,var(--accent),var(--accent2))";

if(userData.premium){

$("myBadges").innerHTML=`
<span class="badge" id="myPremiumBadge">
<span class="avanta-mark">À</span>
ÀVanta Premium
</span>`;

$("myPremiumBadge").onclick=showPremium;

}else{

$("myBadges").innerHTML="";
}
}


/* =========================================================
   CHATS
========================================================= */

function loadChats(){

onValue(ref(db,"publicChats"),snapshot=>{

const list=$("chatList");
list.innerHTML="";

if(!snapshot.exists()){

list.innerHTML=`
<div class="card empty">
هنوز چتی وجود ندارد.<br>
از دکمه ＋ گروه یا کانال بساز.
</div>`;

return;
}

const chats=Object.entries(snapshot.val())
.sort((a,b)=>
(b[1].updatedAt||0)-(a[1].updatedAt||0)
);

for(const [id,c] of chats){

const el=document.createElement("div");
el.className="item";

el.innerHTML=`
${avatar(c)}
<div class="grow">
<div class="row">
<b>${escapeHTML(c.name||"Chat")}</b>
${c.premium?'<span class="badge">✦</span>':""}
</div>
<div class="muted small">
${escapeHTML(c.lastMessage||(
c.type==="channel"?"کانال":
c.type==="group"?"گروه":"چت خصوصی"
))}
</div>
</div>
<div class="muted small">
${c.type==="channel"?"Channel":c.type==="group"?"Group":"Chat"}
</div>
`;

el.onclick=()=>openChat(id,c);

list.appendChild(el);
}
});
}


/* =========================================================
   CONTACTS
========================================================= */

function loadContacts(){

onValue(ref(db,"users"),snapshot=>{

const list=$("contactList");
list.innerHTML="";

if(!snapshot.exists())return;

Object.entries(snapshot.val())
.filter(([uid])=>uid!==user.uid)
.slice(0,100)
.forEach(([uid,data])=>{

const el=document.createElement("div");
el.className="item";

el.innerHTML=`
${avatar(data)}
<div class="grow">
<div class="name">
${escapeHTML(data.name||"User")}
${data.premium?'<span class="badge">✦</span>':""}
</div>
<div class="muted small">@${escapeHTML(data.username||uid)}</div>
</div>
<button class="btn">Message</button>
`;

el.querySelector("button").onclick=e=>{
e.stopPropagation();
openPrivate(uid,data);
};

el.onclick=()=>openUserProfile(uid,data);

list.appendChild(el);
});
});
}


$("findContact").onclick=async()=>{

const query=$("contactSearch").value.trim()
.replace(/^@/,"")
.toLowerCase();

if(!query)return;

const snap=await get(ref(db,"users"));

if(!snap.exists()){
toast("کاربری پیدا نشد");
return;
}

let result=null;

for(const [uid,data] of Object.entries(snap.val())){

if(
uid===query ||
String(data.username||"").toLowerCase()===query
){

result={uid,data};
break;
}
}

if(!result){
toast("کاربر پیدا نشد");
return;
}

openUserProfile(result.uid,result.data);
};


/* =========================================================
   PROFILE OF OTHER USER
========================================================= */

function openUserProfile(uid,data){

const premium=data.premium?`
<div style="margin:9px">
<span class="badge" id="otherPremium">
<span class="avanta-mark">À</span>
ÀVanta Premium
</span>
</div>`:"";

openModal(
"Profile",
`
<div class="profileLarge">

<div class="bigAvatar">
${data.photo
?`<img src="${escapeHTML(data.photo)}">`
:escapeHTML((data.name||"U").slice(0,1).toUpperCase())}
</div>

<h2>${escapeHTML(data.name||"User")}</h2>

<div class="muted">@${escapeHTML(data.username||uid)}</div>

${premium}

<div class="muted" style="margin:13px">
${escapeHTML(data.bio||"")}
</div>

<div class="grid3">

========================================================= */

async function openPrivate(uid,data){

const chatId=[user.uid,uid].sort().join("_");

const chatData={
type:"private",
name:data.name||"User",
peerUid:uid,
owner:user.uid,
updatedAt:Date.now()
};

await update(
ref(db,"publicChats/"+chatId),
chatData
);

openChat(chatId,chatData);
}

function openChat(id,data){

activeChat={id,...data};

$("chatTitle").textContent=data.name||"Chat";

$("chatStatus").textContent=
data.type==="group"?"Group":
data.type==="channel"?"Channel":
"Private chat";

$("chatAvatar").textContent=
(data.name||"A").slice(0,1).toUpperCase();

$("chat").classList.add("open");

if(messageListener)messageListener();

messageListener=onValue(
ref(db,"messages/"+id),
snapshot=>{
renderMessages(snapshot.val()||{});
}
);
}

function renderMessages(data){

const box=$("messages");
box.innerHTML="";

const messages=Object.entries(data)
.sort((a,b)=>
(a[1].createdAt||0)-(b[1].createdAt||0)
);

if(!messages.length){

box.innerHTML=`
<div class="empty">
هنوز پیامی ارسال نشده.
</div>`;

return;
}

messages.forEach(([id,m])=>{

const el=document.createElement("div");

el.className="message "+
(m.uid===user.uid?"mine":"");

if(m.gif){

el.innerHTML=`
<img src="${escapeHTML(m.gif)}">
<div class="small muted">
${escapeHTML(m.name||"User")}
</div>
`;

}else if(m.giftId){

el.innerHTML=`
<div style="font-size:34px">🎁</div>
<b>${escapeHTML(m.name||"User")}</b>
<div class="small">Gift sent</div>
`;

}else{

el.innerHTML=`
<b>${escapeHTML(m.name||"User")}</b>
<div>${escapeHTML(m.text||"")}</div>
`;
}

box.appendChild(el);
});

box.scrollTop=box.scrollHeight;
}

async function sendMessage(){

const text=$("messageInput").value.trim();

if(!text||!activeChat)return;

await push(
ref(db,"messages/"+activeChat.id),
{
uid:user.uid,
name:userData.name||user.displayName||"User",
text,
createdAt:Date.now()
}
);

await update(
ref(db,"publicChats/"+activeChat.id),
{
lastMessage:text,
updatedAt:Date.now()
}
);

$("messageInput").value="";
}

$("sendBtn").onclick=sendMessage;

$("messageInput").addEventListener("keydown",e=>{
if(e.key==="Enter"&&!e.shiftKey){
e.preventDefault();
sendMessage();
}
});

$("chat").classList.remove("open");

async function changeVC(sign){

const uid=$("vcUid").value.trim();
const amount=Number($("vcAmount").value);

if(!uid||!amount){
toast("UID و مقدار را وارد کن");
return;
}

const r=ref(db,"users/"+uid);
const s=await get(r);

if(!s.exists()){
toast("کاربر پیدا نشد");
return;
}

const old=Number(s.val().vc||0);
const next=Math.max(0,old+sign*amount);

await update(r,{vc:next});

await push(
ref(db,"vcTransactions/"+uid),
{
amount:sign*amount,
before:old,
after:next,
by:user.uid,
createdAt:Date.now()
}
);

toast("VC تغییر کرد");
}

$("vcAdd").onclick=()=>changeVC(1);
$("vcRemove").onclick=()=>changeVC(-1);
}

box.innerHTML="";

if(!snap.exists()){
box.innerHTML='<div class="empty">Gift وجود ندارد.</div>';
return;
}

Object.entries(snap.val()).forEach(([id,g])=>{

const el=document.createElement("div");

el.className="item";

el.innerHTML=`
<div style="font-size:30px">${escapeHTML(g.icon||"🎁")}</div>

<div class="grow">

<b>${escapeHTML(g.name||"Gift")}</b>

<div class="muted small">
${escapeHTML(g.type||"normal")}
 · ${escapeHTML(g.price||0)} VC
</div>

</div>

<button class="btn danger deleteGift" data-id="${id}">
Delete
</button>
`;

el.querySelector("button").onclick=async()=>{

await remove(ref(db,"gifts/"+id));

toast("Gift حذف شد");

loadGiftAdminList();
};

box.appendChild(el);
});
}

);

toast("Emoji ساخته شد");
};

reader.readAsDataURL(file);
};
