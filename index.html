<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ÀVanta Messenger</title>
<style>
:root{--accent:#7662ff;--bg:#080c13;--panel:#111923;--panel2:#172230;--line:#2a384b;--muted:#91a0b5}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:#fff;border:0}#app{height:100dvh;max-width:960px;margin:auto;background:var(--bg);display:flex;flex-direction:column}.top{height:66px;display:flex;align-items:center;gap:9px;padding:9px 12px;background:#0e151f;border-bottom:1px solid var(--line);position:relative;z-index:5}.brand{font-weight:1000;font-size:21px;white-space:nowrap}.brand b,.logoBig b{color:#a493ff}.search{flex:1;min-width:50px;background:#182331;border:1px solid #2c3b4e;color:#fff;border-radius:17px;padding:10px 12px;outline:0}main{flex:1;overflow:auto;padding:14px 12px 100px}.page{display:none}.page.on{display:block}.card,.row{background:var(--panel);border:1px solid var(--line);border-radius:21px;padding:14px;margin-bottom:10px}.row{display:flex;align-items:center;gap:11px;transition:.15s}.row:active{transform:scale(.985)}.title{font-size:21px;font-weight:950;margin-bottom:5px}.muted{color:var(--muted)}.small{font-size:12px}.grow{flex:1;min-width:0}.avatar{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,#806bff,#21c9ff);font-weight:950;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.avatar.big{width:118px;height:118px;border-radius:35px;margin:4px auto 10px;font-size:42px}.cover{height:145px;border-radius:22px;background:linear-gradient(135deg,#6d5ce7,#1cc7ff);background-size:cover;background-position:center;margin:-14px -14px 12px}.btn{background:#1b2634;border:1px solid #34445a;border-radius:15px;padding:10px 13px;font-weight:800;transition:.15s}.btn:active{transform:scale(.96)}.primary{background:linear-gradient(135deg,#7b65ff,#4d83ff);border-color:#8274ff}.danger{background:#481e2b;border-color:#713347}.full{width:100%;margin-top:7px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bottom{position:fixed;bottom:9px;left:50%;transform:translateX(-50%);width:min(940px,calc(100% - 16px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;background:#111a25ee;border:1px solid #34445b;border-radius:27px;backdrop-filter:blur(20px);z-index:20;box-shadow:0 12px 45px #0008}.bottom button{background:transparent;border-radius:21px;padding:7px 3px;color:#8997aa}.bottom button.on{background:#7461ff22;color:#fff}.navico{font-size:21px;display:block;line-height:22px}.input,.textarea{width:100%;background:#0a1018;border:1px solid #314055;border-radius:15px;color:#fff;padding:11px;outline:0;margin:4px 0 8px}.textarea{min-height:90px;resize:vertical}.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:linear-gradient(135deg,#9c86ff,#547dff);font-size:11px;font-weight:950;box-shadow:0 0 17px #806cff66}.premiummark{width:23px;height:23px;border-radius:50%;display:inline-grid;place-items:center;background:radial-gradient(circle,#eee7ff,#8068ff 54%,#33238f);box-shadow:0 0 13px #8977ff;font-weight:1000}.modal{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:flex-end;padding:8px}.modal.on{display:flex}.sheet{width:min(720px,100%);max-height:92dvh;overflow:auto;background:#101923;border:1px solid #34445a;border-radius:28px;padding:16px}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.chat{position:fixed;inset:0;z-index:40;background:#080d14;display:none;flex-direction:column}.chat.on{display:flex}.chathead{height:66px;display:flex;align-items:center;gap:9px;padding:8px;background:#111a24;border-bottom:1px solid var(--line)}.messages{flex:1;overflow:auto;padding:13px}.msg{max-width:80%;width:max-content;background:#172434;border:1px solid #2d3c50;border-radius:18px;padding:8px 11px;margin:6px 0}.msg.mine{margin-right:auto;background:#4d3e9b;border-color:#6d5bc3}.msg img{max-width:260px;border-radius:13px;display:block}.composer{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);background:#0e151f}.composer input{flex:1;min-width:0;background:#182331;border:1px solid #314055;border-radius:18px;color:#fff;padding:10px;outline:0}.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;background:#172230;border:1px solid #40506a;border-radius:15px;padding:10px 15px;display:none;max-width:90%;text-align:center}.toast.on{display:block}.empty{text-align:center;padding:30px 10px;color:var(--muted)}.login{position:fixed;inset:0;background:radial-gradient(circle at 50% 0,#221c4b,#080c13 55%);z-index:200;display:grid;place-items:center;padding:20px}.login.hide{display:none}.loginbox{width:min(440px,100%);background:#111923ee;border:1px solid #35445a;border-radius:30px;padding:24px;text-align:center;box-shadow:0 20px 80px #0009}.logoBig{font-size:42px;font-weight:1000}.spinner{width:17px;height:17px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:middle}@keyframes spin{to{transform:rotate(360deg)}}.color{width:43px;height:43px;border-radius:50%;border:2px solid #fff3}.colors{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.stat{font-size:22px;font-weight:950}.shopItem{text-align:center}.emojiBox{display:grid;place-items:center;height:90px;border-radius:18px;background:#0b111a;border:1px solid var(--line);overflow:hidden}.emojiBox img{max-width:80px;max-height:80px}.verified{color:#65e0a4;font-weight:900}.coverPreview{height:100px;border-radius:18px;background-size:cover;background-position:center;margin:8px 0}
@media(max-width:500px){.top{gap:6px}.brand{font-size:18px}.btn{padding:9px 10px}}
</style></head><body>
<div id="toast" class="toast"></div>
<div id="login" class="login"><div class="loginbox"><div class="logoBig">À<b>Vanta</b></div><div class="muted" style="margin-bottom:22px">Messenger</div><button id="googleLogin" class="btn primary full">ورود با Google</button><button id="guestLogin" class="btn full">ورود به‌عنوان مهمان</button><div id="loginStatus" class="muted small" style="margin-top:12px"></div></div></div>
<div id="app"><header class="top"><div class="brand">À<b>Vanta</b></div><input id="search" class="search" placeholder="جستجوی چت یا مخاطب"><button id="newBtn" class="btn primary">＋</button></header>
<main>
<section id="chatsPage" class="page on"><div class="card"><div class="title">Chats</div><div class="muted small">پیام‌ها، گروه‌ها و کانال‌ها</div></div><div id="chatList"></div></section>
<section id="contactsPage" class="page"><div class="card"><div class="title">مخاطبین</div><input id="contactInput" class="input" placeholder="UID یا username"><button id="findContact" class="btn primary full">افزودن مخاطب</button></div><div id="contactsList"></div></section>
<section id="settingsPage" class="page"><div class="card"><div class="title">Settings</div><button id="editInfo" class="btn full">Edit Info</button><button id="setPhoto" class="btn full">Set Photo</button><button id="profileColor" class="btn full">Change Profile Colour</button><button id="nameEmoji" class="btn full">Premium Name Emoji</button><button id="storyBtn" class="btn full">Add Story</button><button id="premiumBtn" class="btn full">ÀVanta Premium</button><button id="savedBtn" class="btn full">Saved Messages</button><button id="adminBtn" class="btn primary full" style="display:none">⚡ Admin Panel</button><button id="logoutBtn" class="btn danger full">خروج</button></div><div class="card"><div class="title">Create</div><div class="grid2"><button id="groupBtn" class="btn primary">👥 Group</button><button id="channelBtn" class="btn primary">📢 Channel</button><button id="giftBtn" class="btn">🎁 Gifts Shop</button><button id="gifMakerBtn" class="btn">GIF</button></div></div></section>
<section id="profilePage" class="page"><div class="card"><div id="profileCover" class="cover"></div><div style="text-align:center"><div id="bigAvatar"></div><h2 id="profileName" style="margin:6px 0"></h2><div id="profileUsername" class="muted"></div><div id="profileBadges" style="margin:10px"></div><div id="profileBio" class="muted"></div><div class="grid3" style="margin-top:15px"><button id="profileEdit" class="btn primary">Edit Info</button><button id="profilePhoto" class="btn">Set Photo</button><button id="profileMore" class="btn">•••</button></div></div></div><div class="card"><div class="title">Gift Collection</div><div id="giftCollection" class="empty"></div></div><div class="card"><div class="title">Stories</div><div id="storyList" class="empty">هنوز Storyای نیست.</div></div></section>
</main><nav class="bottom"><button data-page="contactsPage"><span class="navico">♙</span>مخاطبین</button><button data-page="chatsPage" class="on"><span class="navico">◌</span>چت‌ها</button><button data-page="settingsPage"><span class="navico">◉</span>تنظیمات</button><button data-page="profilePage"><span class="navico">◎</span>پروفایل</button></nav></div>
<input id="photoFile" type="file" accept="image/*" hidden><input id="coverFile" type="file" accept="image/*" hidden><input id="storyFile" type="file" accept="image/*,video/*" hidden><input id="gifFile" type="file" accept="image/gif" hidden><input id="premiumEmojiFile" type="file" accept="image/*" hidden>
<div id="modal" class="modal"><div class="sheet"><div class="sheethead"><h3 id="modalTitle">ÀVanta</h3><button id="closeModal" class="btn">×</button></div><div id="modalBody"></div></div></div>
<div id="chat" class="chat"><header class="chathead"><button id="backChat" class="btn">‹</button><div id="chatAvatar" class="avatar">A</div><div class="grow"><b id="chatTitle">Chat</b><div id="chatSub" class="muted small"></div></div><button id="chatMenu" class="btn">•••</button></header><div id="messages" class="messages"></div><div class="composer"><button id="chatGif" class="btn">GIF</button><input id="messageInput" placeholder="پیام..."><button id="sendMessage" class="btn primary">➤</button></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInAnonymously,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getDatabase,ref,set,get,push,onValue,update}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyBsncHhhlqIi6qpf3hYtb0DOnq8Zjb-zpI",authDomain:"avanta-3db7e.firebaseapp.com",databaseURL:"https://avanta-3db7e-default-rtdb.firebaseio.com",projectId:"avanta-3db7e",storageBucket:"avanta-3db7e.firebasestorage.app",messagingSenderId:"879564538420",appId:"1:879564538420:web:a0fc85cc43a9347d92c061"};
const ADMIN_UID="NNY1ymTknwREwMo16ZI3lgFEni23";const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);const $=id=>document.getElementById(id);let user=null,profile=null,activeChat=null,chatMeta=null,unsubs=[];
const toast=t=>{const x=$("toast");x.textContent=t;x.classList.add("on");clearTimeout(window._toast);window._toast=setTimeout(()=>x.classList.remove("on"),2400)};const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
function friendlyError(e){const m={"auth/popup-blocked":"Popup توسط مرورگر مسدود شد.","auth/popup-closed-by-user":"ورود لغو شد.","auth/network-request-failed":"اتصال اینترنت یا Firebase مشکل دارد.","auth/unauthorized-domain":"دامنه در Firebase مجاز نشده است.","auth/operation-not-allowed":"روش ورود در Firebase فعال نیست.","PERMISSION_DENIED":"Firebase Rules اجازه این عملیات را نمی‌دهد."};return m[e?.code]||e?.message||"خطای نامشخص"}
function modal(t,h){$("modalTitle").textContent=t;$("modalBody").innerHTML=h;$("modal").classList.add("on")}function closeModal(){$("modal").classList.remove("on")}$('closeModal').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};
$('googleLogin').onclick=async()=>{try{$('loginStatus').textContent="در حال ورود...";await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$('loginStatus').textContent=friendlyError(e);toast(friendlyError(e))}};
$('guestLogin').onclick=async()=>{try{$('loginStatus').textContent="در حال ورود...";await signInAnonymously(auth)}catch(e){$('loginStatus').textContent=friendlyError(e);toast(friendlyError(e))}};$('logoutBtn').onclick=()=>signOut(auth);
async function ensureProfile(u){const r=ref(db,"users/"+u.uid),s=await get(r);if(!s.exists()){const p={uid:u.uid,name:u.displayName||"ÀVanta User",username:u.email?.split("@")[0]||"guest_"+u.uid.slice(0,6),email:u.email||"",photo:u.photoURL||"",cover:"",bio:"",premium:false,profileColor:"#7662ff",nameEmoji:"",createdAt:Date.now()};await set(r,p);return p}return s.val()}
onAuthStateChanged(auth,async u=>{user=u;if(!u){$('login').classList.remove('hide');return}$('login').classList.add('hide');try{profile=await ensureProfile(u);$('adminBtn').style.display=u.uid===ADMIN_UID?'block':'none';renderAll();subscribeUser()}catch(e){toast(friendlyError(e))}});
function subscribeUser(){unsubs.forEach(f=>f&&f());unsubs=[];unsubs.push(onValue(ref(db,"users/"+user.uid),s=>{profile=s.val()||profile;renderAll()}));unsubs.push(onValue(ref(db,"userChats/"+user.uid),renderChats));unsubs.push(onValue(ref(db,"contacts/"+user.uid),renderContacts));}
function avatar(o,big=false){return `<div class="avatar${big?' big':''}" style="background:${esc(o?.profileColor||profile?.profileColor||'#7662ff')}">${o?.photo?`<img src="${esc(o.photo)}">`:esc((o?.name||'A').slice(0,1).toUpperCase())}</div>`}
function renderProfile(){if(!profile)return;$('bigAvatar').outerHTML=avatar(profile,true).replace('class="avatar big"','class="avatar big" id="bigAvatar"');$('profileName').innerHTML=esc(profile.name||'ÀVanta User')+(profile.nameEmoji?` <span>${esc(profile.nameEmoji)}</span>`:'');$('profileUsername').textContent='@'+(profile.username||'user');$('profileBadges').innerHTML=profile.premium?'<span class="badge"><span class="premiummark">À</span>ÀVanta Premium</span>':'';$('profileBio').textContent=profile.bio||'';$('profileCover').style.backgroundImage=profile.cover?`url("${profile.cover}")`:'';renderGiftCollection()}
async function renderChats(){if(!user)return;const box=$('chatList');const data=(window._chats||{});const arr=Object.entries(data).map(([id,v])=>({id,...v})).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));box.innerHTML=arr.length?'':'<div class="empty">هنوز چتی ندارید. از ＋ یک چت، گروه یا کانال بسازید.</div>';arr.forEach(c=>{const d=document.createElement('div');d.className='row';d.innerHTML=`${avatar(c)}<div class="grow"><b>${esc(c.name)}</b><div class="muted small">${esc(c.lastMessage||c.type||'chat')}</div></div><span class="muted small">${esc(c.type||'')}</span>`;d.onclick=()=>openChat(c);box.appendChild(d)})}
function renderContacts(snap){const box=$('contactsList');const data=snap?.val?.()||{};box.innerHTML='';const arr=Object.entries(data).map(([id,v])=>({id,...v}));if(!arr.length){box.innerHTML='<div class="empty">مخاطبی ندارید.</div>';return}arr.forEach(c=>{const d=document.createElement('div');d.className='row';d.innerHTML=`${avatar(c)}<div class="grow"><b>${esc(c.name)}</b><div class="muted small">@${esc(c.username||'')}</div></div><button class="btn primary">Chat</button>`;d.onclick=()=>openUser(c);d.querySelector('button').onclick=e=>{e.stopPropagation();openPrivate(c)};box.appendChild(d)})}
function renderAll(){renderProfile();renderChats();}
function subscribeChatsSnapshot(){return onValue(ref(db,"userChats/"+user.uid),s=>{window._chats=s.val()||{};renderChats()})}
async function findUser(q){q=q.replace(/^@/,'').trim();const s=await get(ref(db,'users'));for(const [uid,p] of Object.entries(s.val()||{}))if(uid===q||String(p.username||'').toLowerCase()===q.toLowerCase())return{uid,...p};return null}
$('findContact').onclick=async()=>{const q=$('contactInput').value.trim();if(!q)return toast('UID یا username را وارد کن');try{const p=await findUser(q);if(!p)return toast('کاربر پیدا نشد');if(p.uid===user.uid)return toast('نمی‌توانی خودت را اضافه کنی');await set(ref(db,`contacts/${user.uid}/${p.uid}`),{uid:p.uid,name:p.name,username:p.username,photo:p.photo||'',bio:p.bio||'',premium:!!p.premium,profileColor:p.profileColor||'#7662ff'});$('contactInput').value='';toast('مخاطب اضافه شد')}catch(e){toast(friendlyError(e))}};
function openUser(c){modal('Profile',`<div style="text-align:center">${avatar(c,true)}<h2>${esc(c.name)}</h2><div class="muted">@${esc(c.username||'')}</div><p class="muted">${esc(c.bio||'')}</p><div class="grid2"><button id="userMessage" class="btn primary">Message</button><button id="userGift" class="btn">🎁 Gift</button></div></div>`);$('userMessage').onclick=()=>{closeModal();openPrivate(c)};$('userGift').onclick=()=>{closeModal();openGiftShop(c)}}
async function openPrivate(c){const id=[user.uid,c.uid].sort().join('_'),meta={name:c.name,type:'private',photo:c.photo||'',otherUid:c.uid,updatedAt:Date.now()};await update(ref(db,`chats/${id}`),meta);await set(ref(db,`userChats/${user.uid}/${id}`),meta);await set(ref(db,`userChats/${c.uid}/${id}`),{...meta,name:profile.name,otherUid:user.uid});openChat({id,...meta})}
function openChat(c){activeChat=c.id;chatMeta=c;$('chat').classList.add('on');$('chatTitle').textContent=c.name;$('chatSub').textContent=c.type||'chat';$('chatAvatar').outerHTML=avatar({name:c.name,photo:c.photo}).replace('class="avatar"','class="avatar" id="chatAvatar"');subscribeMessages()}
function subscribeMessages(){if(window.msgUnsub)window.msgUnsub();window.msgUnsub=onValue(ref(db,`messages/${activeChat}`),s=>{const arr=Object.values(s.val()||{}).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));const box=$('messages');box.innerHTML=arr.length?'':'<div class="empty">هنوز پیامی نیست.</div>';arr.forEach(m=>{const d=document.createElement('div');d.className='msg'+(m.uid===user.uid?' mine':'');d.innerHTML=m.gif?`<img src="${esc(m.gif)}">`:`<div>${esc(m.text||'')}</div>`;box.appendChild(d)});box.scrollTop=box.scrollHeight})}
$('backChat').onclick=()=>{$('chat').classList.remove('on');activeChat=null;if(window.msgUnsub)window.msgUnsub()};
async function sendMessage(){const v=$('messageInput').value.trim();if(!v||!activeChat)return;try{await set(push(ref(db,`messages/${activeChat}`)),{uid:user.uid,name:profile.name,text:v,createdAt:Date.now()});await update(ref(db,`chats/${activeChat}`),{lastMessage:v,updatedAt:Date.now()});await update(ref(db,`userChats/${user.uid}/${activeChat}`),{lastMessage:v,updatedAt:Date.now()});$('messageInput').value=''}catch(e){toast(friendlyError(e))}}$('sendMessage').onclick=sendMessage;$('messageInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};
async function saveProfile(fields){await update(ref(db,'users/'+user.uid),fields);profile={...profile,...fields};renderProfile()}
function editInfo(){modal('Edit Info',`<input id="editName" class="input" value="${esc(profile.name||'')}" placeholder="Name"><input id="editUsername" class="input" value="${esc(profile.username||'')}" placeholder="Username"><textarea id="editBio" class="textarea">${esc(profile.bio||'')}</textarea><button id="saveInfo" class="btn primary full">Save</button>`);$('saveInfo').onclick=async()=>{try{await saveProfile({name:$('editName').value.trim()||'ÀVanta User',username:$('editUsername').value.trim().replace(/^@/,'')||'user',bio:$('editBio').value});closeModal();toast('ذخیره شد')}catch(e){toast(friendlyError(e))}}}$('editInfo').onclick=$('profileEdit').onclick=editInfo;
$('setPhoto').onclick=$('profilePhoto').onclick=()=>$('photoFile').click();$('photoFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>1800000)return toast('عکس حداکثر 1.8MB');const r=new FileReader();r.onload=async()=>{try{await saveProfile({photo:r.result});toast('عکس تغییر کرد')}catch(x){toast(friendlyError(x))}};r.readAsDataURL(f);e.target.value=''};
$('profileColor').onclick=()=>{if(!profile.premium)return toast('این قابلیت فقط برای Premium است');const cs=['#7662ff','#21c9ff','#ff4f9a','#36d89a','#ffad45','#a85cff','#ef62ff','#4d8cff'];modal('Change Profile Colour',`<div class="colors">${cs.map(c=>`<button class="color" data-c="${c}" style="background:${c}"></button>`).join('')}</div>`);document.querySelectorAll('.color').forEach(b=>b.onclick=async()=>{await saveProfile({profileColor:b.dataset.c});closeModal();toast('رنگ تغییر کرد')})};
$('nameEmoji').onclick=()=>{if(!profile.premium)return toast('این قابلیت فقط برای Premium است');const em=['✦','✧','⚡','◆','◈','✪','♛','☄','À'];modal('Premium Name Emoji',`<div class="grid3">${em.map(x=>`<button class="btn pem">${x}</button>`).join('')}</div>`);document.querySelectorAll('.pem').forEach(b=>b.onclick=async()=>{await saveProfile({nameEmoji:b.textContent});closeModal();toast('Emoji فعال شد')})};
$('premiumBtn').onclick=()=>modal('ÀVanta Premium',`<div style="text-align:center"><div class="premiummark" style="width:74px;height:74px;font-size:34px;margin:auto">À</div><h2>ÀVanta Premium</h2><p class="muted">رنگ پروفایل، Emoji نام، کاور و Giftهای ویژه.</p><button id="premiumDemo" class="btn primary full">فعال‌سازی</button></div>`);$('modalBody').addEventListener('click',async e=>{if(e.target.id==='premiumDemo'){try{await saveProfile({premium:true});closeModal();toast('Premium فعال شد')}catch(x){toast(friendlyError(x))}}});
$('storyBtn').onclick=()=>$('storyFile').click();$('storyFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>2000000)return toast('Story حداکثر 2MB');const r=new FileReader();r.onload=async()=>{try{await set(push(ref(db,`stories/${user.uid}`)),{data:r.result,type:f.type,createdAt:Date.now(),expiresAt:Date.now()+86400000});toast('Story منتشر شد');renderStories()}catch(x){toast(friendlyError(x))}};r.readAsDataURL(f);e.target.value=''};
async function renderStories(){try{const s=await get(ref(db,`stories/${user.uid}`));const a=Object.values(s.val()||{}).filter(x=>(x.expiresAt||0)>Date.now());$('storyList').innerHTML=a.length?a.map(x=>x.type?.startsWith('video')?`<video controls src="${x.data}" style="max-width:100%;border-radius:18px"></video>`:`<img src="${x.data}" style="max-width:100%;border-radius:18px">`).join(''):'هنوز Storyای نیست.'}catch(e){}}
$('profileMore').onclick=()=>modal('Profile Options',`<div class="grid2"><button id="pmGifts" class="btn primary">🎁 Gift Collection</button><button id="pmCover" class="btn">🖼 Change Profile Cover</button><button id="pmEmoji" class="btn">Premium Emoji</button><button id="pmStory" class="btn">Story</button></div>`);$('modalBody').addEventListener('click',e=>{if(e.target.id==='pmGifts'){closeModal();showMyGifts()}if(e.target.id==='pmCover'){closeModal();$('coverFile').click()}if(e.target.id==='pmEmoji'){closeModal();$('nameEmoji').click()}if(e.target.id==='pmStory'){closeModal();$('storyBtn').click()}});
$('coverFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>2500000)return toast('کاور حداکثر 2.5MB');const r=new FileReader();r.onload=async()=>{try{await saveProfile({cover:r.result});toast('کاور پروفایل تغییر کرد')}catch(x){toast(friendlyError(x))}};r.readAsDataURL(f);e.target.value=''};
function defaultGifts(){return[{id:'rose',name:'Crystal Rose',icon:'🌹',price:10},{id:'star',name:'VANTA Star',icon:'⭐',price:25},{id:'crown',name:'Royal Crown',icon:'👑',price:50},{id:'gem',name:'ÀVanta Gem',icon:'💎',price:100}]}
async function getGifts(){const s=await get(ref(db,'gifts'));const v=s.val()||{};const custom=Object.entries(v).map(([id,g])=>({id,...g}));return custom.length?custom:defaultGifts()}
async function wallet(){const s=await get(ref(db,`wallets/${user.uid}/vc`));return Number(s.val())||0}
async function openGiftShop(target=null){const gifts=await getGifts();const balance=await wallet();modal(target?'Send Gift':'VANTA Gifts Shop',`<div class="card" style="text-align:center"><b>VANTAcoin: ${balance} VC</b></div><div class="grid2">${gifts.map(g=>`<div class="card shopItem"><div style="font-size:48px">${esc(g.icon||'💎')}</div><b>${esc(g.name)}</b><div class="muted small">${Number(g.price)||0} VC</div><button class="btn primary full buyGift" data-id="${esc(g.id)}">${target?'Send':'Buy'}</button></div>`).join('')}</div>`);document.querySelectorAll('.buyGift').forEach(b=>b.onclick=async()=>{const g=gifts.find(x=>x.id===b.dataset.id);if(!g)return;const price=Number(g.price)||0;try{const bal=await wallet();if(bal<price)return toast('VANTAcoin کافی نیست');await set(ref(db,`wallets/${user.uid}/vc`),bal-price);if(target){await set(push(ref(db,`messages/${activeChat}`)),{uid:user.uid,name:profile.name,text:`🎁 ${g.name}`,gift:g,createdAt:Date.now()});toast('Gift ارسال شد')}else{await set(push(ref(db,`giftCollections/${user.uid}`)),{...g,boughtAt:Date.now()});toast('Gift خریداری شد')}closeModal();renderGiftCollection()}catch(e){toast(friendlyError(e))}})}
async function showMyGifts(){const s=await get(ref(db,`giftCollections/${user.uid}`));const a=Object.values(s.val()||{});modal('Gift Collection',a.length?`<div class="grid2">${a.map(g=>`<div class="card shopItem"><div style="font-size:48px">${esc(g.icon)}</div><b>${esc(g.name)}</b><div class="muted small">Purchased</div></div>`).join('')}</div>`:'<div class="empty">هنوز گیفتی نداری.<button id="openShopFromCollection" class="btn primary full">باز کردن Gift Shop</button></div>');const b=$('openShopFromCollection');if(b)b.onclick=()=>{closeModal();openGiftShop()}}
async function renderGiftCollection(){if(!user)return;try{const s=await get(ref(db,`giftCollections/${user.uid}`));const a=Object.values(s.val()||{});$('giftCollection').innerHTML=a.length?`<div class="grid3">${a.slice(0,12).map(g=>`<div class="card shopItem"><div style="font-size:35px">${esc(g.icon)}</div><b>${esc(g.name)}</b></div>`).join('')}</div><button id="allGifts" class="btn full">مشاهده کامل</button>`:'<div class="empty">هنوز Giftای نداری.<button id="buyFirstGift" class="btn primary full">خرید Gift</button></div>';const x=$('allGifts');if(x)x.onclick=showMyGifts;const y=$('buyFirstGift');if(y)y.onclick=()=>openGiftShop()}catch(e){}}
$('giftBtn').onclick=()=>openGiftShop();$('gifMakerBtn').onclick=()=>$('gifFile').click();$('chatGif').onclick=()=>$('gifFile').click();$('gifFile').onchange=e=>{const f=e.target.files[0];if(!f||!activeChat)return;if(f.size>3000000)return toast('GIF حداکثر 3MB');const r=new FileReader();r.onload=async()=>{try{await set(push(ref(db,`messages/${activeChat}`)),{uid:user.uid,name:profile.name,gif:r.result,createdAt:Date.now()});toast('GIF ارسال شد')}catch(x){toast(friendlyError(x))}};r.readAsDataURL(f);e.target.value=''};
async function createCommunity(type){modal(type==='group'?'Create Group':'Create Channel',`<input id="communityName" class="input" placeholder="Name"><input id="communityUsername" class="input" placeholder="Username"><textarea id="communityBio" class="textarea" placeholder="Description"></textarea><button id="createCommunity" class="btn primary full">Create</button>`);$('createCommunity').onclick=async()=>{const name=$('communityName').value.trim();if(!name)return toast('نام را وارد کن');try{const id=push(ref(db,'chats')).key,meta={name,type,username:$('communityUsername').value.trim(),bio:$('communityBio').value,owner:user.uid,updatedAt:Date.now()};await set(ref(db,`chats/${id}`),meta);await set(ref(db,`chatMembers/${id}/${user.uid}`),{role:'owner',joinedAt:Date.now()});await set(ref(db,`userChats/${user.uid}/${id}`),meta);closeModal();toast('ساخته شد')}catch(e){toast(friendlyError(e))}}}$('groupBtn').onclick=()=>createCommunity('group');$('channelBtn').onclick=()=>createCommunity('channel');
$('savedBtn').onclick=async()=>{const id='saved_'+user.uid,meta={name:'Saved Messages',type:'saved',owner:user.uid,updatedAt:Date.now()};try{await set(ref(db,`userChats/${user.uid}/${id}`),meta);openChat({id,...meta})}catch(e){toast(friendlyError(e))}};
$('newBtn').onclick=()=>modal('Create',`<div class="grid2"><button id="newGroup" class="btn primary">👥 Group</button><button id="newChannel" class="btn primary">📢 Channel</button><button id="newGift" class="btn">🎁 Gift Shop</button><button id="newGif" class="btn">GIF</button></div>`);$('modalBody').addEventListener('click',e=>{if(e.target.id==='newGroup'){closeModal();createCommunity('group')}if(e.target.id==='newChannel'){closeModal();createCommunity('channel')}if(e.target.id==='newGift'){closeModal();openGiftShop()}if(e.target.id==='newGif'){closeModal();$('gifFile').click()}});
$('adminBtn').onclick=()=>{if(user.uid!==ADMIN_UID)return;modal('ÀVANTA ADMIN',`<div class="grid2"><button id="adminUsers" class="btn">Users</button><button id="adminVC" class="btn">VANTAcoin</button><button id="adminGift" class="btn">Gift Manager</button><button id="adminPremium" class="btn">Premium</button><button id="adminEmoji" class="btn primary">Premium Emoji</button><button id="adminStats" class="btn">Stats</button></div>`)};
$('modalBody').addEventListener('click',async e=>{if(e.target.id==='adminUsers'){const s=await get(ref(db,'users'));const a=Object.values(s.val()||{});modal('Users',`<div class="stat">${a.length}</div><div class="muted">Registered users</div>${a.slice(0,30).map(x=>`<div class="row">${avatar(x)}<div class="grow"><b>${esc(x.name)}</b><div class="muted small">@${esc(x.username||'')}</div></div></div>`).join('')}`)}if(e.target.id==='adminVC'){modal('VANTAcoin',`<input id="vcUid" class="input" placeholder="User UID"><input id="vcAmount" class="input" type="number" placeholder="Amount"><button id="giveVC" class="btn primary full">Grant VC</button>`)}if(e.target.id==='giveVC'){try{const uid=$('vcUid').value.trim(),n=Number($('vcAmount').value);if(!uid||!Number.isFinite(n))return toast('اطلاعات ناقص');const old=await walletFor(uid);await set(ref(db,`wallets/${uid}/vc`),old+n);toast('VC ثبت شد');closeModal()}catch(x){toast(friendlyError(x))}}if(e.target.id==='adminGift'){modal('Gift Manager',`<input id="giftName" class="input" placeholder="Gift name"><input id="giftIcon" class="input" placeholder="Emoji"><input id="giftPrice" class="input" type="number" placeholder="VC price"><button id="createGiftAdmin" class="btn primary full">Create Gift</button>`)}if(e.target.id==='createGiftAdmin'){try{const id=push(ref(db,'gifts')).key;await set(ref(db,`gifts/${id}`),{name:$('giftName').value.trim(),icon:$('giftIcon').value||'💎',price:Number($('giftPrice').value)||0,createdAt:Date.now()});toast('Gift ساخته شد');closeModal()}catch(x){toast(friendlyError(x))}}if(e.target.id==='adminPremium'){modal('Premium Manager',`<input id="premiumUid" class="input" placeholder="User UID"><div class="grid2"><button id="grantPremium" class="btn primary">Grant</button><button id="revokePremium" class="btn danger">Revoke</button></div>`)}if(e.target.id==='grantPremium'||e.target.id==='revokePremium'){try{const uid=$('premiumUid').value.trim();if(!uid)return toast('UID را وارد کن');await update(ref(db,'users/'+uid),{premium:e.target.id==='grantPremium'});toast('انجام شد');closeModal()}catch(x){toast(friendlyError(x))}}if(e.target.id==='adminEmoji'){if(user.uid!==ADMIN_UID)return;modal('Premium Emoji Builder',`<p class="muted small">تصویر را انتخاب کن؛ به Base64 تبدیل و در Firebase ذخیره می‌شود.</p><input id="emojiName" class="input" placeholder="نام Emoji"><input id="emojiFileAdmin" type="file" accept="image/*" class="input"><input id="emojiId" class="input" placeholder="ID اختیاری"><button id="savePremiumEmoji" class="btn primary full">ساخت Emoji</button><div id="emojiPreview" class="emojiBox">Preview</div>`)}if(e.target.id==='savePremiumEmoji'){try{const f=$('emojiFileAdmin').files[0],name=$('emojiName').value.trim();if(!f||!name)return toast('نام و تصویر لازم است');if(f.size>700000)return toast('برای Base64 بهتر است تصویر زیر 700KB باشد');const data=await fileData(f);const id=$('emojiId').value.trim()||push(ref(db,'premiumEmojis')).key;await set(ref(db,`premiumEmojis/${id}`),{id,name,data,type:f.type,createdAt:Date.now(),owner:user.uid});toast('Premium Emoji ساخته شد');closeModal()}catch(x){toast(friendlyError(x))}}});
async function walletFor(uid){const s=await get(ref(db,`wallets/${uid}/vc`));return Number(s.val())||0}function fileData(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
$('chatMenu').onclick=()=>modal('Chat',`<div class="grid2"><button id="clearChat" class="btn danger">Clear</button><button id="closeChatMenu" class="btn">Close</button></div>`);$('modalBody').addEventListener('click',async e=>{if(e.target.id==='clearChat'){if(!activeChat)return;try{await set(ref(db,`messages/${activeChat}`),null);closeModal();toast('پیام‌ها پاک شدند')}catch(x){toast(friendlyError(x))}}if(e.target.id==='closeChatMenu')closeModal()});
document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(b.dataset.page).classList.add('on');document.querySelectorAll('.bottom button').forEach(x=>x.classList.toggle('on',x===b))});
$('search').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#chatList .row').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'':'none')};
// Keep chat list live even if the UI is opened before the auth callback finishes.
const oldAuth=onAuthStateChanged;
setTimeout(()=>{if(user){if(!window._chatLive)window._chatLive=subscribeChatsSnapshot()}},500);
</script></body></html>
