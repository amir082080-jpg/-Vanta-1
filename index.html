<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ÀVanta Messenger</title>

<style>
:root{
  --accent:#7662ff;
  --bg:#080c13;
  --panel:#111923;
  --panel2:#172230;
  --line:#2a384b;
  --muted:#91a0b5
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  background:var(--bg);color:#fff;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif
}
button,input,textarea{font:inherit}
button{cursor:pointer;color:#fff;border:0}
#app{
  height:100dvh;max-width:960px;margin:auto;
  background:var(--bg);display:flex;flex-direction:column
}
.top{
  height:66px;display:flex;align-items:center;gap:9px;
  padding:9px 12px;background:#0e151f;
  border-bottom:1px solid var(--line);
  position:relative;z-index:5
}
.brand{font-weight:1000;font-size:21px;white-space:nowrap}
.brand b,.logoBig b{color:#a493ff}
.search{
  flex:1;min-width:50px;background:#182331;
  border:1px solid #2c3b4e;color:#fff;
  border-radius:17px;padding:10px 12px;outline:0
}
main{flex:1;overflow:auto;padding:14px 12px 100px}
.page{display:none}.page.on{display:block}
.card,.row{
  background:var(--panel);border:1px solid var(--line);
  border-radius:21px;padding:14px;margin-bottom:10px
}
.row{display:flex;align-items:center;gap:11px;transition:.15s}
.row:active{transform:scale(.985)}
.title{font-size:21px;font-weight:950;margin-bottom:5px}
.muted{color:var(--muted)}
.small{font-size:12px}
.grow{flex:1;min-width:0}
.avatar{
  width:52px;height:52px;border-radius:18px;
  display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,#806bff,#21c9ff);
  font-weight:950;overflow:hidden
}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.big{
  width:118px;height:118px;border-radius:35px;
  margin:4px auto 10px;font-size:42px
}
.cover{
  height:145px;border-radius:22px;
  background:linear-gradient(135deg,#6d5ce7,#1cc7ff);
  background-size:cover;background-position:center;
  margin:-14px -14px 12px
}
.btn{
  background:#1b2634;border:1px solid #34445a;
  border-radius:15px;padding:10px 13px;font-weight:800;
  transition:.15s
}
.btn:active{transform:scale(.96)}
.primary{
  background:linear-gradient(135deg,#7b65ff,#4d83ff);
  border-color:#8274ff
}
.danger{background:#481e2b;border-color:#713347}
.full{width:100%;margin-top:7px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bottom{
  position:fixed;bottom:9px;left:50%;
  transform:translateX(-50%);
  width:min(940px,calc(100% - 16px));
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:4px;padding:6px;background:#111a25ee;
  border:1px solid #34445b;border-radius:27px;
  backdrop-filter:blur(20px);z-index:20;
  box-shadow:0 12px 45px #0008
}
.bottom button{
  background:transparent;border-radius:21px;
  padding:7px 3px;color:#8997aa
}
.bottom button.on{background:#7461ff22;color:#fff}
.navico{font-size:21px;display:block;line-height:22px}
.input,.textarea{
  width:100%;background:#0a1018;
  border:1px solid #314055;border-radius:15px;
  color:#fff;padding:11px;outline:0;margin:4px 0 8px
}
.textarea{min-height:90px;resize:vertical}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 9px;border-radius:999px;
  background:linear-gradient(135deg,#9c86ff,#547dff);
  font-size:11px;font-weight:950;
  box-shadow:0 0 17px #806cff66
}
.premiummark{
  width:23px;height:23px;border-radius:50%;
  display:inline-grid;place-items:center;
  background:radial-gradient(circle,#eee7ff,#8068ff 54%,#33238f);
  box-shadow:0 0 13px #8977ff;
  font-weight:1000
}
.modal{
  position:fixed;inset:0;background:#000b;z-index:50;
  display:none;align-items:flex-end;padding:8px
}
.modal.on{display:flex}
.sheet{
  width:min(720px,100%);max-height:92dvh;
  overflow:auto;background:#101923;
  border:1px solid #34445a;border-radius:28px;padding:16px
}
.sheethead{
  display:flex;align-items:center;
  justify-content:space-between;margin-bottom:8px
}
.chat{
  position:fixed;inset:0;z-index:40;background:#080d14;
  display:none;flex-direction:column
}
.chat.on{display:flex}
.chathead{
  height:66px;display:flex;align-items:center;gap:9px;
  padding:8px;background:#111a24;
  border-bottom:1px solid var(--line)
}
.messages{flex:1;overflow:auto;padding:13px}
.msg{
  max-width:80%;width:max-content;
  background:#172434;border:1px solid #2d3c50;
  border-radius:18px;padding:8px 11px;margin:6px 0
}
.msg.mine{
  margin-right:auto;background:#4d3e9b;
  border-color:#6d5bc3
}
.msg img{
  max-width:260px;border-radius:13px;
  display:block
}
.msg.emoji-message{
  background:transparent!important;
  border:0!important;padding:3px!important
}
.msg.emoji-message img{
  width:72px;height:72px;
  max-width:72px;max-height:72px;
  object-fit:contain;
  border-radius:0
}
.msg .gift-message{
  display:flex;align-items:center;gap:9px;
  font-weight:800
}
.msg .gift-icon{font-size:36px}
.composer{
  display:flex;gap:6px;padding:8px;
  border-top:1px solid var(--line);
  background:#0e151f
}
.composer input{
  flex:1;min-width:0;background:#182331;
  border:1px solid #314055;border-radius:18px;
  color:#fff;padding:10px;outline:0
}
.toast{
  position:fixed;top:14px;left:50%;
  transform:translateX(-50%);z-index:100;
  background:#172230;border:1px solid #40506a;
  border-radius:15px;padding:10px 15px;
  display:none;max-width:90%;text-align:center
}
.toast.on{display:block}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.login{
  position:fixed;inset:0;
  background:radial-gradient(circle at 50% 0,#221c4b,#080c13 55%);
  z-index:200;display:grid;place-items:center;padding:20px
}
.login.hide{display:none}
.loginbox{
  width:min(440px,100%);background:#111923ee;
  border:1px solid #35445a;border-radius:30px;
  padding:24px;text-align:center;
  box-shadow:0 20px 80px #0009
}
.logoBig{font-size:42px;font-weight:1000}
.spinner{
  width:17px;height:17px;border:2px solid #ffffff55;
  border-top-color:#fff;border-radius:50%;
  display:inline-block;animation:spin .7s linear infinite;
  vertical-align:middle
}
@keyframes spin{to{transform:rotate(360deg)}}
.color{
  width:43px;height:43px;border-radius:50%;
  border:2px solid #fff3
}
.colors{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stat{font-size:22px;font-weight:950}
.shopItem{text-align:center}
.emojiBox{
  display:grid;place-items:center;height:90px;
  border-radius:18px;background:#0b111a;
  border:1px solid var(--line);overflow:hidden
}
.emojiBox img{max-width:80px;max-height:80px}
.verified{color:#65e0a4;font-weight:900}
.coverPreview{
  height:100px;border-radius:18px;
  background-size:cover;background-position:center;
  margin:8px 0
}
.emoji-picker{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  max-height:55dvh;
  overflow:auto
}
.emoji-picker-item{
  min-height:82px;
  background:#0b111a;
  border:1px solid #2d3c50;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px
}
.emoji-picker-item img{
  width:58px;
  height:58px;
  object-fit:contain
}
.emoji-picker-item:active{transform:scale(.94)}
.text-emoji{
  font-size:42px;
  line-height:1
}
@media(max-width:500px){
  .top{gap:6px}
  .brand{font-size:18px}
  .btn{padding:9px 10px}
  .emoji-picker{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>

<body>

<div id="toast" class="toast"></div>

<div id="login" class="login">
  <div class="loginbox">
    <div class="logoBig">À<b>Vanta</b></div>
    <div class="muted" style="margin-bottom:22px">Messenger</div>

    <button id="googleLogin" class="btn primary full">
      ورود با Google
    </button>

    <button id="guestLogin" class="btn full">
      ورود به‌عنوان مهمان
    </button>

    <div id="loginStatus" class="muted small" style="margin-top:12px"></div>
  </div>
</div>

<div id="app">

<header class="top">
  <div class="brand">À<b>Vanta</b></div>
  <input id="search" class="search" placeholder="جستجوی چت یا مخاطب">
  <button id="newBtn" class="btn primary">＋</button>
</header>

<main>

<section id="chatsPage" class="page on">

    <div class="title">Chats</div>

</section>

<section id="settingsPage" class="page">
  <div class="card">
    <div class="title">Settings</div>

    <button id="editInfo" class="btn full">Edit Info</button>
    <button id="setPhoto" class="btn full">Set Photo</button>
    <button id="profileColor" class="btn full">Change Profile Colour</button>
    <button id="nameEmoji" class="btn full">Premium Name Emoji</button>
    <button id="storyBtn" class="btn full">Add Story</button>
    <button id="premiumBtn" class="btn full">ÀVanta Premium</button>
    <button id="savedBtn" class="btn full">Saved Messages</button>

    <button id="adminBtn" class="btn primary full" style="display:none">

      <button id="channelBtn" class="btn primary">📢 Channel</button>
      <button id="giftBtn" class="btn">🎁 Gifts Shop</button>
      <button id="gifMakerBtn" class="btn">GIF</button>

</section>

<section id="profilePage" class="page">
  <div class="card">

    <div style="text-align:center">

      <div id="bigAvatar"></div>

      <h2 id="profileName" style="margin:6px 0"></h2>

      <div id="profileUsername" class="muted"></div>

      <div class="grid3" style="margin-top:15px">
        <button id="profileEdit" class="btn primary">Edit Info</button>
        <button id="profilePhoto" class="btn">Set Photo</button>
        <button id="profileMore" class="btn">•••</button>
      </div>

    </div>

    <div class="title">Gift Collection</div>

  <div class="card">
    <div class="title">Stories</div>
    <div id="storyList" class="empty">هنوز Storyای نیست.</div>
  </div>
</section>

</main>

<nav class="bottom">
  <button data-page="contactsPage">
    <span class="navico">♙</span>مخاطبین
  </button>

  <button data-page="chatsPage" class="on">
    <span class="navico">◌</span>چت‌ها
  </button>

  <button data-page="settingsPage">
    <span class="navico">◉</span>تنظیمات
  </button>

  <button data-page="profilePage">
    <span class="navico">◎</span>پروفایل
  </button>
</nav>

</div>

<input id="photoFile" type="file" accept="image/*" hidden>
<input id="coverFile" type="file" accept="image/*" hidden>
<input id="storyFile" type="file" accept="image/*,video/*" hidden>
<input id="gifFile" type="file" accept="image/gif" hidden>

<div id="modal" class="modal">
  <div class="sheet">
    <div class="sheethead">
      <h3 id="modalTitle">ÀVanta</h3>
      <button id="closeModal" class="btn">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div id="chat" class="chat">

  <header class="chathead">

    <button id="backChat" class="btn">‹</button>

    <div id="chatAvatar" class="avatar">A</div>

    <div class="grow">
      <b id="chatTitle">Chat</b>
      <div id="chatSub" class="muted small"></div>

    <button id="chatMenu" class="btn">•••</button>

  <div id="messages" class="messages"></div>

    <button id="chatEmoji" class="btn" title="Premium Emoji">😊</button>

    <button id="chatGif" class="btn">GIF</button>

    <input id="messageInput" placeholder="پیام...">

    <button id="sendMessage" class="btn primary">➤</button>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signInAnonymously,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  set,
  get,
  push,
  onValue,
  update,
  runTransaction,
  remove
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig={
  apiKey:"AIzaSyBsncHhhlqIi6qpf3hYtb0DOnq8Zjb-zpI",
  authDomain:"avanta-3db7e.firebaseapp.com",
  databaseURL:"https://avanta-3db7e-default-rtdb.firebaseio.com",
  projectId:"avanta-3db7e",
  storageBucket:"avanta-3db7e.firebasestorage.app",
  messagingSenderId:"879564538420",
  appId:"1:879564538420:web:a0fc85cc43a9347d92c061"
};

const ADMIN_UID="NNY1ymTknwREwMo16ZI3lgFEni23";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

const $=id=>document.getElementById(id);

let user=null;
let profile=null;
let activeChat=null;
let chatMeta=null;
let unsubs=[];
let premiumEmojisCache=[];
let premiumEmojisLoaded=false;


/* =========================
   BASIC HELPERS
========================= */

const toast=t=>{
  const x=$("toast");
  x.textContent=t;
  x.classList.add("on");

  clearTimeout(window._toast);

  window._toast=setTimeout(()=>{
    x.classList.remove("on");
  },2400);
};

const esc=s=>String(s??"").replace(
  /[&<>"']/g,
  m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m])
);

function friendlyError(e){

  const m={
    "auth/popup-blocked":"Popup توسط مرورگر مسدود شد.",
    "auth/popup-closed-by-user":"ورود لغو شد.",
    "auth/network-request-failed":"اتصال اینترنت یا Firebase مشکل دارد.",
    "auth/unauthorized-domain":"دامنه در Firebase مجاز نشده است.",
    "auth/operation-not-allowed":"روش ورود در Firebase فعال نیست.",
    "PERMISSION_DENIED":"Firebase Rules اجازه این عملیات را نمی‌دهد.",
    "username/taken":"این Username قبلاً استفاده شده است.",
    "username/invalid":"Username باید حداقل 3 کاراکتر داشته باشد.",
    "community/username-taken":"این لینک/Username قبلاً استفاده شده است."
  };

  return m[e?.code]||e?.message||"خطای نامشخص";
}

function modal(t,h){
  $("modalTitle").textContent=t;
  $("modalBody").innerHTML=h;
  $("modal").classList.add("on");
}

function closeModal(){
  $("modal").classList.remove("on");
}

$("closeModal").onclick=closeModal;

$("modal").onclick=e=>{
  if(e.target===$("modal")) closeModal();
};

function normId(v){
  return String(v||"")
    .trim()
    .replace(/^@/,"")
    .toLowerCase()
    .replace(/[^a-z0-9_]/g,"")
    .slice(0,32);
}

function ownerUser(){
  return !!user&&user.uid===ADMIN_UID;
}

function fileData(f){
  return new Promise((res,rej)=>{
    const r=new FileReader();

    r.onload=()=>res(r.result);
    r.onerror=rej;

    r.readAsDataURL(f);
  });
}


/* =========================
   AUTH
========================= */

$("googleLogin").onclick=async()=>{
  try{
    $("loginStatus").textContent="در حال ورود...";
    await signInWithPopup(auth,new GoogleAuthProvider());
  }catch(e){
    $("loginStatus").textContent=friendlyError(e);
    toast(friendlyError(e));
  }
};

$("guestLogin").onclick=async()=>{
  try{
    $("loginStatus").textContent="در حال ورود...";
    await signInAnonymously(auth);
  }catch(e){
    $("loginStatus").textContent=friendlyError(e);
    toast(friendlyError(e));
  }
};

$("logoutBtn").onclick=()=>signOut(auth);


/* =========================
   USERNAME
========================= */

async function claimUsername(uid,username,oldUsername=""){

  const n=normId(username);

  if(!n||n.length<3){
    throw Object.assign(
      new Error("Username must be at least 3 characters"),
      {code:"username/invalid"}
    );
  }

  const old=normId(oldUsername);

  if(old===n) return n;

  const rr=ref(db,"usernames/"+n);

  const tx=await runTransaction(
    rr,
    current=>{
      if(current===null) return uid;
      if(current===uid) return uid;
      return;
    }
  );

  if(!tx.committed){
    throw Object.assign(
      new Error("این Username قبلاً استفاده شده است"),
      {code:"username/taken"}
    );
  }

  if(old&&old!==n){
    const oldRef=ref(db,"usernames/"+old);
    const os=await get(oldRef);

    if(os.exists()&&os.val()===uid){
      await remove(oldRef);
    }
  }

  return n;
}


/* =========================
   COMMUNITY USERNAME
========================= */

async function claimCommunityUsername(
  chatId,
  username,
  oldUsername=""
){

  const n=normId(username);

  if(!n) return "";

  const rr=ref(db,"communityUsernames/"+n);

  const tx=await runTransaction(
    rr,
    current=>{
      if(current===null) return chatId;
      if(current===chatId) return chatId;
      return;
    }
  );

  if(!tx.committed){
    throw Object.assign(
      new Error("این لینک/Username قبلاً استفاده شده است"),
      {code:"community/username-taken"}
    );
  }

  const old=normId(oldUsername);

  if(old&&old!==n){
    const or=ref(db,"communityUsernames/"+old);
    const os=await get(or);

    if(os.exists()&&os.val()===chatId){
      await remove(or);
    }
  }

  return n;
}

function communityLink(username,id){
  const slug=normId(username);
  return location.origin+
    location.pathname+
    "?join="+
    encodeURIComponent(slug||id);
}


/* =========================
   JOIN LINK
========================= */

async function joinFromLink(){

  const raw=new URLSearchParams(location.search).get("join");

  if(!raw||!user) return;

  try{

    const q=normId(raw);

    let chatId=q
      ?(await get(ref(db,"communityUsernames/"+q))).val()
      :null;

    if(!chatId) chatId=raw;

    const cs=await get(ref(db,"chats/"+chatId));

    if(!cs.exists()){
      toast("لینک گروه یا کانال معتبر نیست");
      return;
    }

    const meta=cs.val();

    if(meta.type!=="group"&&meta.type!=="channel"){
      return;
    }

    await set(
      ref(db,`chatMembers/${chatId}/${user.uid}`),
      {
        role:meta.owner===user.uid?"owner":"member",
        joinedAt:Date.now()
      }
    );

    await set(
      ref(db,`userChats/${user.uid}/${chatId}`),
      meta
    );

    history.replaceState({}, "", location.pathname);

    toast("با موفقیت وارد شدی");

    startChatSubscription();

  }catch(e){
    toast(friendlyError(e));
  }
}


/* =========================
   PROFILE
========================= */

async function ensureProfile(u){

  const r=ref(db,"users/"+u.uid);
  const s=await get(r);

  if(!s.exists()){

    const p={
      uid:u.uid,
      name:u.displayName||"ÀVanta User",
      username:u.email?.split("@")[0]||
        "guest_"+u.uid.slice(0,6),
      email:u.email||"",
      photo:u.photoURL||"",
      cover:"",
      bio:"",
      premium:u.uid===ADMIN_UID,
      verified:u.uid===ADMIN_UID,
      owner:u.uid===ADMIN_UID,
      profileColor:"#7662ff",
      nameEmoji:"",
      createdAt:Date.now()
    };

    await set(r,p);

    return p;
  }

  return s.val();
}


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(auth,async u=>{

  user=u;

  if(!u){
    $("login").classList.remove("hide");
    return;
  }

  $("login").classList.add("hide");

  try{

    profile=await ensureProfile(u);

    try{

      const n=normId(profile.username);

      if(n){

        const rs=await get(ref(db,"usernames/"+n));

        if(!rs.exists()){
          await set(ref(db,"usernames/"+n),u.uid);
        }
      }

    }catch(e){}

    $("adminBtn").style.display=
      u.uid===ADMIN_UID?"block":"none";

    renderAll();

    subscribeUser();

    startChatSubscription();

    renderStories();

    joinFromLink();

  }catch(e){
    toast(friendlyError(e));
  }
});

/* =========================
   FIND USER
========================= */

async function findUser(q){

  q=q.replace(/^@/,"").trim();

  const s=await get(ref(db,"users"));

  for(
    const [uid,p]
    of Object.entries(s.val()||{})
  ){

    if(
      uid===q||
      String(p.username||"").toLowerCase()===
      q.toLowerCase()
    ){

      return {
        uid,
        ...p
      };
    }
  }

  return null;
}

$("findContact").onclick=async()=>{

  const q=$("contactInput").value.trim();

  if(!q){
    return toast("UID یا username را وارد کن");

  try{

    if(!p){
      return toast("کاربر پیدا نشد");

    if(p.uid===user.uid){
      return toast("نمی‌توانی خودت را اضافه کنی");

    await set(
      ref(db,`contacts/${user.uid}/${p.uid}`),
      {
        uid:p.uid,
        name:p.name,
        username:p.username,
        photo:p.photo||"",
        bio:p.bio||"",
        premium:!!p.premium,
        profileColor:p.profileColor||"#7662ff"
      }
    );

    $("contactInput").value="";

  }catch(e){
    toast(friendlyError(e));
  }
};

/* =========================
   MESSAGE RENDER
   IMPORTANT:
   CUSTOM EMOJI NOW RENDERS
   AS IMAGE, NOT ITS NAME
========================= */

function renderMessage(m){

  const mine=m.uid===user.uid;

  let content="";

  if(m.premiumEmoji){

    const src=
      m.premiumEmoji.data||
      m.premiumEmoji.src||
      "";

    if(src){

      content=`
        <img
          src="${esc(src)}"
          alt=""
          draggable="false"
        >
      `;

    }else{

      content=
        `<div class="text-emoji">
          ${esc(m.premiumEmoji.fallback||"😊")}
        </div>`;
    }

  }else if(m.gif){

    content=`
      <img
        src="${esc(m.gif)}"
        alt="GIF"
      >
    `;

  }else if(m.gift){

    const g=m.gift;

    content=`
      <div class="gift-message">
        <span class="gift-icon">
          ${esc(g.icon||"🎁")}
        </span>

        <span>
          ${esc(g.name||"Gift")}
        </span>
      </div>
    `;

  }else{

    content=
      `<div>${esc(m.text||"")}</div>`;
  }

  return `
    <div class="msg ${mine?"mine":""} ${
      m.premiumEmoji?"emoji-message":""
    }">
      ${content}
    </div>
  `;
}


/* =========================

========================= */

function subscribeMessages(){

  if(window.msgUnsub){
    window.msgUnsub();
  }

  window.msgUnsub=
    onValue(
      ref(db,`messages/${activeChat}`),
      s=>{

        const arr=
          Object
            .values(s.val()||{})
            .sort(
              (a,b)=>
                (a.createdAt||0)-
                (b.createdAt||0)
            );

        const box=$("messages");

        box.innerHTML=
          arr.length
          ?
          ""
          :
          `<div class="empty">
            هنوز پیامی نیست.
          </div>`;

        arr.forEach(m=>{
          box.insertAdjacentHTML(
            "beforeend",
            renderMessage(m)
          );
        });

        box.scrollTop=box.scrollHeight;
      }
    );
}

========================= */

async function sendMessage(){

  const v=$("messageInput")
    .value
    .trim();

  if(!v||!activeChat) return;

  try{

    await set(
      push(ref(db,`messages/${activeChat}`)),
      {
        uid:user.uid,
        name:profile.name,
        text:v,
        createdAt:Date.now()
      }
    );

    await update(
      ref(db,`chats/${activeChat}`),
      {
        lastMessage:v,
        updatedAt:Date.now()
      }
    );

    await update(
      ref(db,`userChats/${user.uid}/${activeChat}`),
      {
        lastMessage:v,
        updatedAt:Date.now()
      }
    );

    $("messageInput").value="";

  }catch(e){
    toast(friendlyError(e));
  }
}

$("sendMessage").onclick=sendMessage;

$("messageInput").onkeydown=e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
};


/* =========================

========================= */

async function saveProfile(fields){

  if(fields.username!==undefined){

    const desired=normId(fields.username);

    if(!desired){
      throw new Error("Username نامعتبر است");
    }

    const claimed=
      await claimUsername(
        user.uid,
        desired,
        profile.username||""
      );

    fields={
      ...fields,
      username:claimed
    };
  }

  await update(
    ref(db,"users/"+user.uid),
    fields
  );

  profile={
    ...profile,
    ...fields
  };

  renderProfile();
}

          await set(
            push(

                db,
                `messages/${activeChat}`
              )
            ),
            {
              uid:user.uid,
              name:profile.name,

              premiumEmoji:{
                id:emoji.id||"",

          await update(
            ref(db,`chats/${activeChat}`),
            {

              updatedAt:Date.now()

          );

          await update(
            ref(

/* =========================
   GIFTS
========================= */

async function openGiftShop(target=null){

  const gifts=await getGifts();

  const balance=await wallet();

  modal(
    target?"Send Gift":"VANTA Gifts Shop",
    `
    <div
      class="card"
      style="text-align:center"
    >
      <b>
        VANTAcoin: ${balance} VC
      </b>
    </div>

    <div class="grid2">

      ${gifts.map(g=>`

        <div class="card shopItem">

          <div style="font-size:48px">
            ${esc(g.icon||"💎")}
          </div>

          <b>${esc(g.name)}</b>

          <div class="muted small">
            ${Number(g.price)||0} VC
          </div>

          <button
            class="btn primary full buyGift"
            data-id="${esc(g.id)}"
          >
            ${target?"Send":"Buy"}
          </button>

        </div>

      `).join("")}

    </div>
    `
  );

  document
    .querySelectorAll(".buyGift")
    .forEach(b=>{

      b.onclick=async()=>{

        const g=
          gifts.find(
            x=>x.id===b.dataset.id
          );

        if(!g) return;

        const price=Number(g.price)||0;

        try{

          const bal=await wallet();

          if(bal<price){
            return toast(
              "VANTAcoin کافی نیست"
            );
          }

          await set(
            ref(db,`wallets/${user.uid}/vc`),
            bal-price
          );

          if(target){

            if(!activeChat){
              return toast("اول چت را باز کن");
            }

            await set(
              push(
                ref(
                  db,
                  `messages/${activeChat}`
                )
              ),
              {
                uid:user.uid,
                name:profile.name,
                gift:g,
                createdAt:Date.now()
              }
            );

            toast("Gift ارسال شد");

          }else{

            await set(
              push(
                ref(
                  db,
                  `giftCollections/${user.uid}`
                )
              ),
              {
                ...g,
                boughtAt:Date.now()
              }
            );

            toast("Gift خریداری شد");
          }

          closeModal();

          renderGiftCollection();

        }catch(e){
          toast(friendlyError(e));
        }
      };
    });
}

   CREATE GROUP / CHANNEL
========================= */

async function createCommunity(type){

  modal(
    type==="group"
      ?"Create Group"
      :"Create Channel",

    `
    <input
      id="communityName"
      class="input"
      placeholder="Name"
    >

    <input
      id="communityUsername"
      class="input"
      placeholder="Username / Link (اختیاری)"
    >

    <textarea
      id="communityBio"
      class="textarea"
      placeholder="Description"
    ></textarea>

    <button
      id="createCommunity"
      class="btn primary full"
    >
      Create
    </button>
    `
  );

  $("createCommunity").onclick=async()=>{

    const name=
      $("communityName")
      .value
      .trim();

    if(!name){
      return toast("نام را وارد کن");
    }

    const raw=
      $("communityUsername")
      .value
      .trim();

    try{

      const id=
        push(ref(db,"chats")).key;

      const uname=
        normId(raw)||
        ("avanta_"+id.slice(0,8));

      const finalName=
        await claimCommunityUsername(
          id,
          uname
        );

      const meta={
        name,
        type,
        username:finalName,
        bio:$("communityBio").value,
        owner:user.uid,
        updatedAt:Date.now(),
        inviteLink:communityLink(
          finalName,
          id
        )
      };

      await set(
        ref(db,`chats/${id}`),
        meta
      );

      await set(
        ref(
          db,
          `chatMembers/${id}/${user.uid}`
        ),
        {
          role:"owner",
          joinedAt:Date.now()
        }
      );

      await set(
        ref(
          db,
          `userChats/${user.uid}/${id}`
        ),
        meta
      );

      closeModal();

      startChatSubscription();

      modal(
        type==="group"
          ?"گروه ساخته شد"
          :"کانال ساخته شد",

        `
        <div class="card">

          <div class="title">
            ${esc(name)}
          </div>

          <div class="muted">
            لینک ${type==="group"?"گروه":"کانال"}:
          </div>

          <input
            class="input"
            readonly
            value="${esc(meta.inviteLink)}"
          >

          <button
            id="copyCommunityLink"
            class="btn primary full"
          >
            کپی لینک
          </button>

          <button
            id="openCreatedChat"
            class="btn full"
          >
            باز کردن
          </button>

        </div>
        `
      );

      $("copyCommunityLink").onclick=async()=>{

        try{

          await navigator.clipboard.writeText(
            meta.inviteLink
          );

          toast("لینک کپی شد");

        }catch(e){
          toast(meta.inviteLink);
        }
      };

      $("openCreatedChat").onclick=()=>{
        closeModal();
        openChat({
          id,
          ...meta
        });
      };

    }catch(e){
      toast(friendlyError(e));
    }
  };
}

function openAdminEmojiBuilder(){

  if(!ownerUser()){
    return toast("دسترسی فقط برای Admin است");
  }

  modal(
    "Premium Emoji Builder",
    `
    <p class="muted small">
      تصویر را انتخاب کن؛
      به Base64 تبدیل و در Firebase ذخیره می‌شود.
    </p>

    <input
      id="emojiName"
      class="input"
      placeholder="نام Emoji"
    >

    <input
      id="emojiFileAdmin"
      type="file"
      accept="image/*"
      class="input"
    >

    <input
      id="emojiId"
      class="input"
      placeholder="ID اختیاری"
    >

    <button
      id="savePremiumEmoji"
      class="btn primary full"
    >
      ساخت Emoji
    </button>

    <div
      id="emojiPreview"
      class="emojiBox"
    >
      Preview
    </div>
    `
  );

  $("emojiFileAdmin").onchange=async()=>{

    const f=
      $("emojiFileAdmin")
      .files[0];

    if(!f) return;

    if(f.size>700000){
      toast(
        "برای Base64 بهتر است تصویر زیر 700KB باشد"
      );
      return;
    }

    try{

      const data=await fileData(f);

      $("emojiPreview").innerHTML=
        `
        <img
          src="${esc(data)}"
          alt=""
        >
        `;

    }catch(e){
      toast(friendlyError(e));
    }
  };

  $("savePremiumEmoji").onclick=async()=>{

    try{

      const f=
        $("emojiFileAdmin")
        .files[0];

      const name=
        $("emojiName")
        .value
        .trim();

      if(!f||!name){
        return toast(
          "نام و تصویر لازم است"
        );
      }

      if(f.size>700000){
        return toast(
          "تصویر باید زیر 700KB باشد"
        );
      }

      const data=await fileData(f);

      const id=
        $("emojiId").value.trim()||
        push(ref(db,"premiumEmojis")).key;

      await set(
        ref(db,`premiumEmojis/${id}`),
        {
          id,
          name,
          data,
          type:f.type,
          createdAt:Date.now(),
          owner:user.uid
        }
      );

      premiumEmojisLoaded=false;
      premiumEmojisCache=[];

      closeModal();

      toast("Premium Emoji ساخته شد");

    }catch(x){
      toast(friendlyError(x));
    }
  };
}

    )
    .forEach(x=>{

      x.style.display=
        x.textContent
          .toLowerCase()
          .includes(q)
          ?
          ""
          :
          "none";
    });
};

function renderAll(){

  renderProfile();
  renderChats();
}
