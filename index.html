<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes"><title>ÀVanta Messenger</title>
<style>
:root{--bg:#070b14;--p:#10182a;--p2:#17233a;--line:#26334d;--txt:#f7f9ff;--mut:#99a6bd;--a:#7658ff;--b:#22d6c5;--red:#ff5c76;--gold:#ffd76a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#2a2050,#070b14 45%);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}.hide{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(450px,100%);background:#11192cf5;border:1px solid #fff2;border-radius:30px;padding:30px;box-shadow:0 30px 100px #0008}.logo{font-size:42px;font-weight:950;letter-spacing:-3px;text-align:center}.mut{color:var(--mut)}.btn{background:linear-gradient(135deg,var(--a),#4f7cff);border:0;border-radius:15px;padding:12px 16px;font-weight:800}.full{width:100%;margin-top:10px}.ghost{background:#fff0;border:1px solid var(--line)}.danger{background:#ff5c7614;border:1px solid #ff5c7633;color:#ff9aaa}.app{min-height:100vh}.desk{min-height:100vh;display:grid;grid-template-columns:88px 330px 1fr}.rail{background:#0b1120ed;border-left:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:7px}.nav{background:#fff0;border:0;border-radius:18px;padding:11px 3px;color:var(--mut)}.nav.active,.nav:hover{background:#fff1;color:#fff}.nav i{display:block;font-style:normal;font-size:22px}.nav span{font-size:10px}.side{background:#0d1425f5;border-left:1px solid var(--line);padding:16px;overflow:auto}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand b{font-size:22px}.search,.field input,.field textarea,.field select{width:100%;padding:12px 14px;border-radius:14px;background:#080e1a;border:1px solid var(--line);color:#fff;outline:none}.row{display:flex;gap:11px;align-items:center;padding:11px;border-radius:16px}.row:hover{background:#fff1}.ava{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-weight:900;overflow:hidden;flex:none}.ava img{width:100%;height:100%;object-fit:cover}.meta{min-width:0;flex:1}.meta b,.meta small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta small{color:var(--mut)}.view{min-height:100vh;padding:22px;overflow:auto}.hero{max-width:950px;margin:auto}.card{background:#10182ae8;border:1px solid #fff1;border-radius:24px;padding:19px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:11px}.stat{padding:15px;border-radius:17px;background:#fff1}.stat strong{display:block;font-size:25px}.top{display:flex;align-items:center;gap:13px;margin-bottom:15px}.top .ava{width:70px;height:70px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{width:auto}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#7658ff20;color:#d4cdff;font-size:12px}.premium{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;background:radial-gradient(circle,#fff,#a99aff 28%,#6548ff 65%,#211557);box-shadow:0 0 17px #7658ff;animation:glow 2s infinite}.verified{color:#55dcff}.cover{height:145px;border-radius:25px;background:linear-gradient(135deg,var(--a),var(--b));margin-bottom:-50px}.pava{width:105px;height:105px;border:5px solid var(--p)}.pname{font-size:29px;font-weight:900}.ids{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.id{background:#fff1;border-radius:11px;padding:7px 10px}.gifts{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:11px}.gift{background:#fff1;border:1px solid #fff1;border-radius:18px;padding:9px}.gicon{aspect-ratio:1;border-radius:13px;background:linear-gradient(135deg,#29204e,#17263d);display:grid;place-items:center;font-size:44px}.gift small{color:var(--mut);display:block;margin-top:5px}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:50;backdrop-filter:blur(8px)}.modalbox{width:min(560px,100%);max-height:90vh;overflow:auto;background:#11192c;border:1px solid #fff2;border-radius:25px;padding:20px;animation:pop .2s}.mh{display:flex;justify-content:space-between;align-items:center}.x{background:#fff1;border:0;border-radius:11px;padding:6px 10px}.field{margin:10px 0}.field label{display:block;color:var(--mut);font-size:12px;margin-bottom:5px}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tab{background:#fff1;border:0;border-radius:12px;padding:9px 12px;white-space:nowrap}.tab.on{background:#7658ff30}.chat{height:calc(100vh - 44px);display:flex;flex-direction:column}.chathead{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px}.messages{flex:1;overflow:auto;padding:15px 2px}.bubble{max-width:72%;background:#18233b;border:1px solid #fff1;border-radius:18px;padding:10px 13px;margin:6px 0}.mine{margin-right:auto;background:linear-gradient(135deg,#6046cb,#3769d2)}.bubble small{display:block;color:#bbc5d6;font-size:10px;margin-top:4px}.composer{display:flex;gap:7px;padding-top:9px}.composer input{flex:1;background:#fff1;border:1px solid var(--line);border-radius:15px;padding:12px;color:#fff;outline:none}.toast{position:fixed;z-index:100;bottom:90px;left:50%;transform:translate(-50%,20px);opacity:0;background:#172239;border:1px solid #fff2;border-radius:14px;padding:11px 16px;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.bottom{display:none}@keyframes glow{50%{transform:scale(1.08);box-shadow:0 0 27px #7658ff}}@keyframes pop{from{opacity:0;transform:scale(.97) translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:850px){.desk{display:block}.rail,.side{display:none}.view{padding:14px 14px 92px}.bottom{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:12px;right:12px;bottom:12px;z-index:30;background:#10182aee;border:1px solid #fff2;border-radius:24px;padding:6px;backdrop-filter:blur(18px)}.bottom .nav{padding:7px 2px}.chat{height:calc(100vh - 30px)}}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import{getAuth,GoogleAuthProvider,signInWithPopup,signInAnonymously,onAuthStateChanged,signOut,reauthenticateWithPopup}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import{getDatabase,ref,get,set,push,update,onValue}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyBsncHhhlqIi6qpf3hYtb0DOnq8Zjb-zpI',authDomain:'avanta-3db7e.firebaseapp.com',databaseURL:'https://avanta-3db7e-default-rtdb.firebaseio.com',projectId:'avanta-3db7e',storageBucket:'avanta-3db7e.firebasestorage.app',messagingSenderId:'879564538420',appId:'1:879564538420:web:a0fc85cc43a9347d92c061',measurementId:'G-P3LP14QTQT'};
const ADMIN_UID='NNY1ymTknwREwMo16ZI3lgFEni23';const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),google=new GoogleAuthProvider();
const S={u:null,page:'chats',target:null,unsub:null,admin:false};const $=x=>document.querySelector(x);const esc=x=>String(x??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
function toast(x){let e=$('#toast');e.textContent=x;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)}function av(u,cl='ava'){return`<div class="${cl}">${u?.photoURL?`<img src="${esc(u.photoURL)}">`:esc((u?.displayName||u?.email||'A')[0].toUpperCase())}</div>`}
function authUI(){$('#app').innerHTML=`<div class=auth><div class=box><div class=logo>ÀVanta</div><p class=mut style="text-align:center">پیام‌رسان اختصاصی ÀVanta</p><button id=google class="btn full">ورود با Google</button><button id=guest class="btn ghost full">ورود مهمان</button><p class=mut style="font-size:12px;text-align:center;margin-top:18px">ورود مدیریت از Settings انجام می‌شود.</p></div></div>`;$('#google').onclick=async()=>{try{await signInWithPopup(auth,google)}catch(e){toast('Google: '+e.code)}};$('#guest').onclick=async()=>{try{await signInAnonymously(auth)}catch(e){toast('Guest: '+e.code)}}}
function nav(){return`<div class=rail><button class="nav ${S.page==='contacts'?'active':''}" data-page=contacts><i>👥</i><span>مخاطبین</span></button><button class="nav ${S.page==='chats'?'active':''}" data-page=chats><i>💬</i><span>چت‌ها</span></button><button class="nav ${S.page==='settings'?'active':''}" data-page=settings><i>⚙️</i><span>تنظیمات</span></button><button class="nav ${S.page==='profile'?'active':''}" data-page=profile><i>👤</i><span>پروفایل</span></button></div>`}function bottom(){return`<div class=bottom>${['contacts','chats','settings','profile'].map((p,i)=>`<button class="nav ${S.page===p?'active':''}" data-page=${p}><i>${['👥','💬','⚙️','👤'][i]}</i><span>${['مخاطبین','چت‌ها','تنظیمات','پروفایل'][i]}</span></button>`).join('')}</div>`}
async function ensure(){let r=await get(ref(db,'users/'+S.u.uid));if(!r.exists())await set(ref(db,'users/'+S.u.uid),{uid:S.u.uid,displayName:S.u.displayName||'ÀVanta User',email:S.u.email||'',photoURL:S.u.photoURL||'',bio:'',premium:false,verified:S.u.uid===ADMIN_UID,vc:0,createdAt:Date.now(),online:true});else await update(ref(db,'users/'+S.u.uid),{online:true});S.admin=S.u.uid===ADMIN_UID}
function shell(){if(S.unsub)S.unsub();$('#app').innerHTML=`<div class=desk>${nav()}<aside class=side id=side></aside><main><div class=view id=view></div></main></div>${bottom()}`;render()}
async function render(){if(!S.u)return authUI();document.querySelectorAll('[data-page]').forEach(e=>e.onclick=()=>{S.page=e.dataset.page;S.target=null;render()});$('#side').innerHTML=`<div class=brand><b>ÀVanta</b><span class=pill>VC</span></div><input class=search id=sideSearch placeholder="جستجو..."><div class=mut style="font-size:12px;margin:15px 5px 7px">حساب</div><div class=row data-page=profile>${av(S.u)}<div class=meta><b>${esc(S.u.displayName||'پروفایل')}</b><small>${esc(S.u.email||'مهمان')}</small></div></div><div class=row data-page=contacts>${av({displayName:'+'})}<div class=meta><b>مخاطبین</b><small>افزودن افراد</small></div></div>`;document.querySelectorAll('[data-page]').forEach(e=>e.onclick=()=>{S.page=e.dataset.page;S.target=null;render()});if(S.page==='chats')chats();else if(S.page==='contacts')contacts();else if(S.page==='profile')profile(S.u.uid,true);else if(S.page==='settings')settings();else if(S.page==='chat')chat(S.target);else if(S.page==='user')profile(S.target,false)}
async function chats(){let d=(await get(ref(db,'users/'+S.u.uid+'/chats'))).val()||{};$('#view').innerHTML=`<div class=hero><div class=top>${av(S.u)}<div><h1 style="margin:0">چت‌ها</h1><span class=mut>همه گفتگوها در یکجا</span></div></div><div class=card><div class=actions><button class=btn id=newc>＋ چت جدید</button><button class="btn ghost" id=saved>⭐ Saved Messages</button><button class="btn ghost" id=groups>👥 گروه‌ها</button><button class="btn ghost" id=channels>📣 کانال‌ها</button></div></div><div class=card><h3>گفتگوهای اخیر</h3>${Object.entries(d).map(([id,x])=>`<div class=row data-chat=${id}>${av(x)}<div class=meta><b>${esc(x.name||'گفتگو')}</b><small>${esc(x.lastMessage||'شروع گفتگو')}</small></div></div>`).join('')||'<p class=mut>هنوز چتی نداری؛ از مخاطبین یک نفر را انتخاب کن.</p>'}</div></div>`;$('#newc').onclick=()=>{S.page='contacts';render()};$('#saved').onclick=()=>modal('Saved Messages','<p class=mut>پیام‌های ذخیره‌شده در نسخه بعدی با دکمه ذخیره پیام به این بخش متصل می‌شوند.</p>');$('#groups').onclick=()=>collection('گروه‌ها');$('#channels').onclick=()=>collection('کانال‌ها');document.querySelectorAll('[data-chat]').forEach(e=>e.onclick=()=>{S.target=e.dataset.chat;S.page='chat';render()})}
async function contacts(){let us=Object.entries((await get(ref(db,'users'))).val()||{}).map(([uid,u])=>({uid,...u})).filter(x=>x.uid!==S.u.uid&&!x.disabled);$('#view').innerHTML=`<div class=hero><div class=top>${av({displayName:'👥'})}<div><h1 style="margin:0">مخاطبین</h1><span class=mut>کاربران ÀVanta</span></div></div><div class=card><button class=btn id=add>＋ افزودن مخاطب</button></div><div class=card><input class=search id=filter placeholder="نام یا username"><div id=people>${us.map(u=>`<div class=row person data-uid=${u.uid}>${av(u)}<div class=meta><b>${esc(u.displayName||'کاربر')} ${u.premium?'<span class=premium>À</span>':''}</b><small>@${esc(u.username||((u.email||'user').split('@')[0]))} ${u.online?'· 🟢 آنلاین':''}</small></div></div>`).join('')||'<p class=mut>کاربر دیگری پیدا نشد.</p>'}</div></div></div>`;$('#filter').oninput=e=>document.querySelectorAll('.person').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(e.target.value.toLowerCase())?'flex':'none');document.querySelectorAll('.person').forEach(e=>e.onclick=()=>{S.target=e.dataset.uid;S.page='user';render()});$('#add').onclick=()=>modal('افزودن مخاطب','<div class=field><label>UID یا username</label><input id=cid></div><button class="btn full" id=doadd>افزودن</button>');if($('#doadd'))$('#doadd').onclick=async()=>{let q=$('#cid').value.trim().replace(/^@/,'').toLowerCase(),us=(await get(ref(db,'users'))).val()||{},hit=Object.entries(us).find(([id,u])=>id===q||(u.username||'').toLowerCase()===q||((u.email||'').split('@')[0].toLowerCase()===q));if(!hit)return toast('کاربر پیدا نشد');await set(ref(db,`users/${S.u.uid}/contacts/${hit[0]}`),true);close();toast('مخاطب اضافه شد')}
async function profile(uid,own){let u=(await get(ref(db,'users/'+uid))).val()||{};let gs=Object.values((await get(ref(db,'users/'+uid+'/gifts'))).val()||{});$('#view').innerHTML=`<div class=hero><div class=card><div class=cover style="${u.profileColor?'background:'+esc(u.profileColor):''}"></div>${av(u,'ava pava')}<h1 class=pname>${esc(u.displayName||'ÀVanta User')} ${u.premium?'<span class=premium title="ÀVanta Premium">À</span>':''} ${u.verified?'<span class=verified>✓</span>':''}</h1><div class=mut>@${esc(u.username||((u.email||'user').split('@')[0]))} · ${u.online?'🟢 آنلاین':'⚪ آفلاین'}</div>${u.verified?'<p><b class=verified>✓ ÀVanta Verified</b><br><span class=mut>این کاربر توسط VANTA تأیید شده است</span></p>':''}${u.bio?'<p>'+esc(u.bio)+'</p>':''}${own?`<div class=ids>${(u.specialIds||['@AVANTA','@VANTA','@AV','@A7','@V7']).map(x=>'<span class=id>'+esc(x)+'</span>').join('')}</div>`:''}<div class=actions>${own?'<button class=btn id=edit>Edit Info</button><button class="btn ghost" id=photo>Set Photo</button><button class="btn ghost" id=ps>Settings</button>':'<button class=btn id=msg>Message</button><button class="btn ghost" id=gift>🎁 Send Gift</button>'}<button class="btn ghost" id=more>⋮</button></div></div><div class=card><h2>🎁 VANTA Gifts</h2><div class=gifts>${gs.map(g=>`<div class=gift><div class=gicon>${esc(g.icon||'🎁')}</div><b>${esc(g.name||'Gift')}</b><small>${g.edition?'#'+g.edition+' / '+(g.total||'∞'):'Collection'}</small></div>`).join('')||'<p class=mut>گیفتی دریافت نشده.</p>'}</div></div></div>`;if($('#edit'))$('#edit').onclick=()=>edit(u);if($('#photo'))$('#photo').onclick=()=>photo();if($('#ps'))$('#ps').onclick=()=>{S.page='settings';render()};if($('#msg'))$('#msg').onclick=()=>{S.target=uid;S.page='chat';render()};if($('#gift'))$('#gift').onclick=()=>giftShop(uid);$('#more').onclick=()=>modal('منوی پروفایل',`${u.premium?'<button class="btn ghost full" id=color>🎨 Change profile colour</button>':''}<button class="btn ghost full" id=share>Share Profile</button><button class="btn danger full" id=report>Report</button>`);if($('#color'))$('#color').onclick=()=>{close();color()};$('#share').onclick=()=>{navigator.clipboard?.writeText(location.href+'#user/'+uid);toast('لینک پروفایل کپی شد');close()}}
function edit(u){modal('Edit Info',`<div class=field><label>Name</label><input id=en value="${esc(u.displayName||'')}"></div><div class=field><label>Username</label><input id=eu value="${esc(u.username||'')}"></div><div class=field><label>Bio</label><textarea id=eb>${esc(u.bio||'')}</textarea></div><button class="btn full" id=save>Save</button>`);$('#save').onclick=async()=>{await update(ref(db,'users/'+S.u.uid),{displayName:$('#en').value,username:$('#eu').value.replace(/^@/,''),bio:$('#eb').value});close();toast('پروفایل ذخیره شد');render()}}
function photo(){modal('Set Photo','<input type=file id=pf accept="image/*"><p class=mut style="font-size:12px">تصویر در مرورگر به WebP فشرده می‌شود و در Realtime Database ذخیره می‌شود؛ Storage لازم نیست.</p><button class="btn full" id=up>ذخیره</button>');$('#up').onclick=async()=>{let f=$('#pf').files[0];if(!f)return;let data=await webp(f);await update(ref(db,'users/'+S.u.uid),{photoURL:data});close();toast('عکس ذخیره شد');render()}}
function webp(file){return new Promise((ok,no)=>{let r=new FileReader;r.onload=()=>{let i=new Image;i.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,700/Math.max(i.width,i.height));c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/webp',.78))};i.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
function color(){modal('Change Profile Color','<p class=mut>فقط برای Premium</p><input type=color id=col value=#7658ff><button class="btn full" id=colsave>ذخیره</button>');$('#colsave').onclick=async()=>{let c=$('#col').value;await update(ref(db,'users/'+S.u.uid),{profileColor:`linear-gradient(135deg,${c},#22d6c5)`});close();toast('ذخیره شد');render()}}
async function giftShop(to){let g=Object.entries((await get(ref(db,'gifts'))).val()||{}).map(([id,x])=>({id,...x})).filter(x=>x.active!==false);modal('VANTA Gift Shop',`<div class=gifts>${g.map(x=>`<div class=gift><div class=gicon>${esc(x.icon||'🎁')}</div><b>${esc(x.name||'Gift')}</b><small>${x.price||0} VC ${x.limited?'· LIMITED':''} ${x.nft?'· NFT':''}</small><button class="btn full" data-g=${x.id}>ارسال</button></div>`).join('')||'<p class=mut>Giftی ساخته نشده.</p>'}</div>`);document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>buyGift(b.dataset.g,to))}
async function buyGift(id,to){let g=(await get(ref(db,'gifts/'+id))).val(),me=(await get(ref(db,'users/'+S.u.uid))).val()||{};if(!g)return;if((me.vc||0)<(g.price||0))return toast('VC کافی نیست');await update(ref(db,'users/'+S.u.uid),{vc:(me.vc||0)-(g.price||0)});await push(ref(db,'users/'+to+'/gifts'),{name:g.name,icon:g.icon||'🎁',edition:g.edition||null,total:g.total||null,giftId:id,from:S.u.uid,at:Date.now()});close();toast('🎁 Gift ارسال شد')}
async function chat(uid){let u=(await get(ref(db,'users/'+uid))).val()||{};$('#view').innerHTML=`<div class=chat><div class=chathead><button class=x id=back>←</button>${av(u)}<div class=meta><b>${esc(u.displayName||'کاربر')}</b><small>${u.online?'🟢 آنلاین':'⚪ آفلاین'}</small></div><button class=x id=cp>⋮</button></div><div class=messages id=msgs></div><div class=composer><input id=message placeholder="پیام..."><button class=btn id=send>ارسال</button></div></div>`;$('#back').onclick=()=>{S.page='chats';render()};$('#cp').onclick=()=>{S.target=uid;S.page='user';render()};let id=[S.u.uid,uid].sort().join('_'),q=ref(db,'privateMessages/'+id);if(S.unsub)S.unsub();S.unsub=onValue(q,s=>{let a=Object.values(s.val()||{});$('#msgs').innerHTML=a.map(m=>`<div class="bubble ${m.from===S.u.uid?'mine':''}">${esc(m.text)}<small>${new Date(m.at).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}</small></div>`).join('')||'<div class=mut style="text-align:center">پیامی نیست.</div>';$('#msgs').scrollTop=$('#msgs').scrollHeight});$('#send').onclick=async()=>{let t=$('#message').value.trim();if(!t)return;await push(q,{from:S.u.uid,text:t,at:Date.now()});await update(ref(db,`users/${S.u.uid}/chats/${uid}`),{name:u.displayName,displayName:u.displayName,photoURL:u.photoURL||'',lastMessage:t});await update(ref(db,`users/${uid}/chats/${S.u.uid}`),{name:S.u.displayName,displayName:S.u.displayName,photoURL:S.u.photoURL||'',lastMessage:t});$('#message').value=''};$('#message').onkeydown=e=>{if(e.key==='Enter')$('#send').click()}}
function settings(){$('#view').innerHTML=`<div class=hero><h1>تنظیمات</h1><div class=card>${['Account','Privacy','Notifications','Appearance','Language','Premium','VANTAcoin','Gifts','Storage','Folders'].map(x=>`<div class=row><div class=ava style="width:42px;height:42px">•</div><div class=meta><b>${x}</b><small>تنظیمات ${x}</small></div><b>›</b></div>`).join('')}</div><div class=card><h3>مدیریت ÀVanta</h3><button class="btn full" id=admin>ورود مدیریت</button></div><div class=card><button class="btn danger full" id=out>خروج از حساب</button></div></div>`;$('#out').onclick=()=>signOut(auth);$('#admin').onclick=adminLogin}
async function adminLogin(){if(S.u.uid!==ADMIN_UID)return toast('این حساب Admin نیست');try{await reauthenticateWithPopup(auth,google);if(auth.currentUser.uid!==ADMIN_UID)return toast('دسترسی ممنوع');adminPanel()}catch(e){toast('تأیید Google: '+e.code)}}
async function adminPanel(){let us=(await get(ref(db,'users'))).val()||{},gs=(await get(ref(db,'gifts'))).val()||{};modal('ÀVANTA CONTROL CENTER',`<div class=grid><div class=stat>Users<strong>${Object.keys(us).length}</strong></div><div class=stat>Online<strong>${Object.values(us).filter(x=>x.online).length}</strong></div><div class=stat>Premium<strong>${Object.values(us).filter(x=>x.premium).length}</strong></div><div class=stat>Gifts<strong>${Object.keys(gs).length}</strong></div></div><div class=tabs><button class="tab on" id=au>Users</button><button class=tab id=ag>Gift Manager</button><button class=tab id=ae>Emoji Manager</button><button class=tab id=av>VANTAcoin</button><button class=tab id=ap>Premium</button></div><div id=ac></div>`);usersAdmin(us);$('#au').onclick=()=>usersAdmin(us);$('#ag').onclick=giftsAdmin;$('#ae').onclick=emojiAdmin;$('#av').onclick=vcAdmin;$('#ap').onclick=premiumAdmin}
function usersAdmin(us){$('#ac').innerHTML=Object.entries(us).map(([id,u])=>`<div class=row><div class=meta><b>${esc(u.displayName||'User')}</b><small>${esc(id)} · ${u.vc||0} VC</small></div><button class="btn ghost" data-vc=${id}>+100 VC</button><button class="btn ghost" data-prem=${id}>Premium</button></div>`).join('');document.querySelectorAll('[data-vc]').forEach(b=>b.onclick=async()=>{let id=b.dataset.vc,u=(await get(ref(db,'users/'+id))).val()||{};await update(ref(db,'users/'+id),{vc:(u.vc||0)+100});toast('100 VC اضافه شد')});document.querySelectorAll('[data-prem]').forEach(b=>b.onclick=async()=>{let id=b.dataset.prem,u=(await get(ref(db,'users/'+id))).val()||{};await update(ref(db,'users/'+id),{premium:!u.premium});toast('Premium تغییر کرد')})}
function giftsAdmin(){$('#ac').innerHTML=`<div class=field><label>نام</label><input id=gn placeholder="VANTA Crown"></div><div class=field><label>Icon</label><input id=gi value="👑"></div><div class=field><label>قیمت VC</label><input id=gp type=number value=250></div><div class=field><label>Total Edition</label><input id=gt type=number value=100></div><label><input type=checkbox id=gl> LIMITED</label> <label><input type=checkbox id=gnft> NFT-style</label><button class="btn full" id=createg>ساخت Gift</button>`;$('#createg').onclick=async()=>{let id=push(ref(db,'gifts')).key;await set(ref(db,'gifts/'+id),{name:$('#gn').value,icon:$('#gi').value,price:+$('#gp').value,total:+$('#gt').value,limited:$('#gl').checked,nft:$('#gnft').checked,active:true,createdAt:Date.now()});toast('Gift ساخته شد')}}
function emojiAdmin(){$('#ac').innerHTML=`<input type=file id=em accept="image/*"><p class=mut>تصویر در مرورگر WebP می‌شود و Data URL داخل Realtime Database ذخیره می‌شود؛ Firebase Storage استفاده نمی‌شود.</p><button class="btn full" id=createe>ساخت Emoji</button>`;$('#createe').onclick=async()=>{let f=$('#em').files[0];if(!f)return toast('فایل انتخاب کن');let data=await webp(f),id=push(ref(db,'emojis')).key;await set(ref(db,'emojis/'+id),{data,name:f.name,createdAt:Date.now(),createdBy:S.u.uid});toast('Emoji ساخته شد')}}
function vcAdmin(){$('#ac').innerHTML='<h3>VANTAcoin</h3><p class=mut>ساخت/افزایش VC فقط از Admin انجام می‌شود.</p><p>کاربر عادی هیچ مسیر سمت کلاینت برای افزایش موجودی ندارد.</p><button class="btn full" id=vcquick>افزایش 100 VC برای یک UID</button>';$('#vcquick').onclick=()=>modal('Admin VC','<div class=field><label>UID</label><input id=vu></div><button class="btn full" id=va>افزایش</button>');$('#va')?.addEventListener('click',async()=>{let id=$('#vu').value,u=(await get(ref(db,'users/'+id))).val();if(!u)return toast('UID پیدا نشد');await update(ref(db,'users/'+id),{vc:(u.vc||0)+100});close();toast('انجام شد')})}
function premiumAdmin(){$('#ac').innerHTML='<h3>Premium Manager</h3><p class=mut>فعال/غیرفعال کردن Premium و مزایا فقط از Admin.</p>'}
function collection(t){modal(t,`<p class=mut>بخش ${t} آماده اتصال به ساختار Groups/Channels در Realtime Database است.</p>`)}function modal(title,body){close();let d=document.createElement('div');d.className='modal';d.id='modal';d.innerHTML=`<div class=modalbox><div class=mh><h2>${title}</h2><button class=x id=close>×</button></div>${body}</div>`;document.body.append(d);$('#close').onclick=close;d.onclick=e=>{if(e.target===d)close()}}function close(){$('#modal')?.remove()}
onAuthStateChanged(auth,async u=>{if(!u){S.u=null;authUI();return}S.u=u;try{await ensure();shell()}catch(e){$('#app').innerHTML=`<div class=auth><div class=box><div class=logo>ÀVanta</div><p>خطای Firebase</p><p class=mut>${esc(e.code||e.message)}</p><button class="btn full" onclick=location.reload()>تلاش دوباره</button></div></div>`}});window.addEventListener('beforeunload',()=>{if(S.u)update(ref(db,'users/'+S.u.uid),{online:false})});
</script></body></html>
